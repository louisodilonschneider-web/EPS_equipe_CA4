          members: mem, value: +val,
          levelId: lvlSel ? lvlSel.value : null,
          recommendedLevelId: reco
        };
        var ev = null;
        A.set(function () {
          sit.attempts.push(attempt);
          ev = PROGRESS.applyAttempt(sit, attempt);
        });
        if (ev) showMessage(sit, ev, mem);
        else UI.toast('Score enregistré.');
      }
    });
  }

  /* Affichage du retour automatique. Fermable, mais jamais perdu : il reste
     consultable depuis la fiche de la situation et au passage suivant. */
  function showMessage(sit, ev, members, onClose) {
    var cls = A.currentClass();
    var names = (members || []).map(function (sid) {
      var s = A.studentById(cls.id, sid); return s ? A.shortName(s) : '';
    }).join(', ');
    var info = ev.bandInfo;
    var body = '<div class="feedback band-' + ev.band + '">' +
      '<div class="row" style="margin-bottom:6px">' + UI.badge(info.icon + ' ' + info.label, info.cls) +
      '<span class="small muted">' + e(names) + '</span></div>' +
      '<p style="margin:0;white-space:pre-wrap"><b>' + e(ev.text) + '</b></p>' +
      (ev.image ? '<div class="img-slot"><img src="' + ev.image + '" alt="Illustration de la consigne"></div>' : '') +
      '</div>';
    body += KIOSK.nextLevelBlock(ev);
    body += '<p class="small muted">Ce message reste consultable : il te sera reproposé au prochain passage, et tu peux le rouvrir depuis la fiche de la situation.</p>';
    UI.modal({
      title: 'Retour sur ta performance', body: body, cancel: false, okLabel: 'J\'ai compris',
      onOk: function () {
        A.set(function () {
          (members || []).forEach(function (sid) { PROGRESS.dismissMessage(sit, sid, true); });
        });
        if (onClose) onClose();
      },
      onCancel: function () { if (onClose) onClose(); }
    });
  }

  function reopenMessage(sit, sid) {
    var m = PROGRESS.messageFor(sit, sid);
    if (!m) { UI.toast('Aucun message pour cet élève.'); return; }
    var info = PROGRESS.BANDS[m.band];
    showMessage(sit, {
      band: m.band, bandInfo: info, text: m.text, image: m.image || '', changed: m.changed,
      nextLevelName: m.nextLevelName, nextConsigne: m.nextConsigne
    }, [sid]);
  }

  return {
    view: view, edit: edit, editGroups: editGroups, recordAttempt: recordAttempt,
    showMessage: showMessage, reopenMessage: reopenMessage, sitById: sitById,
    projectGroups: projectGroups, openEditor: openEditor,
    newSituation: newSituation, autoGroups: autoGroups,
    KINDS: KINDS, kindOf: kindOf, ofKind: ofKind,
    formatOf: formatOf, isMatchFormat: isMatchFormat, isCoopFormat: isCoopFormat,
    coopConfig: coopConfig, coopStanding: coopStanding, coopRecord: coopRecord,
    recordCoop: recordCoop,
    coopObjectifDuos: coopObjectifDuos, COOP: COOP,
    recordBatch: recordBatch, recordCoopRetro: recordCoopRetro,
    coopRecordRetro: coopRecordRetro, coopManchesDepuisTotal: coopManchesDepuisTotal,
    coopEtat: coopEtat, coopFinTexte: coopFinTexte, coopToggleStop: coopToggleStop,
    coopAvance: coopAvance, coopNom: coopNom, coopPaires: coopPaires, coopDejaVus: coopDejaVus,
    ownTeams: ownTeams, teamsOf: teamsOf, teamById: teamById, terrainsOf: terrainsOf,
    makeDuels: makeDuels, liveDuels: liveDuels, duelsFor: duelsFor, move: move,
    fairCrit: fairCrit, fairUnits: fairUnits, toggleFair: toggleFair, editFairplay: editFairplay,
    switchKind: switchKind,
    planDuels: planDuels, applyDuelPlan: applyDuelPlan, duelRounds: duelRounds,
    editDuels: editDuels
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — évaluation, auto-évaluation, notes
   ========================================================================== */
'use strict';

var EVAL = (function () {

  var A = APP, e = APP.escapeHtml;

  var SPECIAL = {
    __global__: 'Indice global (toutes sources)',
    __result__: 'Résultat des affrontements (écarts de points)',
    __libre__: 'Rien — je note cet item à la main'
  };

  function defaultGrid() {
    var crits = A.criteria();
    return {
      id: A.uid('grd'),
      name: 'Grille ' + A.activite().name + ' — ' + A.cycleById(A.cycleOf(A.get().ui.classId)).name,
      scale: 20,
      levels: JSON.parse(JSON.stringify(A.DEFAULT_LEVELS)),
      items: crits.map(function (c) {
        return { id: A.uid('itm'), label: c.name, critId: c.id, afcIds: [],
          coef: /fair|esprit/i.test(c.name) ? 2 : 3 };
      }).concat([
        { id: A.uid('itm'), label: 'Investissement dans l\'affrontement', critId: '__result__', coef: 1, afcIds: [] }
      ])
    };
  }

  function gridsList() {
    var st = A.get();
    return Object.keys(st.grids).map(function (k) { return st.grids[k]; });
  }

  function maxPoints(grid) {
    return grid.levels[grid.levels.length - 1].points;
  }

  /* ------------------------------------------- niveaux de maîtrise par item

     « Maîtrise satisfaisante » ne veut pas dire la même chose pour la tactique
     et pour le fair-play. Chaque item peut donc écrire ses quatre niveaux dans
     ses propres termes — souvent chiffrés là où l'activité s'y prête (« marque
     3 points directs sur 10 échanges »), plus qualitatifs ailleurs. Ce qui
     n'est pas rédigé retombe sur le libellé général de la grille : on précise
     ce qui en vaut la peine, et rien de plus. */
  function descOf(grid, item, i) {
    var d = item && item.desc ? item.desc[i] : null;
    d = (d || '').trim();
    return d || (grid.levels[i] ? grid.levels[i].label : '');
  }
  function aDesDesc(item) {
    return !!(item && item.desc && item.desc.some(function (t) { return (t || '').trim(); }));
  }
  /* Le libellé court reste celui de la grille ; le descriptif de l'item vient
     en infobulle et sur le papier, là où on a la place de lire. */
  function labelNiveau(grid, item, i) {
    var gen = grid.levels[i] ? grid.levels[i].label : '';
    var d = item && item.desc ? (item.desc[i] || '').trim() : '';
    return d ? gen + ' — ' + d : gen;
  }

  /* Proposition automatique de niveau à partir de l'indice calculé */
  function proposeLevel(grid, ratings, sid, item) {
    var v = null;
    /* un item que l'enseignant a choisi de noter lui-même ne reçoit aucune
       proposition : l'application n'a rien à en dire */
    if (item.critId === '__libre__') return null;
    if (item.critId === '__global__') v = ratings.byStudent[sid] ? ratings.byStudent[sid].index : null;
    else if (item.critId === '__result__') {
      var r = ratings.byStudent[sid];
      v = r && r.result.n ? RATINGS.display(r.result.z) : null;
    } else v = RATINGS.critDisplay(ratings, sid, item.critId);
    if (v == null) return null;
    var n = grid.levels.length;
    /* 0–10 découpé en n bandes, avec une petite marge de prudence */
    var i = A.clamp(Math.floor(v / (10 / n)), 0, n - 1);
    return i;
  }

  function noteOf(grid, marks) {
    var num = 0, den = 0;
    grid.items.forEach(function (it) {
      var li = marks ? marks[it.id] : null;
      var coef = +it.coef || 0;
      if (li == null || !coef) return;
      num += grid.levels[li].points * coef;
      den += maxPoints(grid) * coef;
    });
    if (!den) return null;
    return A.round(num / den * grid.scale, 1);
  }

  /* ==================================================================== vue */

  function view(l) {
    var st = A.get(), cls = st.classes[l.classId];
    var ratings = RATINGS.compute(cls.id);
    var grids = gridsList();
    l.evaluation = l.evaluation || { gridId: null, teacher: {}, self: {}, comments: {} };
    var grid = l.evaluation.gridId ? st.grids[l.evaluation.gridId] : null;

    var h = '<div class="row" style="margin-bottom:12px">' +
      '<label class="inline"><span class="small muted">Grille</span>' +
      '<select data-chg="eval.grid"><option value="">— aucune —</option>' +
      grids.map(function (g) {
        return '<option value="' + g.id + '"' + (grid && g.id === grid.id ? ' selected' : '') + '>' + e(g.name) + '</option>';
      }).join('') + '</select></label>' +
      '<button data-act="grid.new">Nouvelle grille</button>' +
      (grid ? '<button data-act="grid.edit">Modifier la grille</button>' +
        '<button data-act="grid.dup">Dupliquer pour cette classe</button>' : '') +
      '<div class="spacer"></div>' +
      (grid ? '<button data-act="eval.propose" class="btn-primary">Proposer les niveaux depuis les indices</button>' +
        '<button class="btn-kiosk" data-act="kiosk.open" data-mode="self">Mode kiosque — auto-évaluation</button>' +
        '<button data-act="eval.export">Exporter les notes</button>' : '') +
      '</div>';

    if (!grid) {
      return h + UI.empty('Aucune grille sélectionnée',
        'Crée ta grille d\'évaluation : des items, chacun rattaché à un critère et affecté d\'un coefficient. ' +
        'L\'application pourra ensuite proposer un niveau par élève à partir des données récoltées — tu gardes la main pour ajuster.') +
        afcSection(l);
    }

    var present = LESSON.presentStudents(l);
    var mx = maxPoints(grid);

    h += '<div class="notice">La proposition automatique n\'est qu\'un point de départ : elle traduit les indices en niveaux de maîtrise. ' +
      'Tu peux modifier chaque case. Les élèves dont la fiabilité est faible sont signalés — leur proposition vaut peu.</div>';

    h += '<div class="table-wrap"><table class="compact"><thead><tr><th>Élève</th>';
    grid.items.forEach(function (it) {
      h += '<th title="coefficient ' + it.coef + '">' + e(it.label) +
        (aDesDesc(it)
          ? ' <button class="btn-sm btn-ghost" data-act="eval.niveaux" data-item="' + it.id +
            '" title="Voir les niveaux de maîtrise écrits pour cet item">ⓘ</button>'
          : '') +
        '<br><span class="tiny muted">coef. ' + it.coef + '</span></th>';
    });
    h += '<th class="num">Note /' + grid.scale + '</th><th class="num">Auto-éval.</th><th class="num">Écart</th></tr></thead><tbody>';

    A.sortBy(present, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var marks = l.evaluation.teacher[s.id] || {};
      var note = noteOf(grid, marks);
      var selfMarks = l.evaluation.self[s.id] || {};
      var selfNote = selfNoteOf(grid, selfMarks);
      var rel = ratings.byStudent[s.id] ? ratings.byStudent[s.id].reliability : null;
      h += '<tr><td class="nowrap"><b>' + e(A.displayName(s)) + '</b>' +
        (rel && rel.level === 'faible' ? ' ' + UI.badge('peu de données', 'warn') : '') + '</td>';
      grid.items.forEach(function (it) {
        var cur = marks[it.id];
        h += '<td><select data-chg="eval.mark" data-sid="' + s.id + '" data-item="' + it.id +
          '" style="min-height:34px;font-size:.82rem;max-width:190px">' +
          '<option value="">–</option>' +
          grid.levels.map(function (lv, i) {
            /* Un menu déroulant ne sait pas afficher de retour à la ligne :
               on les remplace par un séparateur plutôt que de les perdre. */
            var texte = descOf(grid, it, i).replace(/\s*\n+\s*/g, ' · ');
            return '<option value="' + i + '"' + (cur === i ? ' selected' : '') +
              ' title="' + e(labelNiveau(grid, it, i)) + '">' +
              e(texte.length > 64 ? texte.slice(0, 63) + '…' : texte) + '</option>';
          }).join('') + '</select></td>';
      });
      h += '<td class="num"><b>' + (note == null ? '–' : note.toFixed(1)) + '</b></td>' +
        /* Une auto-évaluation faite sous le mauvais prénom s'efface aussi
           depuis ici, quand on s'en aperçoit après avoir rendu la tablette. */
        '<td class="num muted nowrap">' + (selfNote == null ? '–' : selfNote.toFixed(1)) +
        (Object.keys(selfMarks).length
          ? ' <button class="btn-sm btn-ghost" data-act="eval.selfclear" data-sid="' + s.id +
            '" title="Effacer l\'auto-évaluation de cet élève">✕</button>'
          : '') + '</td>' +
        '<td class="num">' + (note != null && selfNote != null
          ? (function () {
            var d = selfNote - note;
            var cl = Math.abs(d) <= 2 ? 'ok' : Math.abs(d) <= 4 ? 'accent' : 'warn';
            return UI.badge((d > 0 ? '+' : '') + A.round(d, 1), cl);
          })()
          : '<span class="muted">–</span>') + '</td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<p class="small muted" style="margin-top:10px">L\'écart auto-évaluation / évaluation n\'est pas une erreur de l\'élève : c\'est un indicateur de lucidité, ' +
      'et un très bon support d\'entretien. Un écart systématiquement négatif signale souvent un manque de confiance plutôt qu\'un manque de compétence.</p>';

    /* ce que la grille atteste : les attendus reliés à ses items */
    var relies = {};
    grid.items.forEach(function (it) {
      (it.afcIds || []).forEach(function (id) {
        var a = A.afcById(id);
        if (a) (relies[id] = relies[id] || { a: a, items: [] }).items.push(it.label);
      });
    });
    var cles = Object.keys(relies);
    if (cles.length) {
      h += '<h4 style="margin-top:16px">Ce que cette grille atteste</h4>' +
        '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Attendu de fin de cycle</th><th>Items concernés</th></tr></thead><tbody>' +
        cles.map(function (k) {
          var r = relies[k];
          return '<tr><td>' + (r.a.code ? '<b>' + e(r.a.code) + '</b> · ' : '') + e(r.a.texte) +
            '<span class="tiny muted"> · ' + e(A.cycleById(r.a.cycle).name) + '</span></td>' +
            '<td class="small">' + e(r.items.join(', ')) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    return h + afcSection(l);
  }

  function selfNoteOf(grid, selfMarks) {
    /* l'auto-évaluation se fait par critère, pas par item : on convertit */
    var num = 0, den = 0, mx = maxPoints(grid);
    grid.items.forEach(function (it) {
      var lv = selfMarks[it.critId];
      var coef = +it.coef || 0;
      if (lv == null || !coef) return;
      num += grid.levels[A.clamp(lv, 0, grid.levels.length - 1)].points * coef;
      den += mx * coef;
    });
    return den ? A.round(num / den * grid.scale, 1) : null;
  }

  /* ============================================================= grille */

  function editGrid(isNew) {
    var st = A.get(), l = A.currentLesson();
    var grid = isNew ? defaultGrid() : st.grids[l.evaluation.gridId];
    if (!grid) return;
    var draft = JSON.parse(JSON.stringify(grid));
    var apsaCour = A.apsaById(l.classId, l.apsaId);
    var crits = A.criteria(apsaCour || undefined);

    /* Le menu « Rattaché à » propose les critères du cycle, deux raccourcis
       (indice global, résultat des affrontements), la possibilité de noter
       l'item à la main — et surtout d'AJOUTER un critère sans quitter la
       grille : c'est souvent là qu'on s'aperçoit qu'il en manque un. */
    var critOpts = function (cur) {
      var s = crits.map(function (c) {
        return '<option value="' + c.id + '"' + (cur === c.id ? ' selected' : '') + '>' + e(c.name) + '</option>';
      }).join('');
      Object.keys(SPECIAL).forEach(function (k) {
        s += '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + e(SPECIAL[k]) + '</option>';
      });
      s += '<option value="__nouveau__">+ Ajouter un critère…</option>';
      return s;
    };

    /* Les attendus de fin de cycle disponibles : ceux du cycle de la classe,
       et ceux qui valent pour toutes les activités ou pour celle-ci. */
    var cycle = A.cycleOf(l.classId);
    var attendus = A.afcList(cycle, apsaCour ? apsaCour.activite : '');

    var itemsHtml = function () {
      return '<div class="table-wrap"><table class="compact"><thead><tr><th>Item</th><th>Rattaché à</th>' +
        '<th>Niveaux</th><th>Attendus de fin de cycle</th><th class="num">Coef.</th><th></th></tr></thead><tbody>' +
        draft.items.map(function (it, i) {
          it.afcIds = it.afcIds || [];
          var ecrits = aDesDesc(it);
          return '<tr><td><input data-ik="label" data-i="' + i + '" value="' + e(it.label) + '" style="min-width:160px"></td>' +
            '<td><select data-ik="critId" data-i="' + i + '">' + critOpts(it.critId) + '</select></td>' +
            '<td><button type="button" class="btn-sm' + (ecrits ? ' btn-primary' : '') +
            '" data-idesc="' + i + '" title="Rédiger les quatre niveaux de maîtrise pour cet item">' +
            (ecrits ? 'Rédigés' : 'Rédiger…') + '</button></td>' +
            '<td>' + (attendus.length
              ? '<div class="row tight" style="max-width:320px">' + attendus.map(function (a) {
                var on = it.afcIds.indexOf(a.id) > -1;
                return '<button type="button" class="btn-sm' + (on ? ' btn-primary' : '') +
                  '" data-afc="' + a.id + '" data-i="' + i + '" title="' + e(a.texte) + '">' +
                  e(a.code || a.texte.slice(0, 22)) + '</button>';
              }).join('') + '</div>'
              : '<span class="tiny muted">aucun attendu écrit pour ce cycle</span>') + '</td>' +
            '<td class="num"><input type="number" min="0" max="10" data-ik="coef" data-i="' + i + '" value="' + it.coef + '" style="width:70px"></td>' +
            '<td><button type="button" class="btn-sm btn-ghost" data-irm="' + i + '">✕</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    };

    var levelsHtml = function () {
      return draft.levels.map(function (lv, i) {
        return '<div class="row tight" style="margin-bottom:6px">' +
          '<input data-lk="label" data-i="' + i + '" value="' + e(lv.label) + '" style="flex:1">' +
          '<input type="number" data-lk="points" data-i="' + i + '" value="' + lv.points + '" style="width:80px">' +
          '</div>';
      }).join('');
    };

    UI.modal({
      title: isNew ? 'Nouvelle grille' : 'Modifier la grille',
      okLabel: 'Enregistrer',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Nom de la grille</span><input name="gname" value="' + e(draft.name) + '"></label>' +
        '<label class="field"><span>Note sur</span><input type="number" name="scale" min="1" max="100" value="' + draft.scale + '"></label>' +
        '</div>' +
        '<fieldset><legend>Niveaux de maîtrise</legend><div id="lvls">' + levelsHtml() + '</div></fieldset>' +
        '<fieldset><legend>Items évalués</legend><div id="items">' + itemsHtml() + '</div>' +
        '<button type="button" class="btn-sm" id="additem">Ajouter un item</button>' +
        '<p class="small muted" style="margin-top:8px">Rattacher un item à un critère permet à l\'application de proposer un niveau à partir des données. ' +
        'Un item peut aussi être rattaché à l\'indice global ou au résultat des matchs.</p>' +
        '<p class="small muted">Les boutons de la colonne « Attendus » relient l\'item à ce que tu as écrit ' +
        'pour le <b>' + e(A.cycleById(cycle).name) + '</b> : la note dit alors ce qu\'elle atteste. ' +
        'Les attendus se rédigent dans l\'onglet Évaluation, sous la grille.</p></fieldset>' +

        /* Les boutons ne portent que le code : le texte entier se lit ici, au
           bas de la fenêtre, pendant qu'on choisit. */
        (attendus.length
          ? '<fieldset><legend>Rappel des attendus de fin de cycle</legend>' +
            '<div class="table-wrap"><table class="compact"><tbody>' +
            attendus.map(function (a) {
              return '<tr><td class="nowrap" style="vertical-align:top"><b>' +
                e(a.code || '—') + '</b>' + (a.officiel ? '<br>' + UI.badge('CA4', 'ok') : '') + '</td>' +
                '<td>' + e(a.texte) +
                (a.activite ? '<br><span class="tiny muted">' + e(A.activiteById(a.activite).name) + '</span>' : '') +
                '</td></tr>';
            }).join('') + '</tbody></table></div>' +
            '<p class="tiny muted" style="margin:6px 0 0">Ceux du <b>' + e(A.cycleById(cycle).name) +
            '</b>' + (apsaCour ? ', pour le cycle « ' + e(apsaCour.name) + ' »' : '') +
            '. Les boutons ci-dessus n\'en montrent que le code, faute de place.</p></fieldset>'
          : ''),
      onOpen: function (d) {
        var bind = function () {
          d.querySelectorAll('#items [data-ik]').forEach(function (el) {
            var appliquer = function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-ik');
              /* « + Ajouter un critère… » : on le crée dans le cycle en cours,
                 on le rattache à l'item, et on revient au menu comme si de
                 rien n'était. */
              if (k === 'critId' && el.value === '__nouveau__') {
                var avant = draft.items[i].critId;
                el.value = avant;
                UI.ask('Nouveau critère', 'Nom du critère', 'Nouveau critère', function (v) {
                  var nom = (v || '').trim();
                  if (!nom) return;
                  var nouveau = null;
                  A.set(function () {
                    nouveau = {
                      id: A.uid('crt'), name: nom,
                      short: nom.slice(0, 3).toUpperCase(), weight: 1,
                      desc: 'Créé depuis la grille d\'évaluation'
                    };
                    A.cfg(apsaCour || undefined).criteria.push(nouveau);
                  });
                  crits = A.criteria(apsaCour || undefined);
                  draft.items[i].critId = nouveau.id;
                  d.querySelector('#items').innerHTML = itemsHtml();
                  bind();
                  UI.toast('Critère « ' + nom + ' » ajouté à ce cycle.');
                });
                return;
              }
              draft.items[i][k] = k === 'coef' ? +el.value : el.value;
            };
            el.addEventListener('input', appliquer);
            el.addEventListener('change', appliquer);
          });
          d.querySelectorAll('#items [data-afc]').forEach(function (el) {
            el.addEventListener('click', function () {
              var i = +el.getAttribute('data-i'), id = el.getAttribute('data-afc');
              var it = draft.items[i];
              it.afcIds = it.afcIds || [];
              var k = it.afcIds.indexOf(id);
              if (k > -1) it.afcIds.splice(k, 1); else it.afcIds.push(id);
              d.querySelector('#items').innerHTML = itemsHtml(); bind();
            });
          });
          d.querySelectorAll('[data-idesc]').forEach(function (el) {
            el.addEventListener('click', function () {
              var i = +el.getAttribute('data-idesc');
              editItemLevels(draft, draft.items[i], function () {
                d.querySelector('#items').innerHTML = itemsHtml(); bind();
              });
            });
          });
          d.querySelectorAll('[data-irm]').forEach(function (el) {
            el.addEventListener('click', function () {
              draft.items.splice(+el.getAttribute('data-irm'), 1);
              d.querySelector('#items').innerHTML = itemsHtml(); bind();
            });
          });
          d.querySelectorAll('#lvls [data-lk]').forEach(function (el) {
            el.addEventListener('input', function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-lk');
              draft.levels[i][k] = k === 'points' ? +el.value : el.value;
            });
          });
        };
        bind();
        d.querySelector('#additem').addEventListener('click', function () {
          draft.items.push({ id: A.uid('itm'), label: 'Nouvel item', critId: crits[0] ? crits[0].id : '__global__', coef: 1, afcIds: [] });
          d.querySelector('#items').innerHTML = itemsHtml(); bind();
        });
      },
      onOk: function (d) {
        draft.name = d.querySelector('[name=gname]').value.trim() || 'Grille';
        draft.scale = A.clamp(+d.querySelector('[name=scale]').value || 20, 1, 100);
        A.set(function (s) {
          s.grids[draft.id] = draft;
          l.evaluation.gridId = draft.id;
        });
      }
    });
  }

  /* Rédiger les quatre niveaux d'un item. On laisse volontairement vide ce
     qu'on n'a pas besoin de préciser : la grille reprend alors son libellé
     général. Les repères chiffrés ont toute leur place ici — c'est souvent ce
     qui rend un niveau discutable avec l'élève plutôt qu'arbitraire. */
  function editItemLevels(grid, item, apres) {
    item.desc = item.desc || [];
    var exemples = [
      'Ex. : subit l\'échange, renvoie sans intention',
      'Ex. : cherche parfois à déplacer, 1 point direct sur 10 échanges',
      'Ex. : déplace son adversaire et marque 3 points directs sur 10 échanges',
      'Ex. : enchaîne déplacement et frappe décisive, 5 points directs sur 10 échanges'
    ];
    UI.modal({
      title: 'Niveaux de maîtrise — ' + item.label,
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Ce que tu écris ici remplace le libellé général pour ' +
        '<b>cet item seulement</b>. En tactique, un niveau se dit souvent par un chiffre observable ' +
        'dans une situation d\'évaluation ; en fair-play, plutôt par une description. Laisse vide ' +
        'ce que tu ne veux pas préciser : le libellé de la grille reprend sa place.</p>' +
        grid.levels.map(function (lv, i) {
          return '<label class="field"><span>' + e(lv.label) + ' <span class="tiny muted">(' +
            lv.points + ' pt' + (lv.points > 1 ? 's' : '') + ')</span></span>' +
            '<textarea data-d="' + i + '" rows="3" placeholder="' + e(exemples[i] || '') + '">' +
            e(item.desc[i] || '') + '</textarea></label>';
        }).join('') +
        '<p class="tiny muted">Ces descriptions se retrouvent dans le tableau d\'évaluation, dans ' +
        'l\'auto-évaluation des élèves en kiosque, et dans le dossier de séquence imprimé. ' +
        '<b>Tes retours à la ligne sont conservés</b> : un repère par ligne se lit plus vite ' +
        'qu\'un paragraphe.</p>',
      onOk: function (d) {
        var vals = [];
        d.querySelectorAll('[data-d]').forEach(function (t) {
          vals[+t.getAttribute('data-d')] = t.value.trim();
        });
        item.desc = grid.levels.map(function (lv, i) { return vals[i] || ''; });
        if (apres) apres();
      }
    });
  }

  /* Consulter les niveaux d'un item depuis le tableau d'évaluation. */
  function voirNiveaux(itemId) {
    var st = A.get(), l = A.currentLesson();
    var grid = l && l.evaluation ? st.grids[l.evaluation.gridId] : null;
    if (!grid) return;
    var item = grid.items.filter(function (i) { return i.id === itemId; })[0];
    if (!item) return;
    UI.modal({
      title: 'Niveaux de maîtrise — ' + item.label,
      okLabel: 'Fermer', cancel: false,
      body: '<div class="table-wrap"><table class="compact"><tbody>' +
        grid.levels.map(function (lv, i) {
          return '<tr><td class="nowrap"><b>' + e(lv.label) + '</b><br>' +
            '<span class="tiny muted">' + lv.points + ' pt' + (lv.points > 1 ? 's' : '') + '</span></td>' +
            '<td class="niv-texte">' + e(descOf(grid, item, i)) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
    });
  }

  function proposeAll() {
    var st = A.get(), l = A.currentLesson(), cls = st.classes[l.classId];
    var grid = st.grids[l.evaluation.gridId];
    if (!grid) return;
    var ratings = RATINGS.compute(cls.id);
    var present = LESSON.presentStudents(l);
    var filled = 0, skipped = 0;
    A.set(function () {
      present.forEach(function (s) {
        var marks = l.evaluation.teacher[s.id] = l.evaluation.teacher[s.id] || {};
        grid.items.forEach(function (it) {
          if (marks[it.id] != null) return;       // on n'écrase jamais une saisie manuelle
          var p = proposeLevel(grid, ratings, s.id, it);
          if (p == null) { skipped++; return; }
          marks[it.id] = p; filled++;
        });
      });
    });
    UI.toast(filled + ' cases proposées' + (skipped ? ', ' + skipped + ' sans donnée' : '') + '. Les cases déjà remplies n\'ont pas été touchées.');
  }

  function exportNotes() {
    var st = A.get(), l = A.currentLesson(), cls = st.classes[l.classId];
    var grid = st.grids[l.evaluation.gridId];
    if (!grid) return;
    var rows = [['Nom', 'Prénom'].concat(grid.items.map(function (i) { return i.label; }))
      .concat(['Note /' + grid.scale, 'Auto-évaluation', 'Écart'])];
    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var marks = l.evaluation.teacher[s.id] || {};
      var note = noteOf(grid, marks);
      var sn = selfNoteOf(grid, l.evaluation.self[s.id] || {});
      rows.push([s.last, s.first].concat(grid.items.map(function (it) {
        var li = marks[it.id];
        return li == null ? '' : grid.levels[li].label;
      })).concat([note == null ? '' : String(note).replace('.', ','),
                  sn == null ? '' : String(sn).replace('.', ','),
                  (note != null && sn != null) ? String(A.round(sn - note, 1)).replace('.', ',') : '']));
    });
    A.download('notes-' + cls.name.replace(/\W+/g, '-') + '-' + l.date + '.csv',
      '﻿' + A.toCSV(rows), 'text/csv;charset=utf-8');
    UI.toast('Notes exportées.');
  }

  /* ------------------------------------------- attendus de fin de cycle

     Écrits par l'enseignant, dans ses mots, et rangés par cycle. Une classe de
     sixième relève du cycle 3, une classe de quatrième du cycle 4, le lycée a
     les siens : ce ne sont pas les mêmes exigences, ce ne sont donc pas les
     mêmes attendus. Un attendu peut valoir pour toutes les activités ou pour
     une seule. */
  function afcSection(l) {
    var cls = A.get().classes[l.classId];
    var cycle = A.cycleOf(cls.id);
    var apsa = A.apsaById(cls.id, l.apsaId);
    var tous = A.afcAll();
    var utilises = {};
    Object.keys(A.get().grids || {}).forEach(function (k) {
      (A.get().grids[k].items || []).forEach(function (it) {
        (it.afcIds || []).forEach(function (id) { utilises[id] = (utilises[id] || 0) + 1; });
      });
    });

    var manquants = A.AFC_OFFICIELS.filter(function (o) { return !A.afcById(o.id); }).length;

    var h = '<div class="card" style="margin-top:16px"><div class="card-head"><div>' +
      '<h3 style="margin:0">Attendus de fin de cycle</h3>' +
      '<p class="small muted" style="margin:0">Ce que tes notes attestent. Les attendus du CA4 sont ' +
      'déjà là — les mêmes pour toutes les activités — et tu peux les reformuler ou en ajouter.</p></div>' +
      '<div class="row tight">' +
      '<label class="inline"><span class="small muted">Cycle de la classe</span>' +
      '<select data-chg="class.cycle">' + A.CYCLES.map(function (c) {
        return '<option value="' + c.id + '"' + (c.id === cycle ? ' selected' : '') + '>' +
          e(c.name) + ' — ' + e(c.hint) + '</option>';
      }).join('') + '</select></label>' +
      '<button class="btn-primary" data-act="afc.new">Écrire un attendu</button>' +
      (manquants ? '<button data-act="afc.seed">Rétablir les attendus du CA4 (' + manquants + ')</button>' : '') +
      '</div></div>';

    if (!tous.length) {
      h += UI.empty('Aucun attendu',
        'Les attendus de fin de cycle du CA4 sont livrés avec l\'application. Si tu les as tous ' +
        'supprimés, « Rétablir les attendus du CA4 » les remet en place ; « Écrire un attendu » ' +
        'ajoute les tiens.');
      return h + '</div>';
    }

    h += '<div class="table-wrap"><table class="compact"><thead><tr>' +
      '<th>Code</th><th>Attendu</th><th>Cycle</th><th>Activité</th><th class="num">Items reliés</th><th></th>' +
      '</tr></thead><tbody>' +
      A.sortBy(tous, function (a) { return a.cycle + (a.code || '') + a.texte; }).map(function (a) {
        return '<tr' + (a.cycle === cycle ? ' class="lv-tint"' : '') + '>' +
          '<td class="nowrap"><b>' + e(a.code || '—') + '</b></td>' +
          '<td>' + e(a.texte) +
          (a.officiel ? ' ' + UI.badge('CA4', 'ok') : '') + '</td>' +
          '<td class="small muted">' + e(A.cycleById(a.cycle).name) + '</td>' +
          '<td class="small muted">' + (a.activite ? e(A.activiteById(a.activite).name) : 'toutes') + '</td>' +
          '<td class="num">' + (utilises[a.id] || 0) + '</td>' +
          '<td class="num nowrap">' +
          '<button class="btn-sm" data-act="afc.edit" data-id="' + a.id + '">Modifier</button> ' +
          '<button class="btn-sm btn-ghost" data-act="afc.del" data-id="' + a.id + '">✕</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="tiny muted" style="margin-top:8px">Surlignés : les attendus du cycle de cette classe (' +
      e(A.cycleById(cycle).name) + ')' + (apsa ? ', utilisables dans le cycle « ' + e(apsa.name) + ' »' : '') +
      '. Les autres restent disponibles pour tes autres classes. ' +
      'Le repère <span class="badge ok">CA4</span> marque les attendus livrés avec l\'application : ' +
      'ils valent pour toutes les activités, et se modifient comme les tiens.</p>';
    return h + '</div>';
  }

  /* Rédiger ou corriger un attendu. */
  function editAfc(id, classId) {
    var a = id ? A.afcById(id) : null;
    var cycle = a ? a.cycle : A.cycleOf(classId || A.get().ui.classId);
    var act = a ? a.activite : '';
    UI.modal({
      title: a ? 'Attendu de fin de cycle' : 'Nouvel attendu de fin de cycle',
      okLabel: 'Enregistrer',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Cycle</span><select name="cycle">' +
        A.CYCLES.map(function (c) {
          return '<option value="' + c.id + '"' + (c.id === cycle ? ' selected' : '') + '>' +
            e(c.name) + ' — ' + e(c.hint) + '</option>';
        }).join('') + '</select></label>' +
        '<label class="field"><span>Activité concernée</span><select name="act">' +
        '<option value="">Toutes les activités</option>' +
        A.ACTIVITES.map(function (x) {
          return '<option value="' + x.id + '"' + (x.id === act ? ' selected' : '') + '>' + e(x.name) + '</option>';
        }).join('') + '</select></label>' +
        '</div>' +
        '<label class="field" style="max-width:220px"><span>Code court (facultatif)</span>' +
        '<input name="code" value="' + e(a ? a.code : '') + '" placeholder="AFC 1, CA4-2…">' +
        '<span class="tiny muted">Ce qui s\'affichera sur les boutons de la grille.</span></label>' +
        '<label class="field"><span>Attendu</span>' +
        '<textarea name="texte" rows="3" placeholder="Construire un point en variant les zones et les trajectoires">' +
        e(a ? a.texte : '') + '</textarea></label>',
      onOk: function (d) {
        var texte = d.querySelector('[name=texte]').value.trim();
        if (!texte) { UI.toast('Écris l\'attendu.'); return false; }
        A.set(function () {
          var cible = a || A.newAfc({});
          cible.cycle = d.querySelector('[name=cycle]').value;
          cible.activite = d.querySelector('[name=act]').value;
          cible.code = d.querySelector('[name=code]').value.trim();
          cible.texte = texte;
        });
        UI.toast('Attendu enregistré.');
      }
    });
  }

  return {
    afcSection: afcSection, editAfc: editAfc,
    view: view, defaultGrid: defaultGrid, editGrid: editGrid, proposeAll: proposeAll,
    exportNotes: exportNotes, noteOf: noteOf, selfNoteOf: selfNoteOf, maxPoints: maxPoints,
    proposeLevel: proposeLevel, SPECIAL: SPECIAL,
    descOf: descOf, aDesDesc: aDesDesc, labelNiveau: labelNiveau,
    editItemLevels: editItemLevels, voirNiveaux: voirNiveaux
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — rencontres individuelles : poules, ligues et défis

   Trois façons d'organiser un affrontement en un contre un, et une seule
   mécanique en dessous : des élèves regroupés, des rencontres, des scores.

   · POULE  — un groupe où tout le monde rencontre tout le monde. C'est le
              format d'entrée : chacun joue le même nombre de matchs.
   · LIGUE  — des poules ordonnées, de la plus forte à la plus faible. On ne
              rencontre que les élèves de sa ligue ; l'enseignant décide qui
              monte et qui descend, l'application se contentant de classer et
              de proposer.
   · DÉFI   — une échelle. Chacun choisit son adversaire dans les limites que
              l'enseignant a posées : au-dessus de soi, à portée de rangs, ou
              librement. Gagner prend la place de l'autre.

   Les rencontres sont stockées telles quelles dans la leçon, et alimentent les
   indices comme n'importe quel résultat (voir ratings.js).
   ========================================================================== */
'use strict';

var ARENA = (function () {

  var A = APP, e = APP.escapeHtml;

  /* Plancher d'effectif d'un groupe : en dessous de trois, une poule ne fait
     plus jouer grand monde. */
  var MIN_GROUPE = 3;

  var MODES = [
    { k: 'poules', l: 'Poules', hint: 'Tout le monde rencontre tout le monde, dans son groupe.' },
    { k: 'ligues', l: 'Ligues', hint: 'Des groupes de niveau cloisonnés, avec montées et descentes.' },
    { k: 'defis', l: 'Défis', hint: 'Une échelle : chacun choisit son adversaire dans les règles posées.' }
  ];

  /* Toutes les variables du mode défi sont à la main de l'enseignant : c'est
     le réglage qui fait la différence entre une cohue et une situation
     d'apprentissage. La CONSÉQUENCE d'une victoire, surtout : prendre la place
     de l'autre n'a pas le même effet sur une classe que marquer des points. */
  var REGLES_DEFAUT = {
    cible: 'mieux',       // 'mieux' | 'proche' | 'libre'
    ecartMax: 3,          // nombre de rangs d'écart tolérés
    uniques: true,        // jamais deux fois le même adversaire dans la séance
    maxDefis: 3,          // nombre de défis par élève et par séance (0 = sans limite)
    consequence: 'place', // 'place' | 'monte' | 'points' | 'aucune'
    montee: 1,            // nombre de rangs gagnés, quand la conséquence est « monter »
    ptsVictoire: 3,       // barème du classement aux points
    ptsDefaite: 1,
    ptsParRang: 1,        // bonus par rang d'écart quand on bat mieux classé que soi
    ptsMax: 0,            // plafond du bonus d'écart (0 = pas de plafond)
    echange: true         // conservé pour les fiches écrites avant la refonte
  };

  /* ------------------------------------------------------------- modèle */

  function arenaOf(l) {
    if (!l.arena) {
      l.arena = {
        mode: 'poules', groups: [], matches: [], echelle: [],
        regles: null, terrains: null, tiroirs: {}
      };
    }
    var ar = l.arena;
    ar.groups = ar.groups || [];
    ar.matches = ar.matches || [];
    ar.echelle = ar.echelle || [];
    ar.tiroirs = ar.tiroirs || {};
    ar.regles = Object.assign({}, REGLES_DEFAUT, ar.regles || {});
    return ar;
  }

  function regles(l) {
    var r = Object.assign({}, REGLES_DEFAUT, arenaOf(l).regles || {});
    /* Reprise des fiches écrites avant que la conséquence soit réglable :
       « le vainqueur prend la place » était alors une simple case à cocher. */
    if (!r.consequence) r.consequence = r.echange === false ? 'aucune' : 'place';
    r.montee = Math.max(1, +r.montee || 1);
    r.ptsVictoire = Math.max(0, +r.ptsVictoire);
    r.ptsDefaite = Math.max(0, +r.ptsDefaite);
    r.ptsParRang = Math.max(0, +r.ptsParRang);
    r.ptsMax = Math.max(0, +r.ptsMax);
    return r;
  }

  /* ------------------------------------------------- relevés et bonus

     Une rencontre ne se résume pas toujours à son score. L'enseignant choisit
     ce qu'on observe — points gagnants, fautes, montées au filet, ce qu'il
     veut — et peut relier chaque compteur à un critère : le relevé nourrit
     alors l'indice, comme les relevés de match d'un sport collectif.
     Les BONUS, eux, ajoutent des points au score : « smash gagnant après
     déplacement = 2 points » valorise une intention de jeu sans changer les
     règles du badminton. */
  function configOf(l) {
    var ar = arenaOf(l);
    if (!ar.config) ar.config = {};
    if (!Array.isArray(ar.config.fields) || !ar.config.fields.length) {
      var ap = A.apsaById(l.classId, l.apsaId);
      ar.config.fields = JSON.parse(JSON.stringify(A.cfg(ap || undefined).statFields || []));
    }
    ar.config.bonuses = ar.config.bonuses || [];
    return ar.config;
  }
  function champsActifs(l) {
    return configOf(l).fields.filter(function (f) { return f.on !== false; });
  }
  function bonusDe(l) { return configOf(l).bonuses || []; }

  function terrainsOf(l) {
    var ar = arenaOf(l);
    var n = ar.terrains == null ? A.get().settings.terrains : ar.terrains;
    return A.clamp(+n || A.TERRAINS, 1, A.MAX_TERRAINS);
  }

  function format(l) {
    var ap = l ? A.apsaById(l.classId, l.apsaId) : A.currentApsa();
    var c = A.cfg(ap || undefined);
    return Object.assign({}, A.activiteById(ap ? ap.activite : null).format, c.format || {});
  }

  function nom(cls, sid) {
    var s = A.studentById(cls.id, sid);
    return s ? A.displayName(s) : '?';
  }
  function court(cls, sid) {
    var s = A.studentById(cls.id, sid);
    return s ? A.shortName(s) : '?';
  }

  function groupById(l, gid) {
    var g = arenaOf(l).groups.filter(function (x) { return x.id === gid; })[0];
    return g || null;
  }
  function groupOf(l, sid) {
    return arenaOf(l).groups.filter(function (g) { return (g.members || []).indexOf(sid) > -1; })[0] || null;
  }

  /* ------------------------------------------------- composition des groupes

     Deux réglages, indépendants l'un de l'autre.

     Le niveau : par niveau, les élèves proches se retrouvent ensemble et les
     rencontres sont serrées ; à niveau équilibré, chaque groupe ressemble à la
     classe. Les ligues sont par niveau par défaut — c'est leur raison d'être —
     mais rien n'oblige : un enseignant qui veut des ligues mélangées et une
     montée-descente au mérite doit pouvoir le faire.

     Le sexe : on n'en tient pas compte, on sépare filles et garçons, ou on
     répartit les deux dans chaque groupe. C'est un choix de séance, pas une
     propriété de l'activité. */

  /* Découpe une liste déjà triée du plus fort au plus faible en nb paquets
     aussi égaux que possible. En mode niveau, ce sont des tranches contiguës ;
     sinon un serpentin, qui donne à chaque paquet un fort, un faible, etc. */
  function repartir(tries, nb, niveau) {
    var paquets = [], i;
    for (i = 0; i < nb; i++) paquets.push([]);
    if (!tries.length || nb < 1) return paquets;
    if (niveau === false) {
      var sens = 1, g = 0;
      tries.forEach(function (sid) {
        paquets[g].push(sid);
        g += sens;
        if (g === nb) { g = nb - 1; sens = -1; }
        else if (g < 0) { g = 0; sens = 1; }
      });
    } else {
      var base = Math.floor(tries.length / nb), reste = tries.length % nb, k = 0;
      for (i = 0; i < nb; i++) {
        var taille = base + (i < reste ? 1 : 0);
        paquets[i] = tries.slice(k, k + taille);
        k += taille;
      }
    }
    return paquets;
  }

  function compose(l, cfg) {
    var cls = A.get().classes[l.classId];
    var present = LESSON.presentStudents(l);
    if (present.length < 2) return { error: 'Il faut au moins deux élèves présents.' };

    var r = RATINGS.compute(cls.id, l.apsaId);
    var indice = function (sid) { return r.byStudent[sid] ? r.byStudent[sid].index : 5; };
    var nb = cfg.mode === 'count'
      ? A.clamp(+cfg.count || 2, 1, 12)
      : A.clamp(Math.round(present.length / Math.max(2, +cfg.size || 4)), 1, 12);

    /* Un groupe de deux, c'est une seule rencontre et beaucoup d'attente : dès
       que le compte ne tombe pas juste, on préfère des groupes un peu plus
       fournis. Trois élèves par groupe est le plancher — au-dessous, la poule
       n'a plus d'intérêt. */
    var ajuste = false, notes = [];
    if (present.length >= MIN_GROUPE) {
      var maxGroupes = Math.floor(present.length / MIN_GROUPE);
      if (nb > maxGroupes) { nb = maxGroupes; ajuste = true; }
    } else {
      nb = 1;
    }

    var niveau = cfg.niveau !== false;
    var mixite = cfg.mixite || 'libre';
    var tri = function (list) {
      return list.slice()
        .sort(function (a, b) { return indice(b.id) - indice(a.id); })
        .map(function (s) { return s.id; });
    };
    var filles = present.filter(function (s) { return s.sex === 'F'; });
    var garcons = present.filter(function (s) { return s.sex !== 'F'; });

    if (mixite !== 'libre' && (!filles.length || !garcons.length)) {
      notes.push('Un seul genre est présent : la consigne de mixité n\'a pas pu s\'appliquer.');
      mixite = 'libre';
    }

    var paquets = [], etiquettes = [];
    if (mixite === 'nonmixte') {
      /* Deux sous-classes indépendantes. Le nombre de groupes se partage au
         prorata de l'effectif, sans jamais descendre sous un groupe par genre —
         et sans fabriquer des groupes trop petits d'un côté ou de l'autre. */
      var partF = Math.round(nb * filles.length / present.length);
      var nbF = A.clamp(partF, 1, Math.max(1, Math.floor(filles.length / MIN_GROUPE)));
      var nbG = A.clamp(nb - nbF, 1, Math.max(1, Math.floor(garcons.length / MIN_GROUPE)));
      if (nbF + nbG !== nb) ajuste = true;
      repartir(tri(filles), nbF, niveau).forEach(function (p) { paquets.push(p); etiquettes.push('F'); });
      repartir(tri(garcons), nbG, niveau).forEach(function (p) { paquets.push(p); etiquettes.push('G'); });
      if (filles.length < MIN_GROUPE || garcons.length < MIN_GROUPE) {
        notes.push('Groupes non mixtes : un des deux groupes compte moins de ' + MIN_GROUPE + ' élèves.');
      }
    } else if (mixite === 'equilibre') {
      /* Chaque groupe reçoit sa part de filles et sa part de garçons, en
         respectant par ailleurs la consigne de niveau. */
      var pF = repartir(tri(filles), nb, niveau);
      var pG = repartir(tri(garcons), nb, niveau);
      for (var i2 = 0; i2 < nb; i2++) {
        paquets.push(pF[i2].concat(pG[i2]));
        etiquettes.push('');
      }
    } else {
      repartir(tri(present), nb, niveau).forEach(function (p) { paquets.push(p); etiquettes.push(''); });
    }

    var ar = arenaOf(l);
    var ligues = ar.mode === 'ligues';
    var rang = { F: 0, G: 0, '': 0 };
    ar.groups = paquets.map(function (mem, i) {
      var tag = etiquettes[i];
      var n2 = ++rang[tag];
      var nomGroupe;
      if (tag) {
        var genre = tag === 'F' ? 'filles' : 'garçons';
        nomGroupe = ligues
          ? ('Ligue ' + genre + ' ' + n2)
          : ('Poule ' + genre + ' ' + String.fromCharCode(64 + n2));
      } else {
        nomGroupe = ligues ? ('Ligue ' + n2) : ('Poule ' + String.fromCharCode(64 + n2));
      }
      return {
        id: A.uid('grp'),
        name: nomGroupe,
        color: A.TEAM_COLORS[i % A.TEAM_COLORS.length],
        sexe: tag || null,
        members: mem
      };
    }).filter(function (g2) { return g2.members.length; });
    ar.matches = [];
    ar.compo = { mode: cfg.mode, count: cfg.count, niveau: niveau, mixite: mixite };
    return {
      count: ar.groups.length, ajuste: ajuste, effectif: present.length,
      notes: notes, niveau: niveau, mixite: mixite
    };
  }

  /* --------------------------------------------------------- calendrier

     Méthode du carrousel : dans un groupe de n joueurs, n−1 tours suffisent
     pour que tout le monde se rencontre une fois, sans jamais jouer deux fois
     dans le même tour. Les groupes tournent en parallèle ; s'il y a plus de
     rencontres simultanées que de terrains, le tour se découpe. */
  function rondes(ids) {
    var l2 = ids.slice();
    if (l2.length % 2) l2.push(null);          // un joueur au repos par tour
    var n = l2.length, tours = [];
    for (var t = 0; t < n - 1; t++) {
      var paires = [];
      for (var i = 0; i < n / 2; i++) {
        var a = l2[i], b = l2[n - 1 - i];
        if (a && b) paires.push([a, b]);
      }
      tours.push(paires);
      l2.splice(1, 0, l2.pop());               // on fixe le premier, le reste tourne
    }
    return tours;
  }

  function planifier(l) {
    var ar = arenaOf(l);
    var terrains = terrainsOf(l);
    var parGroupe = ar.groups.map(function (g) { return rondes(g.members); });
    var maxTours = parGroupe.reduce(function (m, t) { return Math.max(m, t.length); }, 0);

    var matches = [], tour = 1;
    for (var t = 0; t < maxTours; t++) {
      /* toutes les rencontres du tour t, tous groupes confondus */
      var lot = [];
      parGroupe.forEach(function (tours, gi) {
        (tours[t] || []).forEach(function (p) {
          lot.push({ gid: ar.groups[gi].id, a: p[0], b: p[1] });
        });
      });
      /* on les sert par paquets de « terrains » */
      for (var k = 0; k < lot.length; k += terrains) {
        lot.slice(k, k + terrains).forEach(function (m, i) {
          matches.push({
            id: A.uid('ren'), groupId: m.gid, a: m.a, b: m.b,
            scoreA: null, scoreB: null, tour: tour, terrain: i + 1, defi: false
          });
        });
        tour++;
      }
    }
    ar.matches = matches;
    return matches.length;
  }

  /* De nouvelles rencontres, quand les élèves ont fini avant l'heure. On
     apparie ceux qui ont le moins joué en évitant les adversaires déjà
     rencontrés : c'est ce qu'on ferait de tête au bord du terrain, en moins
     hésitant. Rien n'est effacé — les rencontres jouées restent, les nouvelles
     s'ajoutent à la suite.

     opts = { tours: combien de rencontres par élève, inedits: refuser un
     adversaire déjà rencontré plutôt que de le reprendre,
     entre: 'poule' (revanche dans sa poule) | 'rang' | 'indice' (croiser les
     poules, voir croiser()) } */
  function relancer(l, gid, opts) {
    opts = opts || {};
    var tours = A.clamp(+opts.tours || 1, 1, 10);
    var inedits = opts.inedits === true;
    var ar = arenaOf(l);
    if (opts.entre === 'rang' || opts.entre === 'indice') {
      return croiser(l, { tours: tours, inedits: inedits, critere: opts.entre });
    }
    var groupes = gid ? [groupById(l, gid)].filter(Boolean) : ar.groups;
    if (!groupes.length) return 0;
    var terrains = terrainsOf(l);
    var tourMax = ar.matches.reduce(function (m, x) { return Math.max(m, +x.tour || 0); }, 0);
    var ajoutes = 0, prochain = tourMax;

    groupes.forEach(function (g) {
      var mem = g.members.slice();
      if (mem.length < 2) return;
      var joues = {}, vus = {};
      mem.forEach(function (sid) { joues[sid] = 0; vus[sid] = {}; });
      ar.matches.forEach(function (m) {
        if (m.groupId !== g.id) return;
        [[m.a, m.b], [m.b, m.a]].forEach(function (p) {
          if (joues[p[0]] == null) return;
          joues[p[0]]++;
          vus[p[0]][p[1]] = (vus[p[0]][p[1]] || 0) + 1;
        });
      });

      var debut = prochain;
      for (var t = 0; t < tours; t++) {
        /* on part de ceux qui ont le moins joué, et on leur cherche le
           partenaire le moins souvent rencontré */
        var libres = mem.slice().sort(function (a, b) { return joues[a] - joues[b]; });
        var paires = [];
        while (libres.length > 1) {
          var a = libres.shift();
          var best = null, score = Infinity;
          libres.forEach(function (b, i) {
            var dejaVu = vus[a][b] || 0;
            if (inedits && dejaVu) return;
            var s2 = dejaVu * 100 + joues[b];
            if (s2 < score) { score = s2; best = i; }
          });
          if (best == null) continue;      // personne d'inédit pour lui : il passe son tour
          var b2 = libres.splice(best, 1)[0];
          paires.push([a, b2]);
          joues[a]++; joues[b2]++;
          vus[a][b2] = (vus[a][b2] || 0) + 1;
          vus[b2][a] = (vus[b2][a] || 0) + 1;
        }
        if (!paires.length) break;         // plus rien à proposer dans ce groupe

        paires.forEach(function (p, i) {
          var tr = debut + 1 + (t * Math.ceil(paires.length / terrains)) + Math.floor(i / terrains);
          prochain = Math.max(prochain, tr);
          ar.matches.push({
            id: A.uid('ren'), groupId: g.id, a: p[0], b: p[1],
            scoreA: null, scoreB: null,
            tour: tr, terrain: (i % terrains) + 1,
            defi: false, relance: true
          });
          ajoutes++;
        });
      }
    });
    return ajoutes;
  }

  /* Qui a fini sa poule ? Celui qui n'a plus de rencontre en attente. C'est la
     question qu'on se pose vraiment au bord du terrain : deux élèves qui
     tournent en rond pendant que les autres jouent encore. */
  function aFini(l, sid) {
    return !arenaOf(l).matches.some(function (m) {
      return (m.a === sid || m.b === sid) && m.scoreA == null;
    });
  }

  /* Où en est chacun : sa poule, sa place dans sa poule, son indice. Sert à
     apparier deux élèves « au même stade » sans y réfléchir deux fois. */
  function stades(l) {
    var ar = arenaOf(l);
    var r = RATINGS.compute(l.classId, l.apsaId);
    var out = { place: {}, poule: {}, indice: {} };
    LESSON.presentStudents(l).forEach(function (s) {
      out.indice[s.id] = r.byStudent[s.id] ? r.byStudent[s.id].index : 5;
    });
    ar.groups.forEach(function (g) {
      classement(l, g.id).forEach(function (p, i) {
        out.place[p.id] = i + 1;
        out.poule[p.id] = g.id;
      });
      g.members.forEach(function (sid) {
        if (out.place[sid] == null) { out.place[sid] = g.members.length; out.poule[sid] = g.id; }
      });
    });
    return out;
  }

  /* ------------------------------------------------- enchaîner tout seul

     Une poule de quatre finit en trois tours ; une poule de sept, non. Les
     premiers libérés n'ont alors rien à faire, et c'est le moment où une leçon
     se délite. Plutôt que d'attendre que l'enseignant traverse le gymnase, la
     tablette leur propose de continuer contre quelqu'un qui a fini aussi —
     donc au même stade qu'eux. L'enseignant garde la main : il autorise ou
     non, choisit le critère d'appariement et peut plafonner le nombre de
     rencontres supplémentaires. */
  var ENCHAIN_DEFAUT = { actif: true, critere: 'rang', max: 0, memePoule: true };

  function enchainConfig(l) {
    var ar = arenaOf(l);
    ar.enchainer = Object.assign({}, ENCHAIN_DEFAUT, ar.enchainer || {});
    ar.enchainer.max = Math.max(0, +ar.enchainer.max || 0);
    return ar.enchainer;
  }

  /* Rencontres supplémentaires déjà jouées ou en cours par un élève. */
  function supplementsDe(l, sid) {
    return arenaOf(l).matches.filter(function (m) {
      return (m.inter || m.relance) && (m.a === sid || m.b === sid);
    }).length;
  }

  /* À qui cet élève peut-il se mesurer maintenant ? Ceux qui ont fini comme
     lui, qui ne sont pas déjà pris, et qui restent dans son quota. Triés du
     plus proche au plus lointain : on veut une rencontre qui ait du sens, pas
     le premier prénom de la liste. */
  function partenairesLibres(l, sid) {
    var cfg = enchainConfig(l);
    var ar = arenaOf(l);
    if (!cfg.actif || ar.mode === 'defis') return [];
    if (!aFini(l, sid) || !groupOf(l, sid)) return [];
    if (cfg.max > 0 && supplementsDe(l, sid) >= cfg.max) return [];

    var st = stades(l);
    var vus = {};
    ar.matches.forEach(function (m) {
      var k = [m.a, m.b].sort().join('|');
      vus[k] = (vus[k] || 0) + 1;
    });

    var cand = LESSON.presentStudents(l).filter(function (s) {
      if (s.id === sid) return false;
      if (!groupOf(l, s.id)) return false;
      if (!aFini(l, s.id)) return false;                       // il joue encore
      if (cfg.max > 0 && supplementsDe(l, s.id) >= cfg.max) return false;
      if (!cfg.memePoule && st.poule[s.id] === st.poule[sid]) return false;
      return true;
    });

    var ecart = function (id) {
      return cfg.critere === 'indice'
        ? Math.abs(st.indice[id] - st.indice[sid])
        : Math.abs((st.place[id] || 9) - (st.place[sid] || 9)) + Math.abs(st.indice[id] - st.indice[sid]) / 10;
    };
    /* Un adversaire d'une autre poule d'abord : c'est le sel de l'affaire.
       Puis celui qu'on a le moins vu, puis le plus proche. */
    return cand.map(function (s) {
      var k = [sid, s.id].sort().join('|');
      return {
        id: s.id,
        autrePoule: st.poule[s.id] !== st.poule[sid],
        place: st.place[s.id] || null,
        poule: (groupById(l, st.poule[s.id]) || {}).name || '',
        deja: vus[k] || 0,
        ecart: ecart(s.id)
      };
    }).sort(function (a, b) {
      if (a.autrePoule !== b.autrePoule) return a.autrePoule ? -1 : 1;
      if (a.deja !== b.deja) return a.deja - b.deja;
      return a.ecart - b.ecart;
    });
  }

  /* L'élève a choisi : on crée la rencontre et on la lui rend tout de suite. */
  function enchainer(l, a, b) {
    var ar = arenaOf(l);
    var st = stades(l);
    var meme = st.poule[a] && st.poule[a] === st.poule[b];
    var tour = ar.matches.reduce(function (n, x) { return Math.max(n, +x.tour || 0); }, 0) + 1;
    /* Hors classement de poule, même quand les deux viennent de la même :
       une poule finie garde son résultat, ces rencontres-là sont du rab. */
    var m = {
      id: A.uid('ren'),
      groupId: null,
      a: a, b: b, scoreA: null, scoreB: null,
      tour: tour, terrain: null,
      defi: false, relance: true, inter: !meme,
      placeA: st.place[a] || null, placeB: st.place[b] || null,
      libre: true                       // choisie par les élèves, pas planifiée
    };
    ar.matches.push(m);
    return m;
  }

  /* Croiser les poules. Une fois sa poule finie, rejouer contre les mêmes n'a
     plus grand intérêt : on va chercher les élèves des AUTRES poules qui ont
     fini aussi, et on les apparie au plus juste — soit sur leur place dans
     leur poule (le 2e d'une poule contre le 2e d'une autre : même statut, même
     enjeu), soit sur leur indice (des rencontres serrées quelles que soient
     les places). Les rencontres créées n'appartiennent à aucune poule : elles
     ne faussent donc aucun classement de poule. */
  function croiser(l, opts) {
    opts = opts || {};
    var tours = A.clamp(+opts.tours || 1, 1, 10);
    var inedits = opts.inedits === true;
    var parIndice = opts.critere === 'indice';
    var ar = arenaOf(l);
    if (ar.groups.length < 2) return 0;

    var r = RATINGS.compute(l.classId, l.apsaId);
    var indice = function (sid) { return r.byStudent[sid] ? r.byStudent[sid].index : 5; };

    /* place de chacun dans sa poule, et poule d'appartenance */
    var place = {}, poule = {}, dispo = [];
    ar.groups.forEach(function (g) {
      classement(l, g.id).forEach(function (p, i) {
        place[p.id] = i + 1;
        poule[p.id] = g.id;
      });
      g.members.forEach(function (sid) {
        if (place[sid] == null) { place[sid] = g.members.length; poule[sid] = g.id; }
        if (aFini(l, sid)) dispo.push(sid);
      });
    });
    if (dispo.length < 2) return 0;

    var vus = {};
    ar.matches.forEach(function (m) {
      vus[[m.a, m.b].sort().join('|')] = (vus[[m.a, m.b].sort().join('|')] || 0) + 1;
    });
    var joues = {};
    dispo.forEach(function (sid) { joues[sid] = 0; });

    var terrains = terrainsOf(l);
    var prochain = ar.matches.reduce(function (m, x) { return Math.max(m, +x.tour || 0); }, 0);
    var ajoutes = 0;

    var cout = function (a, b) {
      return parIndice
        ? Math.abs(indice(a) - indice(b))
        : Math.abs(place[a] - place[b]) + Math.abs(indice(a) - indice(b)) / 10;
    };

    for (var t = 0; t < tours; t++) {
      /* ceux qui ont le moins joué d'abord, puis par place dans leur poule :
         les premiers avec les premiers, les derniers avec les derniers */
      var libres = dispo.slice().sort(function (a, b) {
        if (joues[a] !== joues[b]) return joues[a] - joues[b];
        return parIndice ? indice(b) - indice(a) : place[a] - place[b];
      });
      var paires = [];
      while (libres.length > 1) {
        var a2 = libres.shift();
        var best = null, score = Infinity;
        libres.forEach(function (b2, i) {
          if (poule[b2] === poule[a2]) return;                 // c'est tout l'intérêt
          var deja = vus[[a2, b2].sort().join('|')] || 0;
          if (inedits && deja) return;
          var s2 = deja * 100 + cout(a2, b2);
          if (s2 < score) { score = s2; best = i; }
        });
        if (best == null) continue;
        var adv = libres.splice(best, 1)[0];
        paires.push([a2, adv]);
        joues[a2]++; joues[adv]++;
        var k2 = [a2, adv].sort().join('|');
        vus[k2] = (vus[k2] || 0) + 1;
      }
      if (!paires.length) break;

      paires.forEach(function (p, i) {
        var tr = prochain + 1 + Math.floor(i / terrains);
        ar.matches.push({
          id: A.uid('ren'), groupId: null, a: p[0], b: p[1],
          scoreA: null, scoreB: null,
          tour: tr, terrain: (i % terrains) + 1,
          defi: false, relance: true, inter: true,
          placeA: place[p[0]], placeB: place[p[1]]
        });
        ajoutes++;
      });
      prochain += Math.ceil(paires.length / terrains);
    }
    return ajoutes;
  }

  /* « Nouvelles rencontres » : le même geste que « Nouvelle situation » ou
     « Nouvel échauffement ». On choisit ce qu'on ajoute, on ne remplace rien. */
  function editRelance(l, gid) {
    var ar = arenaOf(l);
    var ligues = ar.mode === 'ligues';
    var cible = gid && groupById(l, gid) ? gid : '';
    if (!ar.groups.length) { UI.toast('Compose d\'abord les groupes.'); return; }
    var opts = ar.groups.map(function (g) {
      return '<option value="' + g.id + '"' + (cible === g.id ? ' selected' : '') + '>' +
        e(g.name) + ' — ' + g.members.length + ' élèves</option>';
    }).join('');
    var finis = LESSON.presentStudents(l)
      .filter(function (s) { return groupOf(l, s.id) && aFini(l, s.id); }).length;
    var mot = ligues ? 'ligue' : 'poule';
    var ec = enchainConfig(l);

    UI.modal({
      title: 'Nouvelles rencontres',
      okLabel: 'Ajouter',
      body: '<p class="small muted">Les rencontres déjà prévues ou jouées ne bougent pas : celles-ci ' +

        '<label class="field"><span>Avec qui</span><select name="entre">' +
        '<option value="poule" selected>Une revanche dans sa ' + mot + '</option>' +
        '<option value="rang">Croiser les ' + mot + 's — à place comparable</option>' +
        '<option value="indice">Croiser les ' + mot + 's — à indice proche</option>' +
        '</select><span class="tiny muted">Croiser ne prend que les élèves qui ont ' +
        '<b>fini leurs rencontres</b> (' + finis + ' pour l\'instant) et les fait jouer contre une ' +
        'autre ' + mot + '. Ces rencontres ne comptent dans aucun classement de ' + mot + '.</span></label>' +
        '<label class="field" data-r="poule"><span>Pour qui</span><select name="g">' +
        '<option value=""' + (cible ? '' : ' selected') + '>Tous les groupes</option>' + opts +
        '</select></label>' +
        '<label class="field" style="max-width:280px"><span>Rencontres par élève</span>' +
        '<input type="number" name="t" min="0" max="10" value="1">' +
        '<span class="tiny muted">0 : n\'ajoute rien maintenant, enregistre seulement le réglage ci-dessous.</span></label>' +
        '<label class="inline" style="display:flex;margin-top:8px"><input type="checkbox" name="ined"> ' +
        'Uniquement des adversaires jamais rencontrés</label>' +
        '<p class="tiny muted" style="margin-top:6px">Avec cette case, un élève qui a déjà vu tous ' +

        '<fieldset style="margin-top:14px"><legend>Quand un élève a fini, sans t\'attendre</legend>' +
        '<p class="small muted" style="margin-top:0">Une ' + mot + ' de quatre finit avant une ' + mot +
        ' de sept. Plutôt que de laisser les premiers libérés tourner en rond, la tablette leur ' +
        'propose de continuer contre un élève qui a fini aussi — donc au même stade qu\'eux. ' +

        '>Une place comparable dans sa ' + mot + '</option>' +

        '>Un indice proche</option>' +
        '</select></label>' +

        '</div>' +

        (ec.memePoule ? ' checked' : '') + '> Accepter aussi un adversaire de sa propre ' + mot +
        ' si personne d\'autre n\'a fini</label>' +
        '<p class="tiny muted" style="margin:6px 0 0">Une autre ' + mot + ' est toujours proposée en ' +

      onOpen: function (d) {

        A.set(function () {
          var cfg = enchainConfig(l);
