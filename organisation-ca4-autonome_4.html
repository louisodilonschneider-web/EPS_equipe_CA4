        '<option value="propres"' + (propres ? ' selected' : '') + '>Des équipes composées pour cet échauffement</option>' +
        '</select><span class="tiny muted">Les équipes composées ici ne touchent pas à celles de la leçon : ' +
        'les matchs d\'ultimate gardent les leurs.</span></label>' +
        '<div id="compoBloc" hidden>' +
        '<div class="grid cols-2">' +
        '<label class="field"><span>Mode</span><select name="cmode">' +
        '<option value="count"' + (cfg.mode === 'count' ? ' selected' : '') + '>Je fixe le nombre d\'équipes</option>' +
        '<option value="size"' + (cfg.mode === 'size' ? ' selected' : '') + '>Je fixe la taille des équipes</option>' +
        '</select></label>' +
        '<label class="field" data-f="count"><span>Nombre d\'équipes (2 à 9)</span>' +
        '<input type="number" name="ccount" min="2" max="9" value="' + cfg.teamCount + '"></label>' +
        '<label class="field" data-f="size" hidden><span>Élèves par équipe (' +
        A.MIN_TEAM_SIZE + ' à ' + A.MAX_TEAM_SIZE + ')</span>' +
        '<input type="number" name="csize" min="' + A.MIN_TEAM_SIZE + '" max="' + A.MAX_TEAM_SIZE +
        '" value="' + cfg.teamSize + '"></label>' +
        '<label class="field"><span>Composition</span><select name="ccomp">' +
        '<option value="equilibre"' + (cfg.composition !== 'niveau' ? ' selected' : '') + '>Équilibré — équipes de force égale</option>' +
        '<option value="niveau"' + (cfg.composition === 'niveau' ? ' selected' : '') + '>Niveau — groupes homogènes</option>' +
        '</select></label>' +
        '<label class="field"><span>Mixité</span><select name="cmix">' +
        '<option value="mixte"' + (cfg.mixite === 'mixte' ? ' selected' : '') + '>Équipes mixtes équilibrées</option>' +
        '<option value="nonmixte"' + (cfg.mixite === 'nonmixte' ? ' selected' : '') + '>Équipes non mixtes</option>' +
        '<option value="libre"' + (cfg.mixite === 'libre' ? ' selected' : '') + '>Sans contrainte de mixité</option>' +
        '</select></label></div>' +
        '<div class="row"><button type="button" class="btn-sm btn-primary" id="recomposer">Composer les équipes</button>' +
        '<span class="tiny muted">' + present.length + ' élèves présents</span></div>' +
        '<div id="apercuEquipes"></div>' +
        '</div></fieldset>' +

        '<fieldset><legend>Qui affronte qui ?</legend>' +
        '<label class="field" style="max-width:280px"><span>Terrains disponibles</span>' +
        '<input type="number" name="terr" min="1" max="' + A.MAX_TERRAINS + '" value="' + terrains + '">' +
        '<span class="tiny muted">Autant d\'oppositions se jouent en même temps. ' +
        'Les équipes en trop attendent leur tour.</span></label>' +
        '<label class="field"><span>Formule</span><select name="mode">' +
        '<option value="simple">Un tour simple — chaque équipe joue une fois</option>' +
        '<option value="complet">Toutes contre toutes — chaque équipe rencontre toutes les autres</option>' +
        '<option value="choix">Je choisis les affiches équipe par équipe</option>' +
        '</select></label>' +
        '<div id="choixBloc" hidden>' +
        '<p class="tiny muted" style="margin:0 0 8px">Choisis une équipe, puis coche celles qu\'elle doit ' +
        'rencontrer. Une affiche cochée d\'un côté l\'est forcément de l\'autre.</p>' +
        '<label class="field"><span>Équipe</span><select name="eq"></select></label>' +
        '<div id="advers" class="pal-grid"></div>' +
        '<div class="row tight" style="margin-top:8px">' +
        '<button type="button" class="btn-sm" data-all="1">Tout cocher</button>' +
        '<button type="button" class="btn-sm btn-ghost" data-all="0">Tout décocher</button></div>' +
        '</div>' +
        '<div id="apercuDuels"></div></fieldset>',

      onOpen: function (d) {
        var adversBox = d.querySelector('#advers');
        var selEq = d.querySelector('[name=eq]');

        var listeEquipes = function () {
          var ts = equipes();
          selEq.innerHTML = ts.map(function (t) {
            return '<option value="' + t.id + '"' + (t.id === courante ? ' selected' : '') + '>' + e(t.name) + '</option>';
          }).join('');
          if (!propres) { d.querySelector('#apercuEquipes').innerHTML = ''; return; }
          d.querySelector('#apercuEquipes').innerHTML = ts.length
            ? '<div class="teamlist">' + ts.map(function (t) {
                return '<div class="teamlist-item" style="border-color:' + t.color + '">' +
                  '<b style="color:' + t.color + '">' + e(t.name) + '</b> ' +
                  '<span class="badge">' + t.members.length + '</span>' +
                  '<div class="tiny muted">' + e(t.members.map(function (sid) {
                    var st2 = A.studentById(l.classId, sid);
                    return st2 ? A.shortName(st2) : '?';
                  }).join(', ')) + '</div></div>';
              }).join('') + '</div>'
            : '<div class="notice bad">Aucune équipe composée.</div>';
        };

        var dessine = function () {
          courante = selEq.value || courante;
          var ts = equipes();
          adversBox.innerHTML = ts.filter(function (t) { return t.id !== courante; })
            .map(function (t) {
              var k = LESSON.pairKey(courante, t.id);
              return '<label class="pal-chip' + (paires[k] ? ' is-on' : '') + '">' +
                '<input type="checkbox" data-pair="' + k + '"' + (paires[k] ? ' checked' : '') + '> ' +
                '<span class="pal-dot" style="background:' + t.color + '"></span>' +
                '<span class="pal-lbl">' + e(t.name) + '</span></label>';
            }).join('');
        };

        var maj = function () {
          opts.mode = d.querySelector('[name=mode]').value;
          terrains = A.clamp(+d.querySelector('[name=terr]').value || A.TERRAINS, 1, A.MAX_TERRAINS);
          d.querySelector('#choixBloc').hidden = opts.mode !== 'choix';

          var ts = equipes();
          if (ts.length < 2) {
            d.querySelector('#apercuDuels').innerHTML =
              '<div class="notice bad">Il faut au moins deux équipes pour organiser une confrontation.</div>';
            return;
          }
          var plan = planDuels(l, sit, { mode: opts.mode, paires: paires, teams: ts, perRound: terrains });
          if (!plan.planned.length) {
            d.querySelector('#apercuDuels').innerHTML =
              '<div class="notice bad">Aucune opposition possible avec ces choix.</div>';
            return;
          }
          var simultanees = Math.min(terrains, Math.floor(ts.length / 2));
          var parTour = {};
          plan.planned.forEach(function (p) { (parTour[p.r] = parTour[p.r] || []).push(p); });
          var attentes = ts.length - simultanees * 2;
          var out = '<div class="notice">' + plan.planned.length + ' opposition' +
            (plan.planned.length > 1 ? 's' : '') + ' en <b>' + plan.tours + ' tour' +
            (plan.tours > 1 ? 's' : '') + '</b> de ' + simultanees + '.' +
            (attentes > 0
              ? ' ' + attentes + ' équipe' + (attentes > 1 ? 's' : '') + ' attend' + (attentes > 1 ? 'ent' : '') +
                ' à chaque tour — jamais la même.'
              : '') +
            (terrains > simultanees
              ? ' <span class="tiny">(' + ts.length + ' équipes ne remplissent que ' + simultanees +
                ' terrain' + (simultanees > 1 ? 's' : '') + ')</span>'
              : '') + '</div><div class="duel-preview">';
          Object.keys(parTour).sort(function (a, b) { return a - b; }).forEach(function (r) {
            var busy = {};
            parTour[r].forEach(function (p) { busy[p.a] = 1; busy[p.b] = 1; });
            var repos = ts.filter(function (t) { return !busy[t.id]; });
            out += '<div class="duel-tour"><b>Tour ' + r + '</b> ' +
              parTour[r].map(function (p) {
                return '<span class="badge" style="border-color:' + colorOf(p.a) + '">' +
                  e(nameOf(p.a)) + ' – ' + e(nameOf(p.b)) + '</span>';
              }).join(' ') +
              (repos.length
                ? ' <span class="tiny muted">au repos : ' + e(repos.map(function (t) { return t.name; }).join(', ')) + '</span>'
                : '') + '</div>';
          });
          d.querySelector('#apercuDuels').innerHTML = out + '</div>';
        };

        var majSource = function () {
          propres = d.querySelector('[name=src]').value === 'propres';
          d.querySelector('#compoBloc').hidden = !propres;
          if (propres && (!brouillon || !brouillon.length)) composer();
          else resetPaires();
          listeEquipes(); dessine(); maj();
        };

        var majChamps = function () {
          cfg.mode = d.querySelector('[name=cmode]').value;
          cfg.teamCount = A.clamp(+d.querySelector('[name=ccount]').value || 4, 2, 9);
          cfg.teamSize = A.clamp(+d.querySelector('[name=csize]').value || 4, A.MIN_TEAM_SIZE, A.MAX_TEAM_SIZE);
          cfg.composition = d.querySelector('[name=ccomp]').value;
          cfg.mixite = d.querySelector('[name=cmix]').value;
          d.querySelector('[data-f="count"]').hidden = cfg.mode !== 'count';
          d.querySelector('[data-f="size"]').hidden = cfg.mode !== 'size';
        };

        d.querySelector('[name=src]').addEventListener('change', majSource);
        d.querySelectorAll('[name=cmode],[name=ccount],[name=csize],[name=ccomp],[name=cmix]')
          .forEach(function (el) { el.addEventListener('change', majChamps); });
        d.querySelector('#recomposer').addEventListener('click', function (ev) {
          ev.preventDefault();
          majChamps();
          var res = composer();
          if (res.warnings && res.warnings.length) UI.toast(res.warnings[0]);
          listeEquipes(); dessine(); maj();
        });

        selEq.addEventListener('change', function () { dessine(); maj(); });
        adversBox.addEventListener('change', function (ev) {
          var box = ev.target;
          if (!box.getAttribute || !box.getAttribute('data-pair')) return;
          paires[box.getAttribute('data-pair')] = box.checked;
          box.parentNode.classList.toggle('is-on', box.checked);
          maj();
        });
        d.querySelectorAll('[data-all]').forEach(function (btn) {
          btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            var on = btn.getAttribute('data-all') === '1';
            equipes().forEach(function (t) {
              if (t.id !== courante) paires[LESSON.pairKey(courante, t.id)] = on;
            });
            dessine(); maj();
          });
        });
        d.querySelector('[name=mode]').addEventListener('change', maj);
        d.querySelector('[name=terr]').addEventListener('change', maj);

        majChamps();
        d.querySelector('#compoBloc').hidden = !propres;
        listeEquipes();
        dessine();
        maj();
      },

      onOk: function () {
        var ts = equipes();
        if (ts.length < 2) { UI.toast('Il faut au moins deux équipes.'); return false; }
        var plan = planDuels(l, sit, { mode: opts.mode, paires: paires, teams: ts, perRound: terrains });
        if (!plan.planned.length) { UI.toast('Aucune opposition possible avec ces choix.'); return false; }
        A.set(function () {
          sit.terrains = terrains;
          sit.ownTeams = propres;
          sit.teams = propres ? ts : [];
          sit.teamConfig = {
            mode: cfg.mode, teamCount: cfg.teamCount, teamSize: cfg.teamSize,
            composition: cfg.composition, mixite: cfg.mixite
          };
          applyDuelPlan(l, sit, plan);
        });
        UI.toast(plan.planned.length + ' opposition' + (plan.planned.length > 1 ? 's' : '') +
          ' en ' + plan.tours + ' tour' + (plan.tours > 1 ? 's' : '') +
          (propres ? ', avec ' + ts.length + ' équipes propres à l\'échauffement' : '') + '.');
      }
    });
  }

  /* ------------------------------------------------------------- fair-play
     Certaines situations mobilisent explicitement le fair-play : auto-arbitrage
     d'un 3 contre 3, respect de la règle dans un déménageur, aide au partenaire
     en difficulté. Quand la fiche vise ce critère, elle propose de le relever —
     exactement comme sur un match : « rien à signaler » pour tout le groupe,
     puis les exceptions, dans un sens comme dans l'autre.
     Les unités observées sont les groupes de travail, ou les équipes quand la
     fiche se joue en confrontation. */
  function fairCrit(sit) {
    var c = RATINGS.fairCriterion(A.criteria());
    if (!c) return null;
    return ((sit.targets || {})[c.id] > 0) ? c : null;
  }

  function fairUnits(l, sit) {
    if (isMatchFormat(sit)) {
      return teamsOf(l, sit).map(function (t) {
        return { id: t.id, label: t.name, color: t.color, members: (t.members || []).slice() };
      });
    }
    var gs = (sit.groups || []).filter(function (g) { return (g.members || []).length; });
    if (gs.length) {
      return gs.map(function (g) {
        return { id: g.id, label: g.label, color: null, members: (g.members || []).slice() };
      });
    }
    /* Pas de groupes constitués : on relève à l'échelle de la classe présente. */
    return [{
      id: 'tous', label: 'Tous les présents', color: null,
      members: LESSON.presentStudents(l).map(function (st2) { return st2.id; })
    }];
  }

  function fairState(sit) {
    sit.fairplay = sit.fairplay || { units: {}, adjust: {}, members: {} };
    sit.fairplay.units = sit.fairplay.units || {};
    sit.fairplay.adjust = sit.fairplay.adjust || {};
    sit.fairplay.members = sit.fairplay.members || {};
    return sit.fairplay;
  }

  /* Bandeau de relevé, ajouté sous la carte quand le critère est visé. */
  function fairRow(l, sit) {
    var c = fairCrit(sit);
    if (!c) return '';
    var fp = fairState(sit);
    var unites = fairUnits(l, sit);
    var nAdj = Object.keys(fp.adjust || {}).length;

    var tous = unites.length > 2 && unites.every(function (u) { return fp.units[u.id] === 'ok'; });

    return '<div class="row tight fair-row">' +
      '<span class="small muted nowrap">' + e(c.name) + ' :</span>' +
      (unites.length > 2
        ? '<button class="btn-sm' + (tous ? ' btn-primary' : '') + '" data-act="sit.fp" ' +
          'data-id="' + sit.id + '" data-u="*" title="Marquer tous les groupes d\'un coup">' +
          (tous ? '✓ ' : '') + 'Rien à signaler — tout le monde</button>'
        : '') +
      unites.map(function (u) {
        var on = fp.units[u.id] === 'ok';
        return '<button class="btn-sm' + (on ? ' btn-primary' : '') + '" data-act="sit.fp" ' +
          'data-id="' + sit.id + '" data-u="' + e(u.id) + '">' +
          (on ? '✓ ' : '') + 'Rien à signaler — ' + e(u.label) + '</button>';
      }).join('') +
      '<button class="btn-sm" data-act="sit.fpadj" data-id="' + sit.id + '">Ajuster individuellement</button>' +
      (nAdj ? UI.badge(nAdj + ' élève(s) ajusté(s)', 'accent') : '') +
      '</div>';
  }

  /* Coche ou décoche une unité, en mémorisant qui la composait ce jour-là :
     les groupes changent d'une semaine à l'autre, le relevé ne doit pas suivre. */
  function toggleFair(l, sit, unitId) {
    var fp = fairState(sit);
    var unites = fairUnits(l, sit);

    /* « tout le monde » : tout cocher, ou tout décocher si c'était déjà fait */
    if (unitId === '*') {
      var deja = unites.every(function (x) { return fp.units[x.id] === 'ok'; });
      unites.forEach(function (x) {
        if (deja) { delete fp.units[x.id]; delete fp.members[x.id]; }
        else { fp.units[x.id] = 'ok'; fp.members[x.id] = x.members.slice(); }
      });
      return;
    }

    var u = unites.filter(function (x) { return x.id === unitId; })[0];
    if (!u) return;
    if (fp.units[unitId] === 'ok') {
      delete fp.units[unitId];
      delete fp.members[unitId];
    } else {
      fp.units[unitId] = 'ok';
      fp.members[unitId] = u.members.slice();
    }
  }

  function editFairplay(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit) return;
    var c = fairCrit(sit);
    var fp = fairState(sit);
    var draft = JSON.parse(JSON.stringify(fp));
    var unites = fairUnits(l, sit);

    var body = '<p class="small muted">Laisse « collectif » pour tous les élèves dont il n\'y a rien à dire : ' +
      'ils reçoivent le relevé de leur groupe. Ne désigne que les exceptions, dans un sens comme dans l\'autre.</p>';
    unites.forEach(function (u) {
      if (!u.members.length) return;
      body += '<fieldset><legend>' + e(u.label) + '</legend><div class="att-grid">';
      u.members.forEach(function (sid) {
        var st2 = A.studentById(cls.id, sid);
        var cur = draft.adjust[sid] || '';
        body += '<div class="att-item" style="cursor:default"><span class="nm">' +
          e(st2 ? A.displayName(st2) : sid) + '</span><span class="seg">' +
          '<button type="button" class="v-injured" data-fp="' + sid + '" data-v="minus" aria-pressed="' + (cur === 'minus') + '" title="À reprendre">−</button>' +
          '<button type="button" data-fp="' + sid + '" data-v="" aria-pressed="' + (!cur) + '" title="Relevé collectif">collectif</button>' +
          '<button type="button" data-fp="' + sid + '" data-v="plus" aria-pressed="' + (cur === 'plus') + '" title="À valoriser">+</button>' +
          '</span></div>';
      });
      body += '</div></fieldset>';
    });

    UI.modal({
      title: (c ? c.name : 'Fair-play') + ' — ' + sit.name,
      body: body, okLabel: 'Enregistrer',
      onOpen: function (d) {
        d.querySelectorAll('[data-fp]').forEach(function (b) {
          b.addEventListener('click', function () {
            var sid = b.getAttribute('data-fp'), v = b.getAttribute('data-v');
            if (v) draft.adjust[sid] = v; else delete draft.adjust[sid];
            d.querySelectorAll('[data-fp="' + sid + '"]').forEach(function (o) {
              o.setAttribute('aria-pressed', String(o.getAttribute('data-v') === v));
            });
          });
        });
      },
      onOk: function () { A.set(function () { sit.fairplay = draft; }); }
    });
  }

  /* Boutons communs aux deux sortes de cartes : monter/descendre la fiche dans
     sa propre liste, la copier dans la banque, la modifier, la supprimer.
     `pos` et `total` servent à griser les flèches aux extrémités. */
  /* Les actions courantes restent visibles ; tout ce qui relève de la gestion
     de la fiche (modifier, changer d'onglet, mettre en banque, effacer) se range
     dans un menu, sinon la carte finit avec dix boutons sur trois lignes. */
  function cardTools(sit, pos, total, aDesResultats) {
    var ech = kindOf(sit) === 'echauffement';
    return '<button class="btn-sm btn-ghost" data-act="sit.move" data-id="' + sit.id + '" data-dir="-1"' +
      (pos === 0 ? ' disabled' : '') + ' title="Monter dans la liste">↑</button>' +
      '<button class="btn-sm btn-ghost" data-act="sit.move" data-id="' + sit.id + '" data-dir="1"' +
      (pos >= total - 1 ? ' disabled' : '') + ' title="Descendre dans la liste">↓</button>' +
      '<button class="btn-sm" data-act="sit.edit" data-id="' + sit.id + '">Modifier</button>' +
      '<details class="tools"><summary class="btn-sm" title="Autres actions">⋯</summary>' +
      '<div class="tools-pop">' +
      /* Un exercice n'appartient pas définitivement à une famille : le même jeu
         met en train aujourd'hui et devient un contenu d'apprentissage demain. */
      '<button class="btn-sm btn-ghost" data-act="sit.kind" data-id="' + sit.id + '">' +
      (ech ? 'Déplacer vers Situations' : 'Déplacer vers Échauffement') + '</button>' +
      '<button class="btn-sm btn-ghost" data-act="sit.toBank" data-id="' + sit.id + '">' +
      'Copier dans la banque</button>' +
      (aDesResultats
        ? '<button class="btn-sm btn-ghost btn-danger" data-act="sit.reset" data-id="' + sit.id + '">' +
          'Effacer les résultats</button>'
        : '') +
      '<button class="btn-sm btn-ghost btn-danger" data-act="sit.del" data-id="' + sit.id + '">' +
      'Retirer de la leçon</button>' +
      '</div></details>';
  }

  /* Carte d'un échauffement mené en confrontation : les oppositions rangées par
     tour, leurs scores, le vainqueur calculé tout seul et les équipes au repos. */
  function matchCard(l, cls, sit, pos, total) {
    var duels = liveDuels(l, sit);
    var equipes = teamsOf(l, sit);
    var nameOf = function (id) {
      for (var i = 0; i < equipes.length; i++) if (equipes[i].id === id) return equipes[i].name;
      return '?';
    };
    var colorOf = function (id) {
      for (var i = 0; i < equipes.length; i++) if (equipes[i].id === id) return equipes[i].color;
      return 'var(--accent)';
    };

    var h = '<div class="card" style="margin:0 0 14px">' +
      '<div class="card-head"><div>' +
      '<h3 style="margin-bottom:3px">' + e(sit.name) +
      ' <span class="badge accent">confrontation</span>' +
      (sit.bankId && BANK.byId(sit.bankId) ? ' <span class="badge">banque</span>' : '') + '</h3>' +
      '<p class="small muted" style="margin:0;white-space:pre-wrap">' +
      e(sit.consigne || 'Pas de consigne générale') + '</p></div>' +
      '<div class="row tight">' +
      '<button class="btn-sm btn-primary" data-act="sit.duels" data-id="' + sit.id + '">' +
      (duels.length ? 'Refaire les oppositions' : 'Opposer les équipes') + '</button>' +
      cardTools(sit, pos, total, duels.some(function (d) { return d.scoreA != null || d.scoreB != null; })) +
      '</div></div>';

    var tg = Object.keys(sit.targets || {}).filter(function (k) { return sit.targets[k] > 0; });
    h += '<div class="row tight" style="margin-bottom:10px">';
    if (!tg.length) h += '<span class="badge warn">aucun critère ciblé — les résultats ne compteront pas dans les indices</span>';
    tg.forEach(function (cid) {
      var c = A.critById(cid);
      if (c) h += UI.badge(c.name + ' ' + Math.round(sit.targets[cid] * 100) + ' %', 'accent');
    });
    (sit.bonuses || []).forEach(function (b) {
      h += '<span class="badge badge-bonus" title="' + e(b.desc || '') + '">★ ' + e(b.name) + ' · +' + b.points + '</span>';
    });
    h += '</div>';

    if (sit.image) {
      h += '<div class="img-slot" style="margin-bottom:12px"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';
    }

    /* Composition propre à l'échauffement : on la montre, sinon personne ne sait
       qui joue avec qui — les équipes de la leçon, elles, sont déjà affichées
       dans leur onglet. */
    if (ownTeams(sit)) {
      h += '<div class="row tight" style="margin-bottom:8px">' +
        UI.badge('équipes propres à l\'échauffement', 'accent') +
        '<span class="tiny muted">Les équipes de la leçon ne sont pas modifiées.</span></div>' +
        '<div class="teamlist">' + equipes.map(function (t) {
          return '<div class="teamlist-item" style="border-color:' + t.color + '">' +
            '<b style="color:' + t.color + '">' + e(t.name) + '</b> ' +
            '<span class="badge">' + t.members.length + '</span>' +
            '<div class="tiny muted">' + e(t.members.map(function (sid) {
              var st2 = A.studentById(cls.id, sid);
              return st2 ? A.shortName(st2) : '?';
            }).join(', ')) + '</div></div>';
        }).join('') + '</div>';
    }

    if (equipes.length < 2) {
      return h + UI.empty('Il faut des équipes',
        'Ce format oppose deux équipes : compose les équipes de la leçon, ' +
        'ou fais composer à l\'application des équipes pour ce seul échauffement ' +
        '(bouton « Opposer les équipes »).') + '</div>';
    }
    if (!duels.length) {
      return h + UI.empty('Aucune opposition',
        'Le bouton « Opposer les équipes » apparie les équipes de la leçon deux par deux. ' +
        'Les élèves saisissent ensuite le score de leur opposition, sur la tablette ou ici.') + '</div>';
    }

    var tours = duelRounds(l, sit);
    if (tours.length) {
      var simult = Math.max.apply(null, tours.map(function (rd) { return rd.items.length; }));
      h += '<div class="row tight" style="margin-bottom:10px">' +
        UI.badge(simult + ' opposition' + (simult > 1 ? 's' : '') + ' à la fois') +
        UI.badge(tours.length + ' tour' + (tours.length > 1 ? 's' : '')) + '</div>';
    }
    tours.forEach(function (rd) {
      h += '<div class="duel-round"><div class="duel-round-head"><h4>Tour ' + rd.n + '</h4>' +
        (rd.repos.length
          ? '<span class="small muted">Au repos : ' +
            rd.repos.map(function (t) {
              return '<span class="badge" style="border-color:' + t.color + ';color:' + t.color + '">' +
                e(t.name) + '</span>';
            }).join(' ') + '</span>'
          : '<span class="small muted">Toutes les équipes jouent</span>') +
        '</div><div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Opposition</th><th class="num">Score</th><th></th><th class="num">Score</th><th>Résultat</th>' +
        '</tr></thead><tbody>';
      rd.items.forEach(function (x) {
        var d = x.d, di = x.i;
        var fait = d.scoreA != null && d.scoreB != null;
        var res = !fait ? '<span class="muted tiny">à jouer</span>'
          : d.scoreA === d.scoreB ? UI.badge('égalité')
            : UI.badge(nameOf(d.scoreA > d.scoreB ? d.teamA : d.teamB) + ' l\'emporte', 'ok');
        h += '<tr><td><b style="color:' + colorOf(d.teamA) + '">' + e(nameOf(d.teamA)) + '</b>' +
          ' <span class="muted tiny">contre</span> ' +
          '<b style="color:' + colorOf(d.teamB) + '">' + e(nameOf(d.teamB)) + '</b></td>' +
          '<td class="num"><input type="number" min="0" style="width:70px" ' +
          'data-chg="duel.score" data-id="' + sit.id + '" data-d="' + di + '" data-side="A" value="' +
          (d.scoreA == null ? '' : d.scoreA) + '"></td>' +
          '<td class="num muted">—</td>' +
          '<td class="num"><input type="number" min="0" style="width:70px" ' +
          'data-chg="duel.score" data-id="' + sit.id + '" data-d="' + di + '" data-side="B" value="' +
          (d.scoreB == null ? '' : d.scoreB) + '"></td>' +
          '<td>' + res + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    });
    h += fairRow(l, sit);
    h +=
      '<p class="tiny muted" style="margin-top:8px">L\'écart entre les deux scores alimente les critères cochés, ' +
      'à l\'échelle de l\'équipe. Ce résultat n\'entre pas dans le classement de la leçon : ' +
      'c\'est un échauffement, pas une rencontre officielle.</p>';
    return h + '</div>';
  }

  /* Carte d'une co-frontation : les règles du jeu, le classement des élèves,
     et l'avancement de chacun dans ses coopérations. */
  function coopCard(l, cls, sit, pos, total) {
    var c = coopConfig(sit);
    var classement = coopStanding(l, sit);
    var vise = coopObjectifDuos(l, sit);
    var presents = LESSON.presentStudents(l);
    var faits = (sit.attempts || []).length;
    var etat = coopEtat(l, sit);

    var h = '<div class="card" style="margin:0 0 14px">' +
      '<div class="card-head"><div>' +
      '<h3 style="margin-bottom:3px">' + e(sit.name) +
      ' <span class="badge accent">co-frontation</span>' +
      (sit.bankId && BANK.byId(sit.bankId) ? ' <span class="badge">banque</span>' : '') + '</h3>' +
      '<p class="small muted" style="margin:0;white-space:pre-wrap">' +
      e(sit.consigne || 'Pas de consigne générale') + '</p></div>' +
      '<div class="row tight">' +
      (etat.fini
        ? '<button class="btn-sm btn-primary" data-act="sit.coopstop" data-id="' + sit.id + '">' +
          (etat.raison === 'manuel' ? 'Relancer' : 'Poursuivre quand même') + '</button>'
        : '<button class="btn-sm btn-primary" data-act="sit.coop" data-id="' + sit.id + '">Saisir une manche</button>' +
          '<button class="btn-sm" data-act="sit.coopstop" data-id="' + sit.id + '">Arrêter</button>') +
      '<button class="btn-sm" data-act="sit.coopretro" data-id="' + sit.id + '">Saisie rétro-active</button>' +
      cardTools(sit, pos, total, faits > 0) +
      '</div></div>';

    /* les règles, en clair */
    h += '<div class="row tight" style="margin-bottom:10px">' +
      UI.badge(c.objectif + ' ' + e(sit.unit || 'réussites') + ' en ' + c.essais + ' essai' + (c.essais > 1 ? 's' : ''), 'accent') +
      UI.badge('réussi : ' + c.ptsReussite + ' pt' + (c.ptsReussite > 1 ? 's' : ''), 'ok') +
      UI.badge('raté : ' + c.ptsEchec + ' pt' + (c.ptsEchec > 1 ? 's' : '')) +
      UI.badge(c.fin === 'temps'
        ? 'pendant ' + c.duree + ' min'
        : (c.fin === 'classe'
          ? 'le premier à avoir vu toute la classe (' + vise + ')'
          : vise + ' coopérations par élève')) +
      UI.badge('en ' + coopNom(c, true)) +
      (c.uniques ? UI.badge('jamais deux fois le même groupe', 'warn') : '') +
      '</div>';

    /* l'état de la course, en tête : c'est ce qu'on regarde en cours de séance */
    if (etat.fini) {
      h += '<div class="notice ' + (etat.raison === 'course' ? 'ok' : '') + '" style="margin-bottom:10px">' +
        '<b>' + e(coopFinTexte(etat)) + '</b>' +
        '<br><span class="small">Le classement est figé et la tablette n\'accepte plus de manche. ' +
        (etat.raison === 'manuel'
          ? '« Relancer » rouvre la situation sans rien effacer.'
          : '« Poursuivre quand même » laisse les autres finir leur tour.') +
        '</span></div>';
    } else if (etat.gagnant) {
      h += '<div class="notice ok" style="margin-bottom:10px"><b>' + e(etat.gagnant.nom) +
        ' a coopéré avec toute la classe.</b><br><span class="small">Tu as choisi de laisser ' +
        'tourner : « Arrêter » met fin à la situation quand tu veux.</span></div>';
    }

    var tg = Object.keys(sit.targets || {}).filter(function (k) { return sit.targets[k] > 0; });
    h += '<div class="row tight" style="margin-bottom:10px">';
    tg.forEach(function (cid) {
      var cr = A.critById(cid);
      if (cr) h += UI.badge(cr.name + ' ' + Math.round(sit.targets[cid] * 100) + ' %', 'accent');
    });
    h += '<div class="spacer"></div>' + UI.badge(faits + ' manche' + (faits > 1 ? 's' : '')) + '</div>';
    if (!tg.length) {
      h += '<div class="notice bad" style="margin-bottom:10px"><b>Aucun critère ciblé : les points ' +
        'ne compteront pas dans les indices.</b><br><span class="small">« Modifier » → ' +
        '« Critères alimentés par cette situation » : coche au moins un critère pour que les ' +
        'réussites de chacun fassent bouger son indice.</span></div>';
    }

    if (sit.image) {
      h += '<div class="img-slot" style="margin-bottom:12px"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';
    }

    h += fairRow(l, sit);

    if (!faits) {
      return h + UI.empty('Aucune manche',
        'Les élèves saisissent eux-mêmes en mode kiosque : ils forment leur ' + coopNom(c) + ', ' +
        'annoncent si l\'objectif est atteint, et repartent chercher quelqu\'un d\'autre. ' +
        (c.uniques ? 'Les camarades déjà rencontrés s\'éteignent à l\'écran. ' : '') +
        'Tu peux aussi saisir une manche ici.') + '</div>';
    }

    /* classement */
    h += '<h4>Classement</h4><div class="table-wrap"><table class="compact"><thead><tr>' +
      '<th class="num">#</th><th>Élève</th><th class="num">Points</th>' +
      '<th class="num">' + (c.fin === 'classe' ? 'Camarades vus' : 'Coopérations') + '</th>' +
      '<th class="num">Réussites</th><th>Avancement</th></tr></thead><tbody>';
    classement.forEach(function (p, i) {
      var av = coopAvance(sit, p);
      var part = vise ? Math.min(100, Math.round(av / vise * 100)) : null;
      h += '<tr' + (p.absent ? ' class="muted"' : '') + '>' +
        '<td class="num">' + (i + 1) + '</td>' +
        '<td>' + e(p.nom) + (p.absent ? ' <span class="badge warn">absent</span>' : '') +
        (p.retro ? ' <span class="badge" title="Points saisis après coup : partenaires inconnus">rétro</span>' : '') +
        '</td>' +
        '<td class="num"><b>' + p.pts + '</b></td>' +
        '<td class="num">' + av + (vise ? ' / ' + vise : '') + '</td>' +
        '<td class="num">' + p.reussites + '</td>' +
        '<td>' + (part == null
          ? '<span class="tiny muted">au temps</span>'
          : '<div class="gauge" style="min-width:90px"><div class="gauge-fill ' +
            (part >= 100 ? 'ok' : (part >= 50 ? '' : 'warn')) + '" style="width:' + Math.max(3, part) + '%"></div></div>') +
        '</td></tr>';
    });
    h += '</tbody></table></div>';

    /* qui n'a pas encore joué */
    var vus = {};
    classement.forEach(function (p) { vus[p.id] = 1; });
    var jamais = presents.filter(function (st2) { return !vus[st2.id]; });
    if (jamais.length) {
      h += '<p class="small muted" style="margin-top:6px"><b>Pas encore entrés en jeu :</b> ' +
        e(jamais.map(function (st2) { return A.shortName(st2); }).join(', ')) + '</p>';
    }
    if (vise && c.fin !== 'classe') {
      var finis = classement.filter(function (p) { return !p.absent && p.duos >= vise; }).length;
      h += '<p class="tiny muted" style="margin-top:4px">' + finis + ' élève(s) ont atteint les ' +
        vise + ' coopérations demandées.</p>';
    }
    if (vise && c.fin === 'classe' && !etat.fini) {
      var tete = classement.slice().sort(function (x, y) { return y.nbPartenaires - x.nbPartenaires; })[0];
      if (tete) {
        h += '<p class="tiny muted" style="margin-top:4px">En tête de la course : ' + e(tete.court) +
          ', ' + tete.nbPartenaires + ' camarade(s) sur ' + vise + '.</p>';
      }
    }

    return h + '</div>';
  }

  function card(l, cls, sit, pos, total) {
    if (isMatchFormat(sit)) return matchCard(l, cls, sit, pos, total);
    if (isCoopFormat(sit)) return coopCard(l, cls, sit, pos, total);
    var crits = A.criteria();
    var present = LESSON.presentStudents(l).map(function (s) { return s.id; });
    var spread = PROGRESS.levelSpread(sit, present);
    var fr = PROGRESS.followRate(sit);
    var contrib = RATINGS.situationContributions(sit, A.get().settings.ridgeLambda);

    var h = '<div class="card" style="margin:0 0 14px">' +
      '<div class="card-head"><div>' +
      '<h3 style="margin-bottom:3px">' + e(sit.name) +
      (sit.bankId && BANK.byId(sit.bankId) ? ' <span class="badge">banque</span>' : '') + '</h3>' +
      '<p class="small muted" style="margin:0;white-space:pre-wrap">' + e(sit.consigne || 'Pas de consigne générale') +
      ' · mesure en <b>' + e(sit.unit) + '</b> (' + (sit.direction === 'high' ? 'plus c\'est haut, mieux c\'est' : 'plus c\'est bas, mieux c\'est') + ')</p>' +
      '</div><div class="row tight">' +
      '<button class="btn-sm btn-primary" data-act="sit.attempt" data-id="' + sit.id + '">Saisir un score</button>' +
      '<button class="btn-sm" data-act="sit.batch" data-id="' + sit.id + '">Saisie en série</button>' +
      '<button class="btn-sm" data-act="sit.groups" data-id="' + sit.id + '">Groupes</button>' +
      ((sit.groups || []).length ? '<button class="btn-sm" data-act="sit.project" data-id="' + sit.id + '">Afficher / imprimer</button>' : '') +
      cardTools(sit, pos, total, (sit.attempts || []).length > 0) +
      '</div></div>';

    /* critères ciblés */
    var tg = Object.keys(sit.targets || {}).filter(function (k) { return sit.targets[k] > 0; });
    h += '<div class="row tight" style="margin-bottom:10px">';
    if (!tg.length) h += '<span class="badge warn">aucun critère ciblé — les scores ne compteront pas dans les indices</span>';
    tg.forEach(function (cid) {
      var c = A.critById(cid);
      if (c) h += UI.badge(c.name + ' ' + Math.round(sit.targets[cid] * 100) + ' %', 'accent');
    });
    h += '<div class="spacer"></div>' +
      UI.badge((sit.attempts || []).length + ' tentative' + ((sit.attempts || []).length > 1 ? 's' : '')) +
      (contrib.mixing && !contrib.mixing.solo
        ? UI.badge('brassage : ' + contrib.mixing.avgPartners + ' partenaires', contrib.mixing.ok ? 'ok' : 'warn')
        : '') +
      (fr ? UI.badge('recommandation suivie ' + Math.round(fr.rate * 100) + ' %', fr.rate >= 0.7 ? 'ok' : 'warn') : '') +
      '</div>';

    if (sit.image) {
      h += '<div class="img-slot" style="margin-bottom:12px"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';
    }

    /* répartition par palier */
    if (spread.levels.length > 1) {
      h += '<h4>Où en est la classe</h4><div class="grid cols-4" style="margin-bottom:12px">';
      spread.levels.forEach(function (lv) {
        var ids = spread.byLevel[lv.id] || [];
        var sh = PROGRESS.levelShade(spread.levels.indexOf(lv), spread.levels.length);
        h += '<div class="stat lv-tint" style="' + sh.style + '"><b>' + ids.length + '</b>' +
          '<span class="lv-name">' + e(lv.name) + '</span>' +
          '<div class="tiny muted" style="margin-top:4px">' +
          e(ids.slice(0, 6).map(function (sid) { var s = A.studentById(cls.id, sid); return s ? A.shortName(s) : ''; }).join(', ')) +
          (ids.length > 6 ? ' +' + (ids.length - 6) : '') + '</div></div>';
      });
      h += '</div>';
    }

    /* messages en attente */
    var pending = [];
    Object.keys(sit.progress || {}).forEach(function (sid) {
      var m = sit.progress[sid].message;
      if (m && !m.dismissed) pending.push({ sid: sid, m: m });
    });
    if (pending.length) {
      h += '<div class="notice"><b>' + pending.length + ' message' + (pending.length > 1 ? 's' : '') + ' non lu' + (pending.length > 1 ? 's' : '') + ' :</b> ' +
        e(pending.slice(0, 8).map(function (p) {
          var s = A.studentById(cls.id, p.sid); return s ? A.shortName(s) : '';
        }).join(', ')) + (pending.length > 8 ? '…' : '') +
        ' <span class="small">Ils s\'afficheront à leur prochain passage en mode kiosque.</span></div>';
    }

    h += fairRow(l, sit);

    /* tentatives */
    if ((sit.attempts || []).length) {
      h += '<h4>Dernières tentatives</h4><div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Groupe</th><th>Palier</th><th class="num">Score</th><th>Retour</th><th>Reco. suivie</th><th></th></tr></thead><tbody>';
      sit.attempts.slice(-14).reverse().forEach(function (at) {
        var names = (at.members || []).map(function (sid) {
          var s = A.studentById(cls.id, sid); return s ? A.shortName(s) : '?';
        }).join(', ');
        var lv = PROGRESS.levelById(sit, at.levelId);
        var ev = PROGRESS.evaluateAttempt(sit, at.levelId, at.value);
        h += '<tr><td class="small">' + e(names) + '</td>' +
          '<td class="small">' + (lv
            ? '<span class="lv-chip lv-tint" style="' + PROGRESS.levelColor(sit, lv.id).style + '">' + e(lv.name) + '</span>'
            : '–') + '</td>' +
          '<td class="num"><b>' + e(at.value) + '</b></td>' +
          '<td>' + (ev ? UI.badge(ev.bandInfo.label, ev.bandInfo.cls) : '') + '</td>' +
          '<td>' + (at.recommendedLevelId
            ? (at.levelId === at.recommendedLevelId ? UI.badge('oui', 'ok') : UI.badge('non', 'warn'))
            : '<span class="muted tiny">—</span>') + '</td>' +
          '<td class="num"><button class="btn-sm btn-ghost btn-danger" data-act="sit.attemptDel" ' +
          'data-id="' + sit.id + '" data-a="' + at.id + '" ' +
          'title="Effacer cette tentative et le palier qu\'elle avait donné">✕</button></td></tr>';
      });
      h += '</tbody></table></div>' +
        '<p class="tiny muted" style="margin-top:6px">Effacer une tentative efface aussi le palier ' +
        'atteint, la recommandation et le message qu\'elle avait produits : un essai fait avant le ' +
        'cours ne fausse pas les recommandations des élèves.</p>';

      /* contributions individuelles estimées */
      var keys = Object.keys(contrib.contrib);
      if (keys.length) {
        h += '<h4 style="margin-top:14px">Contributions individuelles estimées sur cette situation</h4>' +
          '<p class="tiny muted">Corrigées de l\'effet des partenaires et du palier choisi. 0 = niveau moyen de la classe sur cette situation.</p>' +
          '<div class="table-wrap"><table class="compact"><thead><tr><th>Élève</th><th class="num">Contribution</th><th class="num">Tentatives</th></tr></thead><tbody>';
        A.sortBy(keys, function (k) { return contrib.contrib[k]; }, true).forEach(function (sid) {
          var s = A.studentById(cls.id, sid);
          var v = contrib.contrib[sid];
          h += '<tr><td>' + e(s ? A.displayName(s) : sid) + '</td>' +
            '<td class="num"><span class="badge ' + (v > 0.4 ? 'ok' : v < -0.4 ? 'warn' : '') + '">' +
            (v > 0 ? '+' : '') + A.round(v, 2) + '</span></td>' +
            '<td class="num">' + (contrib.n[sid] || 0) + '</td></tr>';
        });
        h += '</tbody></table></div>';
      }
    }

    h += '</div>';
    return h;
  }

  /* ============================================================== éditeur */

  function edit(sitId, kind) {
    var l = A.currentLesson();
    var isNew = !sitId;
    var sit = isNew ? newSituation(kind) : sitById(l, sitId);
    if (!sit) return;
    openEditor(sit, {
      title: isNew
        ? (kind === 'echauffement' ? 'Nouvel échauffement' : 'Nouvelle situation')
        : 'Modifier — ' + sit.name,
      onSave: function (draft) {
        A.set(function () {
          if (isNew) l.situations.push(draft);
          else {
            var i = l.situations.indexOf(sit);
            draft.attempts = sit.attempts;
            draft.progress = sit.progress;
            draft.groups = sit.groups;
            draft.bankId = sit.bankId;
            l.situations[i] = draft;
          }
        });
      }
    });
  }

  /* Éditeur partagé : une situation de leçon et une fiche de la banque se
     préparent exactement de la même manière. */
  function openEditor(source, opts) {
    var draft = JSON.parse(JSON.stringify(source));
    var crits = A.criteria();

    var moveOpts = function (cur, dflt) {
      return PROGRESS.MOVES.map(function (m) {
        return '<option value="' + m.id + '"' + ((cur || dflt) === m.id ? ' selected' : '') + '>' + e(m.label) + '</option>';
      }).join('');
    };

    var bandBlock = function (lv, key, icon, title, hint, placeholder, dflt) {
      var img = lv['img' + key];
      return '<fieldset class="band band-' + key.toLowerCase() + '">' +
        '<legend>' + icon + ' ' + e(title) + '</legend>' +
        '<p class="tiny muted" style="margin:0 0 8px">' + e(hint) + '</p>' +
        '<label class="field"><span>Message affiché à l\'élève (les retours à la ligne sont conservés)</span>' +
        '<textarea data-lk="msg' + key + '" rows="3" placeholder="' + e(placeholder) + '">' + e(lv['msg' + key] || '') + '</textarea></label>' +
        '<div class="row tight" style="margin-bottom:10px">' +
        '<button type="button" class="btn-sm" data-img="' + key + '">' + (img ? 'Remplacer l\'image' : 'Ajouter une image') + '</button>' +
        (img ? '<button type="button" class="btn-sm btn-ghost btn-danger" data-imgdel="' + key + '">Retirer l\'image</button>' : '') +
        '</div>' +
        '<div class="img-slot" data-imgslot="' + key + '">' +
        (img ? '<img src="' + img + '" alt="Illustration du message">' : '') + '</div>' +
        '<label class="field" style="margin-bottom:0"><span>Et ensuite, l\'élève…</span>' +
        '<select data-lk="action' + key + '">' + moveOpts(lv['action' + key], dflt) + '</select></label>' +
        '</fieldset>';
    };

    var levelsHtml = function () {
      var ls = PROGRESS.levelsOf(draft);
      if (!ls.length) return '<p class="small muted">Aucun palier : la situation fonctionnera sans différenciation.</p>';
      return ls.map(function (lv, i) {
        var sh = PROGRESS.levelShade(i, ls.length);
        return '<fieldset data-lv="' + lv.id + '" class="lv-tint lv-fieldset" style="margin-bottom:14px;' + sh.style + '">' +
          '<legend class="lv-name">' + e(lv.name) + '</legend>' +
          '<div class="row tight" style="margin-bottom:8px">' +
          '<input data-lk="name" value="' + e(lv.name) + '" placeholder="Nom du palier" style="flex:1;min-width:140px">' +
          '<button type="button" class="btn-sm btn-ghost btn-danger" data-lvdel="' + lv.id + '">✕</button>' +
          '</div>' +
          '<label class="field"><span>Consigne de ce palier — ce que l\'élève doit faire</span>' +
          '<textarea data-lk="consigne" rows="3" placeholder="ex. Passes à 5 m&#10;Receveur en mouvement&#10;Deux mains obligatoires">' +
          e(lv.consigne || '') + '</textarea></label>' +
          '<div class="grid cols-2">' +
          '<label class="field"><span>Seuil bas</span>' +
          '<input type="number" data-lk="seuilBas" value="' + (lv.seuilBas == null ? '' : lv.seuilBas) + '" placeholder="ex. 10"></label>' +
          '<label class="field"><span>Seuil haut</span>' +
          '<input type="number" data-lk="seuilHaut" value="' + (lv.seuilHaut == null ? '' : lv.seuilHaut) + '" placeholder="ex. 15"></label>' +
          '</div>' +
          bandBlock(lv, 'Aide', '◆', 'Score sous le seuil bas', 'Critères de réalisation : ce qu\'il faut soigner pour réussir.',
            'Regarde ton receveur avant de lancer.\nDisque à plat, poignet armé.', 'stay') +
          bandBlock(lv, 'Reco', '▶', 'Score entre les deux seuils', 'Recommandation : placement, intention, consigne de jeu.',
            'Place-toi en diagonale du porteur.\nPars au moment où il arme son bras.', 'stay') +
          bandBlock(lv, 'Plus', '▲', 'Score au-dessus du seuil haut', 'Complexification : la tâche devient plus difficile.',
            'Objectif atteint. Recule de 3 mètres et refais la série.', 'next') +
          '</fieldset>';
      }).join('');
    };

    var estEch = kindOf(draft) === 'echauffement';
    var mot = estEch ? 'cet échauffement' : 'cette situation';
    var coop = coopConfig(draft);

    var body =
      '<label class="field"><span>Comment se mène ' + mot + ' ?</span>' +
      '<select name="format">' +
      '<option value="paliers"' + (draft.format === 'match' || draft.format === 'coop' ? '' : ' selected') + '>' +
      'Par paliers — chaque groupe mesure un score et reçoit son retour</option>' +
      '<option value="match"' + (draft.format === 'match' ? ' selected' : '') + '>' +
      'En confrontation — deux équipes s\'opposent (passe à 10, déménageur, gagne-terrain…)</option>' +
      '<option value="coop"' + (draft.format === 'coop' ? ' selected' : '') + '>' +
      'En co-frontation — deux élèves coopèrent, marquent des points, puis changent de partenaire</option>' +
      '</select><span class="tiny muted" id="fmthint"></span></label>' +
      '<label class="field"><span>Nom' + (estEch ? ' de l\'échauffement' : ' de la situation') + '</span>' +
      '<input name="name" value="' + e(draft.name) + '" placeholder="' + e(KINDS[kindOf(draft)].exemple) + '"></label>' +
      '<label class="field"><span>Consigne générale</span><textarea name="consigne" style="min-height:54px">' + e(draft.consigne || '') + '</textarea></label>' +
      '<fieldset><legend>Schéma de la situation</legend>' +
      '<p class="tiny muted" style="margin:0 0 8px">Un croquis du dispositif, des plots, des zones. Il s\'affiche sur la fiche, ' +
      'sur la tablette des élèves au moment de choisir leur groupe, et sur la feuille imprimable.</p>' +
      '<div class="row tight" style="margin-bottom:8px">' +
      '<button type="button" class="btn-sm" id="sitimg">' + (draft.image ? 'Remplacer le schéma' : 'Ajouter un schéma') + '</button>' +
      '<button type="button" class="btn-sm btn-ghost btn-danger" id="sitimgdel"' + (draft.image ? '' : ' hidden') + '>Retirer</button>' +
      '</div><div class="img-slot" id="sitimgslot">' +
      (draft.image ? '<img src="' + draft.image + '" alt="Schéma de la situation">' : '') + '</div></fieldset>' +
      '<div class="grid cols-3" id="mesureBloc">' +
      '<label class="field"><span>Unité mesurée</span><input name="unit" value="' + e(draft.unit) + '" placeholder="réussites, secondes, mètres…"></label>' +
      '<label class="field"><span>Sens</span><select name="direction">' +
      '<option value="high"' + (draft.direction === 'high' ? ' selected' : '') + '>Plus c\'est haut, mieux c\'est</option>' +
      '<option value="low"' + (draft.direction === 'low' ? ' selected' : '') + '>Plus c\'est bas, mieux c\'est</option></select></label>' +
      '<label class="field"><span>Prime de palier — ' + A.round(draft.levelStep, 1) + '</span>' +
      '<input type="range" name="lstep" min="0" max="20" value="' + Math.round(draft.levelStep * 10) + '">' +
      '<span class="tiny muted">Bonus d\'indice accordé pour être monté d\'un palier. Sans lui, un élève serait pénalisé d\'avoir complexifié sa tâche.</span></label>' +
      '</div>' +
      '<fieldset><legend>Critères alimentés par cette situation</legend>' +
      '<p class="small muted">Le score normalisé se répartit sur ces critères. Une situation de défense ne doit pas polluer l\'indice « Lancer ». ' +
      'Tout à zéro, la fiche n\'influence aucun indice : elle ne sert plus qu\'à afficher la consigne.</p>' +
      crits.map(function (c) {
        var v = Math.round((draft.targets[c.id] || 0) * 100);
        return '<label class="field" style="margin-bottom:8px"><span>' + e(c.name) + ' — <b data-tv="' + c.id + '">' + v + ' %</b></span>' +
          '<input type="range" min="0" max="100" step="10" data-target="' + c.id + '" value="' + v + '"></label>';
      }).join('') + '</fieldset>' +
      '<fieldset id="paliersBloc"><legend>Paliers et messages automatiques</legend>' +
      '<p class="small muted">Chaque palier découpe le score en trois bandes. Le message correspondant s\'affiche à l\'élève dès qu\'il saisit son score, ' +
      'et reste consultable ensuite. Au passage suivant, l\'élève choisit son palier — on note s\'il a suivi la recommandation.</p>' +
      '<div id="levels">' + levelsHtml() + '</div>' +
      '<button type="button" class="btn-sm" id="addlv">Ajouter un palier</button></fieldset>' +
      '<fieldset id="matchBloc" hidden><legend>Confrontation</legend>' +
      '<p class="small muted">Les équipes sont appariées deux par deux — celles de la leçon, ou des ' +
      'équipes composées pour cette fiche. Chaque opposition reçoit deux scores, saisis par toi ou ' +
      'par les élèves en mode kiosque. L\'écart entre les deux scores alimente les critères cochés ' +
      'ci-dessus, à l\'échelle de l\'équipe ; ce résultat n\'entre pas dans le classement de la leçon.</p>' +
      '<legend>Bonus par combinaison d\'actions</legend>' +
      '<p class="small muted">Comme pour les matchs d\'ultimate : un geste qui rapporte davantage qu\'un ' +
      'point ordinaire. « Marquer après trois passes sans perte = 3 points ». Les élèves les trouvent ' +
      'en mode kiosque, sur fond ambré à côté du bouton + 1.</p>' +
      '<div id="bonusList"></div>' +
      '<button type="button" class="btn-sm" id="addbonus">Ajouter un bonus</button>' +
      '</fieldset>' +

      '<fieldset id="coopBloc" hidden><legend>Co-frontation</legend>' +
      '<p class="small muted">Deux élèves coopèrent pour atteindre un objectif en un nombre d\'essais ' +
      'limité. Réussi ou raté, le duo marque des points — c\'est ce qui permet de se classer — puis ' +
      'chacun change de partenaire. Exemple, « partenaire en or » : <b>15 passes en 3 essais</b>, ' +
      '10 points si c\'est réussi, 1 point sinon.<br>' +
      'Quelle que soit la condition de fin choisie, <b>tu peux arrêter la situation quand tu veux</b> ' +
      'depuis sa carte : le classement se fige, la tablette cesse d\'accepter des manches, et ' +
      '« Relancer » rouvre tout sans rien effacer.</p>' +
      '<div class="grid cols-3">' +
      '<label class="field"><span>Objectif à atteindre</span>' +
      '<input type="number" name="coObj" min="1" value="' + coop.objectif + '">' +
      '<span class="tiny muted">exprimé dans l\'unité ci-dessus (passes, réceptions…)</span></label>' +
      '<label class="field"><span>Essais autorisés</span>' +
      '<input type="number" name="coEss" min="1" max="20" value="' + coop.essais + '"></label>' +
      '<label class="field"><span>Points si l\'objectif est atteint</span>' +
      '<input type="number" name="coPtsR" min="0" value="' + coop.ptsReussite + '"></label>' +
      '<label class="field"><span>Points en cas d\'échec</span>' +
      '<input type="number" name="coPtsE" min="0" value="' + coop.ptsEchec + '">' +
      '<span class="tiny muted">Rarement zéro : essayer avec un partenaire difficile doit rapporter.</span></label>' +
      '<label class="field"><span>La situation s\'arrête…</span><select name="coFin">' +
      '<option value="duos"' + (coop.fin === 'duos' ? ' selected' : '') + '>après un nombre de coopérations</option>' +
      '<option value="classe"' + (coop.fin === 'classe' ? ' selected' : '') + '>dès qu\'un élève a coopéré avec toute la classe (course)</option>' +
      '<option value="temps"' + (coop.fin === 'temps' ? ' selected' : '') + '>au bout d\'un temps donné</option>' +
      '</select></label>' +
      '<label class="field" data-co="duos"><span>Coopérations par élève</span>' +
      '<input type="number" name="coDuos" min="1" max="30" value="' + coop.nbDuos + '"></label>' +
      '<label class="field" data-co="temps" hidden><span>Durée (minutes)</span>' +
      '<input type="number" name="coDuree" min="1" max="60" value="' + coop.duree + '"></label>' +
      '<label class="field"><span>Taille du groupe</span><select name="coTaille">' +
      [2, 3, 4, 5, 6].map(function (t) {
        return '<option value="' + t + '"' + (coop.taille === t ? ' selected' : '') + '>' +
          t + ' élèves — ' + coopNom({ taille: t }) + '</option>';
      }).join('') +
      '</select><span class="tiny muted">Un objectif à trois ne se règle pas comme à deux : ' +
      'pense à relever l\'objectif.</span></label>' +
      '</div>' +
      '<label class="inline" style="display:flex;margin-top:10px"><input type="checkbox" name="coUniques"' + (coop.uniques ? ' checked' : '') +
      '> Interdire de refaire un groupe déjà formé</label>' +
      '<p class="tiny muted" style="margin:4px 0 0">Coché, deux élèves qui ont déjà coopéré ne peuvent ' +
      'plus se retrouver ensemble : ni ta saisie ni la tablette ne l\'acceptent, et les noms déjà ' +
      'rencontrés s\'éteignent à l\'écran. C\'est ce qui force le brassage — et ce qui rend les ' +
      'indices plus justes, puisque chacun est mesuré avec des partenaires différents.</p>' +
      '</fieldset>';

    UI.modal({
      title: opts.title || 'Situation',
      body: body, okLabel: opts.okLabel || 'Enregistrer',
      onOpen: function (d) {
        /* Le choix du format masque ce qui ne sert pas : en confrontation,
           ni unité, ni sens, ni paliers — juste des équipes et des scores. */
        var fmt = d.querySelector('[name=format]');
        var majFormat = function () {
          var v = fmt ? fmt.value : 'paliers';
          draft.format = (v === 'match' || v === 'coop') ? v : 'paliers';
          var match = v === 'match', co = v === 'coop';
          var mesure = d.querySelector('#mesureBloc'), paliers = d.querySelector('#paliersBloc');
          var bloc = d.querySelector('#matchBloc'), blocCo = d.querySelector('#coopBloc');
          var hint = d.querySelector('#fmthint');
          /* la co-frontation garde l'unité de mesure (« 15 passes »), mais pas
             les paliers : la différenciation passe par le choix du partenaire */
          if (mesure) mesure.hidden = match;
          if (paliers) paliers.hidden = match || co;
          if (bloc) bloc.hidden = !match;
          if (blocCo) blocCo.hidden = !co;
          if (hint) {
            hint.textContent = match
              ? 'Deux équipes s\'opposent et notent leur score : rien à régler de plus.'
              : (co
                ? 'Les élèves coopèrent par petits groupes, marquent des points, puis changent de partenaire.'
                : 'Chaque groupe mesure un score et reçoit son retour automatique.');
          }
          /* Une co-frontation qui ne vise aucun critère ne compterait pas dans
             les indices — or c'est bien un contenu d'apprentissage. On propose
             donc la Technique par défaut, visiblement, pour que l'enseignant
             la déplace plutôt que de l'oublier. */
          if (co && !Object.keys(draft.targets || {}).some(function (k) { return draft.targets[k] > 0; })) {
            draft.targets = draft.targets || {};
            draft.targets.c_tech = 1;
            var slider = d.querySelector('[data-target="c_tech"]');
            if (slider) {
              slider.value = 100;
              var lab = d.querySelector('[data-tv="c_tech"]');
              if (lab) lab.textContent = '100 %';
            }
          }
        };
        if (fmt) { fmt.addEventListener('change', majFormat); majFormat(); }

        /* Réglages de la co-frontation : la condition de fin décide du champ affiché. */
        var majFin = function () {
          var fin = d.querySelector('[name=coFin]').value;
          d.querySelectorAll('[data-co]').forEach(function (x) {
            x.hidden = x.getAttribute('data-co') !== fin;
          });
        };
        d.querySelector('[name=coFin]').addEventListener('change', majFin);
        majFin();

        /* Bonus de confrontation : mêmes réglages que ceux des matchs
           d'ultimate, mais propres à cette fiche. */
        draft.bonuses = draft.bonuses || [];
        var bonusList = d.querySelector('#bonusList');
        var dessineBonus = function () {
          bonusList.innerHTML = draft.bonuses.length
            ? draft.bonuses.map(function (b, i) {
                return '<div class="bonus-row">' +
                  '<input data-bk="name" data-i="' + i + '" value="' + e(b.name || '') +
                  '" placeholder="Combinaison d\'actions" style="flex:2;min-width:170px">' +
                  '<input data-bk="desc" data-i="' + i + '" value="' + e(b.desc || '') +
                  '" placeholder="Précision (facultatif)" style="flex:2;min-width:150px">' +
                  '<input type="number" data-bk="points" data-i="' + i + '" min="1" value="' +
                  (b.points || 2) + '" style="width:86px">' +
                  '<button type="button" class="btn-sm btn-ghost btn-danger" data-brm="' + i + '">✕</button></div>';
              }).join('')
            : '<p class="tiny muted">Aucun bonus : seul le bouton + 1 sera proposé aux élèves.</p>';
        };
        dessineBonus();
        bonusList.addEventListener('input', function (ev) {
          var el2 = ev.target, k = el2.getAttribute && el2.getAttribute('data-bk');
          if (!k) return;
          var b = draft.bonuses[+el2.getAttribute('data-i')];
          if (!b) return;
          b[k] = k === 'points' ? Math.max(1, +el2.value || 1) : el2.value;
        });
        bonusList.addEventListener('click', function (ev) {
          var rm = ev.target.getAttribute && ev.target.getAttribute('data-brm');
          if (rm == null) return;
          ev.preventDefault();
          draft.bonuses.splice(+rm, 1);
          dessineBonus();
        });
        d.querySelector('#addbonus').addEventListener('click', function (ev) {
          ev.preventDefault();
          draft.bonuses.push({ id: A.uid('bon'), name: '', desc: '', points: 2 });
          dessineBonus();
        });

        var imgBtn = d.querySelector('#sitimg'), imgDel = d.querySelector('#sitimgdel');
        var imgSlot = d.querySelector('#sitimgslot');
        imgBtn.addEventListener('click', function () {
          A.pickImage(function (data) {
            draft.image = data;
            imgSlot.innerHTML = '<img src="' + data + '" alt="Schéma de la situation">';
            imgBtn.textContent = 'Remplacer le schéma';
            imgDel.hidden = false;
            UI.toast('Schéma ajouté.');
          });
        });
        imgDel.addEventListener('click', function () {
          draft.image = '';
          imgSlot.innerHTML = '';
          imgBtn.textContent = 'Ajouter un schéma';
          imgDel.hidden = true;
        });
        d.querySelectorAll('[data-target]').forEach(function (el) {
          el.addEventListener('input', function () {
            draft.targets[el.getAttribute('data-target')] = +el.value / 100;
            var b = d.querySelector('[data-tv="' + el.getAttribute('data-target') + '"]');
            if (b) b.textContent = el.value + ' %';
          });
        });
        var bindLevels = function () {
          d.querySelectorAll('#levels [data-lv]').forEach(function (fs) {
            var id = fs.getAttribute('data-lv');
            var lv = PROGRESS.levelById(draft, id);
            fs.querySelectorAll('[data-lk]').forEach(function (el) {
              var apply = function () {
                var k = el.getAttribute('data-lk');
                var v = el.value;
                if (k === 'seuilBas' || k === 'seuilHaut') lv[k] = v === '' ? null : +v;
                else lv[k] = v;
                if (k === 'name') { var lg = fs.querySelector('legend'); if (lg) lg.textContent = v; }
              };
              el.addEventListener('input', apply);
              el.addEventListener('change', apply);
            });
            /* images jointes aux messages */
            fs.querySelectorAll('[data-img]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                var key = btn.getAttribute('data-img');
                A.pickImage(function (data) {
                  lv['img' + key] = data;
                  var slot = fs.querySelector('[data-imgslot="' + key + '"]');
                  if (slot) slot.innerHTML = '<img src="' + data + '" alt="Illustration du message">';
                  btn.textContent = 'Remplacer l\'image';
                  UI.toast('Image ajoutée.');
                });
              });
            });
            fs.querySelectorAll('[data-imgdel]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                var key = btn.getAttribute('data-imgdel');
                lv['img' + key] = '';
                var slot = fs.querySelector('[data-imgslot="' + key + '"]');
                if (slot) slot.innerHTML = '';
                btn.remove();
              });
            });

            var del = fs.querySelector('[data-lvdel]');
            if (del) del.addEventListener('click', function () {
              draft.levels = draft.levels.filter(function (x) { return x.id !== id; });
              draft.levels.forEach(function (x, i) { x.order = i; });
              d.querySelector('#levels').innerHTML = levelsHtml();
              bindLevels();
            });
          });
        };
        bindLevels();
        d.querySelector('#addlv').addEventListener('click', function () {
          draft.levels.push(PROGRESS.newLevel(draft.levels.length));
          d.querySelector('#levels').innerHTML = levelsHtml();
          bindLevels();
        });
      },
      onOk: function (d) {
        var fmtSel = d.querySelector('[name=format]');
        var fv = fmtSel ? fmtSel.value : 'paliers';
        draft.format = (fv === 'match' || fv === 'coop') ? fv : 'paliers';
        if (draft.format === 'coop') {
          draft.coop = {
            objectif: Math.max(1, +d.querySelector('[name=coObj]').value || COOP.objectif),
            essais: Math.max(1, +d.querySelector('[name=coEss]').value || COOP.essais),
            ptsReussite: Math.max(0, +d.querySelector('[name=coPtsR]').value),
            ptsEchec: Math.max(0, +d.querySelector('[name=coPtsE]').value),
            fin: d.querySelector('[name=coFin]').value,
            nbDuos: Math.max(1, +d.querySelector('[name=coDuos]').value || COOP.nbDuos),
            duree: Math.max(1, +d.querySelector('[name=coDuree]').value || COOP.duree),
            taille: A.clamp(+d.querySelector('[name=coTaille]').value || COOP.taille, 2, COOP_TAILLE_MAX),
            uniques: d.querySelector('[name=coUniques]').checked
          };
        }
        draft.name = d.querySelector('[name=name]').value.trim() ||
          (draft.format === 'match' ? 'Confrontation'
            : (draft.format === 'coop' ? 'Co-frontation' : 'Situation'));
        draft.consigne = d.querySelector('[name=consigne]').value;
        draft.unit = d.querySelector('[name=unit]').value.trim() || 'points';
        draft.direction = d.querySelector('[name=direction]').value;
        draft.levelStep = +d.querySelector('[name=lstep]').value / 10;
        if (draft.format === 'match') {
          draft.duels = draft.duels || [];
          /* un bonus sans nom ou sans points ne sert à rien sur la tablette */
          draft.bonuses = (draft.bonuses || []).filter(function (b) { return b.name && b.points; });
        }
        return opts.onSave(draft);
      }
    });
  }

  /* ================================================================ groupes */

  function editGroups(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    var present = LESSON.presentStudents(l);
    sit.groups = sit.groups || [];

    var draft = JSON.parse(JSON.stringify(sit.groups));

    var picked = null;   // élève sélectionné, en attente d'un groupe d'arrivée

    var render = function () {
      var assigned = {};
      draft.forEach(function (g) { g.members.forEach(function (m) { assigned[m] = g.id; }); });
      var s = '';
      if (picked) {
        var ps = A.studentById(cls.id, picked);
        s += '<div class="notice"><b>' + e(ps ? A.displayName(ps) : picked) + '</b> est sélectionné — ' +
          'touche maintenant le groupe d\'arrivée. <button type="button" class="btn-sm btn-ghost" data-gcancel>Annuler</button></div>';
      }
      s += '<div class="grid cols-3">';
      draft.forEach(function (g, gi) {
        var glv = PROGRESS.levelById(sit, PROGRESS.recommendedLevelForGroup(sit, g.members));
        var gsh = glv ? PROGRESS.levelColor(sit, glv.id) : null;
        s += '<div class="team' + (gsh ? ' lv-tint' : '') + '" style="--team:' +
          (gsh ? 'var(--lv)' : 'var(--accent)') + ';' + (gsh ? gsh.style : '') + '" data-gdrop="' + gi + '">' +
          '<div class="team-head">' +
          '<input data-gn="' + gi + '" value="' + e(g.label) + '" style="flex:1;min-height:32px;font-weight:700">' +
          (glv ? '<span class="lv-chip lv-tint" style="' + gsh.style + '" title="Palier recommandé">' +
            e(glv.name) + '</span>' : '') +
          '<span class="badge">' + g.members.length + '</span>' +
          '<button type="button" class="btn-sm btn-ghost" data-grm="' + gi + '">✕</button></div>';
        g.members.forEach(function (sid) {
          var st2 = A.studentById(cls.id, sid);
          s += '<div class="player' + (picked === sid ? ' selected' : '') + '" data-gpick="' + sid + '">' +
            '<span class="pn">' + e(st2 ? A.shortName(st2) : sid) + '</span>' +
            '<button type="button" class="btn-sm btn-ghost" data-gout="' + sid + '" title="Retirer du groupe">✕</button></div>';
        });
        s += '<select data-gadd="' + gi + '" style="width:100%;margin-top:6px;min-height:34px"><option value="">+ ajouter…</option>' +
          present.filter(function (p) { return !assigned[p.id]; })
            .map(function (p) { return '<option value="' + p.id + '">' + e(A.shortName(p)) + '</option>'; }).join('') +
          '</select></div>';
      });
      s += '</div>';
      var libres = present.filter(function (p) { return !assigned[p.id]; });
      s += '<div class="row tight" style="margin-top:10px"><span class="small muted">Sans groupe :</span>' +
        (libres.length
          ? libres.map(function (p) {
              return '<button type="button" class="btn-sm' + (picked === p.id ? ' btn-primary' : '') +
                '" data-gpick="' + p.id + '">' + e(A.shortName(p)) + '</button>';
            }).join('')
          : '<span class="small muted">aucun</span>') + '</div>';
      return s;
    };

    UI.modal({
      title: 'Groupes de travail — ' + sit.name,
      okLabel: 'Enregistrer',
      body: '<div class="row tight" style="margin-bottom:10px">' +
        '<label class="inline small">Taille visée <input type="number" id="gsize" min="2" max="8" value="3" style="width:70px"></label>' +
        '<button type="button" class="btn-sm" id="gauto">Générer automatiquement</button>' +
        '<button type="button" class="btn-sm" id="gteams">Reprendre les équipes de la leçon</button>' +
        '<button type="button" class="btn-sm" id="gadd">Groupe vide</button>' +
        '</div>' +
        '<p class="small muted">Touche un élève puis touche le groupe d\'arrivée pour le déplacer — aucune limite de taille, ' +
        'tu peux faire un groupe de 2 comme de 8. Fais tourner les partenaires d\'une tentative à l\'autre : c\'est ce qui permet ' +
        'de distinguer le niveau d\'un élève de celui de son binôme.</p>' +
        '<div id="gwrap">' + render() + '</div>',
      onOpen: function (d) {
        var refresh = function () { d.querySelector('#gwrap').innerHTML = render(); bind(); };
        var moveTo = function (sid, gi) {
          draft.forEach(function (g) {
            var i = g.members.indexOf(sid);
            if (i > -1) g.members.splice(i, 1);
          });
          if (draft[gi]) draft[gi].members.push(sid);
          picked = null;
          refresh();
        };
        var bind = function () {
          d.querySelectorAll('[data-gadd]').forEach(function (el) {
            el.addEventListener('change', function () {
              if (!el.value) return;
              moveTo(el.value, +el.getAttribute('data-gadd'));
            });
          });
          /* sélection puis dépôt : fonctionne au doigt comme à la souris */
          d.querySelectorAll('[data-gpick]').forEach(function (el) {
            el.addEventListener('click', function (ev2) {
              ev2.stopPropagation();
              var sid = el.getAttribute('data-gpick');
              picked = (picked === sid) ? null : sid;
              refresh();
            });
          });
          d.querySelectorAll('[data-gdrop]').forEach(function (el) {
            el.addEventListener('click', function () {
              if (!picked) return;
              moveTo(picked, +el.getAttribute('data-gdrop'));
            });
          });
          d.querySelectorAll('[data-gout]').forEach(function (el) {
            el.addEventListener('click', function (ev2) {
              ev2.stopPropagation();
              var sid = el.getAttribute('data-gout');
              draft.forEach(function (g) {
                var i = g.members.indexOf(sid);
                if (i > -1) g.members.splice(i, 1);
              });
              if (picked === sid) picked = null;
              refresh();
            });
          });
          d.querySelectorAll('[data-grm]').forEach(function (el) {
            el.addEventListener('click', function (ev2) {
              ev2.stopPropagation();
              draft.splice(+el.getAttribute('data-grm'), 1);
              refresh();
            });
          });
          var cancel = d.querySelector('[data-gcancel]');
          if (cancel) cancel.addEventListener('click', function () { picked = null; refresh(); });
          d.querySelectorAll('[data-gn]').forEach(function (el) {
            el.addEventListener('input', function () { draft[+el.getAttribute('data-gn')].label = el.value; });
          });
        };
        bind();
        d.querySelector('#gadd').addEventListener('click', function () {
          draft.push({ id: A.uid('grp'), label: 'Groupe ' + (draft.length + 1), members: [] }); refresh();
        });
        d.querySelector('#gteams').addEventListener('click', function () {
          draft = (l.teams || []).map(function (t, i) {
            return { id: A.uid('grp'), label: t.name, members: t.members.slice() };
          });
          refresh();
        });
        d.querySelector('#gauto').addEventListener('click', function () {
          var size = A.clamp(+d.querySelector('#gsize').value || 3, 2, 8);
          draft = autoGroups(sit, present, size);
          refresh();
        });
      },
      onOk: function () {
        A.set(function () { sit.groups = draft.filter(function (g) { return g.members.length; }); });
      }
    });
  }

  /* Affichage plein écran des groupes de travail, à projeter ou à imprimer :
     une feuille lisible de loin, avec le palier de chaque groupe. */
  function projectGroups(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit || !(sit.groups || []).length) { UI.toast('Aucun groupe à afficher.'); return; }

    var h = '<div class="print-sheet"><div class="print-head">' +
      '<div><h1>' + e(sit.name) + '</h1>' +
      '<p class="muted">' + e(cls.name) + ' · ' + e(l.title) + ' · ' + e(A.frDate(l.date)) + '</p></div>' +
      '<div class="no-print row tight">' +
      '<button onclick="window.print()">Imprimer</button>' +
      '<button data-act="project.close">Fermer</button></div></div>';

    if (sit.consigne) h += '<p class="print-consigne">' + e(sit.consigne) + '</p>';
    if (sit.image) h += '<div class="img-slot print-schema"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';

    h += '<div class="print-groups">';
    sit.groups.forEach(function (g) {
      var lvId = PROGRESS.recommendedLevelForGroup(sit, g.members);
      var lv = PROGRESS.levelById(sit, lvId);
      h += '<div class="print-group"><h2>' + e(g.label) + '</h2>' +
        (lv ? '<p class="print-level lv-tint" style="' + PROGRESS.levelColor(sit, lv.id).style + '"><b>' + e(lv.name) + '</b>' +
          (lv.consigne ? '<span>' + e(lv.consigne) + '</span>' : '') + '</p>' : '') +
        '<ol>' + g.members.map(function (sid) {
          var s = A.studentById(cls.id, sid);
          return '<li>' + e(s ? A.displayName(s) : sid) + '</li>';
        }).join('') + '</ol>' +
        '<div class="print-score"><span>Score :</span><i></i><i></i><i></i></div>' +
        '</div>';
    });
    h += '</div></div>';

    var wrap = document.createElement('div');
    wrap.className = 'kiosk-root';
    wrap.id = 'projector';
    wrap.innerHTML = h;
    document.body.appendChild(wrap);
  }

  /* Génère des groupes en minimisant les paires déjà vues (maximise le brassage). */
  function autoGroups(sit, present, size) {
    var seen = {};
    (sit.attempts || []).forEach(function (at) {
      (at.members || []).forEach(function (a) {
        (at.members || []).forEach(function (b) {
          if (a === b) return;
          seen[a + '|' + b] = (seen[a + '|' + b] || 0) + 1;
        });
      });
    });
    var rng = A.rngFrom(sit.id + ':' + (sit.attempts || []).length);
    var pool = A.shuffle(present.map(function (p) { return p.id; }), rng);
    var nG = Math.max(1, Math.round(pool.length / size));
    var groups = [];
    for (var i = 0; i < nG; i++) groups.push({ id: A.uid('grp'), label: 'Groupe ' + (i + 1), members: [] });
    pool.forEach(function (sid) {
      var best = 0, bestCost = Infinity;
      groups.forEach(function (g, gi) {
        if (g.members.length >= size + 1) return;
        var c = g.members.length * 0.01;
        g.members.forEach(function (m) { c += (seen[sid + '|' + m] || 0); });
        if (c < bestCost) { bestCost = c; best = gi; }
      });
      groups[best].members.push(sid);
    });
    return groups.filter(function (g) { return g.members.length; });
  }

  /* ============================================================== tentative */

  function recordAttempt(sitId, presetMembers, presetLevel, opts) {
    opts = opts || {};
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit) return;
    var present = LESSON.presentStudents(l);
    var levels = PROGRESS.levelsOf(sit);
    var members = presetMembers ? presetMembers.slice() : [];

    var groupOpts = '<option value="">— composition libre —</option>' +
      (sit.groups || []).map(function (g) {
        return '<option value="' + g.id + '">' + e(g.label) + ' (' +
          g.members.map(function (m) { var s = A.studentById(cls.id, m); return s ? A.shortName(s) : '?'; }).join(', ') + ')</option>';
      }).join('');

    var reco = members.length ? PROGRESS.recommendedLevelForGroup(sit, members) : (levels[0] ? levels[0].id : null);

    var studentsBox = function () {
      return present.map(function (p) {
        return '<label class="inline" style="border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin:0 4px 4px 0">' +
          '<input type="checkbox" name="mem" value="' + p.id + '"' + (members.indexOf(p.id) > -1 ? ' checked' : '') + '> ' +
          e(A.shortName(p)) + '</label>';
      }).join('');
    };

    var body =
      '<label class="field"><span>Groupe de travail</span><select name="grp">' + groupOpts + '</select></label>' +
      '<fieldset><legend>Élèves concernés</legend><div id="members" style="max-height:150px;overflow:auto">' + studentsBox() + '</div></fieldset>' +
      (levels.length
        ? '<label class="field"><span>Palier réalisé <span id="recohint" class="tiny"></span></span><select name="lvl">' +
          levels.map(function (lv) { return '<option value="' + lv.id + '">' + e(lv.name) + (lv.consigne ? ' — ' + e(lv.consigne) : '') + '</option>'; }).join('') +
          '</select></label>'
        : '') +
      '<label class="field"><span>Score obtenu (' + e(sit.unit) + ')</span>' +
      '<input type="number" name="val" step="any" inputmode="decimal" style="font-size:1.3rem;min-height:56px"></label>';

    UI.modal({
      title: 'Saisir un score — ' + sit.name,
      body: body, okLabel: 'Enregistrer',
      onOpen: function (d) {
        var lvlSel = d.querySelector('[name=lvl]');
        var hint = d.querySelector('#recohint');
        var updateReco = function () {
          var mem = Array.prototype.slice.call(d.querySelectorAll('[name=mem]:checked')).map(function (c) { return c.value; });
          reco = mem.length ? PROGRESS.recommendedLevelForGroup(sit, mem) : (levels[0] ? levels[0].id : null);
          if (lvlSel && reco) {
            if (!lvlSel.dataset.touched) lvlSel.value = reco;
            var lv = PROGRESS.levelById(sit, reco);
            if (hint) hint.innerHTML = lv ? '— recommandé : <b>' + e(lv.name) + '</b>' : '';
          }
        };
        d.querySelectorAll('[name=mem]').forEach(function (c) { c.addEventListener('change', updateReco); });
        if (lvlSel) lvlSel.addEventListener('change', function () { lvlSel.dataset.touched = '1'; });
        d.querySelector('[name=grp]').addEventListener('change', function (ev) {
          var g = (sit.groups || []).filter(function (x) { return x.id === ev.target.value; })[0];
          d.querySelectorAll('[name=mem]').forEach(function (c) {
            c.checked = g ? g.members.indexOf(c.value) > -1 : false;
          });
          updateReco();
        });
        if (presetLevel && lvlSel) { lvlSel.value = presetLevel; lvlSel.dataset.touched = '1'; }
        updateReco();
      },
      onOk: function (d) {
        var mem = Array.prototype.slice.call(d.querySelectorAll('[name=mem]:checked')).map(function (c) { return c.value; });
        var val = d.querySelector('[name=val]').value;
        if (!mem.length) { UI.toast('Sélectionne au moins un élève.'); return false; }
        if (val === '' || !isFinite(+val)) { UI.toast('Saisis un score numérique.'); return false; }
        var lvlSel = d.querySelector('[name=lvl]');
        var attempt = {
          id: A.uid('att'), ts: new Date().toISOString(),
