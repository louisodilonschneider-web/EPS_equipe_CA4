      '<input type="range" min="5" max="100" value="' + Math.round(s.ewma * 100) + '" data-chg="set.ewma">' +
      '<span class="tiny muted">À 100 %, seule la dernière séance compte. 35 % laisse la progression s\'exprimer sans effacer le passé.</span></label>' +
      '<label class="field"><span>Prudence quand peu de données — ' + s.shrinkK + '</span>' +
      '<input type="range" min="0" max="12" value="' + s.shrinkK + '" data-chg="set.shrink">' +
      '<span class="tiny muted">Plus c\'est haut, plus un élève vu deux ou trois fois reste proche de la moyenne de la classe au lieu d\'être jugé trop vite.</span></label>' +
      '<label class="field"><span>Séparation élève / partenaires — ' + A.round(s.ridgeLambda, 1) + '</span>' +
      '<input type="range" min="1" max="40" value="' + Math.round(s.ridgeLambda * 10) + '" data-chg="set.ridge">' +
      '<span class="tiny muted">Prudence du calcul qui distingue un élève de ses partenaires dans un score de groupe. Baisse-la si tu brasses beaucoup les groupes.</span></label>' +
      '</div></details></div>';

    /* Installation matérielle */
    h += '<div class="card"><h2>Le gymnase</h2>' +
      '<p class="muted small">Le nombre de terrains décide du nombre de rencontres qui se jouent en même temps, ' +
      'donc du découpage des matchs en tours : les équipes qui ne jouent pas observent et tiennent les feuilles. ' +
      'C\'est la valeur par défaut ; chaque leçon et chaque échauffement peuvent s\'en écarter.</p>' +
      '<label class="field" style="max-width:260px"><span>Terrains disponibles</span>' +
      '<input type="number" min="1" max="' + A.MAX_TERRAINS + '" data-chg="set.terrains" value="' +
      (s.terrains || A.TERRAINS) + '"></label></div>';

    /* Mode kiosque */
    h += '<div class="card"><h2>Mode kiosque</h2>' +
      '<p class="muted small">Quand la tablette circule entre les élèves, l\'application se verrouille en plein écran. ' +
      'Pour en sortir, il faut ce code — les élèves ne peuvent donc pas aller voir les notes de la classe.</p>' +
      '<label class="field" style="max-width:260px"><span>Code de sortie</span>' +
      '<input inputmode="numeric" data-chg="set.kioskcode" value="' + e(s.kioskCode || A.KIOSK_CODE) + '"></label>' +
      '<p class="tiny muted">Laisse vide pour sortir sans code (déconseillé en classe).</p></div>';

    /* Combien de jours depuis la dernière sauvegarde exportée ? C'est la seule
       copie qui survit à une réinstallation de l'application. */
    var dernier = s.lastExportAt ? new Date(s.lastExportAt) : null;
    var jours = dernier ? Math.floor((Date.now() - dernier.getTime()) / 86400000) : null;
    var aDesDonnees = Object.keys(st.classes || {}).length > 0;
    var alerte = aDesDonnees && (jours === null || jours >= 7);

    /* Mise à jour de l'application — le geste qui évite de désinstaller l'icône */
    h += '<div class="card"><h2>Mettre à jour l\'application</h2>' +
      '<p class="muted small">Une nouveauté ne s\'affiche pas ? C\'est le cache hors ligne qui sert ' +
      'l\'ancienne version. Ce bouton le vide et redémarre l\'application sur la dernière version ' +
      '— <b>sans toucher à tes données</b>.</p>' +
      '<div class="notice bad"><b>Ne supprime jamais l\'icône de l\'écran d\'accueil pour « rafraîchir ».</b> ' +
      'Sur tablette, désinstaller l\'application installée efface aussi tout son stockage : classes, ' +
      'leçons et notes partent avec elle. Utilise ce bouton à la place.</div>' +
      '<button class="btn-primary" data-act="app.update">Recharger la dernière version</button></div>';

    /* Confidentialité + sauvegarde */
    h += '<div class="card"><h2>Données et sauvegarde</h2>' +
      (alerte
        ? '<div class="notice bad"><b>' +
          (jours === null
            ? 'Aucune sauvegarde n\'a jamais été exportée depuis cet appareil.'
            : 'Dernière sauvegarde exportée il y a ' + jours + ' jours.') +
          '</b><br><span class="small">Le fichier JSON est la seule copie qui survit à une ' +
          'réinstallation de l\'application ou à un effacement des données du navigateur. ' +
          'Exporte-le maintenant, et range-le dans ton cloud habituel ou envoie-le-toi par mail.</span></div>'
        : '') +
      '<label class="inline" style="margin-bottom:10px"><input type="checkbox" data-chg="set.anon"' + (s.anonymize ? ' checked' : '') +
      '> Afficher les élèves en « Prénom N. » (utile en vidéoprojection et si tu actives la synchronisation)</label>' +
      '<p class="small muted">Tout est enregistré dans le navigateur de cet appareil. Rien n\'est envoyé sur Internet tant que tu n\'actives pas la synchronisation. ' +
      'Pense à exporter régulièrement : vider le cache du navigateur efface les données.</p>' +
      '<div class="row tight">' +
      '<button class="btn-primary" data-act="data.export">Exporter la sauvegarde (JSON)</button>' +
      '<button data-act="data.import">Importer une sauvegarde</button>' +
      '<button data-act="data.reset" class="btn-danger">Tout effacer</button>' +
      '</div>' +
      '<p class="tiny muted" style="margin-top:8px">Dernier enregistrement sur cet appareil : ' +
      (st.savedAt ? new Date(st.savedAt).toLocaleString('fr-FR') : 'jamais') +
      ' · dernière sauvegarde exportée : ' +
      (dernier ? dernier.toLocaleString('fr-FR') + (jours ? ' (il y a ' + jours + ' jours)' : '') : 'jamais') +
      '</p></div>';

    /* ------------------------------------------------------------ stockage */
    var info = A.storageInfo();
    var ko = function (n) {
      return n > 1048576 ? (n / 1048576).toFixed(1) + ' Mo' : Math.round(n / 1024) + ' Ko';
    };
    var etat = info.pct >= 90 ? 'bad' : (info.pct >= 70 ? 'warn' : 'ok');

    h += '<div class="card"><h2>Stockage</h2>' +
      (!info.ok
        ? '<div class="notice bad"><b>Rien n\'est enregistré en ce moment.</b> Le navigateur refuse d\'écrire : ' +
          'l\'espace est plein. Allège les images ci-dessous, ou exporte ta sauvegarde puis efface ' +
          'des leçons anciennes. Tant que ce message est là, ce que tu saisis sera perdu au rechargement.</div>'
        : '') +
      '<p class="muted small">Le navigateur accorde environ <b>5 Mo</b> par adresse. Le texte ne pèse presque rien : ' +
      'ce sont les images — schémas de situations et illustrations des messages de palier — qui remplissent l\'espace.</p>' +
      '<div class="gauge"><div class="gauge-fill ' + etat + '" style="width:' + Math.max(2, info.pct) + '%"></div></div>' +
      '<div class="row tight" style="margin:8px 0 12px">' +
      UI.badge(ko(info.total) + ' sur ~5 Mo · ' + info.pct + ' %', etat) +
      UI.badge(info.nbImages + ' image' + (info.nbImages > 1 ? 's' : '') + ' — ' + ko(info.images)) +
      UI.badge('texte et notes — ' + ko(info.texte)) +
      '</div>' +
      (info.nbImages
        ? '<div class="row tight">' +
          '<button class="btn-primary" data-act="data.shrink">Alléger les images</button>' +
          '<span class="small muted">Recompresse les ' + info.nbImages + ' images en 720 px : ' +
          'elles restent lisibles sur tablette et occupent environ deux fois moins de place.</span></div>'
        : '<p class="small muted">Aucune image enregistrée : tu as toute la place.</p>') +
      (info.pct >= 70
        ? '<p class="small" style="margin-top:10px">Si cela ne suffit pas : exporte une sauvegarde, ' +
          'puis supprime les leçons des cycles terminés — leurs scores sont dans le fichier exporté.</p>'
        : '') +
      '</div>';

    /* Synchronisation Realtime Database */
    var cl = APP.cloud.status();
    var phaseBadge = {
      off: ['', 'désactivée'],
      loading: ['', 'connexion…'],
      'signed-out': ['warn', 'non connecté'],
      on: [cl.pending ? 'accent' : 'ok', cl.pending ? 'envoi en cours' : 'synchronisé'],
      offline: ['warn', 'hors ligne'],
      error: ['bad', 'erreur']
    }[cl.phase] || ['', cl.phase];

    h += '<div class="card"><div class="card-head"><div><h2>Synchronisation ordinateur ↔ tablette</h2>' +
      '<p class="muted small" style="margin:0">Projet <code>eps-pasteur</code> · base en <b>Europe</b> ' +
      '(europe-west1). La configuration est déjà intégrée : il n\'y a rien à coller.</p></div>' +
      UI.badge(phaseBadge[1], phaseBadge[0]) + '</div>';

    if (cl.message) {
      h += '<div class="notice ' + (cl.phase === 'error' ? 'bad' : cl.phase === 'offline' ? 'warn' : '') + '">' +
        e(cl.message) + '</div>';
    }

    if (cl.phase === 'on' && cl.uid) {
      h += '<p class="small">Connecté en tant que <b>' + e(cl.email || '—') + '</b>' +
        (cl.lastSync ? ' · dernier échange à ' + new Date(cl.lastSync).toLocaleTimeString('fr-FR') : '') + '</p>' +
        '<div class="row tight">' +
        '<button data-act="cloud.push">Envoyer mes données maintenant</button>' +
        '<button data-act="cloud.pull">Récupérer celles du serveur</button>' +
        '<button data-act="cloud.off" class="btn-danger">Désactiver sur cet appareil</button>' +
        '</div>' +
        '<p class="small muted" style="margin-top:10px">Ouvre l\'application sur ton autre appareil et connecte-toi ' +
        'avec <b>ce même compte</b> : les deux resteront à jour. En cas de modification simultanée, ' +
        'l\'application prévient au lieu d\'écraser.</p>';
    } else {
      h += '<p class="small muted">Connecte-toi avec le <b>même compte sur les deux appareils</b>. ' +
        'La première fois, utilise « Créer le compte » ; ensuite, « Se connecter ». ' +
        'Le mot de passe n\'est jamais enregistré par l\'application.</p>' +
        '<div class="grid cols-2">' +
        '<label class="field"><span>Adresse e-mail</span>' +
        '<input type="email" name="cloudemail" autocomplete="username" value="' + e(s2.cloudEmail || '') + '"></label>' +
        '<label class="field"><span>Mot de passe (6 caractères minimum)</span>' +
        '<input type="password" name="cloudpass" autocomplete="current-password"></label>' +
        '</div>' +
        '<div class="row tight">' +
        '<button class="btn-primary" data-act="cloud.signin">Se connecter</button>' +
        '<button data-act="cloud.signup">Créer le compte</button>' +
        '</div>';
    }

    h += '<div class="notice warn" style="margin-top:14px"><b>À faire une seule fois, côté Firebase.</b> ' +
      'Sans ces deux réglages, la synchronisation ne marchera pas — et surtout, les données de tes élèves ' +
      'seraient lisibles par n\'importe qui connaissant l\'adresse de la base.' +
      '<ol style="margin:8px 0 0 18px">' +
      '<li><b>Authentication → Sign-in method</b> : activer <b>E-mail/Mot de passe</b>.</li>' +
      '<li><b>Realtime Database → Règles</b> : coller les règles ci-dessous, puis publier.</li>' +
      '</ol>' +
      '<p style="margin:8px 0 0"><button class="btn-sm" data-act="cloud.rules">Voir les règles à coller</button></p></div>';

    h += '<details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:600">' +
      'Utiliser un autre projet Firebase</summary>' +
      '<label class="field" style="margin-top:10px"><span>Configuration (JSON) — vide = projet eps-pasteur</span>' +
      '<textarea data-chg="set.fbconfig" placeholder=\'{"apiKey":"…","databaseURL":"…"}\'>' +
      e(s2.firebase ? JSON.stringify(s2.firebase, null, 2) : '') + '</textarea></label>' +
      '<p class="tiny muted">Après modification, désactive puis reconnecte la synchronisation.</p></details>';

    h += '<p class="tiny muted" style="margin-top:10px"><b>RGPD.</b> Les noms des élèves quittent l\'appareil dès que ' +
      'la synchronisation est active. La base est hébergée en Europe, l\'accès est limité à ton compte, et ' +
      'l\'anonymisation ci-dessus (« Prénom N. ») n\'affecte que l\'affichage, pas ce qui est stocké. ' +
      'Préviens ton chef d\'établissement et, au moindre doute, reste en local.</p>';

    h += '</div>';

    /* Thème */
    h += '<div class="card"><h2>Affichage</h2><div class="row tight">' +
      ['auto', 'light', 'dark'].map(function (t) {
        return '<button data-act="theme.set" data-t="' + t + '"' + (s.theme === t ? ' class="btn-primary"' : '') + '>' +
          (t === 'auto' ? 'Automatique' : t === 'light' ? 'Clair' : 'Sombre') + '</button>';
      }).join('') + '</div></div>';

    return h;
  }

  /* Les règles de sécurité, prêtes à copier. */
  function showRules() {
    var rules =
      '{\n' +
      '  "rules": {\n' +
      '    "espaces": {\n' +
      '      "$uid": {\n' +
      '        ".read": "auth != null && auth.uid === $uid",\n' +
      '        ".write": "auth != null && auth.uid === $uid"\n' +
      '      }\n' +
      '    }\n' +
      '  }\n' +
      '}';
    UI.modal({
      title: 'Règles de la Realtime Database',
      cancel: false, okLabel: 'Fermer',
      body: '<p class="small">Dans la console Firebase : <b>Realtime Database → Règles</b>, remplace tout par ceci, ' +
        'puis <b>Publier</b>.</p>' +
        '<textarea readonly style="min-height:190px;font-family:var(--mono);font-size:.85rem">' + e(rules) + '</textarea>' +
        '<p class="small muted">Ce que ça dit : chaque compte ne peut lire et écrire que son propre espace. ' +
        'Un visiteur non connecté n\'a accès à rien. Tant que tu n\'as pas publié ces règles, ' +
        'la base est en mode test — ouverte à tous, et elle expire au bout de 30 jours.</p>' +
        '<p class="small"><button class="btn-sm" id="copyrules">Copier les règles</button></p>',
      onOpen: function (d) {
        d.querySelector('#copyrules').addEventListener('click', function () {
          var ta = d.querySelector('textarea');
          ta.select();
          try { document.execCommand('copy'); UI.toast('Règles copiées.'); }
          catch (err) { UI.toast('Sélectionne le texte et copie-le à la main.'); }
        });
      }
    });
  }

  return {
    classes: classes, startImport: startImport, showMapping: showMapping,
    students: students, stats: stats,
    apsaBar: apsaBar,
    showRules: showRules,
    studentProfile: studentProfile, constraints: constraints, addConstraint: addConstraint,
    model: model, settings: settings
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — banque de situations
   ----------------------------------------------------------------------------
   Une fiche de la banque contient tout le travail de préparation : consigne,
   unité de mesure, paliers, seuils, messages et images. Elle ne contient aucun
   score : les tentatives appartiennent à la leçon où la situation est utilisée.

   On prépare donc une fois, puis on réutilise d'un cycle à l'autre en ajustant,
   au moment de l'insertion, les critères que la situation doit alimenter.
   ========================================================================== */
'use strict';

var BANK = (function () {

  var A = APP, e = APP.escapeHtml;

  function all(kind) {
    var b = A.get().bank || {};
    var list = Object.keys(b).map(function (k) { return b[k]; });
    if (kind) list = list.filter(function (t) { return TRAINING.kindOf(t) === kind; });
    return A.sortBy(list, function (t) { return t.name; });
  }
  function byId(id) { return (A.get().bank || {})[id] || null; }

  /* ------------------------------------------------------------- dossiers
     Une même situation se décline : « Passe à 10 » à 5 m, à 8 m, en mouvement.
     Les dossiers rassemblent ces variantes pour qu'elles ne se perdent pas au
     milieu de tout le reste, et se rangent eux-mêmes les uns dans les autres :
     « Passe à 10 » peut contenir « à 5 m » et « en mouvement ».
     Une fiche sans dossier reste parfaitement utilisable : elle se range dans
     « Sans dossier », en bas. */
  var PROFONDEUR_MAX = 4;

  function folders() {
    var f = A.get().bankFolders || {};
    return A.sortBy(Object.keys(f).map(function (k) { return f[k]; }), function (x) { return x.name; });
  }
  function folderById(id) { return (A.get().bankFolders || {})[id] || null; }
  function folderName(id) {
    var f = folderById(id);
    return f ? f.name : 'Sans dossier';
  }

  /* Les dossiers rangés directement dans `parentId` (null = la racine). */
  function folderChildren(parentId) {
    return folders().filter(function (f) { return (f.parentId || null) === (parentId || null); });
  }
  function folderDepth(id) {
    var d = 0, f = folderById(id);
    while (f && f.parentId && d < 20) { d++; f = folderById(f.parentId); }
    return d;
  }
  /* Chemin complet, pour les menus déroulants : « Passe à 10 › à 5 m ». */
  function folderPath(id) {
    var parts = [], f = folderById(id), garde = 0;
    while (f && garde++ < 20) { parts.unshift(f.name); f = f.parentId ? folderById(f.parentId) : null; }
    return parts.join(' › ');
  }
  /* Un dossier et toute sa descendance. */
  function folderSubtree(id) {
    var out = [id];
    folderChildren(id).forEach(function (c) { out = out.concat(folderSubtree(c.id)); });
    return out;
  }
  /* Ce que contient un dossier, sous-dossiers compris. */
  function folderCount(id, kind) {
    var ids = {};
    folderSubtree(id).forEach(function (x) { ids[x] = 1; });
    return {
      fiches: all(kind).filter(function (t) {
        return foldersOf(t).some(function (f) { return ids[f]; });
      }).length,
      dossiers: folderSubtree(id).length - 1
    };
  }

  function newFolder(name, parentId, then) {
    var sous = parentId ? folderById(parentId) : null;
    if (sous && folderDepth(parentId) + 1 >= PROFONDEUR_MAX) {
      UI.toast('Quatre niveaux de dossiers suffisent largement.');
      return;
    }
    UI.ask(sous ? 'Nouveau sous-dossier de « ' + sous.name + ' »' : 'Nouveau dossier',
      'Nom du dossier', name || '', function (v) {
      if (!v || !v.trim()) return;
      var id = A.uid('dos');
      A.set(function (s) {
        s.bankFolders = s.bankFolders || {};
        s.bankFolders[id] = {
          id: id, name: v.trim(), parentId: parentId || null,
          createdAt: new Date().toISOString()
        };
        /* un dossier tout neuf s'ouvre, et son parent avec lui */
        s.ui.bankClosed = s.ui.bankClosed || {};
        delete s.ui.bankClosed[id];
        if (parentId) delete s.ui.bankClosed[parentId];
      });
      UI.toast((sous ? 'Sous-dossier' : 'Dossier') + ' « ' + v.trim() + ' » créé.');
      if (then) then(id);
    });
  }

  function renameFolder(id) {
    var f = folderById(id);
    if (!f) return;
    UI.ask('Renommer le dossier', 'Nom', f.name, function (v) {
      if (!v || !v.trim()) return;
      A.set(function (s) { s.bankFolders[id].name = v.trim(); });
    });
  }

  /* Supprimer un dossier ne supprime jamais son contenu : ses fiches et ses
     sous-dossiers remontent d'un cran, dans le dossier parent. */
  function removeFolder(id) {
    var f = folderById(id);
    if (!f) return;
    var c = folderCount(id);
    var vers = f.parentId ? folderById(f.parentId) : null;
    var ou = vers ? '« ' + e(vers.name) +' »' : '« Sans dossier »';

    UI.confirm('Supprimer le dossier',
      'Le dossier <b>' + e(f.name) + '</b> sera supprimé. ' +
      (c.fiches || c.dossiers
        ? 'Son contenu n\'est pas perdu : ' +
          (c.fiches ? c.fiches + ' fiche(s)' : '') +
          (c.fiches && c.dossiers ? ' et ' : '') +
          (c.dossiers ? c.dossiers + ' sous-dossier(s)' : '') +
          ' remontent dans ' + ou + '.'
        : 'Il est vide.'),
      function () {
        A.set(function (s) {
          var parent = (s.bankFolders[id] || {}).parentId || null;
          Object.keys(s.bank).forEach(function (k) {
            var t = s.bank[k];
            if ((t.folderIds || []).indexOf(id) === -1) return;
            t.folderIds = t.folderIds.filter(function (x) { return x !== id; });
            /* elle remonte dans le parent, sauf si elle est déjà rangée ailleurs */
            if (parent && t.folderIds.indexOf(parent) === -1 && !t.folderIds.length) {
              t.folderIds.push(parent);
            }
          });
          Object.keys(s.bankFolders).forEach(function (k) {
            if (s.bankFolders[k].parentId === id) s.bankFolders[k].parentId = parent;
          });
          delete s.bankFolders[id];
        });
      }, 'Supprimer');
  }

  /* ------------------------------------------- une fiche, plusieurs dossiers
     Le même jeu relève souvent de deux familles : « passe à 10 » est un
     échauffement ET un travail de progression du disque. Plutôt que d'en faire
     deux copies qui divergeront, la fiche est rangée dans plusieurs dossiers à
     la fois : c'est toujours la même, modifiée d'un seul endroit. */
  function foldersOf(tpl) {
    if (!tpl) return [];
    var ids = Array.isArray(tpl.folderIds) ? tpl.folderIds : (tpl.folderId ? [tpl.folderId] : []);
    return ids.filter(function (id) { return !!folderById(id); });
  }
  function isIn(tpl, folderId) { return foldersOf(tpl).indexOf(folderId) > -1; }

  function addTo(tplId, folderId) {
    if (!folderId) return;
    A.set(function (s) {
      var t = s.bank[tplId];
      if (!t) return;
      t.folderIds = Array.isArray(t.folderIds) ? t.folderIds : [];
      if (t.folderIds.indexOf(folderId) === -1) t.folderIds.push(folderId);
    });
  }
  function removeFrom(tplId, folderId) {
    A.set(function (s) {
      var t = s.bank[tplId];
      if (!t) return;
      t.folderIds = (t.folderIds || []).filter(function (x) { return x !== folderId; });
    });
  }
  /* Rangement exclusif, utilisé quand on veut remplacer et non ajouter. */
  function moveTo(tplId, folderId) {
    A.set(function (s) {
      if (s.bank[tplId]) s.bank[tplId].folderIds = folderId ? [folderId] : [];
    });
  }

  /* ------------------------------------------------------ ouvert / fermé
     L'état est mémorisé dans l'interface, donc il survit aux allers-retours
     entre les pages et au rechargement. Ouvert par défaut. */
  function isClosed(id) { return !!(A.get().ui.bankClosed || {})[id]; }
  function toggleFolder(id) {
    A.set(function (s) {
      s.ui.bankClosed = s.ui.bankClosed || {};
      if (s.ui.bankClosed[id]) delete s.ui.bankClosed[id];
      else s.ui.bankClosed[id] = true;
    });
  }
  function setAllFolders(closed) {
    A.set(function (s) {
      s.ui.bankClosed = {};
      if (closed) folders().forEach(function (f) { s.ui.bankClosed[f.id] = true; });
    });
  }

  /* Menu déroulant de rangement : l'arbre mis à plat, chemin complet en clair. */
  function folderOptions(sel, sansLabel) {
    var lignes = [];
    var marche = function (parentId, niveau) {
      folderChildren(parentId).forEach(function (f) {
        lignes.push('<option value="' + f.id + '"' + (sel === f.id ? ' selected' : '') + '>' +
          new Array(niveau + 1).join('  ') + (niveau ? '› ' : '') + e(f.name) + '</option>');
        marche(f.id, niveau + 1);
      });
    };
    marche(null, 0);
    return '<option value="">' + (sansLabel || 'Sans dossier') + '</option>' + lignes.join('');
  }

  /* Une fiche de banque = une situation sans ses données de séance. */
  function toTemplate(sit) {
    var t = JSON.parse(JSON.stringify(sit));
    delete t.attempts; delete t.progress; delete t.groups; delete t.bankId;
    delete t.duels;   // les oppositions dépendent des équipes du jour
    delete t.teams;   // idem pour les équipes composées pour un échauffement
    delete t.fairplay;
    t.levels = (t.levels || []).map(function (lv) { return lv; });
    return t;
  }

  function toSituation(tpl) {
    var sit = JSON.parse(JSON.stringify(tpl));
    sit.id = A.uid('sit');
    sit.bankId = tpl.id;
    /* nouveaux identifiants de paliers : les messages déjà reçus par les élèves
       d'une leçon précédente ne doivent pas se mélanger avec ceux d'aujourd'hui */
    sit.levels = (sit.levels || []).map(function (lv) {
      lv.id = A.uid('lvl');
      return lv;
    });
    sit.attempts = [];
    sit.progress = {};
    sit.groups = [];
    sit.duels = [];
    sit.teams = [];
    delete sit.fairplay;
    return sit;
  }

  /* ==================================================================== vue */

  function view() {
    var st = A.get();
    var filtre = st.ui.bankKind || 'tous';
    var list = all(filtre === 'tous' ? null : filtre);
    var l = A.currentLesson();
    var dossiers = folders();

    var h = '<div class="card"><div class="card-head"><div>' +
      '<h2>Banque de situations</h2>' +
      '<p class="muted small" style="margin:0">Prépare une situation une fois, réutilise-la autant de fois que tu veux. ' +
      'La banque garde les paliers, les seuils, les messages et les images — jamais les scores, qui restent attachés à chaque leçon. ' +
      'Les <b>dossiers</b> regroupent les variantes d\'un même exercice, et se rangent les uns dans les autres. Une fiche n\'est pas ' +
      'enfermée dans sa famille : au moment de l\'insérer, tu choisis si elle sert d\'échauffement ou de situation.</p>' +
      '</div><div class="row tight">' +
      '<label class="inline"><span class="small muted">Afficher</span>' +
      '<select data-chg="bank.kind">' +
      [['tous', 'Tout'], ['echauffement', 'Échauffements'], ['apprentissage', 'Situations']].map(function (o) {
        return '<option value="' + o[0] + '"' + (filtre === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>' +
      '<button class="btn-primary" data-act="bank.new" data-kind="apprentissage">Nouvelle situation</button>' +
      '<button data-act="bank.new" data-kind="echauffement">Nouvel échauffement</button>' +
      '<button data-act="bank.folderNew">Nouveau dossier</button>' +
      (dossiers.length > 1
        ? '<button class="btn-sm btn-ghost" data-act="bank.foldAll" data-v="1">Tout replier</button>' +
          '<button class="btn-sm btn-ghost" data-act="bank.foldAll" data-v="0">Tout déplier</button>'
        : '') +
      '<button data-act="bank.export">Exporter la banque</button>' +
      '<button data-act="bank.import">Importer</button>' +
      '</div></div>';

    if (!list.length && !dossiers.length) {
      return h + UI.empty('Banque vide',
        'Crée une fiche ici, ou copie une situation existante depuis une leçon ' +
        '— le bouton « Copier dans la banque » se trouve dans le menu « ⋯ » de chaque fiche.') + '</div>';
    }

    var entete = '<thead><tr><th>Situation</th><th>Critères alimentés</th><th class="num">Paliers</th>' +
      '<th class="num">Utilisations</th><th>Dossier</th><th></th></tr></thead>';

    /* Une fiche peut être rangée dans plusieurs dossiers à la fois : on montre
       ceux qu'elle occupe sous forme d'étiquettes retirables, et un menu pour
       l'ajouter ailleurs. C'est toujours la même fiche — pas une copie. */
    var celluleDossiers = function (t) {
      var siens = foldersOf(t);
      var libres = folders().filter(function (f) { return siens.indexOf(f.id) === -1; });
      return '<div class="folder-chips">' +
        siens.map(function (fid) {
          return '<span class="folder-chip" title="' + e(folderPath(fid)) + '">' + e(folderName(fid)) +
            '<button class="chip-x" data-act="bank.folderOut" data-id="' + t.id + '" data-f="' + fid +
            '" title="Retirer de ce dossier">✕</button></span>';
        }).join('') +
        (siens.length ? '' : '<span class="tiny muted">non rangée</span>') +
        '</div>' +
        '<select data-chg="bank.folderAdd" data-id="' + t.id + '" class="folder-pick" ' +
        'title="Ranger cette fiche dans un dossier de plus">' +
        '<option value="">' + (siens.length ? '＋ aussi dans…' : '＋ ranger dans…') + '</option>' +
        libres.map(function (f) {
          return '<option value="' + f.id + '">' + e(folderPath(f.id)) + '</option>';
        }).join('') +
        '<option value="__new">＋ Nouveau dossier…</option></select>';
    };

    var ligne = function (t) {
      var tg = Object.keys(t.targets || {}).filter(function (k) { return t.targets[k] > 0; });
      return '<tr><td><b>' + e(t.name) + '</b> ' +
        UI.badge(TRAINING.KINDS[TRAINING.kindOf(t)].label, TRAINING.kindOf(t) === 'echauffement' ? 'warn' : '') +
        (TRAINING.isMatchFormat(t) ? ' ' + UI.badge('confrontation', 'accent') : '') +
        (t.consigne ? '<div class="tiny muted" style="white-space:pre-wrap">' + e(t.consigne.slice(0, 110)) + '</div>' : '') +
        '<div class="tiny muted">' + (TRAINING.isMatchFormat(t)
          ? (t.bonuses || []).length + ' bonus'
          : 'mesure en ' + e(t.unit || '—')) + '</div></td>' +
        '<td>' + (tg.length
          ? tg.map(function (cid) {
              var c = A.critById(cid);
              return c ? UI.badge(c.short || c.name, 'accent') : '';
            }).join(' ')
          : '<span class="badge warn">aucun</span>') + '</td>' +
        '<td class="num">' + (TRAINING.isMatchFormat(t) ? '<span class="muted">—</span>' : (t.levels || []).length) + '</td>' +
        '<td class="num">' + (t.uses || 0) + '</td>' +
        '<td class="folder-cell">' + celluleDossiers(t) + '</td>' +
        '<td class="num nowrap">' +
        (l ? '<button class="btn-sm btn-primary" data-act="bank.use" data-id="' + t.id + '">Ajouter à la leçon</button> ' : '') +
        '<button class="btn-sm" data-act="bank.edit" data-id="' + t.id + '">Modifier</button> ' +
        '<button class="btn-sm" data-act="bank.dup" data-id="' + t.id + '" title="Créer une variante à côté">Dupliquer</button> ' +
        '<button class="btn-sm btn-ghost btn-danger" data-act="bank.del" data-id="' + t.id + '">✕</button>' +
        '</td></tr>';
    };

    /* Un dossier, ses fiches, puis ses sous-dossiers — récursivement.
       Le bandeau entier est cliquable : il ouvre et referme le dossier. */
    var bloc = function (f, niveau) {
      var fiches = list.filter(function (t) { return isIn(t, f.id); });
      var enfants = folderChildren(f.id);
      var c = folderCount(f.id, filtre === 'tous' ? null : filtre);
      var ferme = isClosed(f.id);

      var out = '<div class="bank-folder" style="--niv:' + niveau + '">' +
        '<div class="bank-folder-head' + (ferme ? ' is-closed' : '') + '" data-act="bank.fold" data-id="' + f.id + '" ' +
        'role="button" tabindex="0" title="' + (ferme ? 'Ouvrir' : 'Replier') + ' ce dossier">' +
        '<span class="fold-caret">' + (ferme ? '▸' : '▾') + '</span>' +
        '<h3>' + (ferme ? '📁' : '📂') + ' ' + e(f.name) + '</h3>' +
        UI.badge(c.fiches + ' fiche' + (c.fiches > 1 ? 's' : '')) +
        (c.dossiers ? UI.badge(c.dossiers + ' sous-dossier' + (c.dossiers > 1 ? 's' : '')) : '') +
        '<div class="spacer"></div>' +
        '<button class="btn-sm btn-ghost" data-act="bank.folderNew" data-id="' + f.id + '" ' +
        'title="Créer un dossier à l\'intérieur">+ sous-dossier</button>' +
        '<button class="btn-sm btn-ghost" data-act="bank.folderRename" data-id="' + f.id + '">Renommer</button>' +
        '<button class="btn-sm btn-ghost btn-danger" data-act="bank.folderDel" data-id="' + f.id + '">Supprimer</button>' +
        '</div>';

      if (!ferme) {
        out += '<div class="bank-folder-body">';
        if (fiches.length) {
          out += '<div class="table-wrap"><table>' + entete + '<tbody>' +
            fiches.map(ligne).join('') + '</tbody></table></div>';
        } else if (!enfants.length) {
          out += '<p class="small muted" style="margin:0 0 6px">Dossier vide : range une fiche dedans ' +
            'avec le menu « dossier » de sa ligne, ou crée un sous-dossier.</p>';
        }
        enfants.forEach(function (sf) { out += bloc(sf, niveau + 1); });
        out += '</div>';
      }
      return out + '</div>';
    };

    folderChildren(null).forEach(function (f) { h += bloc(f, 0); });

    /* Les fiches qui ne sont dans aucun dossier (ou dont le dossier a disparu) */
    var orphelines = list.filter(function (t) { return !foldersOf(t).length; });
    if (orphelines.length || !dossiers.length) {
      h += '<div class="bank-folder" style="--niv:0">' +
        '<div class="bank-folder-head"><h3>Sans dossier</h3>' +
        UI.badge(orphelines.length + ' fiche' + (orphelines.length > 1 ? 's' : '')) + '</div>' +
        (orphelines.length
          ? '<div class="table-wrap"><table>' + entete + '<tbody>' +
            orphelines.map(ligne).join('') + '</tbody></table></div>'
          : '<p class="small muted" style="margin:0">Toutes les fiches sont rangées.</p>') +
        '</div>';
    }

    h += '<p class="small muted" style="margin-top:10px">' +
      (l
        ? 'Leçon en cours : <b>' + e(l.title) + '</b>. « Ajouter à la leçon » y insère une copie ; tu ajustes ensuite les critères alimentés sans toucher à la fiche d\'origine.'
        : 'Ouvre une leçon pour pouvoir insérer une situation directement depuis cette page.') +
      '</p>';

    return h + '</div>';
  }

  /* ================================================================ actions */

  function create(kind, folderId) {
    TRAINING.openEditor(TRAINING.newSituation(kind), {
      title: kind === 'echauffement' ? 'Nouvel échauffement en banque' : 'Nouvelle situation en banque',
      onSave: function (draft) {
        A.set(function (s) {
          var t = toTemplate(draft);
          t.id = A.uid('bnk');
          t.uses = 0;
          t.folderIds = folderId ? [folderId] : [];
          t.updatedAt = new Date().toISOString();
          s.bank[t.id] = t;
        });
        UI.toast('Fiche ajoutée à la banque.');
      }
    });
  }

  function edit(id) {
    var t = byId(id);
    if (!t) return;
    TRAINING.openEditor(t, {
      title: 'Modifier la fiche — ' + t.name,
      onSave: function (draft) {
        A.set(function (s) {
          var nt = toTemplate(draft);
          nt.id = t.id;
          nt.uses = t.uses || 0;
          nt.folderIds = (t.folderIds || []).slice();
          nt.updatedAt = new Date().toISOString();
          s.bank[t.id] = nt;
        });
        UI.toast('Fiche mise à jour. Les situations déjà insérées dans des leçons ne changent pas.');
      }
    });
  }

  /* Dupliquer sert surtout à créer une variante : la copie reste dans le même
     dossier que l'originale, prête à être ajustée. */
  function duplicate(id) {
    var t = byId(id);
    if (!t) return;
    A.set(function (s) {
      var c = toTemplate(t);
      c.id = A.uid('bnk');
      c.name = t.name + ' (variante)';
      c.folderIds = (t.folderIds || []).slice();
      c.uses = 0;
      s.bank[c.id] = c;
    });
    var ou = foldersOf(t);
    UI.toast('Variante créée' + (ou.length ? ' dans « ' + folderName(ou[0]) + ' »' : '') + '.');
  }

  function remove(id) {
    var t = byId(id);
    if (!t) return;
    UI.confirm('Retirer de la banque', 'La fiche <b>' + e(t.name) + '</b> sera supprimée. ' +
      'Les situations déjà insérées dans des leçons sont conservées.', function () {
      A.set(function (s) { delete s.bank[id]; });
    }, 'Retirer');
  }

  /* Insertion dans la leçon en cours, avec ajustement des critères : c'est
     là que la même situation peut servir la Technique une semaine et la
     Défense la suivante. */
  function useInLesson(id) {
    var t = byId(id);
    var l = A.currentLesson();
    if (!t || !l) { UI.toast('Ouvre d\'abord une leçon.'); return; }
    var kind = TRAINING.kindOf(t);
    var crits = A.criteria();
    var targets = JSON.parse(JSON.stringify(t.targets || {}));

    var body = '<p class="small muted">« ' + e(t.name) + ' » va être copiée dans <b>' + e(l.title) + '</b>. ' +
      'Ajuste au besoin les critères qu\'elle alimente pour cette leçon — la fiche d\'origine n\'est pas modifiée.</p>' +
      /* Le même exercice sert souvent des deux côtés : une passe à 10 met en
         train un jour et devient un contenu d'apprentissage le lendemain. */
      '<label class="field"><span>Insérer comme</span><select name="kind">' +
      '<option value="echauffement"' + (kind === 'echauffement' ? ' selected' : '') + '>Échauffement</option>' +
      '<option value="apprentissage"' + (kind === 'echauffement' ? '' : ' selected') + '>Situation d\'apprentissage</option>' +
      '</select><span class="tiny muted">Une même fiche peut servir dans les deux onglets : ' +
      'la copie ira dans celui que tu choisis ici.</span></label>' +
      crits.map(function (c) {
        var v = Math.round((targets[c.id] || 0) * 100);
        return '<label class="field" style="margin-bottom:8px"><span>' + e(c.name) +
          ' — <b data-tv="' + c.id + '">' + v + ' %</b></span>' +
          '<input type="range" min="0" max="100" step="10" data-target="' + c.id + '" value="' + v + '"></label>';
      }).join('');

    UI.modal({
      title: 'Ajouter à la leçon', body: body, okLabel: 'Ajouter',
      onOpen: function (d) {
        d.querySelectorAll('[data-target]').forEach(function (el) {
          el.addEventListener('input', function () {
            var cid = el.getAttribute('data-target');
            targets[cid] = +el.value / 100;
            var b = d.querySelector('[data-tv="' + cid + '"]');
            if (b) b.textContent = el.value + ' %';
          });
        });
      },
      onOk: function (d) {
        var choisi = d.querySelector('[name=kind]').value === 'echauffement' ? 'echauffement' : 'apprentissage';
        A.set(function (s) {
          var sit = toSituation(t);
          sit.targets = targets;
          sit.kind = choisi;
          l.situations.push(sit);
          if (s.bank[t.id]) s.bank[t.id].uses = (s.bank[t.id].uses || 0) + 1;
          s.ui.view = 'lessons';
          s.ui.tab = choisi === 'echauffement' ? 'warmup' : 'training';
        });
        UI.toast('Fiche ajoutée dans ' + (choisi === 'echauffement' ? 'l\'échauffement' : 'les situations') + '.');
      }
    });
  }

  /* Depuis une situation de leçon : l'envoyer dans la banque (ou la mettre à jour). */
  function saveFromSituation(sitId) {
    var l = A.currentLesson();
    var sit = TRAINING.sitById(l, sitId);
    if (!sit) return;
    var existing = sit.bankId ? byId(sit.bankId) : null;

    var body = (existing
      ? '<p>Cette situation vient de la fiche <b>' + e(existing.name) + '</b>.</p>' +
        '<label class="inline" style="display:flex;margin-bottom:8px"><input type="radio" name="m" value="update" checked> ' +
        'Mettre à jour cette fiche avec la version actuelle</label>' +
        '<label class="inline" style="display:flex;margin-bottom:10px"><input type="radio" name="m" value="new"> ' +
        'Créer une nouvelle fiche à côté (une variante)</label>'
      : '<p>La situation <b>' + e(sit.name) + '</b> sera copiée dans la banque, sans ses scores : ' +
        'la fiche de la leçon continue sa vie de son côté.</p>') +
      '<label class="field" id="dosBloc"><span>Dossier</span>' +
      '<select name="dos">' + folderOptions(existing ? foldersOf(existing)[0] : null) + '</select>' +
      '<span class="tiny muted">Range les variantes d\'un même exercice ensemble. ' +
      'Tu peux aussi laisser « Sans dossier » et classer plus tard — une fiche peut ensuite ' +
      'être rangée dans plusieurs dossiers à la fois.</span></label>' +
      '<label class="field" id="dosNew"><span>…ou créer un dossier</span>' +
      '<input name="dosnom" placeholder="ex. Passe à 10"></label>';

    UI.modal({
      title: 'Copier dans la banque', body: body, okLabel: 'Copier',
      onOk: function (d) {
        var mode = d.querySelector('[name=m]:checked');
        var update = existing && mode && mode.value === 'update';
        var dossier = d.querySelector('[name=dos]').value || null;
        var nouveau = (d.querySelector('[name=dosnom]').value || '').trim();
        A.set(function (s) {
          if (nouveau) {
            var fid = A.uid('dos');
            s.bankFolders = s.bankFolders || {};
            s.bankFolders[fid] = { id: fid, name: nouveau, createdAt: new Date().toISOString() };
            dossier = fid;
          }
          var t = toTemplate(sit);
          t.id = update ? existing.id : A.uid('bnk');
          t.uses = update ? (existing.uses || 0) : 0;
          /* mise à jour d'une fiche déjà rangée : on ajoute le dossier choisi
             sans effacer les autres rangements */
          var deja = update ? foldersOf(existing) : [];
          t.folderIds = deja.slice();
          if (dossier && t.folderIds.indexOf(dossier) === -1) t.folderIds.push(dossier);
          t.updatedAt = new Date().toISOString();
          if (!update) t.name = sit.name;
          s.bank[t.id] = t;
          sit.bankId = t.id;
        });
        UI.toast((update ? 'Fiche de banque mise à jour' : 'Copiée dans la banque') +
          (dossier ? ' — dossier « ' + folderName(dossier) + ' »' : '') + '.');
      }
    });
  }

  /* Échange de banque entre collègues : un simple fichier JSON. */
  function exportBank() {
    var list = all();
    if (!list.length) { UI.toast('La banque est vide.'); return; }
    A.download('banque-situations-' + A.todayISO() + '.json',
      JSON.stringify({ app: 'organisation-ca4', kind: 'bank', bank: list, folders: folders() }, null, 2));
    UI.toast(list.length + ' fiche(s) exportée(s).');
  }

  function importBank() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var obj = JSON.parse(fr.result);
          var items = obj.kind === 'bank' ? obj.bank
            : (obj.bank ? Object.keys(obj.bank).map(function (k) { return obj.bank[k]; }) : null);
          if (!items || !items.length) throw new Error('aucune fiche trouvée dans ce fichier');
          var dos = obj.folders || [];
          A.set(function (s) {
            s.bankFolders = s.bankFolders || {};
            /* un dossier du même nom est réutilisé plutôt que dupliqué */
            var map = {};
            dos.forEach(function (f) {
              var deja = Object.keys(s.bankFolders).filter(function (k) {
                return s.bankFolders[k].name === f.name;
              })[0];
              if (deja) { map[f.id] = deja; return; }
              var fid = A.uid('dos');
              s.bankFolders[fid] = { id: fid, name: f.name, createdAt: new Date().toISOString() };
              map[f.id] = fid;
            });
            items.forEach(function (t) {
              var c = JSON.parse(JSON.stringify(t));
              c.id = A.uid('bnk');
              c.uses = 0;
              c.folderIds = (Array.isArray(c.folderIds) ? c.folderIds : (c.folderId ? [c.folderId] : []))
                .map(function (x) { return map[x] || null; })
                .filter(function (x) { return !!x; });
              delete c.folderId;
              s.bank[c.id] = c;
            });
          });
          UI.toast(items.length + ' fiche(s) importée(s)' +
            (dos.length ? ' dans ' + dos.length + ' dossier(s)' : '') + '.');
        } catch (err) { UI.toast('Import impossible : ' + err.message); }
      };
      fr.readAsText(f, 'utf-8');
    };
    inp.click();
  }

  return {
    view: view, all: all, byId: byId, create: create, edit: edit,
    duplicate: duplicate, remove: remove, useInLesson: useInLesson,
    saveFromSituation: saveFromSituation, exportBank: exportBank, importBank: importBank,
    toSituation: toSituation, toTemplate: toTemplate,
    folders: folders, folderById: folderById, folderName: folderName,
    newFolder: newFolder, renameFolder: renameFolder, removeFolder: removeFolder,
    moveTo: moveTo, addTo: addTo, removeFrom: removeFrom,
    foldersOf: foldersOf, isIn: isIn, folderOptions: folderOptions,
    folderChildren: folderChildren, folderPath: folderPath, folderSubtree: folderSubtree,
    folderCount: folderCount, folderDepth: folderDepth,
    isClosed: isClosed, toggleFolder: toggleFolder, setAllFolders: setAllFolders
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — situations d'entraînement et progressivité par paliers
   ========================================================================== */
'use strict';

var TRAINING = (function () {

  var A = APP, e = APP.escapeHtml;

  function sitById(l, id) {
    for (var i = 0; i < (l.situations || []).length; i++) if (l.situations[i].id === id) return l.situations[i];
    return null;
  }

  /* Deux familles de situations, qui partagent toute la mécanique :
     l'échauffement et les situations d'apprentissage. */
  var KINDS = {
    echauffement: {
      id: 'echauffement', label: 'Échauffement',
      vide: 'Un échauffement peut lui aussi être mesuré : nombre de passes sans faire tomber le disque, ' +
        'temps sur un parcours, série de réceptions. Les élèves saisissent leur résultat comme pour une situation, ' +
        'et reçoivent le même retour automatique.',
      exemple: 'ex. Montée de température — passes en continu à 5 m'
    },
    apprentissage: {
      id: 'apprentissage', label: 'Situations',
      vide: 'Une situation, c\'est une tâche mesurable (« maximum de passes à 5 m en 1 minute ») découpée en paliers. ' +
        'Selon le score obtenu, l\'élève reçoit automatiquement des critères de réalisation, une recommandation, ' +
        'ou une complexification.',
      exemple: 'ex. Situation n°1 — passes en mouvement'
    }
  };

  function kindOf(sit) { return sit && sit.kind === 'echauffement' ? 'echauffement' : 'apprentissage'; }

  /* Trois façons de mener une fiche, échauffement comme situation :

     PALIERS       on travaille un élément mesurable, chaque groupe saisit son
                   score et reçoit un retour différencié ;
     CONFRONTATION deux équipes s'opposent et notent leur score — passe à 10,
                   déménageur, gagne-terrain ;
     CO-FRONTATION deux élèves coopèrent pour atteindre un objectif en un nombre
                   d'essais limité (« partenaire en or » : 15 passes en 3 essais).
                   Réussi ou raté, le duo marque des points ; chacun change
                   ensuite de partenaire. On coopère à deux, mais on se classe
                   individuellement — d'où le nom.

     Le format se choisit fiche par fiche. */
  var COOP = {
    objectif: 15,       // ce qu'il faut atteindre
    essais: 3,          // en combien de tentatives
    ptsReussite: 10,
    ptsEchec: 1,
    fin: 'duos',        // 'duos' | 'classe' | 'temps'
    nbDuos: 5,
    duree: 10,          // minutes, quand la fin est au temps
    taille: 2,          // binôme, trinôme, quatuor…
    uniques: false      // interdire de refaire un groupe déjà formé
  };
  var COOP_TAILLE_MAX = 6;

  function formatOf(sit) {
    if (!sit) return 'paliers';
    if (sit.format === 'match') return 'match';
    if (sit.format === 'coop') return 'coop';
    return 'paliers';
  }
  function isMatchFormat(sit) { return formatOf(sit) === 'match'; }
  function isCoopFormat(sit) { return formatOf(sit) === 'coop'; }

  /* Réglages d'une co-frontation, complétés par les valeurs par défaut. */
  function coopConfig(sit) {
    var c = Object.assign({}, COOP, sit.coop || {});
    c.objectif = Math.max(1, +c.objectif || COOP.objectif);
    c.essais = Math.max(1, +c.essais || COOP.essais);
    c.ptsReussite = Math.max(0, +c.ptsReussite);
    c.ptsEchec = Math.max(0, +c.ptsEchec);
    c.nbDuos = Math.max(1, +c.nbDuos || COOP.nbDuos);
    c.duree = Math.max(1, +c.duree || COOP.duree);
    c.taille = A.clamp(+c.taille || COOP.taille, 2, COOP_TAILLE_MAX);
    c.uniques = !!c.uniques;
    return c;
  }

  /* Binôme, trinôme… le mot juste, pour que les écrans parlent comme le prof. */
  var COOP_NOMS = { 2: 'binôme', 3: 'trinôme', 4: 'quatuor', 5: 'quintette', 6: 'sextuor' };
  function coopNom(c, pluriel) {
    var t = A.clamp(+((c || {}).taille) || COOP.taille, 2, COOP_TAILLE_MAX);
    var n = COOP_NOMS[t] || ('groupe de ' + t);
    return pluriel ? n + 's' : n;
  }

  /* Les groupes déjà formés, sous forme de paires « a|b » : c'est la mémoire
     qui permet d'interdire de recommencer ensemble. Dans un trinôme, chaque
     paire du groupe compte — deux élèves qui ont déjà travaillé ensemble ne
     peuvent pas se retrouver dans le même trio. */
  function coopPaires(sit) {
    var vues = {};
    (sit.attempts || []).forEach(function (at) {
      var m = at.members || [];
      m.forEach(function (a, i) {
        m.slice(i + 1).forEach(function (b) {
          vues[[a, b].sort().join('|')] = 1;
        });
      });
    });
    return vues;
  }

  /* Quelles paires du groupe proposé se sont déjà rencontrées ? */
  function coopDejaVus(sit, ids, vues) {
    vues = vues || coopPaires(sit);
    var out = [];
    ids.forEach(function (a, i) {
      ids.slice(i + 1).forEach(function (b) {
        if (vues[[a, b].sort().join('|')]) out.push([a, b]);
      });
    });
    return out;
  }

  /* Combien de coopérations chaque élève doit-il mener ? */
  function coopObjectifDuos(l, sit) {
    var c = coopConfig(sit);
    if (c.fin === 'classe') return Math.max(1, LESSON.presentStudents(l).length - 1);
    if (c.fin === 'temps') return 0;      // c'est le chrono qui arrête, pas le compte
    return c.nbDuos;
  }

  /* La situation est-elle terminée ? Trois façons de s'arrêter, et la
     première est toujours disponible : l'enseignant la clôt d'un bouton,
     quel que soit le réglage — un cours ne finit pas quand le tableau le dit,
     il finit quand le professeur siffle.
       · « tour complet » : le PREMIER élève à avoir coopéré avec toute la
         classe arrête la course. On rejoue les manches dans l'ordre pour
         savoir qui y est arrivé d'abord.
       · « nombre de coopérations » : quand chaque élève présent a mené les
         siennes.
       · « temps donné » : rien d'automatique, c'est le chrono de l'enseignant. */
  function coopEtat(l, sit) {
    var c = coopConfig(sit);
    var vise = coopObjectifDuos(l, sit);
    var out = { fini: false, raison: null, gagnant: null, vise: vise, arret: sit.coopStop || null };

    if (c.fin === 'classe' && vise) {
      var par = {}, gagne = null;
      var ats = (sit.attempts || []).slice().sort(function (x, y) {
        return String(x.ts || '') < String(y.ts || '') ? -1 : 1;
      });
      ats.forEach(function (at) {
        if (gagne) return;
        var m = at.members || [];
        m.forEach(function (sid) {
          par[sid] = par[sid] || {};
          m.forEach(function (o) { if (o !== sid) par[sid][o] = 1; });
        });
        m.forEach(function (sid) {
          if (!gagne && Object.keys(par[sid]).length >= vise) gagne = sid;
        });
      });
      if (gagne) {
        var s = A.studentById(l.classId, gagne);
        out.gagnant = {
          id: gagne,
          nom: s ? A.displayName(s) : gagne,
          court: s ? A.shortName(s) : gagne
        };
      }
    } else if (c.fin === 'duos') {
      var st = coopStanding(l, sit), n = {};
      st.forEach(function (p) { n[p.id] = p.duos; });
      var presents = LESSON.presentStudents(l);
      out.tousServis = presents.length > 0 && presents.every(function (s2) {
        return (n[s2.id] || 0) >= c.nbDuos;
      });
    }

    /* « Poursuivre quand même » : la règle a été atteinte, mais l'enseignant
       laisse tourner — souvent pour que chacun finisse son tour. Seul son
       bouton « Arrêter » met alors fin à la situation. */
    out.suite = !!sit.coopSuite;
    if (sit.coopStop) { out.fini = true; out.raison = 'manuel'; }
    else if (out.gagnant && !out.suite) { out.fini = true; out.raison = 'course'; }
    else if (out.tousServis && !out.suite) { out.fini = true; out.raison = 'duos'; }
    return out;
  }

  /* Ce qui compte pour l'objectif : en course au tour complet, ce sont les
     CAMARADES DIFFÉRENTS rencontrés — refaire deux fois le même duo ne fait
     pas avancer. Sinon, c'est le nombre de coopérations menées. */
  function coopAvance(sit, p) {
    return coopConfig(sit).fin === 'classe' ? p.nbPartenaires : p.duos;
  }

  /* Phrase d'état, la même sur la carte de l'enseignant et sur la tablette. */
  function coopFinTexte(etat) {
    if (etat.raison === 'course') {
      return etat.gagnant.nom + ' a coopéré avec toute la classe : la situation est terminée.';
    }
    if (etat.raison === 'duos') return 'Chacun a mené ses coopérations : la situation est terminée.';
    return 'Situation arrêtée par l\'enseignant.';
  }

  /* Arrêter ou relancer la situation, à tout moment. Rien n'est effacé :
     le classement est simplement figé, et la tablette cesse d'accepter
     des manches. */
  function coopToggleStop(sitId) {
    var l = A.currentLesson(), sit = sitById(l, sitId);
    if (!sit) return;
    var etat = coopEtat(l, sit);
    if (etat.fini && etat.raison === 'manuel') {
      A.set(function () { delete sit.coopStop; });
      UI.toast('Situation relancée.');
    } else if (etat.fini) {
      /* la règle dit stop, l'enseignant dit continue */
      A.set(function () { sit.coopSuite = true; delete sit.coopStop; });
      UI.toast('La situation continue malgré tout.');
    } else {
      A.set(function () { sit.coopStop = new Date().toISOString(); });
      UI.toast('Situation arrêtée : le classement est figé.');
    }
  }

  /* Classement individuel : points cumulés, coopérations menées, réussites,
     et partenaires déjà rencontrés. Les manches sont rangées dans `attempts`,
     comme les tentatives d'une situation à paliers : le moteur d'indices sait
     déjà séparer l'apport de chacun dans un duo. */
  function coopStanding(l, sit) {
    var cls = A.get().classes[l.classId];
    var par = {};
    var voir = function (sid) {
      if (!par[sid]) {
        par[sid] = { id: sid, pts: 0, duos: 0, reussites: 0, retro: 0, partenaires: {} };
      }
      return par[sid];
    };
    (sit.attempts || []).forEach(function (at) {
      (at.members || []).forEach(function (sid) {
        var p = voir(sid);
        p.pts += +at.value || 0;
        p.duos++;
        if (at.reussi) p.reussites++;
        if (at.retro) p.retro++;
        (at.members || []).forEach(function (o) { if (o !== sid) p.partenaires[o] = 1; });
      });
    });
    var out = Object.keys(par).map(function (sid) {
      var p = par[sid];
      var s = A.studentById(cls.id, sid);
      p.nom = s ? A.displayName(s) : sid;
      p.court = s ? A.shortName(s) : sid;
      p.nbPartenaires = Object.keys(p.partenaires).length;
      p.absent = (l.attendance[sid] || 'present') !== 'present';
      return p;
    });
    return A.sortBy(out, function (p) { return p.pts + p.duos / 1000; }, true);
  }

  /* Saisie rétro-active : on ne connaît que le TOTAL de points d'un élève, et
     souvent le nombre de coopérations menées. On reconstitue les manches une
     par une — c'est ce que le reste de l'application sait lire : le classement,
     la fiche élève et le moteur d'indices travaillent sur des manches, pas sur
     des totaux. Les partenaires, eux, restent inconnus : ces manches sont donc
     individuelles, ce qui attribue les points à leur auteur sans rien inventer. */
  function coopManchesDepuisTotal(sit, points, duos) {
    var c = coopConfig(sit);
    var n = Math.max(1, Math.round(+duos || 1));
    var ecart = c.ptsReussite - c.ptsEchec;
    var r = ecart > 0
      ? A.clamp(Math.round((points - n * c.ptsEchec) / ecart), 0, n)
      : 0;
    var vals = [];
    for (var i = 0; i < n; i++) vals.push(i < r ? c.ptsReussite : c.ptsEchec);
    /* le barème ne retombe pas toujours juste sur le total annoncé : on met
       l'écart sur la dernière manche plutôt que de corriger le total du prof */
    var somme = vals.reduce(function (a, b) { return a + b; }, 0);
    vals[vals.length - 1] += (points - somme);
    return vals.map(function (v, i) { return { value: v, reussi: i < r }; });
  }

  function coopRecordRetro(l, sit, sid, points, duos, ts) {
    var c = coopConfig(sit);
    var faites = coopManchesDepuisTotal(sit, points, duos);
    var out = [];
    faites.forEach(function (m) {
      var at = {
        id: A.uid('att'),
        ts: ts || new Date().toISOString(),
        members: [sid],
        levelId: null,
        coop: true,
        retro: true,
        reussi: !!m.reussi,
        cible: c.objectif,
        value: m.value
      };
      sit.attempts = sit.attempts || [];
      sit.attempts.push(at);
      out.push(at);
    });
    return out;
  }

  /* Une liste d'élèves, un total de points chacun : la séance menée sans
     l'application se rattrape en une fenêtre. */
  function recordCoopRetro(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit || !isCoopFormat(sit)) return;
    var c = coopConfig(sit);
    var present = LESSON.presentStudents(l);
    if (!present.length) { UI.toast('Personne n\'est présent dans cette leçon.'); return; }
    var vise = coopObjectifDuos(l, sit);
    var passee = (l.date || A.todayISO()) < A.todayISO();

    var lignes = present.map(function (p) {
      return '<tr><td>' + e(A.displayName(p)) + '</td>' +
        '<td><input type="number" step="1" min="0" inputmode="numeric" data-r="pts" data-id="' + p.id +
        '" style="min-height:44px;max-width:110px"></td>' +
        '<td><input type="number" step="1" min="1" inputmode="numeric" data-r="duos" data-id="' + p.id +
        '" placeholder="' + (vise || '') + '" style="min-height:44px;max-width:110px"></td></tr>';
    }).join('');

    UI.modal({
      title: 'Saisie rétro-active — ' + sit.name,
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Le <b>total de points</b> de chaque élève suffit. ' +
        'L\'application reconstitue les manches à partir du barème de la fiche (' +
        c.ptsReussite + ' pt' + (c.ptsReussite > 1 ? 's' : '') + ' si réussi, ' + c.ptsEchec +
        ' sinon) : elle en déduit combien ont été réussies. Les lignes vides ne sont pas ' +
        'enregistrées.</p>' +
        '<p class="small muted">Le nombre de coopérations est facultatif' +
        (vise ? ' (' + vise + ' par défaut)' : '') + ' : il sert à savoir sur combien de manches ' +
        'ces points ont été marqués. <b>Les partenaires ne sont pas demandés</b> — on ne les ' +
        'invente pas, et les points sont attribués à leur auteur seul.</p>' +
        (passee
          ? '<div class="notice">Leçon datée du <b>' + e(l.date) + '</b> : les manches seront ' +
            'horodatées à cette date-là.</div>'
          : '') +
        '<div class="table-wrap" style="max-height:50vh;overflow:auto">' +
        '<table class="compact"><thead><tr><th>Élève</th><th>Total de points</th>' +
        '<th>Coopérations</th></tr></thead><tbody>' + lignes + '</tbody></table></div>',
      onOk: function (d) {
        var ts = passee ? (l.date + 'T12:00:00.000Z') : new Date().toISOString();
        var saisis = [];
        d.querySelectorAll('[data-r="pts"]').forEach(function (inp) {
          var v = inp.value;
          if (v === '' || !isFinite(+v)) return;
          var sid = inp.getAttribute('data-id');
          var dn = d.querySelector('[data-r="duos"][data-id="' + sid + '"]');
          var nb = dn && dn.value !== '' ? +dn.value : (vise || 1);
          saisis.push({ sid: sid, pts: +v, duos: Math.max(1, Math.round(nb)) });
        });
        if (!saisis.length) { UI.toast('Aucun total saisi.'); return false; }
        A.set(function () {
          saisis.forEach(function (x) { coopRecordRetro(l, sit, x.sid, x.pts, x.duos, ts); });
        });
        UI.toast(saisis.length + ' élève(s) enregistré(s).');
      }
    });
  }

  /* Enregistre une manche : le duo marque, chacun garde ses points. */
  function coopRecord(l, sit, membres, reussi, valeur) {
    var c = coopConfig(sit);
    var at = {
      id: A.uid('att'),
      ts: new Date().toISOString(),
      members: membres.slice(),
      levelId: null,
      coop: true,
      reussi: !!reussi,
      cible: c.objectif,
      value: reussi ? c.ptsReussite : c.ptsEchec
    };
    if (valeur != null && valeur !== '') at.atteint = +valeur;
    sit.attempts = sit.attempts || [];
    sit.attempts.push(at);
    return at;
  }

  /* ------------------------------------------- équipes d'un échauffement
     Par défaut, une confrontation reprend les équipes de la leçon. Mais un
     échauffement n'a pas les mêmes contraintes qu'un match d'ultimate : on peut
     vouloir six petites équipes de trois pour un déménageur, alors que la leçon
     tourne à quatre équipes de sept. La fiche peut donc porter ses propres
     équipes, qui ne touchent pas à celles de la leçon. */
  function ownTeams(sit) { return !!(sit && sit.ownTeams && (sit.teams || []).length); }
  function teamsOf(l, sit) { return ownTeams(sit) ? sit.teams : (l.teams || []); }
  function teamById(l, sit, id) {
    var ts = teamsOf(l, sit);
    for (var i = 0; i < ts.length; i++) if (ts[i].id === id) return ts[i];
    return null;
  }
  /* Un « faux » leçon, pour réutiliser tel quel le planificateur de rencontres. */
  function asLesson(l, sit) { return { id: l.id, classId: l.classId, teams: teamsOf(l, sit) }; }

  /* Les duels reprennent les équipes, deux par deux dans l'ordre :
     c'est le plan par défaut, celui d'un simple tour d'oppositions. */
  function makeDuels(l, sit) {
    var ts = teamsOf(l, sit);
    var out = [];
    for (var i = 0; i + 1 < ts.length; i += 2) {
      out.push({ id: A.uid('duel'), teamA: ts[i].id, teamB: ts[i + 1].id, round: 1, scoreA: null, scoreB: null });
    }
    return out;
  }

  /* Plan complet des oppositions, réparti en tours.
     Contrairement aux matchs d'ultimate limités à deux terrains, un jeu
     d'échauffement occupe tout le gymnase : toutes les équipes peuvent jouer
     en même temps. Avec un nombre impair d'équipes, une équipe se retrouve au
     repos à chaque tour — mais jamais la même, puisque le planificateur sert
     d'abord celles qui ont le moins joué. */
  /* Terrains d'un échauffement : celui de la fiche, sinon celui de la leçon,
     sinon le réglage général. Comme il n'y a pas d'observateurs à placer, on
     n'utilise jamais plus de terrains que d'oppositions possibles. */
  function terrainsOf(l, sit) {
    var v = (sit && sit.terrains != null) ? +sit.terrains : LESSON.terrainsOf(l);
    return A.clamp(v || A.TERRAINS, 1, A.MAX_TERRAINS);
  }

  function planDuels(l, sit, opts) {
    var faux = { id: l.id, classId: l.classId, teams: opts.teams || teamsOf(l, sit) };
    var par = A.clamp(
      opts.perRound != null ? +opts.perRound : terrainsOf(l, sit),
      1, Math.max(1, Math.floor(faux.teams.length / 2))
    );
    return LESSON.planTournament(faux, {
      mode: opts.mode, memeGenre: false, paires: opts.paires,
      repetitions: opts.repetitions || 1, perRound: par
    });
  }

  function applyDuelPlan(l, sit, plan) {
    sit.duels = plan.planned.map(function (p) {
      return { id: A.uid('duel'), teamA: p.a, teamB: p.b, round: p.r, scoreA: null, scoreB: null };
    });
    return sit.duels;
  }

  /* Les oppositions rangées par tour, avec les équipes au repos de chaque tour. */
  function duelRounds(l, sit) {
    var duels = liveDuels(l, sit);
    var byRound = {}, ordre = [];
    duels.forEach(function (d, i) {
      var r = d.round || 1;
      if (!byRound[r]) { byRound[r] = []; ordre.push(r); }
      byRound[r].push({ d: d, i: i });
    });
    ordre.sort(function (a, b) { return a - b; });
    return ordre.map(function (r) {
      var busy = {};
      byRound[r].forEach(function (x) { busy[x.d.teamA] = 1; busy[x.d.teamB] = 1; });
      return {
        n: r,
        items: byRound[r],
        repos: teamsOf(l, sit).filter(function (t) { return !busy[t.id]; })
      };
    });
  }
  /* Crée les oppositions si elles manquent, puis rend celles qui tiennent
     encore debout (une équipe supprimée emporte son duel). */
  function duelsFor(l, sit) {
    if (!sit.duels || !sit.duels.length) sit.duels = makeDuels(l, sit);
    return liveDuels(l, sit);
  }
  function liveDuels(l, sit) {
    var vivants = {};
    teamsOf(l, sit).forEach(function (t) { vivants[t.id] = t; });
    return (sit.duels || []).filter(function (d) { return vivants[d.teamA] && vivants[d.teamB]; });
  }
  /* Monter ou descendre une fiche dans sa liste. Échauffements et situations
     cohabitent dans le même tableau : on échange avec le voisin de la même
     famille, pas avec la fiche physiquement adjacente. */
  /* Bascule une fiche d'une famille à l'autre, en la plaçant à la fin de sa
     nouvelle liste. Rien d'autre ne change : paliers, scores et groupes suivent. */
  function switchKind(l, sitId) {
    var sit = sitById(l, sitId);
    if (!sit) return null;
    var vers = kindOf(sit) === 'echauffement' ? 'apprentissage' : 'echauffement';
    sit.kind = vers;
    var i = l.situations.indexOf(sit);
    if (i > -1) { l.situations.splice(i, 1); l.situations.push(sit); }
    return vers;
  }

  function move(l, sitId, dir) {
    var sit = sitById(l, sitId);
    if (!sit) return false;
    var kind = kindOf(sit);
    var idx = [];
    (l.situations || []).forEach(function (s, i) { if (kindOf(s) === kind) idx.push(i); });
    var pos = idx.indexOf((l.situations || []).indexOf(sit));
    var cible = pos + (dir < 0 ? -1 : 1);
    if (pos < 0 || cible < 0 || cible >= idx.length) return false;
    var a = idx[pos], b = idx[cible];
    var tmp = l.situations[a];
    l.situations[a] = l.situations[b];
    l.situations[b] = tmp;
    return true;
  }

  function ofKind(l, kind) {
    return (l.situations || []).filter(function (s) { return kindOf(s) === kind; });
  }

  function newSituation(kind) {
    var lv1 = PROGRESS.newLevel(0, 'Palier 1');
    var lv2 = PROGRESS.newLevel(1, 'Palier 2');
    var lv3 = PROGRESS.newLevel(2, 'Palier 3');
    return {
      id: A.uid('sit'),
      kind: kind === 'echauffement' ? 'echauffement' : 'apprentissage',
      name: kind === 'echauffement' ? 'Nouvel échauffement' : 'Nouvelle situation',
      consigne: '',
      unit: 'réussites',
      direction: 'high',
      targets: {},
      image: '',
      levelStep: 0.8,
      levels: [lv1, lv2, lv3],
      groups: [],
      attempts: [],
      progress: {},
      format: 'paliers',
      duels: [],
      bonuses: []
    };
  }

  /* ==================================================================== vue */

  function view(l, kind) {
    kind = kind === 'echauffement' ? 'echauffement' : 'apprentissage';
    var K = KINDS[kind];
    var cls = A.get().classes[l.classId];
    var list = ofKind(l, kind);
    var enBanque = BANK.all(kind).length;

    var h = '<div class="row" style="margin-bottom:12px">' +
      '<button class="btn-primary" data-act="sit.new" data-kind="' + kind + '">' +
      (kind === 'echauffement' ? 'Nouvel échauffement' : 'Nouvelle situation') + '</button>' +
      '<button data-act="sit.bank" data-kind="' + kind + '">Prendre dans la banque' +
      (enBanque ? ' (' + enBanque + ')' : '') + '</button>' +
      '<div class="spacer"></div>' +
      (list.length ? '<button class="btn-kiosk" data-act="kiosk.open" data-mode="training" data-kind="' + kind +
        '">Mode kiosque — les élèves saisissent</button>' : '') +
      '</div>';

    if (!list.length) {
      return h + UI.empty(kind === 'echauffement' ? 'Aucun échauffement préparé' : 'Aucune situation',
        K.vide + (enBanque ? '<br>Tu as ' + enBanque + ' fiche(s) en banque : inutile de tout refaire.' : ''),
        (enBanque ? '<button class="btn-primary" data-act="sit.bank" data-kind="' + kind +
          '" style="margin-top:8px">Prendre dans la banque</button>' : ''));
    }

    list.forEach(function (sit, si) {
      h += card(l, cls, sit, si, list.length);
    });
    return h;
  }

  /* ------------------------------------------------------- saisie en série
     Une ligne par élève présent : un palier, un score, et c'est tout. C'est la
     façon de rattraper une séance menée sans l'application — notamment quand on
     ne se rappelle plus qui était passé avec qui. Chaque ligne devient une
     tentative INDIVIDUELLE : le moteur d'indices n'a alors rien à démêler, la
     mesure est attribuée à son auteur sans partage. Laisser une ligne vide,
     c'est ne rien enregistrer pour cet élève. */
  function recordBatch(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit) return;
    if (isMatchFormat(sit) || isCoopFormat(sit)) {
      UI.toast('La saisie en série concerne les situations à paliers.');
      return;
    }
    var present = LESSON.presentStudents(l);
    if (!present.length) { UI.toast('Personne n\'est présent dans cette leçon.'); return; }
    var levels = PROGRESS.levelsOf(sit);
    var passee = (l.date || A.todayISO()) < A.todayISO();

    var lignes = present.map(function (p) {
      var reco = PROGRESS.recommendedLevel(sit, p.id);
      return '<tr><td>' + e(A.displayName(p)) + '</td>' +
        (levels.length
          ? '<td><select data-b="lvl" data-id="' + p.id + '">' +
            levels.map(function (lv) {
              return '<option value="' + lv.id + '"' + (lv.id === reco ? ' selected' : '') + '>' +
                e(lv.name) + '</option>';
            }).join('') + '</select></td>'
          : '') +
        '<td><input type="number" step="any" inputmode="decimal" data-b="val" data-id="' + p.id +
        '" style="min-height:44px;max-width:120px"></td></tr>';
    }).join('');

    UI.modal({
      title: 'Saisie en série — ' + sit.name,
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Un score par élève, en une fois. Chaque score est enregistré ' +
        'comme une tentative individuelle : personne ne partage la mesure de personne. ' +
        'Les lignes laissées vides ne sont pas enregistrées.</p>' +
        (passee
          ? '<div class="notice">Cette leçon est datée du <b>' + e(l.date) + '</b>. Les tentatives ' +
            'seront horodatées à cette date-là, pour que l\'historique reste juste.</div>'
          : '') +
        '<div class="table-wrap" style="max-height:50vh;overflow:auto">' +
        '<table class="compact"><thead><tr><th>Élève</th>' +
        (levels.length ? '<th>Palier réalisé</th>' : '') +
        '<th>Score (' + e(sit.unit || 'points') + ')</th></tr></thead><tbody>' +
        lignes + '</tbody></table></div>' +
        '<label class="inline" style="display:flex;margin-top:10px">' +
        '<input type="checkbox" name="muet"' + (passee ? ' checked' : '') + '> ' +
        'Ne pas afficher les retours aux élèves (séance déjà passée)</label>',
      onOk: function (d) {
        var muet = d.querySelector('[name=muet]').checked;
        var ts = passee ? (l.date + 'T12:00:00.000Z') : new Date().toISOString();
        var saisis = [];
        d.querySelectorAll('[data-b="val"]').forEach(function (inp) {
          var v = inp.value;
          if (v === '' || !isFinite(+v)) return;
          var sid = inp.getAttribute('data-id');
          var sel = d.querySelector('[data-b="lvl"][data-id="' + sid + '"]');
          saisis.push({ sid: sid, val: +v, lvl: sel ? sel.value : null });
        });
        if (!saisis.length) { UI.toast('Aucun score saisi.'); return false; }
        A.set(function () {
          saisis.forEach(function (x) {
            var at = {
              id: A.uid('att'), ts: ts, members: [x.sid], value: x.val,
              levelId: x.lvl,
              recommendedLevelId: PROGRESS.recommendedLevel(sit, x.sid)
            };
            sit.attempts.push(at);
            PROGRESS.applyAttempt(sit, at);
            if (muet) PROGRESS.dismissMessage(sit, x.sid, true);
          });
        });
        UI.toast(saisis.length + ' score(s) enregistré(s).');
      }
    });
  }

  /* Saisie d'une manche de co-frontation côté enseignant : deux élèves, réussi
     ou raté. Les élèves font la même chose eux-mêmes en mode kiosque. */
  function recordCoop(sitId) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var sit = sitById(l, sitId);
    if (!sit) return;
    var c = coopConfig(sit);
    var present = LESSON.presentStudents(l);
    if (present.length < c.taille) {
      UI.toast('Il faut au moins ' + c.taille + ' élèves présents.');
      return;
    }
    var etat = coopEtat(l, sit);
    if (etat.fini) {
      UI.toast(coopFinTexte(etat) + ' Relance-la pour saisir une manche.');
      return;
    }

    var st = coopStanding(l, sit);
    var info = {};
    st.forEach(function (p) { info[p.id] = p; });
    var vues = coopPaires(sit);
    var nomDe = function (id) {
      var s2 = A.studentById(cls.id, id);
      return s2 ? A.shortName(s2) : id;
    };
    var opts = present.map(function (s2) {
      var p = info[s2.id];
      return '<option value="' + s2.id + '">' + e(A.displayName(s2)) +
        (p ? ' — ' + p.duos + ' coop., ' + p.pts + ' pts' : '') + '</option>';
    }).join('');
    var rangs = ['Premier élève', 'Deuxième élève', 'Troisième élève',
      'Quatrième élève', 'Cinquième élève', 'Sixième élève'];

    /* Un select par place dans le groupe : deux pour un binôme, trois pour un
       trinôme, et ainsi de suite. */
    var champs = '';
    for (var i = 0; i < c.taille; i++) {
      champs += '<label class="field"><span>' + rangs[i] + '</span>' +
        '<select name="m' + i + '" data-m="1">' + opts + '</select></label>';
    }

    UI.modal({
      title: 'Manche — ' + sit.name,
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Objectif : <b>' + c.objectif + ' ' + e(sit.unit || 'réussites') +
        '</b> en <b>' + c.essais + ' essai' + (c.essais > 1 ? 's' : '') + '</b>, en ' +
        e(coopNom(c)) + '. ' +
        'Réussi : ' + c.ptsReussite + ' point' + (c.ptsReussite > 1 ? 's' : '') + ' pour chacun. ' +
        'Raté : ' + c.ptsEchec + '.</p>' +
        '<div class="grid cols-2">' + champs + '</div>' +
        '<div id="dejaVu"></div>' +
        '<label class="field"><span>Résultat</span><select name="res">' +
        '<option value="1">Objectif atteint — ' + c.ptsReussite + ' pt' + (c.ptsReussite > 1 ? 's' : '') + '</option>' +
        '<option value="0">Objectif manqué — ' + c.ptsEchec + ' pt' + (c.ptsEchec > 1 ? 's' : '') + '</option>' +
        '</select></label>' +
        '<label class="field" style="max-width:220px"><span>Meilleur essai (facultatif)</span>' +
        '<input type="number" name="val" min="0" placeholder="ex. 12"></label>',
      onOpen: function (d) {
        var sels = [].slice.call(d.querySelectorAll('[data-m]'));
        sels.forEach(function (x, i) { if (x.options.length > i) x.selectedIndex = i; });
        var lire = function () {
          return sels.map(function (x) { return x.value; });
        };
        var maj = function () {
          var ids = lire();
          var doublon = ids.some(function (x, i) { return ids.indexOf(x) !== i; });
          var deja = coopDejaVus(sit, ids, vues);
          var h = '';
          if (doublon) {
            h = '<div class="notice bad">Choisis ' + c.taille + ' élèves différents.</div>';
          } else if (deja.length) {
            var liste = deja.map(function (pr) { return nomDe(pr[0]) + ' et ' + nomDe(pr[1]); }).join(', ');
            h = c.uniques
              ? '<div class="notice bad"><b>' + e(liste) + '</b> ont déjà coopéré. ' +
                'Cette fiche interdit de refaire un groupe déjà formé.</div>'
              : '<div class="notice"><b>' + e(liste) + '</b> ont déjà coopéré. Ce n\'est pas ' +
                'interdit, mais changer de partenaire fait progresser tout le monde — et rend le ' +
                'classement plus juste.</div>';
          }
          d.querySelector('#dejaVu').innerHTML = h;
        };
        sels.forEach(function (x) { x.addEventListener('change', maj); });
        maj();
      },
      onOk: function (d) {
        var ids = [].slice.call(d.querySelectorAll('[data-m]')).map(function (x) { return x.value; });
        if (ids.some(function (x, i) { return ids.indexOf(x) !== i; })) {
          UI.toast('Choisis ' + c.taille + ' élèves différents.');
          return false;
        }
        var deja = coopDejaVus(sit, ids, vues);
        if (c.uniques && deja.length) {
          UI.toast(nomDe(deja[0][0]) + ' et ' + nomDe(deja[0][1]) + ' ont déjà coopéré ensemble.');
          return false;
        }
        var reussi = d.querySelector('[name=res]').value === '1';
        var val = d.querySelector('[name=val]').value;
        A.set(function () { coopRecord(l, sit, ids, reussi, val); });
        UI.toast(reussi
          ? 'Objectif atteint — ' + c.ptsReussite + ' point(s) pour chacun.'
          : 'Manche enregistrée — ' + c.ptsEchec + ' point(s) pour chacun.');
      }
    });
  }

  /* ------------------------------------------ choix des oppositions
     Mêmes questions que pour le tournoi d'ultimate, mais sans la limite de
     deux terrains : un échauffement fait jouer toutes les équipes à la fois. */
  function editDuels(sitId) {
    var l = A.currentLesson();
    var sit = sitById(l, sitId);
    if (!sit) return;
    var present = LESSON.presentStudents(l);
    if (!(l.teams || []).length && present.length < 4) {
      UI.toast('Fais d\'abord l\'appel : il faut des élèves présents.');
      return;
    }

    /* Réglages de composition propres à l'échauffement, mémorisés sur la fiche
       pour qu'un second passage reparte des mêmes choix. */
    var cfg = Object.assign({
      mode: 'count', teamCount: Math.max(2, Math.min(9, Math.round(present.length / 4))),
      teamSize: 4, composition: 'equilibre', mixite: 'mixte'
    }, sit.teamConfig || {});

    /* Les équipes de travail de la fenêtre : celles de la leçon, ou un jet
       composé ici même. On garde le brouillon en mémoire pour que les affiches
       cochées désignent toujours des équipes qui existent. */
    var propres = ownTeams(sit);
    var brouillon = propres ? JSON.parse(JSON.stringify(sit.teams)) : null;
    var tirage = 0;

    var equipes = function () { return (propres && brouillon) ? brouillon : (l.teams || []); };
    var nameOf = function (id) {
      var ts = equipes();
      for (var i = 0; i < ts.length; i++) if (ts[i].id === id) return ts[i].name;
      return '?';
    };
    var colorOf = function (id) {
      var ts = equipes();
      for (var i = 0; i < ts.length; i++) if (ts[i].id === id) return ts[i].color;
      return 'var(--accent)';
    };

    var paires = {};
    var terrains = terrainsOf(l, sit);
    var opts = { mode: 'simple', paires: paires, repetitions: 1 };
    var courante = null;

    /* Toutes les affiches redeviennent possibles dès que les équipes changent. */
    var resetPaires = function () {
      paires = {};
      LESSON.possiblePairs({ classId: l.classId, teams: equipes() }, false)
        .forEach(function (p) { paires[LESSON.pairKey(p[0], p[1])] = true; });
      opts.paires = paires;
      var ts = equipes();
      courante = ts.length ? ts[0].id : null;
    };
    resetPaires();

    var composer = function () {
      tirage++;
      var res = LESSON.composeTeams(l, {
        mode: cfg.mode, teamCount: cfg.teamCount, teamSize: cfg.teamSize,
        composition: cfg.composition, mixite: cfg.mixite, stability: 0
      }, sit.id + ':ech:' + tirage);
      brouillon = res.teams;
      resetPaires();
      return res;
    };

    if (propres && !brouillon.length) composer();

    UI.modal({
      title: 'Confrontation — équipes et oppositions',
      okLabel: 'Former les oppositions',
      body:
        '<fieldset><legend>Quelles équipes s\'affrontent ?</legend>' +
        '<label class="field"><span>Origine des équipes</span><select name="src">' +
        '<option value="lecon"' + (propres ? '' : ' selected') + '>Les équipes de la leçon' +
        ((l.teams || []).length ? ' (' + l.teams.length + ')' : ' — aucune pour l\'instant') + '</option>' +
