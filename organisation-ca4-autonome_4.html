  /* ------------------------------------------------------------ classement

     Une victoire vaut 3 points, une défaite 1 point si la rencontre a été
     jouée — c'est le barème habituel en EPS : se déplacer et jouer rapporte
     déjà quelque chose. La différence de points départage. */
  function classement(l, gid) {
    var cls = A.get().classes[l.classId];
    var ar = arenaOf(l);
    var ids = gid
      ? ((groupById(l, gid) || {}).members || []).slice()
      : LESSON.presentStudents(l).map(function (s) { return s.id; });

    var par = {};
    ids.forEach(function (sid) {
      par[sid] = {
        id: sid, nom: nom(cls, sid), court: court(cls, sid),
        joues: 0, v: 0, d: 0, pts: 0, pp: 0, pc: 0
      };
    });
    ar.matches.forEach(function (m) {
      if (m.scoreA == null || m.scoreB == null) return;
      if (gid && m.groupId !== gid) return;
      [[m.a, +m.scoreA, +m.scoreB], [m.b, +m.scoreB, +m.scoreA]].forEach(function (x) {
        var p = par[x[0]];
        if (!p) return;
        p.joues++; p.pp += x[1]; p.pc += x[2];
        if (x[1] > x[2]) { p.v++; p.pts += 3; }
        else { p.d++; p.pts += 1; }
      });
    });
    return A.sortBy(Object.keys(par).map(function (k) {
      var p = par[k];
      p.diff = p.pp - p.pc;
      return p;
    }), function (p) { return p.pts * 10000 + p.diff * 10 + p.v; }, true);
  }

  /* ------------------------------------------------------------- l'échelle

     Le classement des défis. Au départ, l'ordre des indices — c'est ce qui
     donne des premiers défis équilibrés — mais l'enseignant peut le rebattre. */
  function echelle(l) {
    var ar = arenaOf(l);
    var present = LESSON.presentStudents(l).map(function (s) { return s.id; });
    var connus = {};
    ar.echelle = (ar.echelle || []).filter(function (sid) {
      if (connus[sid] || present.indexOf(sid) === -1) return false;
      connus[sid] = 1; return true;
    });
    var manquants = present.filter(function (sid) { return !connus[sid]; });
    if (manquants.length) {
      var r = RATINGS.compute(l.classId, l.apsaId);
      manquants.sort(function (a, b) {
        var ia = r.byStudent[a] ? r.byStudent[a].index : 5;
        var ib = r.byStudent[b] ? r.byStudent[b].index : 5;
        return ib - ia;
      });
      ar.echelle = ar.echelle.concat(manquants);
    }
    return ar.echelle;
  }

  function rangDe(l, sid) { return echelle(l).indexOf(sid) + 1; }

  function defisDe(l, sid) {
    return arenaOf(l).matches.filter(function (m) {
      return m.defi && (m.a === sid || m.b === sid);
    });
  }
  function dejaRencontre(l, a, b) {
    return arenaOf(l).matches.some(function (m) {
      return (m.a === a && m.b === b) || (m.a === b && m.b === a);
    });
  }

  /* Qui un élève peut-il défier ? La réponse dépend entièrement des règles que
     l'enseignant a posées en préparant la situation. */
  function adversairesPossibles(l, sid) {
    var rg = regles(l);
    var ech = echelle(l);
    var moi = ech.indexOf(sid);
    if (moi < 0) return [];
    return ech.filter(function (o, i) {
      if (o === sid) return false;
      if (rg.uniques && dejaRencontre(l, sid, o)) return false;
      if (rg.cible === 'libre') return true;
      var ecart = moi - i;                       // > 0 : l'autre est mieux classé
      if (rg.cible === 'mieux') return ecart > 0 && ecart <= rg.ecartMax;
      return Math.abs(ecart) <= rg.ecartMax;     // 'proche'
    });
  }

  function peutDefier(l, sid) {
    var rg = regles(l);
    if (rg.maxDefis > 0 && defisDe(l, sid).length >= rg.maxDefis) return false;
    return adversairesPossibles(l, sid).length > 0;
  }

  function lancerDefi(l, a, b) {
    var ar = arenaOf(l);
    var m = {
      id: A.uid('ren'), groupId: null, a: a, b: b,
      scoreA: null, scoreB: null, tour: null, terrain: null, defi: true,
      rangA: rangDe(l, a), rangB: rangDe(l, b)
    };
    ar.matches.push(m);
    return m;
  }

  /* Ce qu'un défi gagné rapporte. Quatre conséquences possibles, et c'est
     l'enseignant qui choisit :
       · place   — le vainqueur prend la place du perdant (l'échelle classique) ;
       · monte   — il gagne un ou plusieurs rangs, le perdant en perd autant ;
       · points  — le classement se fait aux points, avec un bonus d'autant plus
                   gros que l'adversaire était mieux classé ;
       · aucune  — les défis restent des matchs, le classement ne bouge pas. */
  function pointsDefi(l, m, sid) {
    var rg = regles(l);
    if (rg.consequence !== 'points') return 0;
    if (m.scoreA == null || m.scoreB == null) return 0;
    var estA = m.a === sid;
    var mien = +(estA ? m.scoreA : m.scoreB), sien = +(estA ? m.scoreB : m.scoreA);
    if (mien === sien) return Math.round((rg.ptsVictoire + rg.ptsDefaite) / 2);
    if (mien < sien) return rg.ptsDefaite;
    /* victoire : bonus selon l'écart de rangs AU MOMENT DU DÉFI */
    var rangMien = estA ? m.rangA : m.rangB;
    var rangSien = estA ? m.rangB : m.rangA;
    var ecart = (rangMien != null && rangSien != null) ? (rangMien - rangSien) : 0;
    var bonus = ecart > 0 ? ecart * rg.ptsParRang : 0;
    if (rg.ptsMax > 0) bonus = Math.min(bonus, rg.ptsMax);
    return rg.ptsVictoire + bonus;
  }

  function classementDefis(l) {
    var cls = A.get().classes[l.classId];
    var ech = echelle(l);
    var par = {};
    ech.forEach(function (sid, i) {
      par[sid] = {
        id: sid, nom: nom(cls, sid), court: court(cls, sid),
        rang: i + 1, pts: 0, joues: 0, v: 0, d: 0
      };
    });
    arenaOf(l).matches.forEach(function (m) {
      if (!m.defi || m.scoreA == null || m.scoreB == null) return;
      [m.a, m.b].forEach(function (sid) {
        var p = par[sid];
        if (!p) return;
        p.joues++;
        var estA = m.a === sid;
        var mien = +(estA ? m.scoreA : m.scoreB), sien = +(estA ? m.scoreB : m.scoreA);
        if (mien > sien) p.v++; else if (mien < sien) p.d++;
        p.pts += pointsDefi(l, m, sid);
      });
    });
    return A.sortBy(Object.keys(par).map(function (k) { return par[k]; }),
      function (p) { return p.pts * 1000 - p.rang; }, true);
  }

  function appliquerEchelle(l, m) {
    if (!m.defi || m.scoreA == null || m.scoreB == null) return false;
    var rg = regles(l);
    if (rg.consequence !== 'place' && rg.consequence !== 'monte') return false;
    var ech = echelle(l);
    var ia = ech.indexOf(m.a), ib = ech.indexOf(m.b);
    if (ia < 0 || ib < 0) return false;
    var gagnant = +m.scoreA > +m.scoreB ? m.a : (+m.scoreB > +m.scoreA ? m.b : null);
    if (!gagnant) return false;                       // égalité : rien ne bouge
    var perdant = gagnant === m.a ? m.b : m.a;
    var ig = ech.indexOf(gagnant), ip = ech.indexOf(perdant);
    if (ig < ip) return false;                        // le mieux classé a tenu sa place

    if (rg.consequence === 'place') {
      ech[ip] = gagnant;
      ech[ig] = perdant;
    } else {
      /* Le vainqueur remonte de N rangs, sans dépasser le perdant. Ceux qu'il
         double reculent d'une place — le perdant compris s'il est dans la
         zone franchie, mais pas davantage : on ne le punit pas deux fois. */
      var cible = Math.max(ip, ig - rg.montee);
      ech.splice(ig, 1);
      ech.splice(cible, 0, gagnant);
    }
    arenaOf(l).echelle = ech;
    return true;
  }

  function enregistrer(l, matchId, scoreA, scoreB) {
    var ar = arenaOf(l);
    var m = ar.matches.filter(function (x) { return x.id === matchId; })[0];
    if (!m) return null;
    m.scoreA = scoreA == null || scoreA === '' ? null : Math.max(0, +scoreA);
    m.scoreB = scoreB == null || scoreB === '' ? null : Math.max(0, +scoreB);
    m.ts = new Date().toISOString();
    var bouge = appliquerEchelle(l, m);
    return { match: m, echelleModifiee: bouge };
  }

  /* -------------------------------------------- montées et descentes (ligues)

     L'application classe et propose ; c'est l'enseignant qui tranche, parce
     qu'une montée se décide aussi sur ce qu'on a vu du match. */
  /* Quand les ligues sont non mixtes, il y a deux échelles parallèles : une
     fille ne « monte » pas dans une ligue de garçons. Chaque groupe ne connaît
     donc comme voisines que celles qui portent la même étiquette. */
  function echelon(l, g) {
    return arenaOf(l).groups.filter(function (x) { return (x.sexe || null) === (g.sexe || null); });
  }
  function voisine(l, g, sens) {
    var lad = echelon(l, g);
    var j = lad.indexOf(g) + (sens < 0 ? -1 : 1);
    return (j < 0 || j >= lad.length) ? null : lad[j];
  }

  function bouger(l, sid, sens) {
    var g = groupOf(l, sid);
    if (!g) return false;
    var cible = voisine(l, g, sens);
    if (!cible) return false;
    g.members = g.members.filter(function (x) { return x !== sid; });
    cible.members.push(sid);
    return true;
  }

  /* Proposition : le premier de chaque ligue monte, le dernier descend. */
  function propositions(l) {
    var ar = arenaOf(l);
    var out = [];
    ar.groups.forEach(function (g) {
      var cl = classement(l, g.id).filter(function (p) { return p.joues > 0; });
      if (cl.length < 2) return;
      var haut = voisine(l, g, -1), bas = voisine(l, g, 1);
      if (haut) out.push({ sid: cl[0].id, sens: -1, de: g.name, vers: haut.name });
      if (bas) out.push({ sid: cl[cl.length - 1].id, sens: 1, de: g.name, vers: bas.name });
    });
    return out;
  }

  /* ------------------------------------------------------------- fair-play

     En CA4, le fair-play et l'arbitrage font partie de ce qu'on évalue : on
     les relève donc là où ils se jouent — dans les rencontres, pas seulement
     dans les situations. Même barème que partout : « rien à signaler » crédite
     modérément, un élève distingué ou repris pèse plus lourd. */
  function fairCrit(l) {
    var ap = A.apsaById(l.classId, l.apsaId);
    return RATINGS.fairCriterion(A.criteria(ap || undefined));
  }
  function fairState(l) {
    var ar = arenaOf(l);
    ar.fairplay = ar.fairplay || { units: {}, adjust: {}, members: {} };
    ar.fairplay.units = ar.fairplay.units || {};
    ar.fairplay.adjust = ar.fairplay.adjust || {};
    ar.fairplay.members = ar.fairplay.members || {};
    return ar.fairplay;
  }
  function fairUnits(l) {
    var ar = arenaOf(l);
    var gs = (ar.groups || []).filter(function (g) { return (g.members || []).length; });
    if (gs.length) {
      return gs.map(function (g) {
        return { id: g.id, label: g.name, members: (g.members || []).slice() };
      });
    }
    return [{
      id: 'tous', label: 'Tous les présents',
      members: LESSON.presentStudents(l).map(function (s2) { return s2.id; })
    }];
  }
  function toggleFair(l, unitId) {
    var fp = fairState(l);
    var unites = fairUnits(l);
    if (unitId === '*') {
      var deja = unites.every(function (x) { return fp.units[x.id] === 'ok'; });
      unites.forEach(function (x) {
        if (deja) { delete fp.units[x.id]; delete fp.members[x.id]; }
        else { fp.units[x.id] = 'ok'; fp.members[x.id] = x.members.slice(); }
      });
      return;
    }
    var u = unites.filter(function (x) { return x.id === unitId; })[0];
    if (!u) return;
    if (fp.units[unitId] === 'ok') { delete fp.units[unitId]; delete fp.members[unitId]; }
    else { fp.units[unitId] = 'ok'; fp.members[unitId] = u.members.slice(); }
  }

  function fairRow(l) {
    var c = fairCrit(l);
    if (!c) return '';
    var fp = fairState(l);
    var unites = fairUnits(l);
    var nAdj = Object.keys(fp.adjust || {}).length;
    var tous = unites.length > 2 && unites.every(function (u) { return fp.units[u.id] === 'ok'; });
    var arbitres = {};
    arenaOf(l).matches.forEach(function (m) {
      (m.arbitres || []).forEach(function (sid) { arbitres[sid] = (arbitres[sid] || 0) + 1; });
    });
    var nArb = Object.keys(arbitres).length;

    return '<div class="card"><div class="row tight fair-row">' +
      '<span class="small muted nowrap">' + e(c.name) + ' :</span>' +
      (unites.length > 2
        ? '<button class="btn-sm' + (tous ? ' btn-primary' : '') + '" data-act="arena.fp" data-u="*">' +
          (tous ? '✓ ' : '') + 'Rien à signaler — tout le monde</button>'
        : '') +
      unites.map(function (u) {
        var on = fp.units[u.id] === 'ok';
        return '<button class="btn-sm' + (on ? ' btn-primary' : '') + '" data-act="arena.fp" data-u="' + e(u.id) + '">' +
          (on ? '✓ ' : '') + 'Rien à signaler — ' + e(u.label) + '</button>';
      }).join('') +
      '<button class="btn-sm" data-act="arena.fpadj">Ajuster individuellement</button>' +
      (nAdj ? UI.badge(nAdj + ' ajustement' + (nAdj > 1 ? 's' : ''), 'accent') : '') +
      (nArb ? UI.badge(nArb + ' arbitre' + (nArb > 1 ? 's' : '') + ' déclaré' + (nArb > 1 ? 's' : ''), 'ok') : '') +
      '</div>' +
      '<p class="tiny muted" style="margin:6px 0 0">Les élèves déclarent eux-mêmes qui a arbitré leur ' +
      'rencontre en mode kiosque : ces arbitrages comptent dans « ' + e(c.name) + ' ».</p></div>';
  }

  function editFairplay(l) {
    var cls = A.get().classes[l.classId];
    var c = fairCrit(l);
    if (!c) { UI.toast('Aucun critère de fair-play dans cette APSA.'); return; }
    var fp = fairState(l);
    var draft = JSON.parse(JSON.stringify(fp));
    var present = LESSON.presentStudents(l);
    var arbitres = {};
    arenaOf(l).matches.forEach(function (m) {
      (m.arbitres || []).forEach(function (sid) { arbitres[sid] = (arbitres[sid] || 0) + 1; });
    });

    var ligne = function (s2) {
      var cur = draft.adjust[s2.id] || '';
      var g = groupOf(l, s2.id);
      return '<tr><td>' + e(A.displayName(s2)) +
        (arbitres[s2.id] ? ' ' + UI.badge('a arbitré ' + arbitres[s2.id] + '×', 'ok') : '') +
        '</td><td class="small muted">' + (g ? e(g.name) : '—') + '</td>' +
        '<td class="num nowrap">' +
        ['', 'plus', 'minus'].map(function (v) {
          var lab = v === '' ? 'neutre' : (v === 'plus' ? '+ distingué' : '− repris');
          return '<button class="btn-sm' + (cur === v ? ' btn-primary' : '') +
            '" data-fa="' + s2.id + '" data-v="' + v + '">' + lab + '</button>';
        }).join(' ') + '</td></tr>';
    };

    UI.modal({
      title: c.name + ' — ajustements',
      okLabel: 'Enregistrer',
      body: '<p class="small muted">« Rien à signaler » vaut déjà pour les groupes cochés. Ici, on ' +
        'distingue ceux qui ont tenu un rôle exemplaire — arbitrage compris — et ceux qu\'il a fallu ' +
        'reprendre.</p>' +
        '<div class="table-wrap" style="max-height:50vh;overflow:auto"><table class="compact"><thead><tr>' +
        '<th>Élève</th><th>Groupe</th><th></th></tr></thead><tbody id="faw">' +
        present.map(ligne).join('') + '</tbody></table></div>',
      onOpen: function (d) {
        var bind = function () {
          d.querySelectorAll('[data-fa]').forEach(function (el) {
            el.addEventListener('click', function () {
              var sid = el.getAttribute('data-fa'), v = el.getAttribute('data-v');
              if (v) draft.adjust[sid] = v; else delete draft.adjust[sid];
              d.querySelector('#faw').innerHTML = present.map(ligne).join('');
              bind();
            });
          });
        };
        bind();
      },
      onOk: function () {
        A.set(function () {
          var fp2 = fairState(l);
          fp2.adjust = draft.adjust;
        });
        UI.toast('Fair-play enregistré.');
      }
    });
  }

  /* ==================================================================== vue */

  function view(l) {
    var cls = A.get().classes[l.classId];
    var ar = arenaOf(l);
    var present = LESSON.presentStudents(l);
    var f = format();

    var h = '<div class="card"><div class="card-head"><div>' +
      '<h2>Rencontres</h2>' +
      '<p class="muted small" style="margin:0">Un contre un : ' + e(A.activite().name) +
      ', en <b>' + f.points + ' points</b>' + (f.ecart > 1 ? ' avec ' + f.ecart + ' d\'écart' : '') + '.</p>' +
      '</div>' +
      /* En défis, il n'y a rien à générer côté enseignant : ce sont les élèves
         qui se défient. Le bouton doit donc être là dès que deux élèves sont
         présents, sans qu'on ait à lancer un premier défi à la main. */
      ((ar.matches.length || (ar.mode === 'defis' && present.length >= 2))
        ? '<button class="btn-primary" data-act="kiosk.open" data-mode="arena">▣ ' +
          (ar.mode === 'defis'
            ? 'Lancer les défis — les élèves choisissent'
            : 'Mode kiosque — les élèves saisissent') + '</button>'
        : '') +
      '</div>';

    /* choix du mode */
    h += '<div class="row tight" style="margin-bottom:6px">' +
      MODES.map(function (m) {
        var res = enReserve(l, m.k);
        var marque = res
          ? ' <span class="badge">' + (res.matches
            ? res.matches + ' renc.'
            : (res.groupes ? res.groupes + ' gr.' : res.echelle + ' él.')) + '</span>'
          : '';
        return '<button class="btn-sm' + (ar.mode === m.k ? ' btn-primary' : '') +
          '" data-act="arena.mode" data-m="' + m.k + '"' +
          (res ? ' title="Mise en place conservée : on la retrouve telle quelle."' : '') +
          '>' + e(m.l) + marque + '</button>';
      }).join('') + '</div>' +
      '<p class="small muted">' + e((MODES.filter(function (m) { return m.k === ar.mode; })[0] || MODES[0]).hint) + '</p>';

    h += '<div class="row tight" style="margin-bottom:10px">' +
      (ar.mode === 'defis'
        ? '<button class="btn-primary" data-act="arena.rules">Règles des défis</button>' +
          '<button data-act="arena.ladder">Refaire l\'échelle</button>'
        : '<button class="btn-primary" data-act="arena.compose">' +
          (ar.groups.length ? 'Recomposer les groupes' : 'Composer les groupes') + '</button>' +
          (ar.groups.length
            ? '<button data-act="arena.groupes">Remodeler à la main</button>' +
              '<button data-act="arena.plan">Générer les rencontres</button>' +
              '<button data-act="arena.relance">Nouvelles rencontres</button>'
            : '')) +
      '<button data-act="arena.releves">Relevés et bonus</button>' +
      '<button data-act="apport" title="Voir ce que chaque relevé fait bouger dans l\'indice">' +
      'Ce qui alimente l\'indice</button>' +
      '<label class="field" style="max-width:150px;margin:0"><span class="tiny">Terrains</span>' +
      '<input type="number" min="1" max="' + A.MAX_TERRAINS + '" data-chg="arena.terrains" value="' + terrainsOf(l) + '"></label>' +
      '</div></div>';

    if (!present.length) return h + UI.empty('Personne n\'est présent', 'Fais l\'appel pour organiser les rencontres.');

    h += fairRow(l);
    return h + (ar.mode === 'defis' ? vueDefis(l, cls) : vueGroupes(l, cls));
  }

  function ligneMatch(l, cls, m, avecTour) {
    var joue = m.scoreA != null && m.scoreB != null;
    var gagnantA = joue && +m.scoreA > +m.scoreB;
    var gagnantB = joue && +m.scoreB > +m.scoreA;
    return '<tr>' +
      (avecTour ? '<td class="num small muted">' + (m.tour || '—') + '</td>' : '') +
      '<td' + (gagnantA ? ' style="font-weight:700"' : '') + '>' + e(nom(cls, m.a)) + '</td>' +
      '<td class="num nowrap">' + (joue ? m.scoreA + ' – ' + m.scoreB : '<span class="muted">— / —</span>') + '</td>' +
      '<td' + (gagnantB ? ' style="font-weight:700"' : '') + '>' + e(nom(cls, m.b)) + '</td>' +
      '<td class="small muted nowrap">' +
      ((m.arbitres || []).length
        ? '⚖ ' + e(m.arbitres.map(function (x) { return court(cls, x); }).join(', '))
        : '') + '</td>' +
      '<td class="num nowrap">' +
      '<button class="btn-sm' + (joue ? '' : ' btn-primary') + '" data-act="arena.score" data-id="' + m.id + '">' +
      (joue ? 'Corriger' : 'Saisir') + '</button>' +
      '<button class="btn-sm btn-ghost" data-act="arena.del" data-id="' + m.id + '" title="Retirer cette rencontre">×</button>' +
      '</td></tr>';
  }

  function tableClassement(l, cls, g, ligues) {
    var cl = classement(l, g.id);
    var sansHaut = ligues && !voisine(l, g, -1);
    var sansBas = ligues && !voisine(l, g, 1);
    var h = '<div class="table-wrap"><table class="compact"><thead><tr>' +
      '<th class="num">#</th><th>Élève</th><th class="num">J</th><th class="num">V</th>' +
      '<th class="num">D</th><th class="num">Points</th><th class="num">Diff.</th>' +
      (ligues ? '<th></th>' : '') + '</tr></thead><tbody>';
    cl.forEach(function (p, k) {
      h += '<tr><td class="num">' + (k + 1) + '</td><td>' + e(p.nom) + '</td>' +
        '<td class="num">' + p.joues + '</td><td class="num">' + p.v + '</td>' +
        '<td class="num">' + p.d + '</td><td class="num"><b>' + p.pts + '</b></td>' +
        '<td class="num">' + (p.diff > 0 ? '+' : '') + p.diff + '</td>' +
        (ligues
          ? '<td class="num nowrap">' +
            '<button class="btn-sm" data-act="arena.move" data-id="' + p.id + '" data-dir="-1"' +
            (sansHaut ? ' disabled' : '') + ' title="Monter d\'une ligue">↑</button> ' +
            '<button class="btn-sm" data-act="arena.move" data-id="' + p.id + '" data-dir="1"' +
            (sansBas ? ' disabled' : '') + ' title="Descendre d\'une ligue">↓</button></td>'
          : '') +
        '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function vueGroupes(l, cls) {
    var ar = arenaOf(l);
    var ligues = ar.mode === 'ligues';
    if (!ar.groups.length) {
      return UI.empty(ligues ? 'Aucune ligue' : 'Aucune poule',
        ligues
          ? 'Compose les ligues — par niveau ou non, mixtes ou non. On ne rencontre que les élèves de sa ligue, et on monte ou descend d\'une ligue à l\'autre.'
          : 'Compose les poules, puis génère les rencontres : dans une poule, tout le monde se rencontre.');
    }

    var h = '';

    /* Qui a fini et attend ? C'est l'information qu'on cherche des yeux au
       milieu du gymnase — et la tablette la donne d'un coup d'œil. */
    var ec2 = enchainConfig(l);
    var attente = LESSON.presentStudents(l).filter(function (s) {
      return groupOf(l, s.id) && aFini(l, s.id);
    });
    if (attente.length && ar.matches.length) {
      h += '<div class="card" style="border-color:var(--ok)">' +
        '<div class="row tight">' +
        '<span class="small muted nowrap">Ont fini :</span>' +
        attente.map(function (s) {
          var g = groupOf(l, s.id);
          return '<span class="badge ok" title="' + e((g || {}).name || '') + '">' +
            e(A.shortName(s)) + '</span>';
        }).join('') +
        '<div class="spacer"></div>' +
        '<button class="btn-sm btn-primary" data-act="arena.relance">Nouvelles rencontres</button>' +
        '</div>' +
        '<p class="tiny muted" style="margin:6px 0 0">' +
        (ec2.actif
          ? 'Ils peuvent enchaîner eux-mêmes depuis le kiosque, contre un camarade qui a fini aussi' +
            (ec2.max > 0 ? ' (' + ec2.max + ' rencontre' + (ec2.max > 1 ? 's' : '') + ' supplémentaire' +
              (ec2.max > 1 ? 's' : '') + ' au maximum)' : '') + '.'
          : 'L\'enchaînement en kiosque est désactivé : c\'est toi qui ajoutes les rencontres.') +
        '</p></div>';
    }

    if (ligues) {
      var props = propositions(l);
      if (props.length) {
        h += '<div class="card" style="border-color:var(--accent)">' +
          '<h3 style="margin-top:0">Mouvements proposés</h3>' +
          '<p class="small muted">D\'après les classements du jour. Rien ne bouge tant que tu n\'as pas tranché — ' +
          'une montée se décide aussi sur ce que tu as vu du match.</p>' +
          '<div class="row tight">' +
          props.map(function (p) {
            return '<button class="btn-sm" data-act="arena.move" data-id="' + p.sid + '" data-dir="' + p.sens + '">' +
              (p.sens < 0 ? '↑ ' : '↓ ') + e(court(cls, p.sid)) + ' → ' + e(p.vers) + '</button>';
          }).join('') +
          '<button class="btn-sm btn-primary" data-act="arena.moveall">Tout appliquer</button>' +
          '</div></div>';
      }
    }

    ar.groups.forEach(function (g) {
      var matchs = ar.matches.filter(function (m) { return m.groupId === g.id; });
      var joues = matchs.filter(function (m) { return m.scoreA != null && m.scoreB != null; }).length;
      h += '<div class="card"><div class="card-head"><div>' +
        '<h3 style="margin:0;color:' + g.color + '">' + e(g.name) + '</h3>' +
        '<p class="small muted" style="margin:0">' + g.members.length + ' élèves · ' +
        joues + ' / ' + matchs.length + ' rencontres jouées</p></div>' +
        '<div class="row tight">' +
        '<button class="btn-sm btn-primary" data-act="arena.relance" data-g="' + g.id + '">Nouvelles rencontres</button>' +
        '<button class="btn-sm" data-act="arena.add" data-g="' + g.id + '">Ajouter une rencontre</button>' +
        '</div></div>';

      h += '<div class="row tight" style="margin-bottom:10px">' +
        g.members.map(function (sid) {
          return '<span class="badge">' + e(court(cls, sid)) + '</span>';
        }).join('') + '</div>';

      if (matchs.length) {
        h += '<div class="table-wrap"><table class="compact"><thead><tr>' +
          '<th class="num">Tour</th><th>Élève</th><th class="num">Score</th><th>Élève</th>' +
          '<th>Arbitre</th><th></th>' +
          '</tr></thead><tbody>' +
          matchs.map(function (m) { return ligneMatch(l, cls, m, true); }).join('') +
          '</tbody></table></div>';
      } else {
        h += '<p class="small muted">Aucune rencontre générée pour ce groupe.</p>';
      }

      if (joues) h += '<h4 style="margin-top:14px">Classement</h4>' + tableClassement(l, cls, g, ligues);
      h += '</div>';
    });

    /* Les rencontres supplémentaires — croisées entre groupes, ou choisies par
       les élèves qui ont fini — vivent à part : elles ne comptent dans aucun
       classement de groupe, et c'est voulu. */
    var croisees = ar.matches.filter(function (m) { return !m.defi && m.groupId == null; });
    if (croisees.length) {
      var joues2 = croisees.filter(function (m) { return m.scoreA != null; }).length;
      var libres = croisees.filter(function (m) { return m.libre; }).length;
      h += '<div class="card" style="border-color:var(--accent)">' +
        '<div class="card-head"><div><h3 style="margin:0">Rencontres supplémentaires</h3>' +
        '<p class="small muted" style="margin:0">' + joues2 + ' / ' + croisees.length +
        ' jouées · hors classement de ' + (ligues ? 'ligue' : 'poule') +
        (libres ? ' · ' + libres + ' choisie' + (libres > 1 ? 's' : '') + ' par les élèves' : '') +
        '</p></div>' +
        '<button class="btn-sm" data-act="arena.relance">Nouvelles rencontres</button></div>' +
        '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th class="num">Tour</th><th>Élève</th><th class="num">Score</th><th>Élève</th>' +
        '<th>Arbitre</th><th></th></tr></thead><tbody>' +
        croisees.map(function (m) { return ligneMatch(l, cls, m, true); }).join('') +
        '</tbody></table></div></div>';
    }
    return h;
  }

  function vueDefis(l, cls) {
    var ar = arenaOf(l);
    var rg = regles(l);
    var ech = echelle(l);
    var defis = ar.matches.filter(function (m) { return m.defi; });

    var h = '<div class="card"><div class="card-head"><div><h3 style="margin:0">Échelle</h3>' +
      '<p class="small muted" style="margin:0">' + ech.length + ' élèves · ' +
      defis.filter(function (m) { return m.scoreA != null; }).length + ' / ' + defis.length + ' défis joués</p></div>' +
      '<div class="row tight">' +
      (ech.length >= 2
        ? '<button class="btn-kiosk" data-act="kiosk.open" data-mode="arena">▣ Lancer les défis</button>'
        : '') +
      '<button class="btn-sm" data-act="arena.defi">Lancer un défi à la main</button></div></div>' +
      (ech.length >= 2
        ? '<p class="small muted" style="margin:-4px 0 10px">Passe la tablette : chaque élève se ' +
          'désigne, choisit un adversaire autorisé et saisit son score. Le bouton « à la main » ne ' +
          'sert qu\'à rattraper un cas particulier.</p>'
        : '')

    h += '<div class="row tight" style="margin-bottom:10px">' +
      UI.badge(rg.cible === 'mieux' ? 'on défie plus fort que soi'
        : (rg.cible === 'proche' ? 'adversaire de niveau proche' : 'adversaire libre'), 'accent') +
      (rg.cible === 'libre' ? '' : UI.badge('jusqu\'à ' + rg.ecartMax + ' rang' + (rg.ecartMax > 1 ? 's' : '') + ' d\'écart')) +
      (rg.uniques ? UI.badge('jamais deux fois le même adversaire') : '') +
      (rg.maxDefis > 0 ? UI.badge(rg.maxDefis + ' défis maximum par élève') : UI.badge('sans limite de défis')) +
      UI.badge(rg.consequence === 'place' ? 'le vainqueur prend la place'
        : (rg.consequence === 'monte' ? 'le vainqueur monte de ' + rg.montee + ' rang' + (rg.montee > 1 ? 's' : '')
          : (rg.consequence === 'points'
            ? 'classement aux points : ' + rg.ptsVictoire + ' / ' + rg.ptsDefaite + ', +' + rg.ptsParRang + ' par rang'
            : 'le classement ne bouge pas')),
        rg.consequence === 'aucune' ? '' : 'ok') +
      '</div>';

    var pts = {};
    if (rg.consequence === 'points') {
      classementDefis(l).forEach(function (p) { pts[p.id] = p.pts; });
    }
    h += '<div class="table-wrap"><table class="compact"><thead><tr>' +
      '<th class="num">Rang</th><th>Élève</th><th class="num">Défis</th><th class="num">V</th>' +
      (rg.consequence === 'points' ? '<th class="num">Points</th>' : '') +
      '<th>Peut défier</th><th></th></tr></thead><tbody>';
    ech.forEach(function (sid, i) {
      var mes = defisDe(l, sid);
      var v = mes.filter(function (m) {
        return (m.a === sid && +m.scoreA > +m.scoreB) || (m.b === sid && +m.scoreB > +m.scoreA);
      }).length;
      var possibles = adversairesPossibles(l, sid);
      h += '<tr><td class="num">' + (i + 1) + '</td><td>' + e(nom(cls, sid)) + '</td>' +
        '<td class="num">' + mes.length + (rg.maxDefis > 0 ? ' / ' + rg.maxDefis : '') + '</td>' +
        '<td class="num">' + v + '</td>' +
        (rg.consequence === 'points' ? '<td class="num"><b>' + (pts[sid] || 0) + '</b></td>' : '') +
        '<td class="small muted">' + (possibles.length
          ? e(possibles.slice(0, 4).map(function (o) { return court(cls, o); }).join(', ')) +
            (possibles.length > 4 ? '…' : '')
          : '<span class="badge warn">personne</span>') + '</td>' +
        '<td class="num nowrap">' +
        '<button class="btn-sm" data-act="arena.up" data-id="' + sid + '" data-dir="-1"' +
        (i === 0 ? ' disabled' : '') + '>↑</button> ' +
        '<button class="btn-sm" data-act="arena.up" data-id="' + sid + '" data-dir="1"' +
        (i === ech.length - 1 ? ' disabled' : '') + '>↓</button></td></tr>';
    });
    h += '</tbody></table></div></div>';

    if (rg.consequence === 'points' && defis.filter(function (m) { return m.scoreA != null; }).length) {
      var clp = classementDefis(l).filter(function (p) { return p.joues; });
      h += '<div class="card"><h3 style="margin-top:0">Classement aux points</h3>' +
        '<p class="small muted">Victoire ' + rg.ptsVictoire + ', défaite jouée ' + rg.ptsDefaite +
        ', et <b>+' + rg.ptsParRang + ' par rang d\'écart</b> quand on bat mieux classé que soi' +
        (rg.ptsMax ? ' (bonus plafonné à ' + rg.ptsMax + ')' : '') + '.</p>' +
        '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th class="num">#</th><th>Élève</th><th class="num">Défis</th><th class="num">V</th>' +
        '<th class="num">D</th><th class="num">Points</th></tr></thead><tbody>' +
        clp.map(function (p, i) {
          return '<tr><td class="num">' + (i + 1) + '</td><td>' + e(p.nom) + '</td>' +
            '<td class="num">' + p.joues + '</td><td class="num">' + p.v + '</td>' +
            '<td class="num">' + p.d + '</td><td class="num"><b>' + p.pts + '</b></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    h += '<div class="card"><h3 style="margin-top:0">Défis de la séance</h3>';
    if (!defis.length) {
      h += UI.empty('Aucun défi', 'Les élèves lancent leurs défis eux-mêmes en mode kiosque : ' +
        'ils se désignent, choisissent un adversaire parmi ceux que les règles autorisent, ' +
        'et saisissent le score. Tu peux aussi en lancer un ici.');
    } else {
      h += '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Élève</th><th class="num">Score</th><th>Élève</th><th>Arbitre</th><th></th></tr></thead><tbody>' +
        defis.map(function (m) { return ligneMatch(l, cls, m, false); }).join('') +
        '</tbody></table></div>';
    }
    return h + '</div>';
  }

  /* ================================================================ actions */

  /* Changer de mode ne détruit plus rien. Chaque mode garde sa mise en place
     dans un tiroir : on peut aller voir les défis au milieu d'un tour de
     poules, revenir, et retrouver ses groupes, ses rencontres et ses scores
     exactement où on les avait laissés. Une fausse manœuvre en cours de leçon
     ne coûte plus qu'un clic pour revenir. */
  function setMode(l, mode) {
    var ar = arenaOf(l);
    if (ar.mode === mode) return;
    ar.tiroirs = ar.tiroirs || {};
    ar.tiroirs[ar.mode] = {
      groups: ar.groups, matches: ar.matches, echelle: ar.echelle, compo: ar.compo || null
    };
    var repris = ar.tiroirs[mode] || null;
    ar.mode = mode;
    ar.groups = (repris && repris.groups) || [];
    ar.matches = (repris && repris.matches) || [];
    ar.echelle = (repris && repris.echelle) || [];
    ar.compo = (repris && repris.compo) || null;
  }

  /* Ce que les autres modes ont en réserve — pour le dire sur leurs boutons
     plutôt que de le laisser deviner. */
  function enReserve(l, mode) {
    var ar = arenaOf(l);
    if (ar.mode === mode) return null;
    var t = (ar.tiroirs || {})[mode];
    if (!t) return null;
    var n = (t.matches || []).length;
    var g = (t.groups || []).length;
    var e2 = (t.echelle || []).length;
    if (!n && !g && !e2) return null;
    return { matches: n, groupes: g, echelle: e2 };
  }

  function editCompose(l) {
    var ar = arenaOf(l);
    var ligues = ar.mode === 'ligues';
    var eleves = LESSON.presentStudents(l);
    var present = eleves.length;
    var nbF = eleves.filter(function (s) { return s.sex === 'F'; }).length;
    var nbG = present - nbF;
    var pre = ar.compo || {};
    var defaut = pre.count != null ? pre.count : Math.max(2, Math.round(present / 4));
    var nivPre = pre.niveau === false ? '0' : '1';
    var mixPre = pre.mixite || 'libre';
    var sel = function (v, cur) { return v === cur ? ' selected' : ''; };

    UI.modal({
      title: ligues ? 'Composer les ligues' : 'Composer les poules',
      okLabel: 'Composer',
      body: '<p class="small muted">' + present + ' élèves présents' +
        (nbF && nbG ? ' — ' + nbF + ' fille' + (nbF > 1 ? 's' : '') + ' et ' +
          nbG + ' garçon' + (nbG > 1 ? 's' : '') : '') + '. ' +
        (ligues
          ? 'On ne rencontre que les élèves de sa ligue, et on monte ou descend d\'une ligue à l\'autre.'
          : 'Une poule où tout le monde se rencontre.') + '</p>' +
        '<div class="grid cols-2">' +
        '<label class="field"><span>Répartition</span><select name="quoi">' +
        '<option value="count"' + sel('count', pre.mode) + '>Nombre de groupes</option>' +
        '<option value="size"' + sel('size', pre.mode) + '>Élèves par groupe</option></select></label>' +
        '<label class="field"><span>Combien</span><input type="number" name="n" min="1" max="12" value="' + defaut + '"></label>' +
        '</div>' +
        '<label class="field"><span>Niveau</span><select name="niveau">' +
        '<option value="1"' + sel('1', nivPre) + '>Par niveau — ' +
        (ligues ? 'Ligue 1 pour les plus à l\'aise' : 'des rencontres serrées') + '</option>' +
        '<option value="0"' + sel('0', nivPre) + '>Peu importe — chaque groupe ressemble à la classe</option>' +
        '</select></label>' +
        '<label class="field"><span>Sexe</span><select name="mixite">' +
        '<option value="libre"' + sel('libre', mixPre) + '>Peu importe</option>' +
        '<option value="nonmixte"' + sel('nonmixte', mixPre) + '>Groupes non mixtes — filles entre elles, garçons entre eux</option>' +
        '<option value="equilibre"' + sel('equilibre', mixPre) + '>Mixité équilibrée — filles et garçons dans chaque groupe</option>' +
        '</select></label>' +
        '<p class="tiny muted" style="margin-top:6px">L\'application garde au moins ' + MIN_GROUPE +
        ' élèves par groupe : si ton découpage donnait des duos, elle réduit le nombre de groupes ' +
        'et te le dit. Tu pourras toujours remodeler à la main ensuite.</p>' +
        '<label class="inline" style="display:flex;margin-top:8px"><input type="checkbox" name="plan" checked> ' +
        'Générer les rencontres dans la foulée</label>',
      onOk: function (d) {
        var quoi = d.querySelector('[name=quoi]').value;
        var n = +d.querySelector('[name=n]').value || 2;
        var nivSel = d.querySelector('[name=niveau]');
        var mixSel = d.querySelector('[name=mixite]');
        var plan = d.querySelector('[name=plan]').checked;
        var res = null;
        A.set(function () {
          res = compose(l, {
            mode: quoi, count: n, size: n,
            niveau: !nivSel || nivSel.value === '1',
            mixite: mixSel ? mixSel.value : 'libre'
          });
          if (!res.error && plan) planifier(l);
        });
        if (res && res.error) { UI.toast(res.error); return false; }
        UI.toast(res.count + (ligues ? ' ligue(s) composée(s)' : ' poule(s) composée(s)') +
          (res.ajuste ? ' — ramené à ' + res.count + ' pour garder au moins ' + MIN_GROUPE +
            ' élèves par groupe.' : '.') +
          ((res.notes || []).length ? ' ' + res.notes.join(' ') : ''));
      }
    });
  }

  /* Remodeler les groupes à la main. L'application propose, l'enseignant
     dispose : il connaît des choses que les indices ignorent — une inimitié,
     un élève qui revient de blessure, deux qui progressent mieux ensemble.
     On touche un élève, puis le groupe où l'envoyer. */
  function editGroupes(l) {
    var cls = A.get().classes[l.classId];
    var ar = arenaOf(l);
    var ligues = ar.mode === 'ligues';
    var present = LESSON.presentStudents(l);
    var draft = JSON.parse(JSON.stringify(ar.groups || []));
    var picked = null;

    var placeDe = function (sid) {
      for (var i = 0; i < draft.length; i++) if (draft[i].members.indexOf(sid) > -1) return i;
      return -1;
    };
    var sansGroupe = function () {
      return present.filter(function (s2) { return placeDe(s2.id) === -1; });
    };

    var html = function () {
      var h = '<div class="grid cols-2">' + draft.map(function (g, gi) {
        return '<div class="card" style="margin:0;border-color:' + g.color + '" data-gzone="' + gi + '">' +
          '<div class="row tight" style="margin-bottom:6px">' +
          '<input data-gname="' + gi + '" value="' + e(g.name) + '" style="flex:1;font-weight:700">' +
          '<span class="badge' + (g.members.length < MIN_GROUPE ? ' warn' : '') + '">' +
          g.members.length + ' élève' + (g.members.length > 1 ? 's' : '') + '</span>' +
          '<button type="button" class="btn-sm btn-ghost" data-gdel="' + gi + '" title="Supprimer ce groupe">×</button>' +
          '</div>' +
          '<div class="row tight">' + g.members.map(function (sid) {
            return '<button type="button" class="btn-sm gchip' + (picked === sid ? ' btn-primary' : '') +
              '" data-gpick="' + sid + '">' + e(court(cls, sid)) + '</button>';
          }).join('') + '</div>' +
          (g.members.length < MIN_GROUPE
            ? '<p class="tiny muted" style="margin:6px 0 0">Moins de ' + MIN_GROUPE +
              ' élèves : peu de rencontres et beaucoup d\'attente.</p>'
            : '') +
          '</div>';
      }).join('') + '</div>';

      var libres = sansGroupe();
      h += '<div class="card" style="margin-top:10px' + (libres.length ? ';border-color:var(--warn)' : '') +
        '" data-gzone="-1"><b>Sans groupe</b>' +
        (libres.length
          ? '<div class="row tight" style="margin-top:6px">' + libres.map(function (s2) {
            return '<button type="button" class="btn-sm gchip' + (picked === s2.id ? ' btn-primary' : '') +
              '" data-gpick="' + s2.id + '">' + e(A.shortName(s2)) + '</button>';
          }).join('') + '</div>'
          : '<p class="tiny muted" style="margin:6px 0 0">Tout le monde est placé.</p>') +
        '</div>';
      return h;
    };

    UI.modal({
      title: ligues ? 'Composer les ligues à la main' : 'Composer les poules à la main',
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Deux gestes au choix : <b>touche un élève puis le groupe</b> où ' +
        'l\'envoyer, ou <b>reste appuyé sur un élève et fais-le glisser</b> jusqu\'au groupe. Les noms ' +
        'des groupes se modifient directement.' + (ligues
          ? ' L\'ordre des ligues va de la plus forte à la plus faible.'
          : '') + '</p>' +
        '<div id="gz">' + html() + '</div>' +
        '<div class="row tight" style="margin-top:10px">' +
        '<button type="button" class="btn-sm" id="gadd">Ajouter un groupe</button>' +
        '<button type="button" class="btn-sm" id="gequi">Répartir ceux qui restent</button>' +
        '</div>' +
        '<div id="gavert"></div>',
      onOpen: function (d) {
        var zone = d.querySelector('#gz');
        var avert = d.querySelector('#gavert');
        var refresh = function () {
          zone.innerHTML = html();
          var petits = draft.filter(function (g) { return g.members.length && g.members.length < MIN_GROUPE; }).length;
          avert.innerHTML = petits
            ? '<div class="notice">' + petits + ' groupe(s) de moins de ' + MIN_GROUPE + ' élèves. ' +
              'C\'est possible, mais chacun y jouera peu.</div>'
            : '';
          bind();
        };
        /* Deux gestes pour le même geste mental. Le clic-puis-clic marche
           partout, y compris à la souris et au clavier. Le glisser-déposer
           demande un appui d'un cinquième de seconde avant de s'armer : sans
           ce délai, le moindre effleurement en faisant défiler la liste
           emporterait un élève dans un autre groupe. À la souris, un
           déplacement franc suffit et le délai ne se sent pas. */
        var drag = null;
        var deplacer = function (sid, gi) {
          draft.forEach(function (g) {
            var k = g.members.indexOf(sid);
            if (k > -1) g.members.splice(k, 1);
          });
          if (gi >= 0 && draft[gi]) draft[gi].members.push(sid);
        };
        var zoneSous = function (x, y) {
          if (!drag) return null;
          drag.ghost.style.display = 'none';
          var sous = document.elementFromPoint(x, y);
          drag.ghost.style.display = '';
          return sous && sous.closest ? sous.closest('[data-gzone]') : null;
        };
        var suivre = function (x, y) {
          if (!drag) return;
          drag.ghost.style.left = x + 'px';
          drag.ghost.style.top = y + 'px';
          var sur = zoneSous(x, y);
          zone.querySelectorAll('.gzone-over').forEach(function (z) { z.classList.remove('gzone-over'); });
          if (sur) sur.classList.add('gzone-over');
        };
        var onMove = function (ev) {
          if (!drag) return;
          if (ev.cancelable) ev.preventDefault();
          suivre(ev.clientX, ev.clientY);
        };
        var onUp = function (ev) {
          if (!drag) return;
          var sur = zoneSous(ev.clientX, ev.clientY);
          var sid = drag.sid;
          if (drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          document.body.classList.remove('gdrag');
          drag = null;
          if (sur) { deplacer(sid, +sur.getAttribute('data-gzone')); picked = null; }
          else { picked = sid; }        // lâché dans le vide : l'élève reste sélectionné
          refresh();
        };
        var lancerDrag = function (sid, x, y) {
          var ghost = document.createElement('div');
          ghost.className = 'gghost';
          ghost.textContent = court(cls, sid);
          document.body.appendChild(ghost);
          document.body.classList.add('gdrag');
          drag = { sid: sid, ghost: ghost };
          picked = sid;
          if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) { /* sans importance */ } }
          suivre(x, y);
          document.addEventListener('pointermove', onMove, { passive: false });
          document.addEventListener('pointerup', onUp);
          document.addEventListener('pointercancel', onUp);
        };

        var bind = function () {
          zone.querySelectorAll('[data-gpick]').forEach(function (el) {
            var sid = el.getAttribute('data-gpick');
            el.addEventListener('click', function (ev) { ev.stopPropagation(); ev.preventDefault(); });
            el.addEventListener('pointerdown', function (ev) {
              if (ev.button > 0) return;
              ev.stopPropagation();
              var x0 = ev.clientX, y0 = ev.clientY, parti = false, minuteur = null;
              var demarrer = function () {
                if (parti || drag) return;
                parti = true;
                clearTimeout(minuteur);
                document.removeEventListener('pointermove', bouge);
                document.removeEventListener('pointerup', leve);
                lancerDrag(sid, x0, y0);
              };
              var bouge = function (e2) {
                if (!parti && Math.abs(e2.clientX - x0) + Math.abs(e2.clientY - y0) > 8) demarrer();
              };
              var leve = function () {
                clearTimeout(minuteur);
                document.removeEventListener('pointermove', bouge);
                document.removeEventListener('pointerup', leve);
                if (parti) return;
                picked = (picked === sid) ? null : sid;   // simple touche : sélection
                refresh();
              };
              minuteur = setTimeout(demarrer, 200);
              document.addEventListener('pointermove', bouge);
              document.addEventListener('pointerup', leve);
            });
          });
          zone.querySelectorAll('[data-gzone]').forEach(function (el) {
            el.addEventListener('click', function () {
              if (!picked || drag) return;
              deplacer(picked, +el.getAttribute('data-gzone'));
              picked = null;
              refresh();
            });
          });
          zone.querySelectorAll('[data-gname]').forEach(function (el) {
            el.addEventListener('input', function () { draft[+el.getAttribute('data-gname')].name = el.value; });
          });
          zone.querySelectorAll('[data-gdel]').forEach(function (el) {
            el.addEventListener('click', function (ev) {
              ev.stopPropagation();
              draft.splice(+el.getAttribute('data-gdel'), 1);
              picked = null;
              refresh();
            });
          });
        };
        d.querySelector('#gadd').addEventListener('click', function () {
          var i = draft.length;
          draft.push({
            id: A.uid('grp'),
            name: ligues ? ('Ligue ' + (i + 1)) : ('Poule ' + String.fromCharCode(65 + i)),
            color: A.TEAM_COLORS[i % A.TEAM_COLORS.length],
            members: []
          });
          refresh();
        });
        d.querySelector('#gequi').addEventListener('click', function () {
          var libres = sansGroupe().map(function (s2) { return s2.id; });
          if (!draft.length || !libres.length) { refresh(); return; }
          libres.forEach(function (sid) {
            var petit = draft.reduce(function (a, b) { return b.members.length < a.members.length ? b : a; });
            petit.members.push(sid);
          });
          refresh();
        });
        refresh();
      },
      onOk: function () {
        A.set(function () {
          var garde = draft.filter(function (g) { return g.members.length; });
          arenaOf(l).groups = garde;
          /* les rencontres qui opposaient des élèves désormais séparés
             n'auraient plus de sens : on ne garde que celles qui tiennent */
          var ar2 = arenaOf(l);
          ar2.matches = ar2.matches.filter(function (m) {
            if (m.defi) return true;
            var g = garde.filter(function (x) { return x.id === m.groupId; })[0];
            return g && g.members.indexOf(m.a) > -1 && g.members.indexOf(m.b) > -1;
          });
        });
        UI.toast('Groupes enregistrés.');
      }
    });
  }

  function editScore(l, matchId) {
    var cls = A.get().classes[l.classId];
    var m = arenaOf(l).matches.filter(function (x) { return x.id === matchId; })[0];
    if (!m) return;
    var f = format();
    var champs = champsActifs(l);
    var bonus = bonusDe(l);
    var val = function (sid, cid) {
      var st2 = (m.stats || {})[sid] || {};
      return st2[cid] == null ? '' : st2[cid];
    };
    var colonne = function (sid, cle, score) {
      return '<div><label class="field"><span>' + e(nom(cls, sid)) + '</span>' +
        '<input type="number" name="' + cle + '" min="0" inputmode="numeric" ' +
        'style="font-size:1.3rem;min-height:56px" value="' + (score == null ? '' : score) + '"></label>' +
        champs.map(function (c) {
          var cr = c.crit ? A.critById(c.crit) : null;
          return '<label class="field" style="margin-top:6px"><span class="tiny">' + e(c.label) +
            (+c.points > 0 ? ' · ' + c.points + ' pt' : '') +
            (cr ? ' · ' + e(cr.short || cr.name) : '') + '</span>' +
            '<input type="number" min="0" data-st="' + sid + '" data-f="' + c.id + '" value="' + val(sid, c.id) + '"></label>';
        }).join('') +
        bonus.map(function (b) {
          return '<label class="field" style="margin-top:6px"><span class="tiny">★ ' + e(b.name) +
            ' · ' + b.points + ' pt' + (b.points > 1 ? 's' : '') + '</span>' +
            '<input type="number" min="0" data-st="' + sid + '" data-f="' + b.id + '" data-bonus="1" value="' +
            val(sid, b.id) + '"></label>';
        }).join('') + '</div>';
    };

    UI.modal({
      title: 'Score — ' + nom(cls, m.a) + ' contre ' + nom(cls, m.b),
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Rencontre en ' + f.points + ' points' +
        (f.ecart > 1 ? ' avec ' + f.ecart + ' d\'écart' : '') + '. Tu peux saisir n\'importe quel score : ' +
        'c\'est un repère, pas une règle.</p>' +
        '<div class="grid cols-2">' + colonne(m.a, 'a', m.scoreA) + colonne(m.b, 'b', m.scoreB) + '</div>' +
        (champs.length || bonus.length
          ? '<p class="tiny muted" style="margin-top:6px">Les relevés sous le score sont facultatifs : ' +
            'remplis-les si tu as observé la rencontre, laisse-les vides sinon. Ils alimentent les ' +
            'critères auxquels tu les as reliés ; le score, lui, alimente l\'indice global. ' +
            'Ici le score est celui que tu saisis — sur la tablette, le bouton bonus ajoute ses points tout seul.</p>'
          : ''),
      onOk: function (d) {
        var a = d.querySelector('[name=a]').value, b = d.querySelector('[name=b]').value;
        if (a === '' || b === '') { UI.toast('Saisis les deux scores.'); return false; }
        var releves = {};
        d.querySelectorAll('[data-st]').forEach(function (inp) {
          if (inp.value === '' || !isFinite(+inp.value)) return;
          var sid = inp.getAttribute('data-st');
          releves[sid] = releves[sid] || {};
          releves[sid][inp.getAttribute('data-f')] = Math.max(0, +inp.value);
        });
        var res = null;
        A.set(function () {
          res = enregistrer(l, matchId, a, b);
          if (res && res.match) {
            if (Object.keys(releves).length) res.match.stats = releves;
            else delete res.match.stats;
          }
        });
        UI.toast(res && res.echelleModifiee ? 'Score enregistré — l\'échelle a changé.' : 'Score enregistré.');
      }
    });
  }

  /* Choisir ce qu'on observe pendant les rencontres, et ce qui rapporte des
     points en plus. Deux listes, sur le modèle des relevés de match. */
  function editReleves(l) {
    var conf = configOf(l);
    var crits = A.criteria(A.apsaById(l.classId, l.apsaId) || undefined);
    var optCrit = function (sel) {
      return '<option value="">— aucun —</option>' + crits.map(function (c) {
        return '<option value="' + c.id + '"' + (sel === c.id ? ' selected' : '') + '>' + e(c.name) + '</option>';
      }).join('');
    };
    var ligneChamp = function (f, i) {
      return '<tr><td><label class="inline"><input type="checkbox" data-fon="' + i + '"' +
        (f.on !== false ? ' checked' : '') + '></label></td>' +
        '<td><input data-fk="label" data-i="' + i + '" value="' + e(f.label) + '"></td>' +
        '<td><input type="number" min="0" max="10" style="max-width:70px" data-fk="points" data-i="' + i + '" value="' +
        (+f.points || 0) + '"></td>' +
        '<td><select data-fk="crit" data-i="' + i + '">' + optCrit(f.crit) + '</select></td>' +
        '<td class="num">' + (f.fixed ? '' : '<button class="btn-sm btn-ghost" data-frm="' + i + '">×</button>') + '</td></tr>';
    };
    var ligneBonus = function (b, i) {
      return '<tr><td><input data-bk="name" data-i="' + i + '" value="' + e(b.name) + '"></td>' +
        '<td><input data-bk="desc" data-i="' + i + '" value="' + e(b.desc || '') + '" placeholder="quand l\'accorder"></td>' +
        '<td><input type="number" min="1" max="20" style="max-width:70px" data-bk="points" data-i="' + i + '" value="' +
        (+b.points || 1) + '"></td>' +
        '<td class="num"><button class="btn-sm btn-ghost" data-brm="' + i + '">×</button></td></tr>';
    };

    UI.modal({
      title: 'Relevés et bonus des rencontres',
      okLabel: 'Enregistrer',
      body: '<p class="small muted">Ce qu\'on observe pendant une rencontre, et ce qui vaut des points ' +
        'en plus. Tout est propre à cette leçon : une séance centrée sur le jeu au filet ne relève pas ' +
        'la même chose qu\'une séance sur le service.</p>' +
        '<h4>Critères observés</h4>' +
        '<p class="tiny muted">Un compteur relié à un critère alimente l\'indice de l\'élève ; sans critère, ' +
        'il reste un simple comptage. Des points au compteur, et chaque unité s\'ajoute au score sur la tablette.</p>' +
        '<div class="table-wrap"><table class="compact" id="aw"><thead><tr>' +
        '<th>Relevé</th><th>Nom</th><th class="num">Points</th><th>Critère alimenté</th><th></th>' +
        '</tr></thead><tbody id="awb">' + conf.fields.map(ligneChamp).join('') + '</tbody></table></div>' +
        '<button type="button" class="btn-sm" id="addf">Ajouter un relevé</button>' +
        '<h4 style="margin-top:16px">Actions bonus</h4>' +
        '<p class="tiny muted">« Smash gagnant après déplacement = 2 points ». Sur la tablette, le bouton ' +
        'ambré ajoute directement ses points au score.</p>' +
        '<div class="table-wrap"><table class="compact" id="bw"><thead><tr>' +
        '<th>Action</th><th>Précision</th><th class="num">Points</th><th></th>' +
        '</tr></thead><tbody id="bwb">' + conf.bonuses.map(ligneBonus).join('') + '</tbody></table></div>' +
        '<button type="button" class="btn-sm" id="addb">Ajouter un bonus</button>',
      onOpen: function (d) {
        var draft = JSON.parse(JSON.stringify(conf));
        var refresh = function () {
          d.querySelector('#awb').innerHTML = draft.fields.map(ligneChamp).join('');
          d.querySelector('#bwb').innerHTML = draft.bonuses.map(ligneBonus).join('');
          bind();
        };
        var bind = function () {
          d.querySelectorAll('[data-fon]').forEach(function (el) {
            el.addEventListener('change', function () { draft.fields[+el.getAttribute('data-fon')].on = el.checked; });
          });
          d.querySelectorAll('[data-fk]').forEach(function (el) {
            el.addEventListener('input', function () {
              var f = draft.fields[+el.getAttribute('data-i')], k = el.getAttribute('data-fk');
              f[k] = k === 'points' ? Math.max(0, +el.value || 0) : el.value;
            });
            el.addEventListener('change', function () {
              var f = draft.fields[+el.getAttribute('data-i')], k = el.getAttribute('data-fk');
              f[k] = k === 'points' ? Math.max(0, +el.value || 0) : el.value;
            });
          });
          d.querySelectorAll('[data-frm]').forEach(function (el) {
            el.addEventListener('click', function () {
              draft.fields.splice(+el.getAttribute('data-frm'), 1); refresh();
            });
          });
          d.querySelectorAll('[data-bk]').forEach(function (el) {
            el.addEventListener('input', function () {
              var b = draft.bonuses[+el.getAttribute('data-i')], k = el.getAttribute('data-bk');
              b[k] = k === 'points' ? Math.max(1, +el.value || 1) : el.value;
            });
          });
          d.querySelectorAll('[data-brm]').forEach(function (el) {
            el.addEventListener('click', function () {
              draft.bonuses.splice(+el.getAttribute('data-brm'), 1); refresh();
            });
          });
        };
        d.querySelector('#addf').addEventListener('click', function () {
          draft.fields.push({ id: A.uid('rel'), label: 'Nouveau relevé', short: 'NEW', on: true, points: 0, crit: '' });
          refresh();
        });
        d.querySelector('#addb').addEventListener('click', function () {
          draft.bonuses.push({ id: A.uid('bon'), name: 'Action valorisée', desc: '', points: 2 });
          refresh();
        });
        bind();
        d.__draft = function () { return draft; };
      },
      onOk: function (d) {
        var draft = d.__draft();
        A.set(function () {
          var c = configOf(l);
          c.fields = draft.fields.filter(function (f) { return (f.label || '').trim(); });
          c.bonuses = draft.bonuses.filter(function (b) { return (b.name || '').trim() && +b.points; });
        });
        UI.toast('Relevés enregistrés.');
      }
    });
  }

  function editAdd(l, gid) {
    var cls = A.get().classes[l.classId];
    var g = groupById(l, gid);
    var ids = g ? g.members : LESSON.presentStudents(l).map(function (s) { return s.id; });
    if (ids.length < 2) { UI.toast('Il faut deux élèves.'); return; }
    var opts = ids.map(function (sid) {
      return '<option value="' + sid + '">' + e(nom(cls, sid)) + '</option>';
    }).join('');
    UI.modal({
      title: 'Ajouter une rencontre' + (g ? ' — ' + g.name : ''),
      okLabel: 'Ajouter',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Premier élève</span><select name="a">' + opts + '</select></label>' +
        '<label class="field"><span>Second élève</span><select name="b">' + opts + '</select></label></div>',
      onOpen: function (d) {
        var sb = d.querySelector('[name=b]');
        if (sb.options.length > 1) sb.selectedIndex = 1;
      },
      onOk: function (d) {
        var a = d.querySelector('[name=a]').value, b = d.querySelector('[name=b]').value;
        if (a === b) { UI.toast('Choisis deux élèves différents.'); return false; }
        A.set(function () {
          arenaOf(l).matches.push({
            id: A.uid('ren'), groupId: gid || null, a: a, b: b,
            scoreA: null, scoreB: null, tour: null, terrain: null, defi: !gid
          });
        });
      }
    });
  }

  function editDefi(l) {
    var cls = A.get().classes[l.classId];
    var ech = echelle(l);
    if (ech.length < 2) { UI.toast('Il faut au moins deux élèves présents.'); return; }
    var opts = ech.map(function (sid, i) {
      return '<option value="' + sid + '">' + (i + 1) + '. ' + e(nom(cls, sid)) + '</option>';
    }).join('');
    UI.modal({
      title: 'Lancer un défi',
      okLabel: 'Lancer',
      body: '<label class="field"><span>Qui défie ?</span><select name="a">' + opts + '</select></label>' +
        '<label class="field"><span>Adversaire</span><select name="b"></select></label>' +
        '<div id="avert"></div>',
      onOpen: function (d) {
        var sa = d.querySelector('[name=a]'), sb = d.querySelector('[name=b]');
        var maj = function () {
          var possibles = adversairesPossibles(l, sa.value);
          sb.innerHTML = possibles.map(function (sid) {
            return '<option value="' + sid + '">' + (ech.indexOf(sid) + 1) + '. ' + e(nom(cls, sid)) + '</option>';
          }).join('');
          d.querySelector('#avert').innerHTML = possibles.length
            ? ''
            : '<div class="notice bad">Aucun adversaire possible pour cet élève avec les règles actuelles.</div>';
        };
        sa.addEventListener('change', maj); maj();
      },
      onOk: function (d) {
        var a = d.querySelector('[name=a]').value, b = d.querySelector('[name=b]').value;
        if (!b) { UI.toast('Aucun adversaire possible.'); return false; }
        A.set(function () { lancerDefi(l, a, b); });
      }
    });
  }

  return {
    MODES: MODES, REGLES_DEFAUT: REGLES_DEFAUT,
    arenaOf: arenaOf, regles: regles, terrainsOf: terrainsOf, format: format,
    compose: compose, planifier: planifier, rondes: rondes, relancer: relancer,
    editRelance: editRelance, enReserve: enReserve, croiser: croiser, aFini: aFini,
    enchainConfig: enchainConfig, partenairesLibres: partenairesLibres,
    enchainer: enchainer, supplementsDe: supplementsDe, stades: stades,
    classement: classement, echelle: echelle, rangDe: rangDe,
    adversairesPossibles: adversairesPossibles, peutDefier: peutDefier,
    lancerDefi: lancerDefi, enregistrer: enregistrer, appliquerEchelle: appliquerEchelle,
    bouger: bouger, propositions: propositions, setMode: setMode,
    pointsDefi: pointsDefi, classementDefis: classementDefis,
    groupById: groupById, groupOf: groupOf, defisDe: defisDe, dejaRencontre: dejaRencontre,
    fairRow: fairRow, toggleFair: toggleFair, editFairplay: editFairplay, fairCrit: fairCrit,
    view: view, editCompose: editCompose, editRegles: editRegles,
    configOf: configOf, champsActifs: champsActifs, bonusDe: bonusDe, editReleves: editReleves,
    editGroupes: editGroupes, MIN_GROUPE: MIN_GROUPE,
    editScore: editScore, editAdd: editAdd, editDefi: editDefi
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — dossier de séquence, à imprimer ou à enregistrer en PDF

   Tout ce qu'il faut avoir sous les yeux pour rédiger ses appréciations, sur
   papier ou dans un PDF : la séquence leçon par leçon, les indices de chaque
   élève, les notes de la grille, et une place laissée vide pour écrire.

   L'application n'écrit pas les appréciations : ce n'est pas son travail.
   Elle rassemble ce qu'elle sait et laisse le cadre libre.

   Techniquement : une page complète est posée par-dessus l'application, et la
   feuille de style d'impression masque tout le reste. Pas de bibliothèque PDF —
   c'est « Imprimer → Enregistrer au format PDF » du navigateur qui produit le
   fichier, et cela fonctionne hors ligne comme sur une tablette.
   ========================================================================== */
'use strict';

var DOSSIER = (function () {

  var A = APP, e = APP.escapeHtml;

  function close() {
    var el = document.getElementById('dossier');
    if (el) el.remove();
    document.body.classList.remove('kiosk');
  }

  function frDate(d) { return A.frDate ? A.frDate(d) : d; }

  /* ------------------------------------------------------- morceaux du dossier */

  function entete(cls, apsa, lecons) {
    var act = A.activiteById(apsa ? apsa.activite : null);
    var d1 = lecons.length ? frDate(lecons[0].date) : '—';
    var d2 = lecons.length ? frDate(lecons[lecons.length - 1].date) : '—';
    return '<header class="dos-head">' +
      '<h1>' + e(cls.name) + ' — ' + e(apsa ? apsa.name : 'Sans APSA') + '</h1>' +
      '<p class="dos-sub">' + e(act.name) + ' · ' +
      (act.famille === 'duel' ? 'activité de duel' : 'activité collective') + ' · ' +
      e(A.cycleById(A.cycleOf(cls.id)).name) + ' · ' +
      lecons.length + ' leçon' + (lecons.length > 1 ? 's' : '') + ' du ' + e(d1) + ' au ' + e(d2) +
      ' · ' + cls.students.length + ' élèves</p>' +
      '<p class="dos-sub tiny">Dossier édité le ' + new Date().toLocaleDateString('fr-FR') +
      ' — les appréciations restent à écrire à la main.</p>' +
      '</header>';
  }

  /* Vue d'ensemble : une ligne par élève, tout ce que l'application sait. */
  function tableauIndices(cls, apsa, lecons, r, grid) {
    var crits = A.criteria(apsa || undefined);
    var notes = {};
    if (grid) {
      lecons.forEach(function (l) {
        var t = (l.evaluation && l.evaluation.teacher) || {};
        Object.keys(t).forEach(function (sid) {
          var n = EVAL.noteOf(grid, t[sid]);
          if (n != null) notes[sid] = n;
        });
      });
    }
    var presences = {};
    cls.students.forEach(function (s) { presences[s.id] = { p: 0, a: 0, b: 0 }; });
    lecons.forEach(function (l) {
      cls.students.forEach(function (s) {
        var st = (l.attendance || {})[s.id] || 'present';
        if (st === 'absent') presences[s.id].a++;
        else if (st === 'injured') presences[s.id].b++;
        else presences[s.id].p++;
      });
    });

    var h = '<section class="dos-sec"><h2>Vue d\'ensemble</h2>' +
      '<table class="dos-table"><thead><tr>' +
      '<th>Élève</th><th class="num">Présences</th>' +
      crits.map(function (c) { return '<th class="num">' + e(c.short || c.name) + '</th>'; }).join('') +
      '<th class="num">Indice</th><th class="num">Obs.</th><th>Fiabilité</th>' +
      (grid ? '<th class="num">Note /' + grid.scale + '</th>' : '') +
      '</tr></thead><tbody>';

    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var rs = r.byStudent[s.id];
      var pr = presences[s.id];
      h += '<tr><td class="nom">' + e(A.displayName(s)) + '</td>' +
        '<td class="num tiny">' + pr.p + 'P' + (pr.a ? ' · ' + pr.a + 'A' : '') + (pr.b ? ' · ' + pr.b + 'B' : '') + '</td>' +
        crits.map(function (c) {
          var v = rs ? RATINGS.critDisplay(r, s.id, c.id) : null;
          return '<td class="num">' + (v == null ? '–' : v.toFixed(1)) + '</td>';
        }).join('') +
        '<td class="num"><b>' + (rs && rs.global.n ? rs.index.toFixed(1) : '–') + '</b></td>' +
        '<td class="num">' + (rs ? rs.global.n : 0) + '</td>' +
        '<td class="tiny">' + (rs && rs.reliability ? e(rs.reliability.level) : '') + '</td>' +
        (grid ? '<td class="num">' + (notes[s.id] != null ? A.round(notes[s.id], 1) : '–') + '</td>' : '') +
        '</tr>';
    });
    return h + '</tbody></table>' +
      '<p class="tiny">P = présent, A = absent, B = blessé ou dispensé. Un indice de 5 signifie ' +
      '« dans la moyenne de la classe sur ce cycle » ; une fiabilité faible veut dire peu ' +
      'd\'observations, donc peu de sens.</p></section>';
  }

  /* Le détail, leçon par leçon : ce qui a été fait, et ce qui en est sorti. */
  function detailLecons(cls, apsa, lecons) {
    var duel = A.estDuel(apsa || undefined);
    var h = '<section class="dos-sec dos-break"><h2>Déroulement de la séquence</h2>';
    if (!lecons.length) return h + '<p>Aucune leçon dans ce cycle.</p></section>';

    lecons.forEach(function (l) {
      var present = LESSON.presentStudents(l);
      var ech = TRAINING.ofKind(l, 'echauffement');
      var sit = TRAINING.ofKind(l, 'apprentissage');
      h += '<article class="dos-lecon"><h3>' + e(l.title) + ' — ' + e(frDate(l.date)) + '</h3>' +
        (l.objective ? '<p class="dos-obj">' + e(l.objective) + '</p>' : '') +
        '<p class="tiny">' + present.length + ' présents sur ' + cls.students.length + '</p>';

      var fiche = function (s) {
        var fmt = TRAINING.formatOf(s);
        var n = (s.attempts || []).length;
        var duels = (s.duels || []).filter(function (d) { return d.scoreA != null; }).length;
        return '<li><b>' + e(s.name) + '</b> <span class="tiny">(' +
          (fmt === 'match' ? 'confrontation' : (fmt === 'coop' ? 'co-frontation' : 'paliers')) + ')</span>' +
          (s.consigne ? ' — ' + e(s.consigne) : '') +
          ' <span class="tiny">' +
          (fmt === 'match' ? duels + ' opposition(s) jouée(s)' : n + ' relevé(s)') + '</span></li>';
      };
      if (ech.length) h += '<p class="dos-part">Échauffement</p><ul>' + ech.map(fiche).join('') + '</ul>';
      if (sit.length) h += '<p class="dos-part">Situations</p><ul>' + sit.map(fiche).join('') + '</ul>';

      if (duel) {
        var ar = ARENA.arenaOf(l);
        var joues = ar.matches.filter(function (m) { return m.scoreA != null; }).length;
        h += '<p class="dos-part">Rencontres — ' +
          (ar.mode === 'defis' ? 'défis' : (ar.mode === 'ligues' ? 'ligues' : 'poules')) +
          ' · ' + joues + ' / ' + ar.matches.length + ' jouées</p>';
        if (ar.mode === 'defis') {
          var ech2 = ARENA.echelle(l);
          h += '<p class="tiny">Échelle finale : ' + ech2.map(function (sid, i) {
            var s2 = A.studentById(cls.id, sid);
            return (i + 1) + '. ' + e(s2 ? A.shortName(s2) : sid);
          }).join(' · ') + '</p>';
        } else {
          ar.groups.forEach(function (g) {
            var cl = ARENA.classement(l, g.id).filter(function (p) { return p.joues; });
            if (!cl.length) return;
            h += '<p class="tiny"><b>' + e(g.name) + '</b> : ' + cl.map(function (p, i) {
              return (i + 1) + '. ' + e(p.court) + ' (' + p.pts + ' pts)';
            }).join(' · ') + '</p>';
          });
        }
        var arb = {};
        ar.matches.forEach(function (m) {
          (m.arbitres || []).forEach(function (sid) { arb[sid] = (arb[sid] || 0) + 1; });
        });
        var nomsArb = Object.keys(arb).map(function (sid) {
          var s2 = A.studentById(cls.id, sid);
          return (s2 ? A.shortName(s2) : sid) + ' (' + arb[sid] + ')';
        });
        if (nomsArb.length) h += '<p class="tiny">Arbitrages déclarés : ' + e(nomsArb.join(', ')) + '</p>';
      } else if ((l.matches || []).length) {
        var joues2 = l.matches.filter(function (m) { return m.scoreA != null; }).length;
        h += '<p class="dos-part">Matchs — ' + joues2 + ' / ' + l.matches.length + ' joués, ' +
          (l.teams || []).length + ' équipes</p>';
        /* les rôles tenus : c'est souvent là que se lit l'engagement d'un élève
           qui ne brille pas balle en main */
        var roles = {};
        l.matches.forEach(function (m) {
          ['central', 'touche', 'obs'].forEach(function (k) {
            ((m.roles || {})[k] || []).forEach(function (sid) {
              roles[sid] = roles[sid] || {};
              roles[sid][k] = (roles[sid][k] || 0) + 1;
            });
          });
        });
        var appreciations = {};
        l.matches.forEach(function (m) {
          var q = (m.roles || {}).qualite || {};
          Object.keys(q).forEach(function (sid) {
            appreciations[sid] = appreciations[sid] || { plus: 0, minus: 0 };
            if (q[sid] === 'plus') appreciations[sid].plus++;
            else if (q[sid] === 'minus') appreciations[sid].minus++;
          });
        });
        var libelle = { central: 'arbitre central', touche: 'touche', obs: 'observateur' };
        var nomsRoles = Object.keys(roles).map(function (sid) {
          var s2 = A.studentById(cls.id, sid);
          var detail = Object.keys(roles[sid]).map(function (k) {
            return libelle[k] + (roles[sid][k] > 1 ? ' ×' + roles[sid][k] : '');
          }).join(', ');
          var ap = appreciations[sid];
          var marque = ap ? (ap.plus ? ' +'.repeat(1) + (ap.plus > 1 ? '×' + ap.plus : '') : '') +
            (ap.minus ? ' −' + (ap.minus > 1 ? '×' + ap.minus : '') : '') : '';
          return (s2 ? A.shortName(s2) : sid) + ' (' + detail + ')' + marque;
        });
        if (nomsRoles.length) {
          h += '<p class="tiny">Arbitrage et observation : ' + e(nomsRoles.join(' · ')) + '</p>';
        }
      }
      h += '</article>';
    });
    return h + '</section>';
  }

  /* L'évaluation : la grille, ce qu'elle atteste, et les notes. */
  function sectionEval(cls, apsa, lecons, r) {
    var grid = null, lecon = null;
    lecons.slice().reverse().some(function (l) {
      var g = l.evaluation && l.evaluation.gridId ? A.get().grids[l.evaluation.gridId] : null;
      if (g) { grid = g; lecon = l; return true; }
      return false;
    });
    if (!grid) {
      return '<section class="dos-sec dos-break"><h2>Évaluation</h2>' +
        '<p>Aucune grille n\'a encore été choisie pour ce cycle.</p></section>';
    }

    var h = '<section class="dos-sec dos-break"><h2>Évaluation — ' + e(grid.name) + '</h2>' +
      '<table class="dos-table"><thead><tr><th>Item</th><th>Rattaché à</th>' +
      '<th class="num">Coef.</th><th>Attendus de fin de cycle</th></tr></thead><tbody>' +
      grid.items.map(function (it) {
        var cr = A.critById(it.critId, apsa || undefined);
        var quoi = cr ? cr.name : (EVAL.SPECIAL[it.critId] || '—');
        var afc = (it.afcIds || []).map(function (id) {
          var a = A.afcById(id);
          return a ? ((a.code ? a.code + ' · ' : '') + a.texte) : '';
        }).filter(Boolean);
        return '<tr><td>' + e(it.label) + '</td><td class="tiny">' + e(quoi) + '</td>' +
          '<td class="num">' + it.coef + '</td>' +
          '<td class="tiny">' + (afc.length ? e(afc.join(' ; ')) : '—') + '</td></tr>';
      }).join('') + '</tbody></table>';

    /* Les niveaux rédigés item par item : c'est ce qu'on relit pour écrire une
       appréciation qui dise quelque chose de précis. */
    var rediges = grid.items.filter(function (it) { return EVAL.aDesDesc(it); });
    if (rediges.length) {
      h += '<h3>Niveaux de maîtrise, item par item</h3>' +
        '<table class="dos-table"><thead><tr><th>Item</th>' +
        grid.levels.map(function (lv) { return '<th class="tiny">' + e(lv.label) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        rediges.map(function (it) {
          return '<tr><td class="tiny"><b>' + e(it.label) + '</b></td>' +
            grid.levels.map(function (lv, i) {
              return '<td class="tiny niv-texte">' + e(EVAL.descOf(grid, it, i)) + '</td>';
            }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
    }

    var marks = (lecon.evaluation && lecon.evaluation.teacher) || {};
    h += '<h3>Niveaux et notes</h3><table class="dos-table"><thead><tr><th>Élève</th>' +
      grid.items.map(function (it) { return '<th class="tiny">' + e(it.label) + '</th>'; }).join('') +
      '<th class="num">Note /' + grid.scale + '</th></tr></thead><tbody>';
    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var m = marks[s.id] || {};
      var note = EVAL.noteOf(grid, m);
      h += '<tr><td class="nom">' + e(A.displayName(s)) + '</td>' +
        grid.items.map(function (it) {
          var lv = m[it.id];
          return '<td class="tiny">' + (lv == null ? '–' : e(grid.levels[lv] ? grid.levels[lv].label : String(lv))) + '</td>';
        }).join('') +
        '<td class="num"><b>' + (note == null ? '–' : A.round(note, 1)) + '</b></td></tr>';
    });
    return h + '</tbody></table></section>';
  }

  /* La page qu'on remplit à la main : chiffres à gauche, place à droite. */
  function pageAppreciations(cls, apsa, r, grid, lecons) {
    var crits = A.criteria(apsa || undefined);
    var notes = {};
    if (grid) {
      lecons.forEach(function (l) {
        var t = (l.evaluation && l.evaluation.teacher) || {};
        Object.keys(t).forEach(function (sid) {
          var n = EVAL.noteOf(grid, t[sid]);
          if (n != null) notes[sid] = n;
        });
      });
    }
    var h = '<section class="dos-sec dos-break"><h2>Appréciations</h2>' +
      '<p class="tiny">Une ligne par élève : ce que l\'application a mesuré, et la place pour écrire.</p>';
    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var rs = r.byStudent[s.id];
      var pts = crits.map(function (c) {
        var v = rs ? RATINGS.critDisplay(r, s.id, c.id) : null;
        return e(c.short || c.name) + ' ' + (v == null ? '–' : v.toFixed(1));
      }).join(' · ');
      h += '<div class="dos-appr"><div class="dos-appr-head">' +
        '<b>' + e(A.displayName(s)) + '</b>' +
        '<span class="tiny">' + pts + ' · indice ' +
        (rs && rs.global.n ? rs.index.toFixed(1) : '–') +
        (grid && notes[s.id] != null ? ' · note ' + A.round(notes[s.id], 1) : '') + '</span>' +
        '</div><div class="dos-appr-box"></div></div>';
    });
    return h + '</section>';
  }

  /* ------------------------------------------------------------------ ouvrir */

  function open() {
    var cls = A.currentClass();
    if (!cls) { UI.toast('Ouvre une classe d\'abord.'); return; }
    var apsa = A.currentApsa(cls.id);
    var lecons = A.classLessons(cls.id, apsa ? apsa.id : null);
    var r = RATINGS.compute(cls.id, apsa ? apsa.id : null);
    var grid = null;
    lecons.slice().reverse().some(function (l) {
      var g = l.evaluation && l.evaluation.gridId ? A.get().grids[l.evaluation.gridId] : null;
      if (g) { grid = g; return true; }
      return false;
    });

    var h = '<div class="dos-bar no-print">' +
      '<button class="btn-lg btn-primary" data-act="dossier.print">Imprimer / Enregistrer en PDF</button>' +
      '<button class="btn-lg" data-act="dossier.close">Fermer</button>' +
      '<span class="small muted">Dans la fenêtre d\'impression, choisis « Enregistrer au format PDF ».</span>' +
      '</div>' +
      '<div class="dos-page">' +
      entete(cls, apsa, lecons) +
      tableauIndices(cls, apsa, lecons, r, grid) +
      detailLecons(cls, apsa, lecons) +
      sectionEval(cls, apsa, lecons, r) +
      pageAppreciations(cls, apsa, r, grid, lecons) +
      '</div>';

    close();
    var wrap = document.createElement('div');
    wrap.className = 'kiosk-root';
    wrap.id = 'dossier';
    wrap.innerHTML = h;
    document.body.appendChild(wrap);
  }

  return { open: open, close: close };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — vues de leçon : présences, composition des équipes, matchs
   ========================================================================== */
'use strict';

var LESSON = (function () {

  var A = APP, e = APP.escapeHtml;

  /* L'appel d'abord, puis les trois entrées possibles de la séance. */
  /* Les onglets suivent la famille de l'APSA : on ne montre pas des équipes et
     un tournoi à un cycle de badminton, ni une échelle de défis à un cycle de
     handball. En duel (raquettes, sports de combat), les affrontements
     s'appellent des RENCONTRES ; avec un ballon, ce sont des MATCHS. */
  function tabsFor(l) {
    var duel = A.estDuel(l ? A.apsaById(l.classId, l.apsaId) : undefined);
    var t = [{ k: 'presence', l: '1. Présences' }];
    if (!duel) t.push({ k: 'teams', l: 'Équipes' });
    t.push({ k: 'warmup', l: 'Échauffement' });
