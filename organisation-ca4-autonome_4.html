<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Poules, ligues et défis en CA4 — badminton, tennis de table, escrime. Collège Louis Pasteur, Villemomble.">
<meta name="theme-color" content="#f7f9fb">
<title>Organisation CA4 — Collège Louis Pasteur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%232f6fb3' stroke-width='9'/><circle cx='50' cy='50' r='16' fill='%232f6fb3'/></svg>">
<style>
/* Ultimate EPS — feuille de style
   Pensée pour une utilisation debout, en gymnase, sur tablette :
   cibles tactiles larges, contrastes élevés, peu de couleurs. */

:root {
  --bg: #f7f9fb;
  --surface: #ffffff;
  --surface-2: #f1f4f8;
  --border: #e3e9f0;
  --text: #1e2a38;
  --text-soft: #6b7a8c;
  --accent: #2f6fb3;
  --accent-soft: #eaf2fb;
  --ok: #2b8a6a;
  --ok-soft: #e9f6f1;
  --warn: #b07a1e;
  --warn-soft: #fcf4e4;
  --bad: #c15550;
  --bad-soft: #fbeeed;
  --ok-ink: #1d4a3a;
  --warn-ink: #6b4708;
  --bad-ink: #7d2f2b;
  --kiosk: #7a4fa3;
  --bonus: #c08a2e;
  --bonus-soft: #fbf1dc;
  --bonus-ink: #7a5410;
  --radius: 10px;
  --tap: 44px;
  --shadow: 0 1px 2px rgba(30, 42, 56, .04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c;
    --surface: #1a2029;
    --surface-2: #222a35;
    --border: #333d4b;
    --text: #e8edf4;
    --text-soft: #9aa7b8;
    --accent: #5b9dff;
    --accent-soft: #1c2a40;
    --ok: #4ec98d;
    --ok-soft: #16301f;
    --warn: #e0a44a;
    --warn-soft: #332713;
    --bad: #f07a6b;
    --bad-soft: #3a1c19;
    --ok-ink: #d7f5e6;
    --warn-ink: #f6e2bd;
    --bad-ink: #fbdcd7;
    --kiosk: #a07cc9;
    --bonus: #e0b25a;
    --bonus-soft: #3a2d12;
    --bonus-ink: #f7e3bb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --bg: #12161c;
  --surface: #1a2029;
  --surface-2: #222a35;
  --border: #333d4b;
  --text: #e8edf4;
  --text-soft: #9aa7b8;
  --accent: #5b9dff;
  --accent-soft: #1c2a40;
  --ok: #4ec98d;
  --ok-soft: #16301f;
  --warn: #e0a44a;
  --warn-soft: #332713;
  --bad: #f07a6b;
  --bad-soft: #3a1c19;
  --ok-ink: #d7f5e6;
  --warn-ink: #f6e2bd;
  --bad-ink: #fbdcd7;
  --kiosk: #a07cc9;
  --bonus: #e0b25a;
  --bonus-soft: #3a2d12;
  --bonus-ink: #f7e3bb;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; font-weight: 650; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
h4 { font-size: .92rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }

/* ---------- Mise en page ---------- */

#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: .6rem;
  padding: .5rem max(12px, env(safe-area-inset-left)) .5rem max(12px, env(safe-area-inset-right));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.brand {
  font-weight: 700; font-size: .95rem; line-height: 1.15;
  letter-spacing: -.005em; white-space: nowrap;
  padding-left: 10px; margin-right: .5rem;
  border-left: 3px solid var(--accent);
  color: var(--text);
}
.brand small {
  display: block; font-weight: 500; font-size: .72rem;
  color: var(--text-soft); letter-spacing: .06em; text-transform: uppercase; margin-top: 1px;
}

.nav { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
.nav button {
  border: 1px solid transparent; background: transparent; color: var(--text-soft);
  padding: .45rem .7rem; border-radius: var(--radius); font: inherit; font-weight: 550;
  cursor: pointer; min-height: 38px;
}
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

.context-pill {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: .25rem .7rem; font-size: .82rem; color: var(--text-soft);
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}

main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 18px 16px 64px; }

/* ---------- Cartes & grilles ---------- */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card > :last-child { margin-bottom: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2, .card-head h3 { margin: 0; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.spacer { flex: 1; }
.muted { color: var(--text-soft); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
/* L'attribut `hidden` doit l'emporter sur nos propres règles d'affichage :
   sans cela, un `.grid` masqué reste visible (display:grid gagne contre la
   feuille du navigateur). */
[hidden] { display: none !important; }

/* ---------- Contrôles ---------- */

button, .btn {
  font: inherit; font-weight: 550; cursor: pointer;
  border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  padding: .5rem .85rem; min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  transition: background .12s, border-color .12s;
}
button:hover, .btn:hover { background: var(--surface-2); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.btn-ghost { border-color: transparent; background: transparent; }
/* Le mode kiosque change de main : bouton nettement identifiable. */
.btn-kiosk {
  background: var(--kiosk); border-color: var(--kiosk); color: #fff; font-weight: 650;
}
.btn-kiosk:hover { background: var(--kiosk); filter: brightness(1.08); }
.btn-kiosk::before { content: "▣"; font-size: .95em; }

.btn-sm { min-height: 32px; padding: .25rem .6rem; font-size: .85rem; }
.btn-lg { min-height: 56px; font-size: 1.05rem; padding: .8rem 1.3rem; }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .5rem .6rem; min-height: var(--tap); max-width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type="range"] { min-height: auto; padding: 0; accent-color: var(--accent); }
input[type="number"] { width: 7.5rem; }
input[type="checkbox"], input[type="radio"] { min-height: auto; width: 20px; height: 20px; accent-color: var(--accent); }

label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .82rem; font-weight: 600; color: var(--text-soft); margin-bottom: .25rem; }
label.field > input, label.field > select, label.field > textarea { width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; }

fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 0 0 14px; }
legend { font-size: .82rem; font-weight: 700; color: var(--text-soft); padding: 0 .4rem; text-transform: uppercase; letter-spacing: .04em; }

/* ---------- Tableaux ---------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--text-soft); font-weight: 700; white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.compact th, table.compact td { padding: .3rem .45rem; }

/* ---------- Badges & jauges ---------- */

.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  border-radius: 999px; padding: .12rem .55rem;
  font-size: .76rem; font-weight: 650; white-space: nowrap;
  background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border);
}
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.stat { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .76rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }

.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 14px; font-size: .88rem; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.notice.bad { border-color: var(--bad); background: var(--bad-soft); }
.notice.ok { border-color: var(--ok); background: var(--ok-soft); }

.empty { text-align: center; padding: 40px 20px; color: var(--text-soft); }
.empty h3 { color: var(--text); }

/* ---------- Sous-onglets de leçon ---------- */

.subnav { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 16px; padding-bottom: 0; }
.subnav button {
  border: none; background: transparent; border-bottom: 2px solid transparent;
  border-radius: 0; padding: .55rem .8rem; color: var(--text-soft); white-space: nowrap; min-height: 42px;
}
.subnav button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }

/* ---------- Présences ---------- */

/* L'appel se fait en touchant le nom : vert → rouge → orange → vert. */
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.att-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  cursor: pointer; min-height: 48px; user-select: none;
  transition: background .12s, border-color .12s;
}
.att-item:hover { filter: brightness(.985); }
.att-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.att-item .nm { flex: 1; font-size: .92rem; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-item .att-state {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; opacity: .8;
}
.att-item .px { font-size: .78rem; font-variant-numeric: tabular-nums; opacity: .65; }
/* Le menu « rôle » passe à la ligne : la ligne du nom reste entièrement
   cliquable pour continuer à faire défiler les états. */
.att-item .att-role { flex: 1 0 100%; min-height: 34px; font-size: .78rem; padding: .15rem .4rem; cursor: default; }

.att-item.present { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
.att-item.absent { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-ink); }
.att-item.injured { border-color: var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
.att-item.present .att-state { color: var(--ok); }
.att-item.absent .att-state { color: var(--bad); }
.att-item.injured .att-state { color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: none; border-radius: 0; min-height: 32px; padding: .2rem .5rem; font-size: .8rem; background: transparent; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button[aria-pressed="true"].v-injured { background: var(--warn); }
.seg button[aria-pressed="true"].v-absent { background: var(--text-soft); }

/* ---------- Choix d'étape suivante ---------- */

.next-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.next-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  text-align: left; padding: 14px; min-height: 108px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.next-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.next-card b { font-size: 1.02rem; }
.next-card span { font-weight: 400; font-size: .84rem; color: var(--text-soft); }
.next-card .badge { margin-top: auto; }
.next-card.active { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Pondération des sources ---------- */

.src-list { display: flex; flex-direction: column; gap: 2px; }
.src-row {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.src-txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.src-ctl { display: flex; align-items: center; gap: 12px; flex: 0 1 260px; min-width: 190px; }
.src-ctl input[type="range"] { flex: 1; min-width: 110px; }
.src-val { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

/* ---------- Équipes ---------- */

.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.team {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--team, var(--accent));
  border-radius: var(--radius); padding: 10px; min-height: 150px;
}
.team.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; background: var(--accent-soft); }
/* Équipe de moins de 4 joueurs : fond bleu clair, repérable d'un coup d'œil. */
.team.team-thin { background: var(--accent-soft); border-color: var(--accent); }
.team.team-thin .player { background: var(--surface); }
.team-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.team-head .tname { font-weight: 700; flex: 1; font-size: .95rem; }
.team-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

/* Pastille de chasuble : un rond de couleur qui ouvre la palette. */
.team-swatch {
  width: 22px; height: 22px; padding: 0; flex: 0 0 auto;
  border-radius: 50%; border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border); cursor: pointer;
}
.team-swatch:hover { box-shadow: 0 0 0 2px var(--accent); }
.pal-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px; margin: 10px 0 14px;
}
.pal-chip {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  background: var(--surface-2); border: 2px solid transparent; border-radius: 10px;
  font-size: .85rem; text-align: left; cursor: pointer;
}
.pal-chip:hover { border-color: var(--border-strong, var(--border)); }
.pal-chip.is-on { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.pal-chip.is-used .pal-lbl { color: var(--text-soft); }
.pal-dot {
  width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .12) inset;
}
.player {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 4px;
  background: var(--surface-2); border-radius: 8px; cursor: grab; font-size: .88rem; min-height: 38px;
  border: 1px solid transparent;
}
.player:last-child { margin-bottom: 0; }
.player.selected { border-color: var(--accent); background: var(--accent-soft); }
.player .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .px { font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--text-soft); font-weight: 650; }
.player .sx { font-size: .68rem; color: var(--text-soft); }
.player.locked-pair { box-shadow: inset 2px 0 0 var(--ok); }

/* ---------- Radar ---------- */

.radar { display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
.radar .grid-line { fill: none; stroke: var(--border); stroke-width: 1; }
.radar .axis { stroke: var(--border); stroke-width: 1; }
.radar .shape { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.radar .shape.alt { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-dasharray: 4 3; }
.radar text { font-size: 9px; fill: var(--text-soft); }

/* ---------- Kiosque ---------- */

body.kiosk { overflow: hidden; }
.kiosk-root {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; flex-direction: column; overflow: auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 24px;
}
.kiosk-root h1 { font-size: 1.6rem; }
.kiosk-inner { width: 100%; max-width: 820px; margin: 0 auto; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick-grid button { min-height: 62px; font-size: 1rem; }
/* Les niveaux rédigés par l'enseignant : un par ligne, sur toute la largeur.
   Le libellé du niveau en tête, la description dessous — avec la place de la
   lire, sans quoi l'élève coche sans lire. */
.pick-grid.k-niveaux { grid-template-columns: 1fr; gap: 8px; }
.pick-grid.k-niveaux button {
  display: block; width: 100%; text-align: left;
  min-height: 0; padding: 12px 14px;
}
.pick-grid button .k-niv {
  display: block; font-size: 1rem; font-weight: 700; line-height: 1.2;
}
/* « pre-line » : les retours à la ligne écrits par l'enseignant sont conservés
   tels quels — souvent un repère par ligne, qui se lit bien plus vite qu'un
   paragraphe — pendant que le texte continue de s'adapter à la largeur. */
.pick-grid button .k-desc {
  display: block; margin-top: 4px; font-size: .88rem; font-weight: 400;
  line-height: 1.35; opacity: .9; white-space: pre-line;
}
.niv-texte { white-space: pre-line; }
.big-num { display: flex; align-items: center; gap: 10px; }
.big-num input { font-size: 1.6rem; text-align: center; min-height: 64px; width: 120px; font-variant-numeric: tabular-nums; }
.big-num button { min-width: 64px; min-height: 64px; font-size: 1.5rem; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { min-width: 46px; min-height: 46px; font-size: 1.2rem; }

/* Kiosque match : les deux équipes côte à côte, tout tient sans défilement. */
.k-match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.k-vs { align-self: center; color: var(--text-soft); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
.k-team { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.k-team-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.k-team-head h2 { margin: 0; font-size: 1.05rem; line-height: 1.2; }
.k-score { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.k-goals { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
.k-goal {
  flex: 1 1 auto; min-height: 62px; flex-direction: column; gap: 0;
  background: var(--ok); border-color: var(--ok); color: #fff; font-size: 1.05rem; font-weight: 700;
}
.k-goal small { font-weight: 500; font-size: .68rem; opacity: .85; }
/* button:hover est plus spécifique que .k-goal : sans ces règles, le bouton
   survolé redevient gris avec du texte blanc, donc illisible. */
.k-goal:hover { background: var(--ok); filter: brightness(1.07); }
.k-goal.alt, .k-goal.alt:hover { background: var(--accent); border-color: var(--accent); }
/* Le bonus rapporte des points : fond ambré pour ne pas le confondre. */
.k-goal.bonus, .k-goal.bonus:hover {
  background: var(--bonus); border-color: var(--bonus); color: #fff;
}
.k-stat.scores span { color: var(--ok); }
.k-stat.scores b { color: var(--ok); }
.k-goal.minus, .k-goal.minus:hover {
  flex: 0 0 58px; background: var(--surface-2); border-color: var(--border);
  color: var(--text); font-size: 1.4rem;
}
.btn-danger:hover { background: var(--bad-soft); }
.k-player { font-weight: 650; font-size: .88rem; margin: 8px 0 4px; }
.k-stats { display: flex; flex-direction: column; gap: 6px; }
.k-stat { display: flex; align-items: center; gap: 6px; }
.k-stat span {
  width: 42px; font-size: .74rem; font-weight: 700; color: var(--text-soft);
  text-transform: uppercase; letter-spacing: .03em;
}
.k-stat button { min-width: 48px; min-height: 48px; font-size: 1.25rem; flex: 0 0 auto; }
.k-stat b { flex: 1; text-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
/* ---------- Kiosque des rencontres de duel : deux fiches jumelles ----------
   Les deux élèves saisissent côte à côte : les fiches doivent faire la même
   largeur, et les compteurs le même gabarit, sinon on doute de ce qu'on lit.
   Deux colonnes égales sur un écran d'ordinateur ou de tablette, une seule
   colonne sur un téléphone. */
.k-duel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
.k-duel-team { display: flex; flex-direction: column; text-align: center; }
.k-duel-nom { margin: 0 0 6px; font-size: 1.05rem; line-height: 1.2; }
.k-duel-pts { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
.k-duel-pts button { flex: 0 0 auto; min-width: 72px; }
.k-duel-bonus { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
/* Les compteurs observés : une vignette par relevé, libellé au-dessus. Le
   libellé garde sa place sur deux lignes pour que les boutons des deux fiches
   restent alignés, quelle que soit la longueur des mots. */
.k-counters {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
  gap: 8px; margin-top: 10px;
}
.k-counter {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 6px;
}
.k-counter-label {
  display: block; min-height: 2.5em; font-size: .7rem; font-weight: 700;
  line-height: 1.25; text-transform: uppercase; letter-spacing: .03em;
  color: var(--text-soft);
}
.k-counter-ctrl { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 4px; }
.k-counter-ctrl button { flex: 0 0 auto; min-width: 46px; min-height: 46px; font-size: 1.2rem; }
.k-counter-ctrl b { min-width: 2ch; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .k-duel { grid-template-columns: 1fr; }
}

.k-legend { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; font-size: .76rem; color: var(--text-soft); }
.k-legend b { color: var(--text); }

/* Les deux matchs d'un tour, l'un sous l'autre, sur la même tablette. */
.k-round-match {
  border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 10px 12px; margin-bottom: 14px; background: var(--surface-2);
}
.k-round-match .k-match { align-items: stretch; }
.k-round-label {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
  font-weight: 700; color: var(--text-soft); margin-bottom: 8px;
}
.btn-round, .btn-round:hover {
  background: var(--kiosk); color: #fff; border-color: var(--kiosk);
  font-size: .82rem; font-weight: 650; padding: 6px 12px; min-height: 36px;
  vertical-align: middle; margin-left: 8px;
}

@media (max-width: 700px) {
  .k-match { grid-template-columns: 1fr; }
  .k-vs { display: none; }
  .k-goal { min-height: 54px; }
  .k-stat button { min-width: 44px; min-height: 44px; }
}
.stepper .val { min-width: 46px; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- Retour de score et palier atteint ----------
   Le message prend la couleur de sa bande ; l'encadré du palier atteint
   reprend la même teinte, en plus clair, pour qu'on lise les deux d'un bloc. */

.feedback {
  border-radius: 12px 12px 0 0; padding: 16px;
  border: 1px solid var(--border); border-bottom: none;
  background: var(--surface-2);
}
.feedback.band-aide { background: var(--warn-soft); border-color: var(--warn); color: var(--warn-ink); }
.feedback.band-reco { background: var(--accent-soft); border-color: var(--accent); }
.feedback.band-plus { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }

.next-level {
  border-radius: 0 0 12px 12px; padding: 14px 16px; margin-bottom: 14px;
  border: 1px solid var(--border); border-top: 1px dashed var(--border);
  background: var(--surface-2);
}
.next-level.band-aide {
  border-color: var(--warn);
  background: var(--warn-soft);
  background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface));
}
.next-level.band-reco {
  border-color: var(--accent);
  background: var(--accent-soft);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface));
}
.next-level.band-plus {
  border-color: var(--ok);
  background: var(--ok-soft);
  background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface));
}
.nl-label {
  display: block; font-size: .7rem; text-transform: uppercase;
  letter-spacing: .06em; font-weight: 700; color: var(--text-soft);
}
.nl-name { display: block; font-size: 1.25rem; line-height: 1.25; margin: 2px 0 4px; }
.nl-consigne { white-space: pre-wrap; font-size: .95rem; }

/* ---------- Couleur des paliers : orange → vert foncé ----------
   Chaque élément porteur d'un palier reçoit trois variables calculées par
   progress.js : --lv (l'encre en thème clair), --lv-lite (la même en plus
   clair, pour le thème sombre) et --lv-soft (un fond translucide valable
   dans les deux thèmes). --lv-ink choisit l'une des deux encres. */

.lv-tint { --lv-ink: var(--lv); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lv-tint { --lv-ink: var(--lv-lite); }
}
:root[data-theme="dark"] .lv-tint { --lv-ink: var(--lv-lite); }

.lv-name { color: var(--lv-ink); font-weight: 700; }

.lv-chip {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  background: var(--lv-soft); color: var(--lv-ink);
  border: 1px solid var(--lv-ink); font-size: .78rem; font-weight: 650;
  white-space: nowrap;
}

.stat.lv-tint {
  background: var(--lv-soft);
  border-left: 4px solid var(--lv-ink);
}
.stat.lv-tint b { color: var(--lv-ink); }

.lv-fieldset {
  border: 2px solid var(--lv-ink);
  background: var(--lv-soft);
}
.lv-fieldset > legend { color: var(--lv-ink); }

.notice.lv-notice {
  background: var(--lv-soft); border-color: var(--lv-ink); color: var(--lv-ink);
}

/* Le bandeau « palier atteint » garde la nuance de sa bande en fond, mais
   c'est la couleur du palier qui borde et qui écrit son nom. */
.next-level.lv-tint { border-left: 6px solid var(--lv-ink); }

/* Choix du palier en kiosque : de gros boutons dégradés de l'orange au vert. */
.k-level, .k-level:hover {
  background: var(--lv-soft);
  border: 2px solid var(--lv-ink);
  color: var(--lv-ink);
  font-weight: 650;
}
.k-level.is-reco, .k-level.is-reco:hover {
  background: var(--lv-ink);
  color: #fff;
  box-shadow: 0 0 0 3px var(--lv-soft);
}
.k-level .tiny { opacity: .85; }

.print-level.lv-tint {
  border-left: 5px solid var(--lv-ink);
  padding-left: 8px;
}
.print-level.lv-tint b { color: var(--lv-ink); }

/* ---------- Bonus : ce qui rapporte des points ---------- */

.badge-bonus { background: var(--bonus-soft); color: var(--bonus-ink); border-color: transparent; }
.btn-bonus, .btn-bonus:hover {
  background: var(--bonus-soft); border-color: var(--bonus); color: var(--bonus-ink); font-weight: 650;
}
.bonus-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }

/* ---------- Tours de matchs ---------- */

.round { margin-bottom: 18px; }
.round-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; margin-bottom: 10px;
  background: var(--surface-2); border-radius: var(--radius); border-left: 3px solid var(--accent);
}
.round-head h3 { margin: 0; }
.observers { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.match-line {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.match-line.faded { opacity: .5; }
.match-line .mt { font-weight: 650; }
.match-line .mt:last-of-type { text-align: right; }
.match-line .ms { font-variant-numeric: tabular-nums; font-size: 1.05rem; white-space: nowrap; }
.match-line .md { grid-column: 1 / -1; }

/* ---------- Pavé de code du kiosque ---------- */

.code-display {
  font-size: 2rem; letter-spacing: .35em; text-align: center; font-variant-numeric: tabular-nums;
  background: var(--surface-2); border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.code-display.bad { color: var(--bad); font-size: 1.1rem; letter-spacing: normal; }
.code-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 0 auto; }
.code-pad button { min-height: 58px; font-size: 1.3rem; }

/* ---------- Images jointes aux messages ---------- */

.img-slot { margin: 8px 0 0; }
.img-slot img {
  display: block; max-width: 100%; max-height: 320px; width: auto;
  border: 1px solid var(--border); border-radius: 8px; background: #fff;
}
.band { border-left: 3px solid var(--border); }
.band-aide { border-left-color: var(--warn); }
.band-reco { border-left-color: var(--accent); }
.band-plus { border-left-color: var(--ok); }

/* ---------- Feuille de groupes à projeter ou imprimer ---------- */

.print-sheet { max-width: 1000px; margin: 0 auto; }
.print-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.print-head h1 { margin: 0; }
.print-consigne {
  white-space: pre-wrap; border-left: 3px solid var(--accent);
  background: var(--accent-soft); padding: 10px 12px; border-radius: 0 8px 8px 0;
}
.print-schema img { max-height: 220px; }
.print-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.print-group {
  border: 2px solid var(--border); border-radius: 10px; padding: 12px; break-inside: avoid;
  background: var(--surface);
}
.print-group h2 { margin: 0 0 6px; font-size: 1.1rem; }
.print-group ol { margin: 0 0 10px; padding-left: 22px; font-size: 1.02rem; line-height: 1.7; }
.print-level {
  margin: 0 0 8px; font-size: .86rem; background: var(--surface-2);
  border-radius: 6px; padding: 6px 8px;
}
.print-level span { display: block; white-space: pre-wrap; color: var(--text-soft); margin-top: 2px; }
.print-score { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-soft); }
.print-score i { display: block; flex: 1; height: 26px; border: 1px dashed var(--border); border-radius: 5px; }

/* ---------- Divers ---------- */

.pairs-list { display: flex; flex-direction: column; gap: 6px; }
.pair {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: .88rem;
}
.pair.apart { border-left: 3px solid var(--bad); }
.pair.together { border-left: 3px solid var(--ok); }

.chart { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--border); stroke-width: 1; }
.chart text { font-size: 10px; fill: var(--text-soft); }
.chart .pt { fill: var(--accent); fill-opacity: .75; }
.chart .fit { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.chart .line { stroke: var(--accent); stroke-width: 2; fill: none; }

/* ---------- Fenêtres (implémentation maison, voir ui.js) ---------- */

body.modal-open { overflow: hidden; }

.modal-back {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(20, 28, 38, .42);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.modal-panel {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 660px; margin: auto;
  box-shadow: 0 12px 40px rgba(20, 28, 38, .18);
  display: flex; flex-direction: column; max-height: calc(100vh - 32px);
}
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); border-radius: 14px 14px 0 0; z-index: 1;
}
.modal-head h2 { margin: 0; flex: 1; font-size: 1.08rem; }
.modal-x {
  min-height: 36px; min-width: 36px; padding: 0; border-radius: 8px;
  border-color: transparent; background: transparent; color: var(--text-soft); font-size: 1rem;
}
.modal-x:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 16px; overflow-y: auto; flex: 1; }
.modal-body > :last-child { margin-bottom: 0; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  padding: 12px 16px; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px;
}
.modal-foot .btn-primary { min-width: 130px; }

@media (max-width: 640px) {
  .modal-back { padding: 0; }
  .modal-panel { max-width: 100%; min-height: 100vh; max-height: none; border-radius: 0; border: none; }
  .modal-head, .modal-foot { border-radius: 0; }
  .modal-foot { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .modal-foot button { flex: 1; }
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: .6rem 1rem; border-radius: 999px;
  font-size: .88rem; font-weight: 600; z-index: 200; box-shadow: var(--shadow); max-width: 90vw; text-align: center;
}

@media (max-width: 760px) {
  .topbar { flex-direction: column; align-items: stretch; gap: .4rem; min-width: 0; }
  .topbar .brand { align-self: flex-start; margin-right: 0; }
  .nav {
    flex: 0 0 auto; width: 100%; min-width: 0; max-width: 100%;
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: 2px; scrollbar-width: thin;
  }
  .nav button { white-space: nowrap; flex: 0 0 auto; }
  #ctx { align-self: flex-start; max-width: 100%; }
}

@media (max-width: 640px) {
  main { padding: 14px 12px 56px; }
  .card { padding: 13px; }
  .brand { font-size: .86rem; }
  .brand small { font-size: .64rem; }
  .topbar { padding-top: .45rem; padding-bottom: .45rem; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .subnav, .no-print, button, .toast { display: none !important; }
  body, .card { background: #fff; color: #000; box-shadow: none; }
  .team, .print-group { break-inside: avoid; }
  /* Une vue projetée s'imprime en pleine page, sans l'application derrière. */
  body:has(#projector) #app { display: none !important; }
  #projector {
    position: static !important; overflow: visible !important;
    padding: 0 !important; background: #fff !important;
  }
  .print-groups { grid-template-columns: repeat(2, 1fr); }
  .print-group { border-color: #999; }
}

/* ---------- Oppositions d'échauffement, tour par tour ---------- */

.duel-round { margin-bottom: 14px; }
.duel-round-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
}
.duel-round-head h4 { margin: 0; }
.duel-preview { margin-top: 4px; }
.duel-tour { padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .85rem; }
.duel-tour:last-child { border-bottom: none; }
.k-tour { margin: 14px 0 8px; font-size: 1rem; }

/* ---------- Rappel des messages, groupé par palier ----------
   Un bloc par palier, à la couleur du palier : les élèves qui vont travailler
   au même endroit lisent au même endroit, et repèrent leur prénom de loin. */

.lv-group {
  border: 2px solid var(--lv-ink);
  border-radius: 14px;
  background: var(--lv-soft);
  padding: 14px 14px 10px;
  margin-bottom: 16px;
}
.lv-group-head { margin-bottom: 10px; }
.lv-group-label {
  display: block; font-size: .7rem; text-transform: uppercase;
  letter-spacing: .08em; font-weight: 700; color: var(--lv-ink); opacity: .8;
}
.lv-group-name { margin: 2px 0 2px; font-size: 1.35rem; color: var(--lv-ink); }
.lv-group-consigne { margin: 0; font-size: .95rem; white-space: pre-wrap; }

.lv-names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.lv-name-chip {
  display: inline-block; padding: 7px 14px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--lv-ink);
  color: var(--lv-ink); font-size: 1.15rem; font-weight: 700; line-height: 1.2;
}
.lv-name-chip.is-new { background: var(--lv-ink); color: #fff; }

.lv-msg {
  background: var(--surface); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 8px; font-size: 1.02rem;
  border-left: 5px solid var(--border);
}
.lv-msg:last-child { margin-bottom: 0; }
.lv-msg.band-aide { border-left-color: var(--warn); }
.lv-msg.band-reco { border-left-color: var(--accent); }
.lv-msg.band-plus { border-left-color: var(--ok); }

@media (max-width: 560px) {
  .lv-group-name { font-size: 1.15rem; }
  .lv-name-chip { font-size: 1rem; padding: 6px 11px; }
}

/* Liste compacte d'équipes (composition d'un échauffement). */
.teamlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
.teamlist-item {
  border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px;
  padding: 7px 10px; background: var(--surface-2); font-size: .85rem;
}

/* Petit champ posé dans une barre d'outils (terrains disponibles, etc.). */
.inline-field {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 4px 0 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); min-height: var(--tap);
}
.inline-field input { border: none; background: transparent; min-height: 36px; padding: 0 4px; }
.inline-field input:focus { outline-offset: -2px; }

/* ---------- Dossiers de la banque ---------- */

.bank-folder { margin-bottom: 14px; }
.bank-folder-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 10px; border-radius: var(--radius);
  background: var(--surface-2); border: 1px solid var(--border);
  margin-bottom: 10px; cursor: pointer; user-select: none;
}
.bank-folder-head:hover { border-color: var(--accent); }
.bank-folder-head.is-closed { margin-bottom: 6px; opacity: .92; }
.bank-folder-head h3 { margin: 0; }
.fold-caret { color: var(--text-soft); font-size: .8rem; width: 12px; }
/* Un sous-dossier se lit à son décalage et à son filet de gauche. */
.bank-folder-body {
  padding-left: 14px; border-left: 2px solid var(--border); margin-left: 6px;
}
.bank-folder-body > .bank-folder:last-child { margin-bottom: 0; }
.folder-pick { min-height: 34px; font-size: .82rem; max-width: 170px; }

@media (max-width: 560px) {
  .bank-folder-body { padding-left: 8px; margin-left: 2px; }
}

/* Jauge d'occupation du stockage. */
.gauge {
  height: 10px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--border); overflow: hidden;
}
.gauge-fill { height: 100%; background: var(--ok); transition: width .2s; }
.gauge-fill.warn { background: var(--warn); }
.gauge-fill.bad { background: var(--bad); }

/* Bandeau de relevé du fair-play sur une situation. */
.fair-row {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--border);
}

/* Menu « ⋯ » des actions secondaires d'une fiche. */
.tools { position: relative; display: inline-block; }
.tools > summary {
  list-style: none; cursor: pointer; user-select: none;
  min-width: 34px; font-weight: 700; letter-spacing: .06em;
}
.tools > summary::-webkit-details-marker { display: none; }
.tools-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 6px 20px rgba(30, 42, 56, .12);
  padding: 5px; min-width: 210px;
}
.tools-pop button { justify-content: flex-start; white-space: nowrap; }

/* Bouton d'appréciation d'un élève blessé, dans la grille des présences. */
.att-obs {
  grid-column: 1 / -1; margin-top: 4px; min-height: 30px;
  font-size: .78rem; background: var(--surface); border-color: var(--border);
}
.att-obs.is-on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); font-weight: 650; }

/* L'équipe des dispensés : présente à l'écran, absente des appariements. */
.team-dispense {
  border-style: dashed;
  background: var(--warn-soft);
}
.team-dispense .player { background: var(--surface); cursor: default; }
.dispense-row { display: block; cursor: default; }
.dispense-nom { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.dispense-actions { display: flex; gap: 5px; }
.dispense-actions .att-role { flex: 1 1 auto; min-width: 0; min-height: 32px; font-size: .78rem; }
.dispense-actions .att-obs { flex: 0 0 auto; grid-column: auto; margin-top: 0; white-space: nowrap; }

/* Une fiche rangée dans plusieurs dossiers : étiquettes retirables. */
.folder-cell { min-width: 190px; }
.folder-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.folder-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--accent); border-radius: 999px;
  padding: 1px 4px 1px 9px; font-size: .76rem; font-weight: 600; white-space: nowrap;
}
.chip-x {
  min-height: 18px; padding: 0 3px; border: none; background: transparent;
  color: inherit; font-size: .72rem; line-height: 1; opacity: .75;
}
.chip-x:hover { background: transparent; opacity: 1; }

/* ---------- Co-frontation en mode kiosque ---------- */

.coop-choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.coop-choix button {
  flex-direction: column; gap: 2px; min-height: 92px; font-size: 1.15rem; font-weight: 700;
}
.coop-choix small { font-size: .82rem; font-weight: 500; opacity: .9; }
.coop-oui, .coop-oui:hover { background: var(--ok); border-color: var(--ok); color: #fff; }
.coop-non, .coop-non:hover { background: var(--surface-2); border-color: var(--border); }
.coop-eleve { min-height: 74px; }
.coop-eleve.is-on, .coop-eleve.is-on:hover {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.coop-eleve.is-done { border-color: var(--ok); }
.coop-eleve.is-done:not(.is-on) { background: var(--ok-soft); }

/* Barre des APSA : le bandeau qui rappelle de quel cycle on parle. */
.apsa-bar { padding: 10px 12px; margin-bottom: 12px; }
.apsa-bar .row { flex-wrap: wrap; }
.apsa-bar .tiny { opacity: .7; font-weight: 400; }

/* ---------- Remodeler les groupes : glisser-déposer ----------
   Les pastilles d'élèves refusent le défilement sous le doigt : sans cela,
   l'appui long qui arme le glissement ferait glisser la page à la place. */
.gchip { touch-action: none; user-select: none; -webkit-user-select: none; }
.gghost {
  position: fixed; z-index: 3000; pointer-events: none;
  transform: translate(-50%, -140%);
  padding: 7px 12px; border-radius: 10px; font-weight: 700; font-size: .9rem;
  background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
}
body.gdrag { cursor: grabbing; }
body.gdrag * { cursor: grabbing !important; }
[data-gzone].gzone-over {
  border-color: var(--accent) !important;
  box-shadow: inset 0 0 0 2px var(--accent);
  background: var(--accent-soft);
}

/* ---------- Dossier de séquence : à l'écran, puis sur le papier ----------
   Une page posée par-dessus l'application. À l'impression, c'est elle seule
   qui reste : l'enseignant enregistre en PDF depuis son navigateur. */
#dossier { background: var(--bg); overflow: auto; }
.dos-bar {
  position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border);
}
.dos-page { max-width: 1000px; margin: 0 auto; padding: 24px 18px 60px; }
.dos-head h1 { margin: 0 0 4px; font-size: 1.5rem; }
.dos-sub { margin: 0; color: var(--muted); font-size: .9rem; }
.dos-sec { margin-top: 26px; }
.dos-sec h2 { font-size: 1.15rem; border-bottom: 2px solid var(--border); padding-bottom: 4px; }
.dos-lecon { margin: 14px 0; padding-left: 10px; border-left: 3px solid var(--border); }
.dos-lecon h3 { margin: 0 0 4px; font-size: 1rem; }
.dos-obj { margin: 0 0 4px; font-style: italic; }
.dos-part { margin: 8px 0 2px; font-weight: 700; font-size: .85rem; }
.dos-lecon ul { margin: 0 0 4px 18px; padding: 0; font-size: .85rem; }
.dos-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 8px; }
.dos-table th, .dos-table td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
.dos-table th { background: var(--soft); }
.dos-table .num { text-align: right; }
.dos-table .nom { white-space: nowrap; }
.dos-appr { margin: 10px 0; break-inside: avoid; }
.dos-appr-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.dos-appr-box { height: 54px; border: 1px solid var(--border); border-radius: 6px; margin-top: 3px; }

@media print {
  body:has(#dossier) #app { display: none !important; }
  #dossier {
    position: static !important; overflow: visible !important;
    padding: 0 !important; background: #fff !important;
  }
  .dos-page { max-width: none; padding: 0; }
  .dos-break { break-before: page; }
  .dos-lecon, .dos-table tr { break-inside: avoid; }
  .dos-table th { background: #eee !important; }
  @page { margin: 12mm; }
}

</head>

    var n = Math.min(xs.length, ys.length);
    if (n < 3) return null;
    var mx = mean(xs.slice(0, n)), my = mean(ys.slice(0, n));
    var num = 0, dx = 0, dy = 0;
    for (var i = 0; i < n; i++) {

      num += a * b; dx += a * a; dy += b * b;

    if (dx === 0 || dy === 0) return null;
    return num / Math.sqrt(dx * dy);

  /* Résolution de A x = b par élimination de Gauss avec pivot partiel. */

  var ACTIVITE_DEFAUT = 'badminton';

  function activiteById(id) {
    for (var i = 0; i < ACTIVITES.length; i++) if (ACTIVITES[i].id === id) return ACTIVITES[i];
    return ACTIVITES[0];
  }
  /* L'activité support du cycle ouvert. Tant qu'aucune APSA n'existe, c'est
     celle des réglages généraux — le temps d'en créer une. */
  function activite(apsa) {
    if (typeof apsa === 'string') apsa = apsaById(state.ui.classId, apsa);
    if (!apsa && state) apsa = currentApsa();
    if (apsa && apsa.activite) return activiteById(apsa.activite);
    return activiteById((state && state.settings && state.settings.activite) || ACTIVITE_DEFAUT);
  }
  function copie(x) { return JSON.parse(JSON.stringify(x)); }

  /* Couleurs d'équipe : sobres, distinguables entre elles y compris pour les
     daltonismes courants, et lisibles sur fond clair comme sur fond sombre. */
  var TEAM_COLORS = ['#c0504a', '#3f8f6b', '#2f6fb3', '#c1802e', '#7a5ba6',
                     '#2a8b96', '#8a6a4f', '#6f7f2e', '#4a5a78'];
  var TEAM_NAMES = ['Rouge', 'Verte', 'Bleue', 'Orange', 'Violette',
                    'Turquoise', 'Marron', 'Olive', 'Marine'];

  /* Palette proposée pour les équipes : ce sont des couleurs de chasubles,
     donc on les nomme comme on les désigne sur le terrain. */
  var TEAM_PALETTE = TEAM_NAMES.map(function (n, i) {
    return { name: n, color: TEAM_COLORS[i] };
  }).concat([
    { name: 'Jaune', color: '#c9a227' },
    { name: 'Rose', color: '#c2568c' },
    { name: 'Grise', color: '#6b7a8c' },
    { name: 'Noire', color: '#3a4250' }
  ]);

  /* Une équipe peut compter deux élèves : en ultimate à effectif réduit,
     ou pour des ateliers en binômes, c'est un cas courant. */
  var MIN_TEAM_SIZE = 2;
  var MAX_TEAM_SIZE = 7;

  /* Code enseignant : il ouvre la sortie du mode kiosque et la réinitialisation
     d'une rencontre. L'ancien code par défaut est remplacé automatiquement chez
     ceux qui ne l'avaient jamais personnalisé (voir migrate). */
  var KIOSK_CODE = '2706';
  /* Terrains disponibles au gymnase : c'est ce qui décide du nombre de
     rencontres simultanées, donc du découpage en tours. Réglable partout,
     et redéfinissable leçon par leçon ou échauffement par échauffement. */
  var TERRAINS = 2;
  var MAX_TERRAINS = 8;
  var KIOSK_CODE_ANCIEN = '1999';

  function defaultSettings(actId) {
    var act = activiteById(actId || ACTIVITE_DEFAUT);
    return {
      activite: act.id,
      criteria: copie(act.criteria),
      statIndicators: copie(act.indicators),
      statFields: copie(act.fields),
      format: copie(act.format),
      /* En CA4, le résultat du duel EST l'essentiel de la preuve : il pèse
         davantage que dans un sport collectif, où il dépend des coéquipiers. */
      sources: copie(act.sources || { situations: 0.45, matchStats: 0.30, observation: 0.15, matchResult: 0.10 }),
      ewma: 0.35,        // 0 = on ne tient compte que du passé, 1 = que de la dernière leçon
      shrinkK: 4,        // régression vers la moyenne de classe quand peu de données
      ridgeLambda: 1.0,  // régularisation de l'estimation des contributions individuelles
      anonymize: false,
      kioskCode: KIOSK_CODE,
      terrains: TERRAINS,
      cloudEnabled: false,
      cloudEmail: '',
      theme: 'light',
      firebase: null,
      autoBackup: true
    };
  }

  function newState() {
    var s = {
      version: 1,
      app: 'organisation-ca4',
      settings: defaultSettings(),
      classes: {},
      lessons: {},
      grids: {},
      afc: {},          // attendus de fin de cycle : ceux du CA4, puis les tiens
      bankFolders: {},
      bank: {},        // banque de situations réutilisables
      ui: { classId: null, apsaId: null, lessonId: null, view: 'classes', tab: 'presence' },
      savedAt: null
    };
    semerAfc(s);
    return s;
  }

  /* --------------------------------------------------------------- stockage */

  var KEY = 'organisation-ca4:v1';
  var state = null;
  var listeners = [];
  var saveTimer = null;

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* navigation privée */ }
    if (!raw) { state = newState(); return state; }
    try {
      var obj = JSON.parse(raw);
      state = migrate(obj);
    } catch (e) {
      console.error('Données illisibles, démarrage à vide', e);
      state = newState();
    }
    return state;
  }

  /* Changer d'activité remplace les préréglages (critères, relevés, format).
     Les classes, leçons et scores ne sont pas touchés — mais les critères visés
     par les fiches déjà écrites peuvent ne plus exister : c'est pour cela que
     l'interface prévient avant. */
  function setActivite(id, apsa) {
    var act = activiteById(id);
    apsa = apsa || currentApsa();
    var cible = (apsa && apsa.config) ? apsa.config : state.settings;
    if (apsa) apsa.activite = act.id; else state.settings.activite = act.id;
    cible.criteria = copie(act.criteria);
    cible.statIndicators = copie(act.indicators);
    cible.statFields = copie(act.fields);
    cible.format = copie(act.format);
    if (act.sources) cible.sources = copie(act.sources);
    return act;
  }

  function migrate(obj) {
    if (!obj || typeof obj !== 'object') return newState();
    var base = newState();
    /* Les attendus du CA4 arrivent dans les espaces déjà ouverts, sans écraser
       ce que l'enseignant a écrit lui-même. */
    semerAfc(obj);
    obj.settings = Object.assign({}, base.settings, obj.settings || {});
    obj.settings.sources = Object.assign({}, base.settings.sources, obj.settings.sources || {});
    if (!Array.isArray(obj.settings.criteria) || !obj.settings.criteria.length)
      obj.settings.criteria = base.settings.criteria;
    if (!Array.isArray(obj.settings.statIndicators) || !obj.settings.statIndicators.length)
      obj.settings.statIndicators = base.settings.statIndicators;
    if (!Array.isArray(obj.settings.statFields) || !obj.settings.statFields.length)
      obj.settings.statFields = base.settings.statFields;
    /* Un espace créé avant le changement de code garde l'ancien par défaut :
       on le met à jour, sauf si l'enseignant en avait choisi un autre. */
    if (String(obj.settings.kioskCode || '').trim() === KIOSK_CODE_ANCIEN) {
      obj.settings.kioskCode = KIOSK_CODE;
    }
    obj.classes = obj.classes || {};
    obj.lessons = obj.lessons || {};
    /* Espaces créés avant les APSA : on crée le cycle qui existait de fait,
       à partir de l'activité réglée, et on lui rattache toutes les leçons. */
    Object.keys(obj.classes).forEach(function (k) {
      var c = obj.classes[k];
      if (Array.isArray(c.apsas) && c.apsas.length) return;
      var act = activiteById(obj.settings.activite || ACTIVITE_DEFAUT);
      c.apsas = [{
        id: uid('aps'), name: act.name, activite: act.id,
        createdAt: c.createdAt || new Date().toISOString(),
        config: {
          criteria: copie(obj.settings.criteria || act.criteria),
          statIndicators: copie(obj.settings.statIndicators || act.indicators),
          statFields: copie(obj.settings.statFields || act.fields),
          format: copie(obj.settings.format || act.format),
          sources: copie(obj.settings.sources || act.sources)
        }
      }];
      Object.keys(obj.lessons).forEach(function (lk) {
        var l = obj.lessons[lk];
        if (l.classId === c.id && !l.apsaId) l.apsaId = c.apsas[0].id;
      });
    });
    obj.grids = obj.grids || {};
    obj.afc = obj.afc || {};
    obj.bank = obj.bank || {};
    obj.bankFolders = obj.bankFolders || {};
    /* Une fiche pouvait n'appartenir qu'à un dossier ; elle peut désormais être
       rangée dans plusieurs. On convertit l'ancien champ unique en liste. */
    Object.keys(obj.bank).forEach(function (k) {
      var t = obj.bank[k];
      if (!Array.isArray(t.folderIds)) {
        t.folderIds = t.folderId ? [t.folderId] : [];
      }
      delete t.folderId;
    });
    obj.ui = Object.assign({}, base.ui, obj.ui || {});
    obj.version = 2;
    return obj;
  }

  /* Dernière écriture réussie ? Le reste de l'application s'en sert pour
     prévenir clairement plutôt que de laisser croire que tout est enregistré. */
  var lastSaveOk = true;

  /* Compteur de révisions du modèle. L'horodatage ne suffit pas à repérer un
     changement : deux modifications faites dans la même milliseconde portent
     la même date, et un calcul mis en cache serait alors resservi périmé. */
  var revision = 0;
  function rev() { return revision; }

  function save(immediate) {
    revision++;
    state.savedAt = new Date().toISOString();
    clearTimeout(saveTimer);
    var doIt = function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        if (!lastSaveOk) {
          lastSaveOk = true;
          notify('✓ Sauvegarde à nouveau possible : tout est enregistré.');
          emit();
        }
      } catch (e) {
        console.error(e);
        var etait = lastSaveOk;
        lastSaveOk = false;
        if (etait) {
          var info = storageInfo();
          var part = info.total ? Math.round(info.images / info.total * 100) : 0;
          notify('⚠ Stockage plein : rien n\'est enregistré depuis maintenant. ' +
            (info.nbImages
              ? 'Les images occupent ' + part + ' % de l\'espace (' + info.nbImages + ' images) — ' +
                'Réglages → Stockage propose de les alléger en un clic.'
              : 'Exporte ta sauvegarde JSON, puis allège l\'espace depuis Réglages → Stockage.'));
          emit();
        }
      }
      if (APP.cloud && APP.cloud.isOn && APP.cloud.isOn()) APP.cloud.push(state);
    };
    if (immediate) doIt(); else saveTimer = setTimeout(doIt, 250);
  }
  function saveOk() { return lastSaveOk; }

  function get() { return state; }

  /* Enregistre en conservant l'horodatage fourni : utilisé quand on applique
     une version venue d'un autre appareil, pour ne pas la renvoyer en boucle. */
  function persistAs(ts) {
    state.savedAt = ts;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* stockage plein */ }
  }

  function set(fn) {
    fn(state);
    save();
    emit();
  }

  /* Enregistre sans redessiner la page. Indispensable pendant la frappe dans
     un champ : reconstruire le HTML à chaque caractère arrache le champ au
     navigateur en plein événement, ce qui produit l'erreur
     « The node to be removed is no longer a child of this node ». */
  function setQuiet(fn) {
    fn(state);
    save();
  }

  function onChange(fn) { listeners.push(fn); }
  function emit() { listeners.forEach(function (f) { try { f(state); } catch (e) { console.error(e); } }); }

  var notifyFn = null;
  function notify(msg) { if (notifyFn) notifyFn(msg); else console.log(msg); }
  function setNotifier(fn) { notifyFn = fn; }

  /* ------------------------------------------------------------ accesseurs */

  function currentClass() { return state.ui.classId ? state.classes[state.ui.classId] : null; }
  function currentLesson() { return state.ui.lessonId ? state.lessons[state.ui.lessonId] : null; }
  /* Les leçons d'une classe, pour une APSA donnée. Sans APSA précisée, on
     prend celle qui est ouverte : c'est ce que veut dire « le cycle en cours ».
     `classLessons(id, '*')` rend tout, tous cycles confondus. */
  function classLessons(classId, apsaId) {
    if (apsaId === undefined) {
      var cur = currentApsa(classId);
      apsaId = cur ? cur.id : null;
    }
    return sortBy(Object.keys(state.lessons)
      .map(function (k) { return state.lessons[k]; })
      .filter(function (l) {
        if (l.classId !== classId) return false;
        if (apsaId === '*' || apsaId == null) return true;
        return (l.apsaId || null) === apsaId;
      }),
      function (l) { return (l.date || '') + '#' + (l.createdAt || ''); });
  }
  function studentsOf(classId) {
    var c = state.classes[classId];
    return c ? c.students : [];
  }
  function studentById(classId, sid) {
    var list = studentsOf(classId);
    for (var i = 0; i < list.length; i++) if (list[i].id === sid) return list[i];
    return null;
  }
  function displayName(st) {
    if (!st) return '?';
    if (state.settings.anonymize) {
      return (st.first || '') + ' ' + (st.last || '').charAt(0).toUpperCase() + '.';
    }
    return (st.first || '') + ' ' + (st.last || '');
  }
  function shortName(st) {
    if (!st) return '?';
    return (st.first || '') + ' ' + (st.last || '').charAt(0).toUpperCase() + '.';
  }
  /* =========================================================== les APSA

     Une classe traverse plusieurs activités dans l'année — dix au plus. Chacune
     est un cycle autonome : son activité support, ses critères, ses relevés,
     son format de rencontre… et ses indices. Un élève à l'aise en badminton
     n'est pas réputé à l'aise en handball : mélanger les deux ne dirait rien
     de juste, ni à lui ni à l'enseignant. Les leçons appartiennent donc à une
     APSA, et tout ce qui se calcule se calcule à l'intérieur d'une APSA. */

  var MAX_APSA = 10;

  /* ------------------------------------------------- cycles et attendus

     Les programmes ne demandent pas la même chose à un sixième et à un
     troisième. Une classe porte donc son cycle, et les ATTENDUS DE FIN DE
     CYCLE — ceux que l'enseignant écrit lui-même, dans ses mots — sont rangés
     par cycle et, s'il le souhaite, par activité. Les items d'une grille
     d'évaluation s'y relient : on sait alors ce que chaque note atteste. */
  var CYCLES = [
    { id: 'c3', name: 'Cycle 3', hint: '6e (et CM1-CM2)' },
    { id: 'c4', name: 'Cycle 4', hint: '5e, 4e, 3e' },
    { id: 'lycee', name: 'Lycée', hint: '2de, 1re, terminale' }
  ];
  function cycleById(id) {
    for (var i = 0; i < CYCLES.length; i++) if (CYCLES[i].id === id) return CYCLES[i];
    return CYCLES[1];
  }
  /* Le nom de la classe suffit presque toujours : « 6e B » est en cycle 3. */
  function devineCycle(nom) {
    var n = String(nom || '').toLowerCase();
    if (/(^|\D)6\s*(e|è|ème|eme)?(\D|$)/.test(n) || /sixi/.test(n)) return 'c3';
    if (/(2de|2nde|seconde|1re|1ère|premiere|première|term|tle|terminale|lyc)/.test(n)) return 'lycee';
    return 'c4';
  }
  function cycleOf(classId) {
    var c = state.classes[classId];
    if (!c) return 'c4';
    if (!c.cycle) c.cycle = devineCycle(c.name);
    return c.cycle;
  }

  /* --------------------------------------------- attendus de fin de cycle

     Les attendus du champ d'apprentissage 4 sont les mêmes quelle que soit
     l'activité : c'est le rapport de force qui les porte, pas le volant ou le
     ballon. Ils sont donc livrés avec l'application, rattachés à « toutes les
     activités », et rangés dans le cycle qui les concerne. L'enseignant peut
     les reformuler, en ajouter, ou en supprimer : ce sont des fiches comme les
     autres, simplement déjà écrites.

     Les identifiants sont stables (« afc-c3-1 ») et la graine est versionnée :
     un espace déjà ouvert les reçoit une fois, et un attendu supprimé à la
     main ne revient pas à la mise à jour suivante. */
  var AFC_SEED = 1;
  var AFC_OFFICIELS = [
    { id: 'afc-c3-1', cycle: 'c3', code: 'AFC3 n°1',
      texte: 'S\'organiser tactiquement pour gagner le duel ou le match en identifiant les situations favorables de marque.' },
    { id: 'afc-c3-2', cycle: 'c3', code: 'AFC3 n°2',
      texte: 'Maintenir un engagement moteur efficace sur tout le temps de jeu prévu.' },
    { id: 'afc-c3-3', cycle: 'c3', code: 'AFC3 n°3',
      texte: 'Respecter les partenaires, les adversaires et l\'arbitre.' },
    { id: 'afc-c3-4', cycle: 'c3', code: 'AFC3 n°4',
      texte: 'Assurer différents rôles sociaux (joueur, arbitre, observateur) inhérents à l\'activité et à l\'organisation de la classe.' },
    { id: 'afc-c3-5', cycle: 'c3', code: 'AFC3 n°5',
      texte: 'Accepter le résultat de la rencontre et être capable de le commenter.' },

    { id: 'afc-c4-1', cycle: 'c4', code: 'AFC4 n°1',
      texte: 'Réaliser des actions décisives en situation favorable afin de faire basculer le rapport de force en sa faveur ou en faveur de son équipe.' },
    { id: 'afc-c4-2', cycle: 'c4', code: 'AFC4 n°2',
      texte: 'Adapter son engagement moteur en fonction de son état physique et du rapport de force.' },
    { id: 'afc-c4-3', cycle: 'c4', code: 'AFC4 n°3',
      texte: 'Être solidaire de ses partenaires et respectueux de son (ses) adversaire(s) et de l\'arbitre.' },
    { id: 'afc-c4-4', cycle: 'c4', code: 'AFC4 n°4',
      texte: 'Observer et co-arbitrer.' },
    { id: 'afc-c4-5', cycle: 'c4', code: 'AFC4 n°5',
      texte: 'Accepter le résultat de la rencontre et savoir l\'analyser avec objectivité.' }
  ];

  /* Installe les attendus officiels manquants dans un espace. Renvoie le
     nombre d'ajouts — zéro veut dire qu'ils étaient déjà là. */
  function semerAfc(obj, forcer) {
    obj.afc = obj.afc || {};
    if (!forcer && obj.afcSeed >= AFC_SEED) return 0;
    var n = 0;
    AFC_OFFICIELS.forEach(function (a) {
      if (obj.afc[a.id]) return;
      obj.afc[a.id] = {
        id: a.id, cycle: a.cycle, activite: '', code: a.code, texte: a.texte,
        officiel: true, createdAt: new Date().toISOString()
      };
      n++;
    });
    obj.afcSeed = AFC_SEED;
    return n;
  }

  function afcAll() {
    state.afc = state.afc || {};
    return Object.keys(state.afc).map(function (k) { return state.afc[k]; });
  }
  function afcList(cycle, activiteId) {
    return sortBy(afcAll().filter(function (a) {
      if (cycle && a.cycle !== cycle) return false;
      if (activiteId && a.activite && a.activite !== activiteId) return false;
      return true;
    }), function (a) { return (a.code || '') + a.texte; });
  }
  function afcById(id) { state.afc = state.afc || {}; return state.afc[id] || null; }
  function newAfc(opts) {
    opts = opts || {};
    state.afc = state.afc || {};
    var a = {
      id: uid('afc'),
      cycle: opts.cycle || 'c4',
      activite: opts.activite || '',      // '' = tous les supports
      code: opts.code || '',
      texte: opts.texte || 'Nouvel attendu',
      createdAt: new Date().toISOString()
    };
    state.afc[a.id] = a;
    return a;
  }
  function removeAfc(id) {
    if (state.afc) delete state.afc[id];
    Object.keys(state.grids || {}).forEach(function (k) {
      (state.grids[k].items || []).forEach(function (it) {
        if (it.afcIds) it.afcIds = it.afcIds.filter(function (x) { return x !== id; });
      });
    });
  }

  function apsasOf(classId) {
    var c = state.classes[classId];
    if (!c) return [];
    c.apsas = c.apsas || [];
    return c.apsas;
  }
  function apsaById(classId, id) {
    var list = apsasOf(classId);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  /* L'APSA courante : celle choisie, sinon la première de la classe. */
  function currentApsa(classId) {
    classId = classId || state.ui.classId;
    var list = apsasOf(classId);
    if (!list.length) return null;
    return apsaById(classId, state.ui.apsaId) || list[0];
  }
  function newApsa(classId, activiteId, name) {
    var c = state.classes[classId];
    if (!c) return null;
    c.apsas = c.apsas || [];
    if (c.apsas.length >= MAX_APSA) return null;
    var act = activiteById(activiteId);
    var a = {
      id: uid('aps'),
      name: name || act.name,
      activite: act.id,
      createdAt: new Date().toISOString(),
      config: {
        criteria: copie(act.criteria),
        statIndicators: copie(act.indicators),
        statFields: copie(act.fields),
        format: copie(act.format),
        sources: copie(act.sources || { situations: 0.45, matchStats: 0.30, observation: 0.15, matchResult: 0.10 })
      }

  }
  function removeApsa(classId, apsaId) {
    var c = state.classes[classId];
    if (!c) return false;
    c.apsas = (c.apsas || []).filter(function (a) { return a.id !== apsaId; });
    Object.keys(state.lessons).forEach(function (k) {
      var l = state.lessons[k];
      if (l.classId === classId && l.apsaId === apsaId) delete state.lessons[k];
    });
    if (state.ui.apsaId === apsaId) state.ui.apsaId = (c.apsas[0] || {}).id || null;

  }

  /* La configuration effective : celle de l'APSA, ou les réglages généraux
     tant qu'aucune APSA n'existe (première ouverture, tests unitaires). */
  function cfg(apsa) {
    if (typeof apsa === 'string') apsa = apsaById(state.ui.classId, apsa);
    if (!apsa) apsa = currentApsa();
    return (apsa && apsa.config) ? apsa.config : state.settings;
  }
  function familleOf(apsa) {
    if (typeof apsa === 'string') apsa = apsaById(state.ui.classId, apsa);
    if (!apsa) apsa = currentApsa();
    return activiteById(apsa ? apsa.activite : state.settings.activite).famille || 'collectif';
  }
  function estDuel(apsa) { return familleOf(apsa) === 'duel'; }

  function criteria(apsa) { return cfg(apsa).criteria; }
  function critById(id, apsa) {
    var c = criteria(apsa);
    for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i];
    return null;
  }

  function newClass(name) {
    var id = uid('cls');
    state.classes[id] = {
      id: id, name: name || 'Nouvelle classe', createdAt: new Date().toISOString(),
      students: [], constraints: { together: [], apart: [] }, apsas: [],
      cycle: devineCycle(name)
    };
    return state.classes[id];
  }

  function newLesson(classId, opts) {
    opts = opts || {};
    var id = uid('les');
    /* Une leçon appartient à une APSA : c'est elle qui décide des critères,
       des relevés, des onglets affichés et du périmètre des indices. */
    var apsa = opts.apsaId ? apsaById(classId, opts.apsaId) : currentApsa(classId);
    if (!apsa) apsa = newApsa(classId, state.settings.activite || ACTIVITE_DEFAUT);
    var prior = classLessons(classId, apsa ? apsa.id : null);
    state.lessons[id] = {
      id: id, classId: classId, apsaId: apsa ? apsa.id : null,
      createdAt: new Date().toISOString(),
      date: opts.date || todayISO(),
      number: prior.length + 1,
      title: opts.title || ('Leçon ' + (prior.length + 1)),
      objective: '',
      attendance: {},
      roles: {},
      teamConfig: {
        mode: 'count', teamCount: 4, teamSize: 5,
        composition: 'equilibre',   // 'equilibre' | 'niveau'
        mixite: 'mixte', stability: 60
      },
      teams: [],
      situations: [],
      matches: [],
      matchConfig: defaultMatchConfig(apsa),
      observations: {},   // sid -> { critId: [ +1, -1, ... ] }
      evaluation: { gridId: null, teacher: {}, self: {}, comments: {} }
    };
    return state.lessons[id];
  }

  /* ------------------------------------------------------------- import CSV */

  function detectDelimiter(text) {
    var head = text.split(/\r?\n/).slice(0, 5).join('\n');
    var cands = [';', ',', '\t', '|'];
    var best = ';', bestScore = -1;
    cands.forEach(function (d) {
      var n = head.split(d).length - 1;
      if (n > bestScore) { bestScore = n; best = d; }
    });
    return bestScore > 0 ? best : ';';
  }

  function parseCSV(text, delim) {
    text = text.replace(/^﻿/, '');
    delim = delim || detectDelimiter(text);
    var rows = [], row = [], field = '', inQ = false, i = 0;
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === delim) { row.push(field); field = ''; i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      field += ch; i++;
    }
    row.push(field);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }

  /* Lecture d'un fichier avec repli sur Windows-1252 si l'UTF-8 produit des
     caractères de remplacement (cas classique des exports Pronote / Excel FR). */
  function readFileSmart(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var txt = fr.result;
      if (/�/.test(txt)) {
        var fr2 = new FileReader();
        fr2.onload = function () { cb(fr2.result); };
        fr2.onerror = function () { cb(txt); };
        try { fr2.readAsText(file, 'windows-1252'); }
        catch (e) { cb(txt); }
      } else cb(txt);
    };
    fr.onerror = function () { notify('Lecture du fichier impossible.'); };
    fr.readAsText(file, 'utf-8');
  }

  var HEADER_HINTS = {
    last: /^(nom|nom de famille|nom d.?[eé]l[eè]ve|nomeleve|name|lastname)$/i,
    first: /^(pr[eé]nom|prenom|firstname|pr[eé]nom de l.?[eé]l[eè]ve)$/i,
    full: /^(nom.?(et.?)?pr[eé]nom|pr[eé]nom.?(et.?)?nom|[eé]l[eè]ves?|eleves?|nom complet|identit[eé])$/i,
    sex: /^(sexe|genre|civilit[eé]|s|sex|gender|m\/f)$/i,
    group: /^(classe|division|groupe|class)$/i
  };

  /* Colonnes des exports d'appel qu'on ne veut jamais confondre avec un nom :
     l'export type du collège comporte « encouragement/valorisation » et
     « Né(e) le » entre la colonne des élèves et celle du sexe. */
  var HEADER_IGNORE = /^(encouragement|valorisation|encouragement.?\/?.?valorisation|n[ée]\(?e\)? le|date de naissance|naissance|observations?|remarques?|appr[eé]ciation)/i;

  function guessMapping(header) {
    var map = { last: -1, first: -1, full: -1, sex: -1, group: -1 };
    header.forEach(function (h, i) {
      var key = String(h).trim();
      if (HEADER_IGNORE.test(key)) return;          // colonne à ne pas utiliser
      Object.keys(HEADER_HINTS).forEach(function (k) {
        if (map[k] === -1 && HEADER_HINTS[k].test(key)) map[k] = i;
      });
    });
    /* Repli sur l'ordre de l'export type du collège :
       1 = Élèves · 2 = encouragement · 3 = Né(e) le · 4 = Sexe */
    if (map.full === -1 && map.last === -1 && map.first === -1 && header.length) map.full = 0;
    if (map.sex === -1 && header.length >= 4) {
      for (var i = 0; i < header.length; i++) {
        if (i === map.full || i === map.last || i === map.first) continue;
        if (HEADER_IGNORE.test(String(header[i]).trim())) continue;
        if (/^sexe?$/i.test(String(header[i]).trim())) { map.sex = i; break; }
      }
    }
    return map;
  }

  /* Repli sur le contenu : si aucun en-tête ne dit « sexe », on cherche la
     colonne dont les valeurs ressemblent à Masculin / Féminin. */
  function guessSexColumn(rows, startRow, exclude) {
    if (!rows.length) return -1;
    var cols = rows[0].length;
    for (var c = 0; c < cols; c++) {
      if (exclude.indexOf(c) > -1) continue;
      var seen = 0, ok = 0;
      for (var r = startRow; r < Math.min(rows.length, startRow + 12); r++) {
        var v = String((rows[r] || [])[c] || '').trim();
        if (!v) continue;
        seen++;
        if (normSex(v) !== 'X') ok++;
      }
      if (seen >= 2 && ok === seen) return c;
    }
    return -1;
  }

  function normSex(v) {
    var s = String(v || '').trim().toUpperCase();
    if (/^(F|FEM|FEMININ|FÉMININ|FILLE|MME|MADEMOISELLE|2)$/.test(s)) return 'F';
    if (/^(M|G|MAS|MASCULIN|GARCON|GARÇON|H|HOMME|1)$/.test(s)) return 'M';
    return 'X';
  }

  /* Une colonne qui réunit le nom et le prénom, dans un sens ou dans l'autre.

     Deux indices, dans cet ordre. D'abord la casse : un bloc tout en
     majuscules est le nom de famille, où qu'il se trouve — « DUPONT Marie »
     comme « Marie DUPONT » se lisent alors sans se tromper, et les prénoms
     composés suivent. Ensuite seulement, l'ordre annoncé par l'enseignant :
     « Nom Prénom » ou « Prénom Nom », qui tranche quand la casse ne dit rien
     (« Dupont Marie »). */
  function splitFullName(v, ordre) {
    ordre = ordre || 'auto';
    var s = String(v || '').trim().replace(/\s+/g, ' ');
    if (s.indexOf(',') > -1) {
      var p = s.split(',');
      var a = p[0].trim(), b = (p[1] || '').trim();
      return ordre === 'prenomNom' ? { first: a, last: b } : { last: a, first: b };
    }
    var words = s.split(' ').filter(Boolean);
    if (words.length < 2) return { last: words[0] || '', first: '' };

    var upper = [], rest = [];
    words.forEach(function (w) {
      if (w.length > 1 && w === w.toLocaleUpperCase('fr') && /[\p{Lu}]/u.test(w)) upper.push(w);
      else rest.push(w);
    });
    if (upper.length && rest.length) return { last: upper.join(' '), first: rest.join(' ') };

    if (ordre === 'prenomNom') {
      return { first: words[0], last: words.slice(1).join(' ') };
    }
    return { last: words[0], first: words.slice(1).join(' ') };
  }

  /* Devine l'ordre d'une colonne « nom complet » à partir de son en-tête, puis
     de son contenu : « Prénom Nom » dans le titre, ou des lignes où le bloc en
     majuscules arrive en dernier. */
  var HEADER_PRENOM_NOM = /pr[eé]nom[\s_\-/]*(et[\s_\-/]*)?nom/i;
  function guessNameOrder(header, rows, col, startRow) {
    if (col < 0) return 'auto';
    if (header && HEADER_PRENOM_NOM.test(String(header[col] || ''))) return 'prenomNom';
    var avant = 0, apres = 0;
    for (var i = startRow; i < Math.min(rows.length, startRow + 12); i++) {
      var s = String((rows[i] || [])[col] || '').trim().replace(/\s+/g, ' ');
      var w = s.split(' ').filter(Boolean);
      if (w.length < 2) continue;
      var estMaj = function (x) {
        return x.length > 1 && x === x.toLocaleUpperCase('fr') && /[\p{Lu}]/u.test(x);
      };
      var premier = estMaj(w[0]), dernier = estMaj(w[w.length - 1]);
      if (premier && !dernier) avant++;
      else if (dernier && !premier) apres++;
    }
    if (apres > avant) return 'prenomNom';
    if (avant > apres) return 'nomPrenom';
    return 'auto';
  }

  function rowsToStudents(rows, map, hasHeader) {
    var out = [], start = hasHeader ? 1 : 0;
    for (var i = start; i < rows.length; i++) {
      var r = rows[i], first = '', last = '';
      if (map.full > -1 && map.first === -1 && map.last === -1) {
        var sp = splitFullName(r[map.full], map.ordre);
        first = sp.first; last = sp.last;
      } else {
        first = map.first > -1 ? String(r[map.first] || '').trim() : '';
        last = map.last > -1 ? String(r[map.last] || '').trim() : '';
      }
      if (!first && !last) continue;
      out.push({
        id: uid('stu'),
        first: titleCase(first),
        last: last.toLocaleUpperCase('fr'),
        sex: map.sex > -1 ? normSex(r[map.sex]) : 'X',
        group: map.group > -1 ? String(r[map.group] || '').trim() : '',
        note: ''
      });
    }
    return out;
  }

  function titleCase(s) {
    return String(s || '').toLocaleLowerCase('fr').replace(/(^|[\s'\-])([\p{L}])/gu, function (m, a, b) {
      return a + b.toLocaleUpperCase('fr');
    });
  }

  /* ----------------------------------------------------------------- images
     Les images jointes aux messages sont stockées en clair dans la sauvegarde :
     on les réduit avant enregistrement, sinon deux photos suffisent à saturer
     le stockage local du navigateur. */
  /* ------------------------------------------------------- poids du stockage
     Tout tient dans le stockage local du navigateur, plafonné à ~5 Mo par
     adresse. Le texte ne pèse rien ; ce sont les images (schémas et
     illustrations de messages) qui remplissent l'espace, chacune quelques
     dizaines de kilo-octets. D'où ces trois outils : mesurer, détailler,
     et alléger. */
  var STORAGE_LIMIT = 5 * 1024 * 1024;

  /* Parcourt toutes les images du modèle, quelles qu'en soient les clés. */
  function eachImage(obj, fn, chemin) {
    if (!obj || typeof obj !== 'object') return;
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (typeof v === 'string') {
        if (v.slice(0, 11) === 'data:image/') fn(obj, k, v, (chemin || '') + '/' + k);
      } else if (v && typeof v === 'object') {
        eachImage(v, fn, (chemin || '') + '/' + k);
      }
    });
  }

  function storageInfo() {
