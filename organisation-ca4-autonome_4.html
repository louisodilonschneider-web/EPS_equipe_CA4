        inp.value = Math.max(0, v); K.data.score = +inp.value; return true;
      }
      case 'k.save': {
        var inp2 = document.getElementById('kscore');
        if (!inp2 || inp2.value === '' || !isFinite(+inp2.value)) { UI.toast('Saisis ton score.'); return true; }
        var sit3 = TRAINING.sitById(l, K.data.sitId);
        var reco = PROGRESS.recommendedLevelForGroup(sit3, K.data.members || []);
        var attempt = {
          id: A.uid('att'), ts: new Date().toISOString(),
          members: (K.data.members || []).slice(), value: +inp2.value,
          levelId: K.data.levelId || null, recommendedLevelId: reco
        };
        var ev = null;
        A.set(function () {
          sit3.attempts.push(attempt);
          ev = PROGRESS.applyAttempt(sit3, attempt);
        });
        K.data.score = +inp2.value;
        if (ev) go('feedback', { ev: ev });
        else { UI.toast('Score enregistré.'); go('group'); }
        return true;
      }
      case 'k.again': {
        var sit4 = TRAINING.sitById(l, K.data.sitId);
        A.set(function () {
          (K.data.members || []).forEach(function (sid) { PROGRESS.dismissMessage(sit4, sid, true); });
        });
        K.data.levelId = PROGRESS.recommendedLevelForGroup(sit4, K.data.members || []);
        K.data.score = null;
        go('level'); return true;
      }
      case 'k.pickmatch': K.data.mi = +el.getAttribute('data-i'); go('match'); return true;
      case 'k.pickround': K.data.round = +el.getAttribute('data-r'); go('round'); return true;
      case 'k.coopduo': {
        var idc = el.getAttribute('data-id');
        var sitC = TRAINING.sitById(l, K.data.sitId);
        if (sitC && TRAINING.coopEtat(l, sitC).fini) { render(); return true; }
        K.data.coopMsg = null;
        if (!idc) K.data.duo = [];
        else {
          var cfgC = TRAINING.coopConfig(sitC);
          K.data.duo = K.data.duo || [];
          var pos = K.data.duo.indexOf(idc);
          if (pos > -1) K.data.duo.splice(pos, 1);
          else if (cfgC.uniques && TRAINING.coopDejaVus(sitC, K.data.duo.concat([idc])).length) {
            /* la fiche interdit de refaire un groupe déjà formé */
            render(); return true;
          }
          else if (K.data.duo.length < cfgC.taille) K.data.duo.push(idc);
          else K.data.duo = K.data.duo.slice(1).concat([idc]);   // le plus ancien cède sa place
        }
        render(); return true;
      }
      case 'k.coopres': {
        var sitR = TRAINING.sitById(l, K.data.sitId);
        if (!sitR) return true;
        var cfg = TRAINING.coopConfig(sitR);
        if ((K.data.duo || []).length !== cfg.taille) return true;
        if (TRAINING.coopEtat(l, sitR).fini) { render(); return true; }
        if (cfg.uniques && TRAINING.coopDejaVus(sitR, K.data.duo).length) { render(); return true; }
        var reussi = el.getAttribute('data-v') === '1';
        var duo = K.data.duo.slice();
        A.set(function () { TRAINING.coopRecord(l, sitR, duo, reussi, null); });
        K.data.coopMsg = {
          reussi: reussi,
          texte: listeNoms(duo) + ' : ' +
            (reussi
              ? 'objectif atteint, + ' + cfg.ptsReussite + ' point' + (cfg.ptsReussite > 1 ? 's' : '') + ' chacun !'
              : '+ ' + cfg.ptsEchec + ' point' + (cfg.ptsEchec > 1 ? 's' : '') + ' chacun. Changez de partenaire et retentez.')
        };
        K.data.duo = [];
        go('group'); return true;
      }
      case 'k.duel': {
        var sitD = TRAINING.sitById(l, K.data.sitId);
        if (!sitD) return true;
        var du = TRAINING.liveDuels(l, sitD)[+el.getAttribute('data-d')];
        if (!du) return true;
        var kd = el.getAttribute('data-side') === 'A' ? 'scoreA' : 'scoreB';
        var autre = kd === 'scoreA' ? 'scoreB' : 'scoreA';
        var dv = +el.getAttribute('data-v');
        A.set(function () {
          du[kd] = Math.max(0, (+du[kd] || 0) + dv);
          /* l'écran affiche 0 en face : dès qu'un point est marqué, l'opposition
             est commencée et son résultat compte, 0 compris */
          if (du[autre] == null) du[autre] = 0;
        });
        render(); return true;
      }
      case 'k.score': {
        var m = l.matches[el.getAttribute('data-mi') != null ? +el.getAttribute('data-mi') : K.data.mi];
        var side = el.getAttribute('data-side'), d = +el.getAttribute('data-v');
        A.set(function () {
          var key = side === 'A' ? 'scoreA' : 'scoreB';
          m[key] = Math.max(0, (+m[key] || 0) + d);
        });
        render(); return true;
      }
      case 'k.stat': {
        var m3 = l.matches[el.getAttribute('data-mi') != null ? +el.getAttribute('data-mi') : K.data.mi];
        var sid2 = el.getAttribute('data-sid'), f = el.getAttribute('data-f'), dd = +el.getAttribute('data-d');
        var side2 = el.getAttribute('data-side');
        var fld = LESSON.activeFields(l).filter(function (x) { return x.id === f; })[0];
        A.set(function () {
          m3.stats = m3.stats || {};
          m3.stats[sid2] = m3.stats[sid2] || {};
          var before = +m3.stats[sid2][f] || 0;
          var after = Math.max(0, before + dd);
          m3.stats[sid2][f] = after;
          /* Un relevé qui vaut des points (les buts) modifie aussi le score. */
          if (fld && +fld.points > 0 && side2) {
            var key = side2 === 'A' ? 'scoreA' : 'scoreB';
            m3[key] = Math.max(0, (+m3[key] || 0) + (after - before) * (+fld.points));
          }
        });
        render(); return true;
      }
      case 'k.pickself': K.data.sid = el.getAttribute('data-id'); go('self'); return true;
      case 'k.self': {
        var c = el.getAttribute('data-c'), v = +el.getAttribute('data-v');
        A.set(function () {
          l.evaluation.self[K.data.sid] = l.evaluation.self[K.data.sid] || {};
          l.evaluation.self[K.data.sid][c] = v;
        });
        render(); return true;
      }
      /* Effacer une auto-évaluation faite sous le mauvais prénom. On demande
         confirmation — un clic malheureux ne doit pas effacer le travail d'un
         camarade — mais pas le code enseignant : la tablette circule, et
         l'erreur se corrige là où elle se produit. */
      case 'k.selfclear': {
        var qui = el.getAttribute('data-id') || K.data.sid;
        UI.modal({
          title: 'Effacer cette auto-évaluation ?',
          okLabel: 'Effacer',
          body: '<p>Les réponses enregistrées sous le nom de <b>' + e(nameOf(qui)) + '</b> ' +
            'seront supprimées, et la mention « fait » disparaîtra de la liste. ' +
            'C\'est ce qu\'il faut faire quand on s\'est trompé de prénom.</p>',
          onOk: function () {
            A.set(function () {
              if (l.evaluation && l.evaluation.self) delete l.evaluation.self[qui];
            });
            K.data.sid = null;
            go('home');
            UI.toast('Auto-évaluation effacée.');
          }
        });
        return true;
      }
    }
    return false;
  }

  return { open: open, close: close, handle: handle, nextLevelBlock: nextLevelBlock, askCode: askCode, isOpen: function () { return K.open; }, render: render };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — routeur, navigation et répartition des actions
   ========================================================================== */
'use strict';

var MAIN = (function () {

  var A = APP, e = APP.escapeHtml;

  /* L'ordre suit le parcours réel d'une séance :
     on choisit la classe, puis la leçon (dans laquelle on fait l'appel avant
     de composer les équipes, lancer les situations ou saisir les matchs),
     puis viennent les réglages durables : contraintes, statistiques, réglages. */
  var NAV = [
    { k: 'classes', l: '1. Classes' },
    { k: 'lessons', l: '2. Leçons', needClass: true },
    { k: 'constraints', l: 'Contraintes', needClass: true },
    { k: 'stats', l: 'Statistiques', needClass: true },
    { k: 'settings', l: 'Réglages' },
    { k: 'bank', l: 'Situations' }
  ];

  /* ================================================================= rendu */

  function render() {
    var st = A.get();
    var cls = A.currentClass();
    var view = st.ui.view || 'classes';
    if (NAV.filter(function (n) { return n.k === view; })[0] &&
        NAV.filter(function (n) { return n.k === view; })[0].needClass && !cls) {
      view = 'classes'; st.ui.view = 'classes';
    }

    /* L'onglet Évaluation travaille toujours sur une leçon : à défaut de choix
       explicite, on prend la plus récente de la classe. */
    if (cls && view === 'stats' && (st.ui.statsTab || 'eleves') === 'eval') {
      var ls = A.classLessons(cls.id);
      var valid = st.ui.lessonId && st.lessons[st.ui.lessonId] && st.lessons[st.ui.lessonId].classId === cls.id;
      if (!valid && ls.length) st.ui.lessonId = ls[ls.length - 1].id;
    }

    var nav = document.getElementById('nav');
    nav.innerHTML = NAV.filter(function (n) { return !n.needClass || cls; }).map(function (n) {
      return '<button data-act="nav" data-v="' + n.k + '"' + (view === n.k ? ' aria-current="page"' : '') + '>' + n.l + '</button>';
    }).join('');

    var ctx = document.getElementById('ctx');
    ctx.innerHTML = cls
      ? '<span class="context-pill">' + e(cls.name) +
        (A.currentLesson() && view === 'lessons' ? ' · ' + e(A.currentLesson().title) : '') + '</span>'
      : '';

    var main = document.getElementById('main');
    var html;
    switch (view) {
      case 'lessons': html = LESSON.view(); break;
      case 'constraints': html = VIEWS.constraints(); break;
      case 'stats': html = VIEWS.stats(); break;
      case 'students': case 'model': html = VIEWS.stats(); break;   // anciens noms
      case 'settings': html = VIEWS.settings(); break;
      case 'bank': html = BANK.view(); break;
      default: html = VIEWS.classes();
    }
    main.innerHTML = html;
    applyTheme();
  }

  /* Petit voyant de synchronisation dans la barre du haut. */
  function renderCloudPill() {
    var el = document.getElementById('cloudpill');
    if (!el) return;
    var st = APP.cloud.status();
    if (st.phase === 'off') { el.innerHTML = ''; return; }
    var map = {
      loading: ['', 'connexion…'],
      'signed-out': ['warn', 'non connecté'],
      on: [st.pending ? 'accent' : 'ok', st.pending ? 'envoi…' : 'synchronisé'],
      offline: ['warn', 'hors ligne'],
      error: ['bad', 'erreur de synchro']
    };
    var m = map[st.phase] || ['', st.phase];
    el.innerHTML = '<span class="badge ' + m[0] + '" title="' + e(st.message || '') +
      '" data-act="nav" data-v="settings" style="cursor:pointer">☁ ' + e(m[1]) + '</span>';
  }

  function applyTheme() {
    var t = A.get().settings.theme || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  /* =============================================================== actions */

  function nearestAct(el) {
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-act')) return el;
      el = el.parentNode;
    }
    return null;
  }

  function onClick(ev) {
    /* Un champ de formulaire gère lui-même son événement : sans cela, le
       menu déroulant « rôle » placé dans une carte déclencherait le clic de
       la carte qui l'entoure. */
    var tn = ev.target && ev.target.tagName;
    if (tn === 'SELECT' || tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'OPTION' || tn === 'LABEL') return;
    var el = nearestAct(ev.target);
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (KIOSK.isOpen() && act.indexOf('k.') === 0) {
      if (KIOSK.handle(act, el)) { ev.preventDefault(); return; }
    }
    var st = A.get(), cls = A.currentClass(), l = A.currentLesson();
    var id = el.getAttribute('data-id');

    switch (act) {
      /* ------------------------------------------------------------ nav */
      case 'nav': {
        /* Cliquer sur « Leçons » ramène toujours à la liste, pour pouvoir
           rouvrir une leçon passée ou déjà préparée. La banque, elle, garde la
           leçon en mémoire : c'est ce qui permet d'y insérer une situation. */
        var dest = el.getAttribute('data-v');
        A.set(function (s) {
          s.ui.view = dest;
          if (dest === 'lessons') s.ui.lessonId = null;
        });
        break;
      }

      /* Le récapitulatif « ce qui alimente l'indice » vit dans Statistiques,
         mais la question se pose au moment où l'on règle les relevés : le
         bouton y emmène directement. */
      case 'apport':
        A.set(function (s) { s.ui.view = 'stats'; s.ui.statsTab = 'apport'; });
        break;

      /* --------------------------------------------------------- classes */
      case 'class.import': VIEWS.startImport(); break;
      case 'class.new':
        /* Une classe neuve n'a pas encore d'APSA : on l'ouvre donc sur ses
           leçons, là où le bandeau invite à créer le premier cycle. */
        UI.ask('Nouvelle classe', 'Nom de la classe', '5e B', function (v) {
          A.set(function (s) {
            var c = A.newClass(v || 'Classe');
            s.ui.classId = c.id;
            s.ui.apsaId = null;
            s.ui.lessonId = null;
            s.ui.view = 'lessons';
          });
        });
        break;
      case 'class.open':
        A.set(function (s) {
          s.ui.classId = id; s.ui.view = 'lessons'; s.ui.lessonId = null;
          var prem = A.apsasOf(id)[0];
          if (!A.apsaById(id, s.ui.apsaId)) s.ui.apsaId = prem ? prem.id : null;
        });
        break;
      case 'class.rename':
        UI.ask('Renommer', 'Nom de la classe', st.classes[id].name, function (v) {
          A.set(function () { st.classes[id].name = v || st.classes[id].name; });
        });
        break;
      case 'class.delete':
        UI.confirm('Supprimer la classe', 'Toutes les leçons, situations et notes de <b>' + e(st.classes[id].name) +
          '</b> seront définitivement effacées. Pense à exporter une sauvegarde avant.', function () {
          A.set(function (s) {
            Object.keys(s.lessons).forEach(function (k) { if (s.lessons[k].classId === id) delete s.lessons[k]; });
            delete s.classes[id];
            if (s.ui.classId === id) { s.ui.classId = null; s.ui.view = 'classes'; }
          });
        }, 'Supprimer');
        break;
      case 'demo.seed': seedDemo(); break;

      /* ---------------------------------------------------------- élèves */
      case 'student.open': VIEWS.studentProfile(id); break;
      case 'student.add':
        UI.modal({
          title: 'Ajouter un élève',
          body: '<div class="grid cols-2"><label class="field"><span>Nom</span><input name="n"></label>' +
            '<label class="field"><span>Prénom</span><input name="p"></label></div>' +
            '<label class="field"><span>Sexe</span><select name="s"><option value="F">Fille</option>' +
            '<option value="M">Garçon</option><option value="X">Non renseigné</option></select></label>',
          onOk: function (d) {
            var n = d.querySelector('[name=n]').value.trim();
            var p = d.querySelector('[name=p]').value.trim();
            if (!n && !p) return;
            A.set(function () {
              cls.students.push({ id: A.uid('stu'), last: n.toLocaleUpperCase('fr'), first: p, sex: d.querySelector('[name=s]').value, note: '' });
            });
          }
        });
        break;
      case 'students.exportCsv': exportStudents(); break;

      /* ----------------------------------------------------- contraintes */
      case 'constraint.add': VIEWS.addConstraint(el.getAttribute('data-kind')); break;
      case 'constraint.del':
        A.set(function () { cls.constraints[el.getAttribute('data-kind')].splice(+el.getAttribute('data-i'), 1); });
        break;

      /* --------------------------------------------------------- leçons */
      case 'lesson.new':
        UI.modal({
          title: 'Nouvelle leçon',
          body: '<div class="grid cols-2">' +
            '<label class="field"><span>Titre</span><input name="t" value="Leçon ' + (A.classLessons(cls.id).length + 1) + '"></label>' +
            '<label class="field"><span>Date</span><input type="date" name="d" value="' + A.todayISO() + '"></label></div>' +
            '<label class="field"><span>Objectif de la leçon</span><input name="o" placeholder="ex. Progresser vers la zone d\'en-but par des passes courtes"></label>',
          onOk: function (d) {
            A.set(function (s) {
              var nl = A.newLesson(cls.id, { title: d.querySelector('[name=t]').value, date: d.querySelector('[name=d]').value });
              nl.objective = d.querySelector('[name=o]').value;
              /* reprise des présences et du réglage d'équipes de la leçon précédente */
              var prev = A.classLessons(cls.id).filter(function (x) { return x.id !== nl.id; }).pop();
              if (prev) { nl.teamConfig = JSON.parse(JSON.stringify(prev.teamConfig)); }
              s.ui.lessonId = nl.id; s.ui.tab = 'presence'; s.ui.view = 'lessons';
            });
          }
        });
        break;
      case 'lesson.open': A.set(function (s) { s.ui.lessonId = id; s.ui.tab = 'presence'; s.ui.view = 'lessons'; }); break;
      case 'lesson.back': A.set(function (s) { s.ui.lessonId = null; }); break;
      case 'lesson.tab': A.set(function (s) { s.ui.tab = el.getAttribute('data-t'); }); break;
      case 'lesson.del':
        UI.confirm('Supprimer la leçon', 'Les situations, scores et matchs de cette leçon seront effacés.', function () {
          A.set(function (s) { delete s.lessons[id]; if (s.ui.lessonId === id) s.ui.lessonId = null; });
        }, 'Supprimer');
        break;
      case 'lesson.edit':
        UI.modal({
          title: 'En-tête de la leçon',
          body: '<div class="grid cols-2">' +
            '<label class="field"><span>Titre</span><input name="t" value="' + e(l.title) + '"></label>' +
            '<label class="field"><span>Date</span><input type="date" name="d" value="' + e(l.date) + '"></label></div>' +
            '<label class="field"><span>Objectif</span><input name="o" value="' + e(l.objective || '') + '"></label>',
          onOk: function (d) {
            A.set(function () {
              l.title = d.querySelector('[name=t]').value || l.title;
              l.date = d.querySelector('[name=d]').value || l.date;
              l.objective = d.querySelector('[name=o]').value;
            });
          }
        });
        break;

      /* ------------------------------------------------------ présences */
      case 'att.set': A.set(function () { l.attendance[id] = el.getAttribute('data-v'); }); break;
      case 'att.cycle': {
        /* présent → absent → blessé → présent */
        var order = ['present', 'absent', 'injured'];
        var cur2 = l.attendance[id] || 'present';
        var nxt = order[(order.indexOf(cur2) + 1) % order.length];
        A.set(function () {
          l.attendance[id] = nxt;
          if (nxt !== 'injured') delete l.roles[id];
        });
        break;
      }
      case 'att.all':
        A.set(function () { cls.students.forEach(function (s) { l.attendance[s.id] = el.getAttribute('data-v'); }); });
        break;
      case 'att.copyPrev': {
        var prevL = A.classLessons(cls.id).filter(function (x) { return x.id !== l.id; }).pop();
        if (!prevL) { UI.toast('Aucune leçon précédente.'); break; }
        A.set(function () { l.attendance = JSON.parse(JSON.stringify(prevL.attendance || {})); });
        UI.toast('Présences reprises.');
        break;
      }

      /* -------------------------------------------------------- équipes */
      case 'teams.compose': LESSON.compose(); break;
      case 'teams.reuse': LESSON.reusePrevious(); break;
      case 'teams.clear': A.set(function () { l.teams = []; }); break;
      case 'teams.project': LESSON.project(); break;
      case 'project.close': { var p = document.getElementById('projector'); if (p) p.remove(); break; }
      case 'teams.pick': {
        /* Touche un élève, puis touche l'équipe d'arrivée — ou directement un
           élève de cette équipe, ce qui revient au même et évite de viser
           le vide sur une tablette. */
        var sel = st.ui.selectedPlayer;
        if (sel && sel !== id) {
          var target = l.teams.filter(function (t) { return t.members.indexOf(id) > -1; })[0];
          var origin = l.teams.filter(function (t) { return t.members.indexOf(sel) > -1; })[0];
          if (target && origin && target.id !== origin.id) {
            LESSON.movePlayer(sel, target.id);
            ev.stopPropagation();
            ev.preventDefault();
            return;
          }
        }
        A.set(function (s) { s.ui.selectedPlayer = (sel === id) ? null : id; });
        ev.stopPropagation();
        break;
      }
      case 'teams.drop':
        if (st.ui.selectedPlayer) LESSON.movePlayer(st.ui.selectedPlayer, el.getAttribute('data-team'));
        break;
      case 'obs.edit':
        LESSON.editObservation(id);
        ev.stopPropagation();
        break;
      case 'teams.unselect': A.set(function (s) { s.ui.selectedPlayer = null; }); break;
      case 'team.color': {
        var tid = el.getAttribute('data-team');
        var tm = l.teams.filter(function (x) { return x.id === tid; })[0];
        if (!tm) break;
        var pris = {};
        l.teams.forEach(function (o) { if (o.id !== tm.id) pris[String(o.color).toLowerCase()] = o.name; });
        var swatches = A.TEAM_PALETTE.map(function (p) {
          var used = pris[p.color.toLowerCase()];
          return '<button type="button" class="pal-chip' +
            (p.color.toLowerCase() === String(tm.color).toLowerCase() ? ' is-on' : '') +
            (used ? ' is-used' : '') + '" data-color="' + p.color + '" data-name="' + A.escapeHtml(p.name) + '"' +
            ' title="' + A.escapeHtml(used ? 'Déjà portée par ' + used : 'Chasuble ' + p.name) + '">' +
            '<span class="pal-dot" style="background:' + p.color + '"></span>' +
            '<span class="pal-lbl">' + A.escapeHtml(p.name) + (used ? ' •' : '') + '</span></button>';
        }).join('');
        UI.modal({
          title: 'Couleur de chasuble',
          body: '<p class="muted small">Choisis la couleur portée par cette équipe. Le point signale une couleur déjà attribuée à une autre équipe.</p>' +
            '<div class="pal-grid">' + swatches + '</div>' +
            '<label class="f">Nom affiché (facultatif)' +
            '<input type="text" data-f="nom" value="' + A.escapeHtml(tm.name) + '"></label>',
          okLabel: 'Appliquer',
          onOpen: function (panel) {
            panel.addEventListener('click', function (evt) {
              var c = evt.target.closest ? evt.target.closest('.pal-chip') : null;
              if (!c) return;
              evt.preventDefault();
              evt.stopPropagation();
              Array.prototype.forEach.call(panel.querySelectorAll('.pal-chip'), function (x) {
                x.classList.remove('is-on');
              });
              c.classList.add('is-on');
              panel.querySelector('[data-f="nom"]').value = c.getAttribute('data-name');
            }, true);
          },
          onOk: function (panel) {
            var chip = panel.querySelector('.pal-chip.is-on');
            var nom = (panel.querySelector('[data-f="nom"]').value || '').trim();
            A.set(function () {
              if (chip) tm.color = chip.getAttribute('data-color');
              if (nom) { tm.name = nom; tm.renamed = true; }
            });
          }
        });
        ev.stopPropagation();
        break;
      }
      case 'round.stats': LESSON.editRoundStats(+el.getAttribute('data-r')); break;

      /* ----------------------------------------------------- situations */
      case 'sit.new': TRAINING.edit(null, el.getAttribute('data-kind')); break;
      case 'sit.bank':
        A.set(function (s) { s.ui.view = 'bank'; s.ui.bankKind = el.getAttribute('data-kind') || 'tous'; });
        break;
      case 'sit.toBank': BANK.saveFromSituation(id); break;
      case 'sit.fp': {
        var sitF = TRAINING.sitById(l, id);
        if (!sitF) break;
        A.set(function () { TRAINING.toggleFair(l, sitF, el.getAttribute('data-u')); });
        break;
      }
      case 'sit.fpadj': TRAINING.editFairplay(id); break;
      case 'sit.kind': {
        var vers = null;
        A.set(function (s) {
          vers = TRAINING.switchKind(l, id);
          if (vers) s.ui.tab = vers === 'echauffement' ? 'warmup' : 'training';
        });
        if (vers) {
          UI.toast('Fiche déplacée dans ' +
            (vers === 'echauffement' ? 'l\'échauffement' : 'les situations') + '.');
        }
        break;
      }
      case 'sit.move': {
        var dir = +el.getAttribute('data-dir');
        if (TRAINING.move(l, id, dir)) A.set(function () {});
        break;
      }
      case 'bank.new': BANK.create(el.getAttribute('data-kind')); break;
      case 'bank.edit': BANK.edit(id); break;
      case 'bank.dup': BANK.duplicate(id); break;
      case 'bank.del': BANK.remove(id); break;
      case 'bank.use': BANK.useInLesson(id); break;
      case 'bank.folderNew':
        /* Sur un bandeau de dossier, le bouton crée un sous-dossier ; dans la
           barre du haut, un dossier à la racine. */
        BANK.newFolder('', id || null);
        ev.stopPropagation();
        break;
      case 'bank.fold': BANK.toggleFolder(id); break;
      case 'bank.folderOut': BANK.removeFrom(id, el.getAttribute('data-f')); break;
      case 'bank.foldAll': BANK.setAllFolders(el.getAttribute('data-v') === '1'); break;
      case 'bank.folderRename': BANK.renameFolder(id); ev.stopPropagation(); break;
      case 'bank.folderDel': BANK.removeFolder(id); ev.stopPropagation(); break;
      case 'bank.export': BANK.exportBank(); break;
      case 'bank.import': BANK.importBank(); break;
      case 'sit.edit': TRAINING.edit(id); break;
      case 'sit.groups': TRAINING.editGroups(id); break;
      case 'sit.project': TRAINING.projectGroups(id); break;
      /* ------------------------------------------------- rencontres (CA4) */
      case 'arena.mode':
        A.set(function () { ARENA.setMode(l, el.getAttribute('data-m')); });
        break;
      case 'arena.compose': ARENA.editCompose(l); break;
      case 'arena.groupes': ARENA.editGroupes(l); break;
      case 'arena.relance':
        ARENA.editRelance(l, el.getAttribute('data-g'));
        break;
      case 'arena.plan': {
        var nRen = 0;
        A.set(function () { nRen = ARENA.planifier(l); });
        UI.toast(nRen + ' rencontre(s) générée(s).');
        break;
      }
      case 'arena.score': ARENA.editScore(l, id); break;
      case 'arena.add': ARENA.editAdd(l, el.getAttribute('data-g')); break;
      case 'arena.defi': ARENA.editDefi(l); break;
      case 'arena.rules': ARENA.editRegles(l); break;
      case 'arena.fp':
        A.set(function () { ARENA.toggleFair(l, el.getAttribute('data-u')); });
        break;
      case 'arena.fpadj': ARENA.editFairplay(l); break;
      case 'arena.releves': ARENA.editReleves(l); break;
      case 'arena.del':
        A.set(function () {
          var ar = ARENA.arenaOf(l);
          ar.matches = ar.matches.filter(function (m) { return m.id !== id; });
        });
        break;
      case 'arena.move':
        A.set(function () { ARENA.bouger(l, id, +el.getAttribute('data-dir')); });
        break;
      case 'arena.moveall': {
        var props = ARENA.propositions(l);
        A.set(function () {
          props.forEach(function (p) { ARENA.bouger(l, p.sid, p.sens); });
        });
        UI.toast(props.length + ' mouvement(s) appliqué(s).');
        break;
      }
      case 'arena.up':
        A.set(function () {
          var ech = ARENA.echelle(l);
          var i = ech.indexOf(id), j = i + (+el.getAttribute('data-dir') < 0 ? -1 : 1);
          if (i < 0 || j < 0 || j >= ech.length) return;
          var tmp = ech[i]; ech[i] = ech[j]; ech[j] = tmp;
          ARENA.arenaOf(l).echelle = ech;
        });
        break;
      case 'arena.ladder':
        UI.confirm('Refaire l\'échelle',
          'L\'échelle sera reconstruite dans l\'ordre des indices du moment. ' +
          'Les défis déjà joués restent enregistrés.',
          function () {
            A.set(function () { ARENA.arenaOf(l).echelle = []; ARENA.echelle(l); });
            UI.toast('Échelle refaite.');
          }, 'Refaire');
        break;
      case 'sit.attempt': TRAINING.recordAttempt(id); break;
      case 'sit.batch': TRAINING.recordBatch(id); break;
      case 'sit.coop': TRAINING.recordCoop(id); break;
      case 'sit.coopstop': TRAINING.coopToggleStop(id); break;
      case 'sit.coopretro': TRAINING.recordCoopRetro(id); break;
      case 'sit.duels': {
        var sitD = TRAINING.sitById(l, id);
        if (!sitD) break;
        var refaire = TRAINING.liveDuels(l, sitD).some(function (d) {
          return d.scoreA != null || d.scoreB != null;
        });
        if (refaire) {
          UI.confirm('Refaire les oppositions',
            'Les scores déjà saisis pour cet échauffement seront effacés.',
            function () { TRAINING.editDuels(id); }, 'Continuer');
        } else TRAINING.editDuels(id);
        break;
      }
      case 'sit.del':
        UI.confirm('Supprimer la situation', 'Les scores et les paliers atteints seront perdus.', function () {
          A.set(function () { l.situations = l.situations.filter(function (x) { return x.id !== id; }); });
        }, 'Supprimer');
        break;
      /* Effacer une tentative efface aussi ce qu'elle avait produit : palier
         atteint, recommandation et message. Sans cela, l'essai fait par
         l'enseignant avant le cours continuerait d'orienter les élèves. */
      case 'sit.attemptDel': {
        var sitA = TRAINING.sitById(l, id);
        if (!sitA) break;
        var aid = el.getAttribute('data-a');
        A.set(function () { PROGRESS.removeAttempt(sitA, aid); });
        UI.toast('Tentative effacée — paliers et recommandations recalculés.');
        break;
      }
      case 'sit.reset': {
        var sitR = TRAINING.sitById(l, id);
        if (!sitR) break;
        if (TRAINING.isMatchFormat(sitR)) {
          var joues = TRAINING.liveDuels(l, sitR).filter(function (d) {
            return d.scoreA != null || d.scoreB != null;
          }).length;
          if (!joues) { UI.toast('Aucun score à effacer.'); break; }
          UI.confirm('Effacer les scores',
            'Les scores des <b>' + joues + '</b> opposition(s) de « ' + e(sitR.name) + ' » seront effacés. ' +
            'Les oppositions elles-mêmes sont conservées.', function () {
            A.set(function () {
              (sitR.duels || []).forEach(function (d) { d.scoreA = null; d.scoreB = null; });
            });
            UI.toast('Scores effacés.');
          }, 'Effacer');
          break;
        }
        var nb = (sitR.attempts || []).length;
        if (!nb) { UI.toast('Aucun résultat à effacer.'); break; }
        UI.confirm('Effacer les résultats',
          'Les <b>' + nb + '</b> tentative(s) de « ' + e(sitR.name) + ' » seront effacées, ' +
          'ainsi que les paliers atteints, les recommandations et les messages qui en découlent. ' +
          'La situation repart à zéro — c\'est ce qu\'il faut après l\'avoir essayée toi-même.',
          function () {
            A.set(function () { PROGRESS.clearAttempts(sitR); });
            UI.toast(nb + ' tentative(s) effacée(s). La situation repart à zéro.');
          }, 'Tout effacer');
        break;
      }

      /* --------------------------------------------------------- matchs */
      case 'match.add': LESSON.addMatch(); break;
      case 'match.roundrobin': LESSON.roundRobin(); break;
      case 'match.config': LESSON.editMatchConfig(); break;
      case 'match.stats': LESSON.editStats(+el.getAttribute('data-i')); break;
      case 'match.del':
        A.set(function () { l.matches.splice(+el.getAttribute('data-i'), 1); });
        break;
      case 'match.fp': {
        var mfp = l.matches[+el.getAttribute('data-i')];
        var tid2 = el.getAttribute('data-team');
        A.set(function () {
          mfp.fairplay = mfp.fairplay || { teams: {}, adjust: {} };
          mfp.fairplay.teams[tid2] = mfp.fairplay.teams[tid2] === 'ok' ? null : 'ok';
        });
        break;
      }
      case 'match.fpadj': LESSON.editFairplay(+el.getAttribute('data-i')); break;
      case 'match.roles': LESSON.editRoles(+el.getAttribute('data-i')); break;
      case 'match.rolesq': LESSON.editRolesQualite(+el.getAttribute('data-i')); break;
      case 'match.reset': LESSON.resetMatch(+el.getAttribute('data-i')); break;
      case 'match.inc': {
        var m = l.matches[+el.getAttribute('data-i')];
        var k = el.getAttribute('data-side') === 'A' ? 'scoreA' : 'scoreB';
        A.set(function () { m[k] = Math.max(0, (+m[k] || 0) + (+el.getAttribute('data-v'))); });
        break;
      }

      /* ----------------------------------------------------- évaluation */
      case 'stats.tab': A.set(function (s) { s.ui.statsTab = el.getAttribute('data-t'); }); break;
      case 'grid.new': EVAL.editGrid(true); break;
      case 'grid.edit': EVAL.editGrid(false); break;
      case 'eval.propose': EVAL.proposeAll(); break;
      case 'eval.niveaux': EVAL.voirNiveaux(el.getAttribute('data-item')); break;
      case 'eval.selfclear': {
        var sidAuto = el.getAttribute('data-sid');
        var eleveAuto = A.studentById(cls && cls.id, sidAuto);
        UI.confirm('Effacer cette auto-évaluation',
          'Les réponses enregistrées sous le nom de <b>' +
          A.escapeHtml(eleveAuto ? A.displayName(eleveAuto) : '') + '</b> seront supprimées. ' +
          'Ton évaluation, elle, ne bouge pas.',
          function () {
            A.set(function () {

            '<p class="small muted">' + nbLecons + ' leçon(s) dans ce cycle.</p>' +
            '<button type="button" class="btn-sm btn-danger" id="delapsa">Supprimer cette APSA et ses leçons</button>',
          onOpen: function (d) {
            d.querySelector('#delapsa').addEventListener('click', function () {
              UI.confirm('Supprimer « ' + ap.name + ' »',
                'Les ' + nbLecons + ' leçon(s) de ce cycle seront supprimées, avec leurs rencontres, ' +
                'leurs situations et leurs relevés. Les autres APSA de la classe ne bougent pas.',

      /* ----------------------------------- attendus de fin de cycle */
      case 'afc.new': EVAL.editAfc(null, cls && cls.id); break;
      case 'afc.seed': {

          A.escapeHtml(af.texte) + '<br><br>Il sera retiré des items de grille auxquels il était relié. ' +
          'Les notes déjà mises ne bougent pas.',
          function () {
            A.set(function () { A.removeAfc(id); });

          }, 'Supprimer');
        break;
      }
      case 'grid.dup': {
        if (!l || !l.evaluation || !l.evaluation.gridId) break;
        var src = st.grids[l.evaluation.gridId];
        if (!src) break;
        UI.ask('Dupliquer la grille', 'Nom de la copie', src.name + ' — ' + (cls ? cls.name : 'copie'), function (v) {
          A.set(function (s2) {
            var copie = JSON.parse(JSON.stringify(src));
            copie.id = A.uid('grd');
            copie.name = v || (src.name + ' (copie)');
            copie.items.forEach(function (it) { it.id = A.uid('itm'); });
            s2.grids[copie.id] = copie;
            l.evaluation.gridId = copie.id;
          });
          UI.toast('Grille dupliquée : les bases restent, tu peux diverger.');
        });

      }
      /* l'évaluation, accessible depuis la liste des leçons */
      case 'dossier.open': DOSSIER.open(); break;
      case 'dossier.close': DOSSIER.close(); break;
      case 'dossier.print': window.print(); break;
      case 'eval.open':
        A.set(function (s2) { s2.ui.view = 'stats'; s2.ui.statsTab = 'eval'; });
        break;
      case 'kiosk.open': KIOSK.open(el.getAttribute('data-mode'), { kind: el.getAttribute('data-kind') }); break;

      /* -------------------------------------------------------- réglages */
      case 'crit.add':
        A.set(function (s) {
          A.cfg().criteria.push({ id: A.uid('crt'), name: 'Nouveau critère', short: 'NEW', weight: 1, desc: '' });
        });
        break;
      case 'crit.del':
        UI.confirm('Supprimer le critère', 'Les données rattachées à ce critère ne seront plus prises en compte.', function () {
          A.set(function () { A.cfg().criteria.splice(+el.getAttribute('data-i'), 1); });
        }, 'Supprimer');
        break;
      case 'crit.reset':
        UI.confirm('Rétablir les quatre critères',
          'Technique, Jeu en progression, Défense et Fair-play remplaceront tes critères actuels.', function () {
          A.set(function () {
            var ap = A.currentApsa();
            A.cfg().criteria = JSON.parse(JSON.stringify(A.activiteById(ap ? ap.activite : null).criteria));
          });
        }, 'Rétablir');
        break;
      case 'src.preset': {
        var pid = el.getAttribute('data-p');
        var preset = A.SOURCE_PRESETS.filter(function (x) { return x.id === pid; })[0];
        if (preset) {
          A.set(function () { A.cfg().sources = JSON.parse(JSON.stringify(preset.values)); });
          UI.toast('Réglage « ' + preset.name +' » appliqué.');
        }
        break;
      }
      case 'theme.set': A.set(function (s) { s.settings.theme = el.getAttribute('data-t'); }); break;
      case 'data.shrink': {
        var infoAvant = A.storageInfo();
        if (!infoAvant.nbImages) { UI.toast('Aucune image à alléger.'); break; }
        UI.toast('Compression des ' + infoAvant.nbImages + ' images…');
        A.shrinkImages({ maxPx: 720, quality: 0.7 }, function (r) {
          var gagne = r.avant - r.apres;
          UI.toast(gagne > 0
            ? r.nb + ' image(s) allégée(s) — ' + Math.round(gagne / 1024) + ' Ko récupérés.'
            : 'Les images étaient déjà au plus léger.');
        });
        break;
      }
      case 'data.export':
        A.download('organisation-ca4-sauvegarde-' + A.todayISO() + '.json', A.exportJSON());
        A.set(function () { A.get().settings.lastExportAt = new Date().toISOString(); });
        UI.toast('Sauvegarde exportée.');
        break;
      /* Recharger la dernière version SANS toucher aux données : on vide le
         cache hors ligne et on redémarre. C'est ce qu'il faut faire quand une
         nouveauté ne s'affiche pas — désinstaller l'icône de l'écran d'accueil
         emporte, elle, tout le stockage de l'application. */
      case 'app.update':
        UI.confirm('Recharger la dernière version',
          'Le cache hors ligne va être vidé, puis l\'application redémarrera sur la version ' +
          'la plus récente.<br><br><b>Tes données ne sont pas touchées</b> : classes, leçons et ' +
          'notes restent en place.',
          function () {
            var fini = function () { location.reload(); };
            var caches0 = (typeof caches !== 'undefined')
              ? caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
              : Promise.resolve();
            var sw = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
              ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
              : Promise.resolve();
            Promise.all([caches0, sw]).then(fini, fini);
            setTimeout(fini, 4000);
          }, 'Recharger');
        break;
      case 'data.import': importBackup(); break;
      case 'data.reset':
        UI.confirm('Tout effacer', 'Toutes les classes, leçons et notes seront supprimées de cet appareil. ' +
          'Cette action est irréversible.', function () {
          try { localStorage.removeItem('organisation-ca4:v1'); } catch (err) {}
          location.reload();
        }, 'Tout effacer');
        break;
      case 'cloud.signin': case 'cloud.signup': {
        var em = (document.querySelector('[name=cloudemail]') || {}).value || '';
        var pw = (document.querySelector('[name=cloudpass]') || {}).value || '';
        em = em.trim();
        if (!em || !pw) { UI.toast('Renseigne l\'adresse et le mot de passe.'); break; }
        APP.cloud.signIn(em, pw, act === 'cloud.signup', function (err) {
          if (!err) UI.toast(act === 'cloud.signup' ? 'Compte créé, synchronisation activée.' : 'Connecté.');
          render();
        });
        break;
      }
      case 'cloud.off':
        UI.confirm('Désactiver la synchronisation',
          'Les données restent sur cet appareil et sur le serveur, mais ne circuleront plus entre les deux.',
          function () { APP.cloud.signOut(); render(); }, 'Désactiver');
        break;
      case 'cloud.push': APP.cloud.pushNow(); UI.toast('Envoi en cours…'); break;
      case 'cloud.pull': APP.cloud.pull(); break;
      case 'cloud.rules': VIEWS.showRules(); break;
      default: return;
    }
    ev.preventDefault();
  }

  function onChangeEvent(ev) {
    var el = ev.target;
    var chg = el.getAttribute && el.getAttribute('data-chg');
    if (!chg) return;
    var st = A.get(), cls = A.currentClass(), l = A.currentLesson();
    var i = +el.getAttribute('data-i');

    switch (chg) {
      case 'students.sort': A.set(function (s) { s.ui.studentSort = el.value; }); break;

      case 'crit.name': A.setQuiet(function () { A.cfg().criteria[i].name = el.value; }); return;
      case 'crit.short': A.setQuiet(function () { A.cfg().criteria[i].short = el.value; }); return;
      case 'crit.desc': A.setQuiet(function () { A.cfg().criteria[i].desc = el.value; }); return;
      case 'crit.weight': A.set(function () { A.cfg().criteria[i].weight = +el.value; }); break;

      case 'src.weight': A.set(function () { A.cfg().sources[el.getAttribute('data-k')] = +el.value / 100; }); break;
      case 'set.ewma': A.set(function (s) { s.settings.ewma = +el.value / 100; }); break;
      case 'set.shrink': A.set(function (s) { s.settings.shrinkK = +el.value; }); break;
      case 'set.ridge': A.set(function (s) { s.settings.ridgeLambda = +el.value / 10; }); break;
      case 'set.anon': A.set(function (s) { s.settings.anonymize = el.checked; }); break;
      case 'set.kioskcode': A.setQuiet(function (s) { s.settings.kioskCode = el.value.trim(); }); return;
      case 'arena.terrains':
        A.set(function () {
          var l2 = A.currentLesson();
          if (l2) ARENA.arenaOf(l2).terrains = A.clamp(+el.value || A.TERRAINS, 1, A.MAX_TERRAINS);
        });
        break;
      case 'class.cycle':
        A.set(function () {
          var c2 = A.currentClass();
          if (c2) c2.cycle = el.value;
        });
        break;
      case 'set.terrains':
        A.set(function (s) { s.settings.terrains = A.clamp(+el.value || A.TERRAINS, 1, A.MAX_TERRAINS); });
        break;
      /* Changer d'activité : on prévient, puis on remplace les préréglages. */
      case 'set.activite': {
        var idAct = el.value, avant = A.activite().id;
        if (idAct === avant) return;
        el.value = avant;   // on ne bascule qu'après confirmation
        UI.confirm('Passer au ' + A.activiteById(idAct).name,
          'Les critères évalués, les relevés de match et le format d\'une rencontre seront remplacés ' +
          'par ceux de cette activité.<br><br>Les classes, leçons et scores ne sont pas touchés — mais ' +
          'les fiches déjà écrites peuvent viser des critères qui n\'existeront plus.',
          function () {
            A.set(function () { A.setActivite(idAct); });
            UI.toast('Activité : ' + A.activiteById(idAct).name + '.');
          }, 'Changer d\'activité');
        return;
      }
      case 'set.fmtpoints':
        A.set(function (s) {
          var c1 = A.cfg();
          c1.format = Object.assign({}, A.activite().format, c1.format);
          c1.format.points = A.clamp(+el.value || 11, 1, 99);
        });
        break;
      case 'set.fmtecart':
        A.set(function (s) {
          var c2 = A.cfg();
          c2.format = Object.assign({}, A.activite().format, c2.format);
          c2.format.ecart = A.clamp(+el.value || 2, 1, 5);
        });
        break;
      case 'set.fbconfig':
        try {
          var cfg = el.value.trim() ? JSON.parse(el.value) : null;
          A.get().settings.firebase = cfg;
          A.save();
          el.style.borderColor = '';
        } catch (err) { el.style.borderColor = 'var(--bad)'; }
        return;

      case 'att.set': break;
      case 'role.set': A.set(function () { l.roles[el.getAttribute('data-id')] = el.value; }); return;

      case 'tc.mode': A.set(function () { l.teamConfig.mode = el.value; }); break;
      case 'tc.count': A.set(function () { l.teamConfig.teamCount = A.clamp(+el.value, 2, 9); }); break;
      case 'tc.size':
        A.set(function () { l.teamConfig.teamSize = A.clamp(+el.value, A.MIN_TEAM_SIZE, A.MAX_TEAM_SIZE); });
        break;
      case 'tc.comp': A.set(function () { l.teamConfig.composition = el.value; }); break;
      case 'tc.mix': A.set(function () { l.teamConfig.mixite = el.value; }); break;
      case 'tc.stab': A.set(function () { l.teamConfig.stability = +el.value; }); break;

      /* Terrains disponibles : change le nombre de rencontres par tour, donc
         le découpage des matchs déjà créés. */
      case 'match.terrains': {
        /* On relâche le champ avant de redessiner : reconstruire la page
           pendant que le curseur est encore dedans arrache l'élément en plein
           événement (la même erreur que sur les scores de match). */
        var terr = el.value;
        if (el.blur) el.blur();
        LESSON.setTerrains(l, terr);
        return;
      }

      case 'match.round':
        A.set(function () { l.matches[i].round = Math.max(1, +el.value || 1); });
        return;
      case 'match.scoreA':
      case 'match.scoreB': {
        var key = chg === 'match.scoreA' ? 'scoreA' : 'scoreB';
        var val = el.value === '' ? null : +el.value;
        /* Pendant la frappe on enregistre sans reconstruire la page : refaire
           le HTML sous les doigts arrache le champ en plein événement. Le
           classement est rafraîchi à la sortie du champ (événement change). */
        if (ev.type === 'input') A.setQuiet(function () { l.matches[i][key] = val; });
        else A.set(function () { l.matches[i][key] = val; });
        return;
      }

      /* Score d'une opposition d'échauffement : même précaution que pour les
         matchs, on n'arrache pas le champ sous les doigts. */
      case 'duel.score': {
        var sitD = TRAINING.sitById(l, el.getAttribute('data-id'));
        if (!sitD) return;
        var duels = TRAINING.liveDuels(l, sitD);
        var du = duels[+el.getAttribute('data-d')];
        if (!du) return;
        var kd = el.getAttribute('data-side') === 'A' ? 'scoreA' : 'scoreB';
        var vd = el.value === '' ? null : Math.max(0, +el.value);
        if (ev.type === 'input') A.setQuiet(function () { du[kd] = vd; });
        else A.set(function () { du[kd] = vd; });
        return;
      }

      case 'stats.lesson': A.set(function (s) { s.ui.lessonId = el.value; }); break;
      case 'bank.kind': A.set(function (s) { s.ui.bankKind = el.value; }); break;
      /* Ranger une fiche dans un dossier DE PLUS : une même situation peut
         vivre dans plusieurs dossiers sans être dupliquée. Le menu propose
         aussi de créer le dossier à la volée. */
      case 'bank.folderAdd': {
        var tid = el.getAttribute('data-id');
        var v = el.value;
        el.value = '';
        if (!v) return;
        if (v === '__new') {
          BANK.newFolder('', null, function (fid) { BANK.addTo(tid, fid); });
          return;
        }
        BANK.addTo(tid, v);
        return;
      }
      case 'eval.grid': A.set(function () { l.evaluation.gridId = el.value || null; }); break;
      case 'eval.mark': {
        var sid = el.getAttribute('data-sid'), item = el.getAttribute('data-item');
        A.set(function () {
          l.evaluation.teacher[sid] = l.evaluation.teacher[sid] || {};
          if (el.value === '') delete l.evaluation.teacher[sid][item];
          else l.evaluation.teacher[sid][item] = +el.value;
        });
        return;
      }
      default: return;
    }
  }

  function setupDnD() {
    document.addEventListener('dragstart', function (ev) {
      var p = ev.target.closest && ev.target.closest('.player[data-id]');
      if (!p) return;
      ev.dataTransfer.setData('text/plain', p.getAttribute('data-id'));
      ev.dataTransfer.effectAllowed = 'move';
    });
    document.addEventListener('dragover', function (ev) {
      var t = ev.target.closest && ev.target.closest('.team[data-team]');
      if (!t) return;
      ev.preventDefault();
      t.classList.add('drop-target');
    });
    document.addEventListener('dragleave', function (ev) {
      var t = ev.target.closest && ev.target.closest('.team[data-team]');
      if (t) t.classList.remove('drop-target');
    });
    document.addEventListener('drop', function (ev) {
      var t = ev.target.closest && ev.target.closest('.team[data-team]');
      if (!t) return;
      ev.preventDefault();
      t.classList.remove('drop-target');
      var sid = ev.dataTransfer.getData('text/plain');
      if (sid) LESSON.movePlayer(sid, t.getAttribute('data-team'));
    });
  }

  function exportStudents() {
    var cls = A.currentClass();
    var r = RATINGS.compute(cls.id);
    var crits = A.criteria();
    var rows = [['Nom', 'Prénom', 'Sexe', 'Indice /10', 'Fiabilité', 'Observations']
      .concat(crits.map(function (c) { return c.name; }))];
    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var rs = r.byStudent[s.id];
      rows.push([s.last, s.first, s.sex,
        String(rs.index).replace('.', ','), rs.reliability.level, rs.global.n]
        .concat(crits.map(function (c) {
          var v = RATINGS.critDisplay(r, s.id, c.id);
          return v == null ? '' : String(v).replace('.', ',');
        })));
    });
    A.download('indices-' + cls.name.replace(/\W+/g, '-') + '-' + A.todayISO() + '.csv',
      '﻿' + A.toCSV(rows), 'text/csv;charset=utf-8');
    UI.toast('Indices exportés.');
  }

  function importBackup() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        UI.modal({
          title: 'Importer une sauvegarde',
          body: '<p>Que faire des données déjà présentes sur cet appareil ?</p>' +
            '<label class="inline"><input type="radio" name="m" value="merge" checked> Ajouter les classes du fichier aux miennes</label><br>' +
            '<label class="inline"><input type="radio" name="m" value="replace"> Tout remplacer par le contenu du fichier</label>',
          onOk: function (d) {
            try {
              A.importJSON(fr.result, d.querySelector('[name=m]:checked').value);
              UI.toast('Sauvegarde importée.');
            } catch (err) { UI.toast('Import impossible : ' + err.message); }
          }
        });
      };
      fr.readAsText(f, 'utf-8');
    };
    inp.click();
  }

        var st2 = {
          id: A.uid('stu'),
          first: isF ? PRE_F[Math.floor(i / 2) % PRE_F.length] : PRE_M[Math.floor(i / 2) % PRE_M.length],
          last: NOMS[i], sex: isF ? 'F' : 'M', note: ''
        };
        c.students.push(st2);
        latent[st2.id] = (rng() + rng() + rng() - 1.5) * 1.4;   // niveau réel caché
      }
      c.constraints.apart.push([c.students[3].id, c.students[7].id]);
      c.constraints.together.push([c.students[10].id, c.students[11].id]);

      /* Deux cycles dans l'année : un duel et un collectif. C'est le cas
         courant, et c'est ce qui montre que les indices ne se mélangent pas. */
      var apsaBad = A.newApsa(c.id, 'badminton', 'Badminton');
      var apsaUlt = A.newApsa(c.id, 'ultimate', 'Ultimate');
      s.ui.classId = c.id;
      s.ui.apsaId = apsaBad.id;

      for (var li = 0; li < 3; li++) {
        var lesson = A.newLesson(c.id, {
          title: 'Leçon ' + (li + 1),
          date: '2026-09-' + String(8 + li * 7).padStart(2, '0'),
          apsaId: apsaBad.id
        });
        lesson.objective = ['Placer le volant loin de l\'adversaire',
          'Rompre l\'échange par l\'amorti', 'Tenir le score en fin de set'][li];
        c.students.forEach(function (stu, k) {
          lesson.attendance[stu.id] = (rng() < 0.08) ? 'absent' : (rng() < 0.05 ? 'injured' : 'present');
        });

        var present = c.students.filter(function (stu) { return lesson.attendance[stu.id] === 'present'; });

        /* situation avec paliers */
        var sit = TRAINING.newSituation();
        sit.name = 'Situation n°' + (li + 1) + ' — ' +
          ['dégagements en fond de court', 'amortis gagnants', 'service long précis'][li];
        sit.consigne = 'Maximum de volants dans la zone cible en 1 minute';
        sit.unit = 'volants';
        var crits = A.cfg().criteria;
        sit.targets[crits[0].id] = li === 2 ? 0.2 : 0.7;              // Technique
        if (crits[1]) sit.targets[crits[1].id] = li === 2 ? 0.2 : 0.5; // Jeu en progression
        if (li === 2 && crits[2]) sit.targets[crits[2].id] = 0.9;      // Défense
        sit.levels.forEach(function (lv, k) {
          lv.name = 'Palier ' + (k + 1) + ' — zone ' + (k + 1);
          lv.consigne = ['Zone large : la moitié arrière du court',
            'Zone réduite : le dernier mètre avant la ligne de fond',
            'Zone étroite : le couloir, dernier mètre'][k];
          lv.seuilBas = 8 + k * 2;
          lv.seuilHaut = 14 + k * 2;
          lv.msgAide = 'Reprends les appuis : volant devant l\'épaule, bras tendu au moment de frapper.';
          lv.msgReco = 'Frappe plus haut et plus tôt : le volant doit partir devant toi, pas au-dessus de ta tête.';
          lv.msgPlus = 'Objectif atteint. Réduis la zone cible et recommence la série.';
        });
        sit.groups = TRAINING.autoGroups(sit, present, 3);
        for (var rep = 0; rep < 3; rep++) {
          var gs = TRAINING.autoGroups(sit, present, 3);
          gs.forEach(function (g) {
            var lvl = sit.levels[Math.min(2, Math.floor(rng() * 2 + (A.mean(g.members.map(function (m) { return latent[m]; })) > 0.4 ? 1 : 0)))];
            var base = A.mean(g.members.map(function (m) { return latent[m]; }));
            var val = Math.max(0, Math.round(11 + base * 3 + (rng() - 0.5) * 4));
            var at = {
              id: A.uid('att'), ts: new Date().toISOString(), members: g.members.slice(),
              value: val, levelId: lvl.id,
              recommendedLevelId: PROGRESS.recommendedLevelForGroup(sit, g.members)
            };
            sit.attempts.push(at);
            PROGRESS.applyAttempt(sit, at);
          });
        }
        lesson.situations.push(sit);
        if (li === 0) {
          var tpl = BANK.toTemplate(sit);
          tpl.id = A.uid('bnk');
          tpl.uses = 1;
          tpl.name = 'Passes en mouvement (fiche type)';
          s.bank[tpl.id] = tpl;
          sit.bankId = tpl.id;
        }

      }

      /* ---- second cycle : l'ultimate, avec équipes et matchs ---- */
      for (var lj = 0; lj < 3; lj++) {
        var lesson = A.newLesson(c.id, {
          title: 'Ultimate ' + (lj + 1),
          date: '2026-11-' + String(3 + lj * 7).padStart(2, '0'),
          apsaId: apsaUlt.id
        });
        lesson.objective = ['Conserver le disque', 'Progresser vers l\'en-but', 'Défendre en surnombre'][lj];
        c.students.forEach(function (stu) {
          lesson.attendance[stu.id] = (rng() < 0.08) ? 'absent' : (rng() < 0.05 ? 'injured' : 'present');
        });
        var present = c.students.filter(function (stu) { return lesson.attendance[stu.id] === 'present'; });

        /* une situation à paliers, comme dans l'autre cycle */
        var sitU = TRAINING.newSituation();
        sitU.name = 'Ultimate n°' + (lj + 1) + ' — ' + ['passes en mouvement', 'montée de disque', 'interception'][lj];
        sitU.consigne = 'Maximum de passes réussies en 1 minute';
        sitU.unit = 'passes';
        var critsU = apsaUlt.config.criteria;
        sitU.targets[critsU[0].id] = 0.7;
        if (critsU[1]) sitU.targets[critsU[1].id] = 0.5;
        sitU.levels.forEach(function (lv, k) {
          lv.name = 'Palier ' + (k + 1) + ' — ' + (5 + k * 3) + ' m';
          lv.consigne = 'Passes à ' + (5 + k * 3) + ' mètres';
          lv.seuilBas = 8 + k * 2;
          lv.seuilHaut = 14 + k * 2;
          lv.msgAide = 'Regarde ton receveur, disque à plat, poignet armé avant le lancer.';
          lv.msgReco = 'Place-toi en diagonale et pars quand il arme son bras.';
          lv.msgPlus = 'Objectif atteint. Recule de 3 mètres.';
        });
        sitU.groups = TRAINING.autoGroups(sitU, present, 3);
        for (var repU = 0; repU < 3; repU++) {
          TRAINING.autoGroups(sitU, present, 3).forEach(function (g2) {
            var lvl = sitU.levels[Math.min(2, Math.floor(rng() * 2 + (A.mean(g2.members.map(function (m) { return latent[m]; })) > 0.4 ? 1 : 0)))];
            var base = A.mean(g2.members.map(function (m) { return latent[m]; }));
            var at = {
              id: A.uid('att'), ts: new Date().toISOString(), members: g2.members.slice(),
              value: Math.max(0, Math.round(11 + base * 3 + (rng() - 0.5) * 4)), levelId: lvl.id,
              recommendedLevelId: PROGRESS.recommendedLevelForGroup(sitU, g2.members)
            };
            sitU.attempts.push(at);
            PROGRESS.applyAttempt(sitU, at);
          });
        }
        lesson.situations.push(sitU);

        /* équipes */
        var res = TEAMS.compose({
          students: present.map(function (p) {
            return { id: p.id, sex: p.sex, index: 5 + latent[p.id] * 1.6, label: p.first };
          }),
          teamCount: 4, mixite: 'mixte', stability: lj === 0 ? 0 : 60,
          constraints: c.constraints, previousTeams: null, minSize: 3, maxSize: 7,
          seed: 'demoU' + lj
        });
        lesson.teams = res.teams;

        /* matchs, répartis en tours de deux */
        lesson.matchConfig = A.defaultMatchConfig(apsaUlt);
        for (var a = 0; a < lesson.teams.length; a++) {
          for (var b = a + 1; b < lesson.teams.length; b++) {
            var tA = lesson.teams[a], tB = lesson.teams[b];
            var sA = A.mean(tA.members.map(function (m) { return latent[m]; }));
            var sB = A.mean(tB.members.map(function (m) { return latent[m]; }));
            var gA = Math.max(0, Math.round(5 + (sA - sB) * 2.2 + (rng() - 0.5) * 3));
            var gB = Math.max(0, Math.round(5 + (sB - sA) * 2.2 + (rng() - 0.5) * 3));
            /* pas de tour figé : la répartition en tours de deux se fait
               d'elle-même à l'affichage, comme pour un tournoi généré */
            var mt = {
              id: A.uid('mt'), teamA: tA.id, teamB: tB.id, scoreA: gA, scoreB: gB,
              granularity: 'team', stats: {},
              fairplay: { teams: {}, adjust: {} }
            };
            var champs = apsaUlt.config.statFields.map(function (f) { return f.id; });
            [tA, tB].forEach(function (t) {
              var lv = A.mean(t.members.map(function (m) { return latent[m]; }));
              mt.stats[t.id] = {};
              if (champs[0]) mt.stats[t.id][champs[0]] = Math.round(28 + lv * 10 + rng() * 8);
              if (champs[1]) mt.stats[t.id][champs[1]] = Math.max(1, Math.round(12 - lv * 5 + rng() * 5));
              if (champs[2]) mt.stats[t.id][champs[2]] = Math.max(0, Math.round(3 + lv * 2 + rng() * 3));
              mt.fairplay.teams[t.id] = 'ok';
            });
            if (rng() < 0.25) {
              var pool = tA.members.concat(tB.members);
              mt.fairplay.adjust[pool[Math.floor(rng() * pool.length)]] = rng() < 0.5 ? 'plus' : 'minus';
            }
            lesson.matches.push(mt);
          }
        }
      }

      /* ---- rencontres individuelles : une poule, une ligue, une échelle ---- */
      A.classLessons(c.id, apsaBad.id).forEach(function (lesson2, li2) {
        var pres = c.students.filter(function (stu) { return lesson2.attendance[stu.id] === 'present'; });
        var ordre = pres.slice().sort(function (x, y) { return latent[y.id] - latent[x.id]; });
        var ar = ARENA.arenaOf(lesson2);
        ar.mode = ['poules', 'ligues', 'defis'][li2];
        ar.terrains = 4;

        if (ar.mode === 'defis') {
          ar.echelle = ordre.map(function (x) { return x.id; });
          ar.regles = { cible: 'mieux', ecartMax: 3, uniques: true, maxDefis: 3, echange: true };
          for (var d2 = 0; d2 < 10; d2++) {
            var i2 = 2 + Math.floor(rng() * (ar.echelle.length - 3));
            var cible2 = i2 - (1 + Math.floor(rng() * 3));
            if (cible2 < 0) continue;
            var defieur = ar.echelle[i2], defie = ar.echelle[cible2];
            if (ARENA.dejaRencontre(lesson2, defieur, defie)) continue;
            var m2 = ARENA.lancerDefi(lesson2, defieur, defie);
            var ecartN = latent[defieur] - latent[defie];
            var sA2 = Math.round(A.clamp(6 + ecartN * 3 + rng() * 5, 0, 11));
            var sB2 = sA2 >= 11 ? Math.round(rng() * 9) : 11;
            m2.scoreA = sA2; m2.scoreB = sB2;
            ARENA.appliquerEchelle(lesson2, m2);
          }
        } else {
          var nbG = ar.mode === 'ligues' ? 3 : 4;
          var parG = Math.ceil(ordre.length / nbG);
          var groupes = [];
          for (var gi = 0; gi < nbG; gi++) groupes.push([]);
          ordre.forEach(function (x, k2) { groupes[Math.min(nbG - 1, Math.floor(k2 / parG))].push(x.id); });
          ar.groups = groupes.map(function (mem, gi2) {
            return {
              id: A.uid('grp'),
              name: ar.mode === 'ligues' ? ('Ligue ' + (gi2 + 1)) : ('Poule ' + String.fromCharCode(65 + gi2)),
              color: A.TEAM_COLORS[gi2 % A.TEAM_COLORS.length],
              members: mem
            };
          });
          ARENA.planifier(lesson2);
          ar.matches.forEach(function (m3, k3) {
            if (k3 % 5 === 4) return;                 // quelques rencontres restent à jouer
            var ec = latent[m3.a] - latent[m3.b];
            var gagne = ec + (rng() - 0.5) * 0.8 > 0;
            m3.scoreA = gagne ? 11 : Math.round(A.clamp(4 + rng() * 6, 0, 10));
            m3.scoreB = gagne ? Math.round(A.clamp(4 + rng() * 6, 0, 10)) : 11;
          });
        }
      });

      var g = EVAL.defaultGrid();
      s.grids[g.id] = g;
      A.classLessons(c.id, '*').forEach(function (ll) { ll.evaluation.gridId = g.id; });

      s.ui.classId = c.id;
      s.ui.view = 'stats';
    });
    UI.toast('Classe de démonstration créée : 28 élèves, 3 leçons, situations et matchs.');
  }

  /* ---------------------------------------------------------------- init */

  function init() {
    A.load();
    A.setNotifier(UI.toast);
    A.onChange(function () { if (KIOSK.isOpen()) KIOSK.render(); else render(); });
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChangeEvent);
    document.addEventListener('input', function (ev) {
      var c = ev.target.getAttribute && ev.target.getAttribute('data-chg');
      if (c && /^(crit\.|set\.fbconfig|set\.kioskcode|match\.score|students\.sort)/.test(c)) onChangeEvent(ev);
    });
    setupDnD();
    render();
    APP.cloud.onStatus(function () {
      renderCloudPill();
      if ((A.get().ui.view || '') === 'settings') render();
    });
    APP.cloud.init();
    renderCloudPill();
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      Promise.reject(new Error('hors ligne natif')).catch(function () { /* hors ligne non critique */ });
    }
  }

  return { init: init, render: render, seedDemo: seedDemo };
})();

document.addEventListener('DOMContentLoaded', MAIN.init);
</script>
</body>
</html>
