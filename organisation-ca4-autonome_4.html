        var a = d.querySelector('[name=a]').value, b = d.querySelector('[name=b]').value;
        if (a === b) { UI.toast('Choisis deux équipes différentes.'); return false; }
        var r = Math.max(1, +d.querySelector('[name=r]').value || 1);
        A.set(function () { l.matches.push(newMatch(l, a, b, r)); });
      }
    });
  }

  /* ====================================================== plan du tournoi
     Trois questions, indépendantes l'une de l'autre :
       – QUI se rencontre : tout le monde, un seul tour d'affiches, ou des
         affiches choisies une par une ;
       – COMBIEN de fois chaque affiche se joue (aller, aller-retour, plus) ;
       – COMMENT on répartit : deux matchs par tour, personne deux fois dans
         le même tour, les autres équipes observent.
     La fonction ne touche à rien : elle calcule et rend le plan, ce qui permet
     d'en afficher l'aperçu avant de valider. */

  /* Clé stable d'une affiche, indépendante de l'ordre des deux équipes. */
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /* Toutes les affiches possibles, éventuellement filtrées par composition. */
  function possiblePairs(l, memeGenre) {
    var genres = {};
    l.teams.forEach(function (t) { genres[t.id] = teamGender(l, t); });
    var pairs = [];
    for (var i = 0; i < l.teams.length; i++) {
      for (var j = i + 1; j < l.teams.length; j++) {
        var a = l.teams[i].id, b = l.teams[j].id;
        if (memeGenre) {
          var ga = genres[a], gb = genres[b];
          /* une équipe mixte peut rencontrer tout le monde ; deux équipes
             non mixtes ne se rencontrent que si elles sont du même genre */
          if (ga !== 'mixte' && gb !== 'mixte' && ga !== gb) continue;
        }
        pairs.push([a, b]);
      }
    }
    return pairs;
  }

  function planTournament(l, opts) {
    /* Deux terrains par tour pour l'ultimate ; l'échauffement, lui, peut faire
       jouer toutes les équipes en même temps et passe donc son propre nombre. */
    var per = opts.perRound || terrainsOf(l);
    var genres = {};
    l.teams.forEach(function (t) { genres[t.id] = teamGender(l, t); });

    var pairs;
    if (opts.mode === 'choix') {
      /* l'enseignant a désigné les affiches lui-même : on les reprend telles
         quelles, sans filtre supplémentaire */
      var vivants = {};
      l.teams.forEach(function (t) { vivants[t.id] = 1; });
      pairs = Object.keys(opts.paires || {}).filter(function (k) { return opts.paires[k]; })
        .map(function (k) { return k.split('|'); })
        .filter(function (p) { return vivants[p[0]] && vivants[p[1]]; });
    } else {
      pairs = possiblePairs(l, opts.memeGenre);
      if (opts.mode === 'simple') {
        /* un seul tour d'affiches : chaque équipe joue une fois au plus */
        var vus = {}, courts = [];
        pairs.forEach(function (p) {
          if (vus[p[0]] || vus[p[1]]) return;
          vus[p[0]] = 1; vus[p[1]] = 1;
          courts.push(p);
        });
        pairs = courts;
      }
    }

    /* Répétitions : le match retour inverse les rôles, et toutes les affiches
       aller se jouent avant d'entamer les retours. */
    var rep = A.clamp(+opts.repetitions || 1, 1, 6);
    var liste = [];
    for (var r = 0; r < rep; r++) {
      pairs.forEach(function (p) {
        liste.push(r % 2 === 1 ? [p[1], p[0]] : [p[0], p[1]]);
      });
    }

    /* Répartition en tours.
       Un placement glouton simple gaspille des tours : il commence par deux
       affiches qui bloquent les équipes restantes, et il faut un tour de plus.
       On tente donc plusieurs ordres de passage et on garde le meilleur plan —
       le moins de tours d'abord, puis le repos le mieux réparti. C'est instantané
       à cette échelle (neuf équipes au plus) et ça donne, sur six équipes,
       les quinze affiches en cinq tours de trois plutôt qu'en sept.
       Dans tous les cas, une équipe ne joue jamais deux fois dans le même tour,
       et avec un nombre impair d'équipes ce n'est jamais la même qui se repose. */
    var ids = l.teams.map(function (t) { return t.id; });
    var rng = A.rngFrom('plan:' + ids.join(',') + ':' + liste.length + ':' + per);

    function essai(bruit) {
      var joues = {}, repos = {};
      ids.forEach(function (id) { joues[id] = 0; repos[id] = 0; });
      var used = liste.map(function () { return false; });
      var planned = [], parTour = {}, round = 1;

      while (used.some(function (u) { return !u; })) {
        var busy = {}, placed = 0;
        var ordre = [];
        for (var k = 0; k < liste.length; k++) if (!used[k]) ordre.push(k);
        var poids = {};
        ordre.forEach(function (k) {
          poids[k] = (joues[liste[k][0]] || 0) + (joues[liste[k][1]] || 0) + (bruit ? rng() * bruit : 0);
        });
        ordre.sort(function (x, y) { return poids[x] - poids[y] || x - y; });

        for (var o = 0; o < ordre.length && placed < per; o++) {
          var k2 = ordre[o];
          if (busy[liste[k2][0]] || busy[liste[k2][1]]) continue;
          busy[liste[k2][0]] = 1; busy[liste[k2][1]] = 1;
          planned.push({ a: liste[k2][0], b: liste[k2][1], r: round });
          joues[liste[k2][0]]++; joues[liste[k2][1]]++;
          used[k2] = true; placed++;
        }
        parTour[round] = ids.filter(function (id) { return !busy[id]; });
        parTour[round].forEach(function (id) { repos[id]++; });
        round++;
        if (round > 300) break;   // garde-fou
      }

      var vals = ids.map(function (id) { return repos[id]; });
      var ecart = vals.length ? Math.max.apply(null, vals) - Math.min.apply(null, vals) : 0;
      return {
        planned: planned, tours: round - 1, repos: parTour, joues: joues,
        note: (round - 1) * 1000 + ecart
      };
    }

    var best = essai(0);                       // ordre déterministe, sans bruit
    for (var t = 0; t < 120 && best.tours * per > liste.length; t++) {
      var autre = essai(2);
      if (autre.note < best.note) best = autre;
    }

    var planned = best.planned;
    return {
      planned: planned, tours: best.tours, genres: genres,
      affiches: pairs.length, repetitions: rep, repos: best.repos, joues: best.joues
    };
  }

  function roundRobin() {
    var l = A.currentLesson();
    var genres = {};
    l.teams.forEach(function (t) { genres[t.id] = teamGender(l, t); });
    var nonMixtes = l.teams.filter(function (t) { return genres[t.id] !== 'mixte'; }).length;
    var deuxGenres = ['F', 'M'].every(function (g) {
      return l.teams.some(function (t) { return genres[t.id] === g; });
    });
    var nameOf = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };
    var colorOf = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].color;
      return 'var(--accent)';
    };

    /* Les affiches choisies à la main démarrent sur « tout le monde se
       rencontre » : on part d'un tournoi complet et on décoche ce qu'on ne
       veut pas, plutôt que de tout construire depuis une page blanche. */
    var paires = {};
    possiblePairs(l, false).forEach(function (p) { paires[pairKey(p[0], p[1])] = true; });

    var opts = {
      mode: 'complet', memeGenre: false, remplacer: true,
      repetitions: 1, paires: paires, perRound: terrainsOf(l)
    };
    var courante = l.teams.length ? l.teams[0].id : null;

    var repOpts = [
      { v: 1, l: 'Une fois — match aller seulement' },
      { v: 2, l: 'Deux fois — aller et retour' },
      { v: 3, l: 'Trois fois' },
      { v: 4, l: 'Quatre fois' }
    ];

    UI.modal({
      title: 'Générer le tournoi',
      okLabel: 'Générer',
      body: '<label class="field"><span>Qui rencontre qui ?</span><select name="mode">' +
        '<option value="complet">Toutes contre toutes — chaque équipe rencontre toutes les autres</option>' +
        '<option value="simple">Un tour simple — chaque équipe joue une fois</option>' +
        '<option value="choix">Je choisis les affiches équipe par équipe</option>' +
        '</select></label>' +
        '<div id="choixBloc" hidden>' +
        '<fieldset><legend>Adversaires de chaque équipe</legend>' +
        '<p class="tiny muted" style="margin:0 0 8px">Choisis une équipe, puis coche celles qu\'elle doit ' +
        'rencontrer. Une affiche cochée d\'un côté l\'est forcément de l\'autre : la Bleue contre la Verte, ' +
        'c\'est la même rencontre que la Verte contre la Bleue.</p>' +
        '<label class="field"><span>Équipe</span><select name="eq">' +
        l.teams.map(function (t) { return '<option value="' + t.id + '">' + e(t.name) + '</option>'; }).join('') +
        '</select></label>' +
        '<div id="advers" class="pal-grid"></div>' +
        '<div class="row tight" style="margin-top:8px">' +
        '<button type="button" class="btn-sm" data-all="1">Tout cocher</button>' +
        '<button type="button" class="btn-sm btn-ghost" data-all="0">Tout décocher</button></div>' +
        '<div id="affiches" class="small" style="margin-top:10px"></div>' +
        '</fieldset></div>' +
        '<label class="field" style="max-width:280px"><span>Terrains disponibles</span>' +
        '<input type="number" name="terr" min="1" max="' + A.MAX_TERRAINS + '" value="' + terrainsOf(l) + '">' +
        '<span class="tiny muted">Autant de rencontres par tour. Les autres équipes observent.</span></label>' +
        '<label class="field"><span>Combien de fois chaque affiche se joue-t-elle ?</span>' +
        '<select name="rep">' + repOpts.map(function (o) {
          return '<option value="' + o.v + '">' + o.l + '</option>';
        }).join('') + '</select>' +
        '<span class="tiny muted">Au match retour, les deux équipes changent de côté sur la feuille. ' +
        'Tous les matchs aller se jouent avant les retours.</span></label>' +
        (deuxGenres
          ? '<label class="inline genre-opt" style="display:flex;margin-bottom:10px"><input type="checkbox" name="genre"> ' +
            'N\'apparier que des équipes de même composition (les ' + nonMixtes + ' équipes non mixtes ne ' +
            'rencontreront pas le genre opposé)</label>'
          : '<p class="small muted genre-opt">Toutes les équipes sont mixtes ou d\'un seul genre : ' +
            'l\'appariement par genre ne s\'applique pas.</p>') +
        '<label class="inline" style="display:flex;margin-bottom:10px"><input type="checkbox" name="remp" checked> ' +
        'Remplacer les matchs déjà créés' +
        ((l.matches || []).length ? ' (' + l.matches.length + ' actuellement)' : '') + '</label>' +
        '<div id="apercu"></div>',

      onOpen: function (d) {
        var adversBox = d.querySelector('#advers');

        /* Liste des adversaires possibles de l'équipe en cours d'édition. */
        var dessineAdversaires = function () {
          courante = d.querySelector('[name=eq]').value;
          adversBox.innerHTML = l.teams.filter(function (t) { return t.id !== courante; })
            .map(function (t) {
              var k = pairKey(courante, t.id);
              return '<label class="pal-chip' + (opts.paires[k] ? ' is-on' : '') + '">' +
                '<input type="checkbox" data-pair="' + k + '"' + (opts.paires[k] ? ' checked' : '') + '> ' +
                '<span class="pal-dot" style="background:' + t.color + '"></span>' +
                '<span class="pal-lbl">' + e(t.name) + '</span></label>';
            }).join('');
        };

        var listeAffiches = function () {
          var ks = Object.keys(opts.paires).filter(function (k) { return opts.paires[k]; });
          d.querySelector('#affiches').innerHTML = ks.length
            ? '<b>' + ks.length + ' affiche' + (ks.length > 1 ? 's' : '') + ' retenue' +
              (ks.length > 1 ? 's' : '') + ' :</b> ' +
              ks.map(function (k) {
                var p = k.split('|');
                return '<span class="badge" style="border-color:' + colorOf(p[0]) + '">' +
                  e(nameOf(p[0])) + ' – ' + e(nameOf(p[1])) + '</span>';
              }).join(' ')
            : '<span class="muted">Aucune affiche retenue pour le moment.</span>';
        };

        var maj = function () {
          opts.mode = d.querySelector('[name=mode]').value;
          opts.repetitions = +d.querySelector('[name=rep]').value || 1;
          opts.perRound = A.clamp(+d.querySelector('[name=terr]').value || A.TERRAINS, 1, A.MAX_TERRAINS);
          var g = d.querySelector('[name=genre]');
          opts.memeGenre = !!(g && g.checked);
          opts.remplacer = d.querySelector('[name=remp]').checked;

          var choix = opts.mode === 'choix';
          d.querySelector('#choixBloc').hidden = !choix;
          /* le filtre par composition ne veut plus rien dire quand on désigne
             soi-même les affiches : on le masque plutôt que de le laisser
             agir dans le dos de l'enseignant */
          d.querySelectorAll('.genre-opt').forEach(function (x) { x.hidden = choix; });
          if (choix) listeAffiches();

          var r = planTournament(l, opts);
          var suite = r.repetitions > 1
            ? ' — ' + r.affiches + ' affiche' + (r.affiches > 1 ? 's' : '') + ' jouée' +
              (r.affiches > 1 ? 's' : '') + ' ' + r.repetitions + ' fois'
            : '';
          d.querySelector('#apercu').innerHTML = r.planned.length
            ? '<div class="notice">' + r.planned.length + ' match' + (r.planned.length > 1 ? 's' : '') +
              ' en <b>' + r.tours + ' tour' + (r.tours > 1 ? 's' : '') + '</b> de ' + opts.perRound +
              suite + '. Les équipes qui ne jouent pas pendant un tour seront désignées comme observatrices.</div>'
            : '<div class="notice bad">Aucune rencontre possible avec ces options.</div>';
        };

        d.querySelector('[name=eq]').addEventListener('change', function () {
          dessineAdversaires(); maj();
        });
        adversBox.addEventListener('change', function (ev) {
          var box = ev.target;
          if (!box.getAttribute || !box.getAttribute('data-pair')) return;
          opts.paires[box.getAttribute('data-pair')] = box.checked;
          box.parentNode.classList.toggle('is-on', box.checked);
          maj();
        });
        d.querySelectorAll('[data-all]').forEach(function (btn) {
          btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            var on = btn.getAttribute('data-all') === '1';
            l.teams.forEach(function (t) {
              if (t.id !== courante) opts.paires[pairKey(courante, t.id)] = on;
            });
            dessineAdversaires(); maj();
          });
        });
        d.querySelectorAll('select[name],input[name]').forEach(function (el) {
          el.addEventListener('change', maj);
        });

        dessineAdversaires();
        maj();
      },

      onOk: function () {
        var r = planTournament(l, opts);
        if (!r.planned.length) {
          UI.toast(opts.mode === 'choix'
            ? 'Aucune affiche retenue : coche au moins une rencontre.'
            : 'Aucune rencontre possible avec ces options.');
          return false;
        }
        A.set(function () {
          l.terrains = opts.perRound;
          if (opts.remplacer) l.matches = [];
          r.planned.forEach(function (p) { l.matches.push(newMatch(l, p.a, p.b, p.r)); });
        });
        UI.toast(r.planned.length + ' matchs en ' + r.tours + ' tours.');
      }
    });
  }

  return {
    tabsFor: tabsFor, list: list, view: view, presence: presence, teams: teams,
    compose: compose, composeTeams: composeTeams, movePlayer: movePlayer, project: project,
    editObservation: editObservation, ROLES: ROLES,
    matches: matches, addMatch: addMatch, roundRobin: roundRobin,
    editStats: editStats, reusePrevious: reusePrevious,
    editFairplay: editFairplay, editMatchConfig: editMatchConfig,
    editRoles: editRoles, editRolesQualite: editRolesQualite,
    rolesDe: rolesDe, designesDe: designesDe, candidatsRoles: candidatsRoles,
    ROLES_MATCH: ROLES_MATCH,
    matchConfig: matchConfig, activeFields: activeFields, scoringFields: scoringFields,
    rounds: rounds, resetMatch: resetMatch, PER_ROUND: PER_ROUND,
    terrainsOf: terrainsOf, setTerrains: setTerrains,
    editRoundStats: editRoundStats, teamGender: teamGender, planTournament: planTournament,
    possiblePairs: possiblePairs, pairKey: pairKey,
    presentStudents: presentStudents, previousTeams: previousTeams,
    defaultScoring: defaultScoring
  };
})();
</script>
<script>
/* ============================================================================
   Organisation CA4 — mode kiosque (tablette qui circule)
   Plein écran, gros boutons, aucun accès aux réglages ni aux notes des autres.
   Trois modes : saisie des situations, statistiques de match, auto-évaluation.
   ========================================================================== */
'use strict';

var KIOSK = (function () {

  var A = APP, e = APP.escapeHtml;
  var K = { open: false, mode: 'training', step: 'home', data: {} };

  function open(mode, opts) {
    K.open = true; K.mode = mode || 'training'; K.step = 'home';
    K.data = {};
    if (opts && opts.kind) K.data.kind = opts.kind;
    document.body.classList.add('kiosk');
    render();
  }
  function close(force) {
    var code = String((A.get().settings.kioskCode || A.KIOSK_CODE)).trim();
    if (!force && code) {
      askCode(code, function () { close(true); });
      return;
    }
    K.open = false;
    document.body.classList.remove('kiosk');
    var el = document.getElementById('kiosk');
    if (el) el.remove();
    MAIN.render();
  }

  /* Sortie du kiosque protégée par un code : les élèves rendent la tablette
     sans pouvoir se promener dans les notes de la classe. */
  function askCode(a, b) {
    /* Deux usages : askCode(code, onOk) depuis le kiosque,
       askCode(onOk, message) depuis l'application. */
    var code, onOk, message;
    if (typeof a === 'function') {
      code = String(A.get().settings.kioskCode || A.KIOSK_CODE).trim();
      onOk = a; message = b;
    } else { code = a; onOk = b; }
    if (!code) { onOk(); return; }
    var buf = '';
    UI.modal({
      title: 'Code enseignant',
      okLabel: 'Valider', cancelLabel: 'Annuler',
      body: '<p class="small muted">' + e(message || 'Saisis le code pour revenir à l\'application.') + '</p>' +
        '<div class="code-display" id="codeDisp">····</div>' +
        '<div class="code-pad">' +
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
          return '<button type="button" data-key="' + n + '">' + n + '</button>';
        }).join('') +
        '<button type="button" data-key="del">←</button>' +
        '<button type="button" data-key="0">0</button>' +
        '<button type="button" data-key="clr">C</button>' +
        '</div>',
      onOpen: function (d) {
        var disp = d.querySelector('#codeDisp');
        var show = function () {
          disp.textContent = buf ? buf.replace(/./g, '•') + '····'.slice(buf.length) : '····';
          disp.classList.remove('bad');
        };
        d.querySelectorAll('[data-key]').forEach(function (b) {
          b.addEventListener('click', function () {
            var k = b.getAttribute('data-key');
            if (k === 'del') buf = buf.slice(0, -1);
            else if (k === 'clr') buf = '';
            else if (buf.length < 8) buf += k;
            show();
          });
        });
        show();
      },
      onOk: function (d) {
        if (buf === code) { onOk(); return; }
        var disp = d.querySelector('#codeDisp');
        if (disp) { disp.textContent = 'code incorrect'; disp.classList.add('bad'); }
        buf = '';
        return false;
      }
    });
  }
  function go(step, data) {
    K.step = step;
    if (data) Object.keys(data).forEach(function (k) { K.data[k] = data[k]; });
    render();
  }

  function frame(title, body, backStep) {
    return '<div class="kiosk-inner">' +
      '<div class="row" style="margin-bottom:14px">' +
      (backStep ? '<button class="btn-lg" data-act="k.go" data-s="' + backStep + '">←</button>' : '') +
      '<h1 style="flex:1;margin:0">' + e(title) + '</h1>' +
      '<button class="btn-lg btn-ghost" data-act="k.close">Quitter</button>' +
      '</div>' + body + '</div>';
  }

  function render() {
    var el = document.getElementById('kiosk');
    if (!el) {
      el = document.createElement('div');
      el.id = 'kiosk'; el.className = 'kiosk-root';
      document.body.appendChild(el);
    }
    el.innerHTML = K.mode === 'training' ? renderTraining()
      : K.mode === 'match' ? renderMatch()
      : K.mode === 'arena' ? renderArena()
      : renderSelf();
  }

  /* Encadré du palier atteint : même famille de couleur que le message
     au-dessus, en plus clair, et il contient la consigne à appliquer. */
  function nextLevelBlock(ev, sit) {
    /* Le bandeau prend la couleur du palier d'arrivée : l'élève voit sa
       progression dans le dégradé orange → vert foncé sans rien lire. */
    var sh = (sit && ev.nextLevelId) ? PROGRESS.levelColor(sit, ev.nextLevelId) : null;
    return '<div class="next-level lv-tint band-' + ev.band + '"' +
      (sh ? ' style="' + sh.style + '"' : '') + '>' +
      '<span class="nl-label">' + (ev.changed ? 'Nouveau palier' : 'Tu restes au palier') + '</span>' +
      '<b class="nl-name lv-name">' + e(ev.nextLevelName || '—') + '</b>' +
      (ev.nextConsigne ? '<div class="nl-consigne">' + e(ev.nextConsigne) + '</div>'
        : '<div class="nl-consigne muted">Reprends la même consigne.</div>') +
      '</div>';
  }

  function lesson() { return A.currentLesson(); }
  function cls() { return A.get().classes[lesson().classId]; }
  function nameOf(sid) { var s = A.studentById(cls().id, sid); return s ? A.shortName(s) : '?'; }

  /* « Léa et Tom », « Léa, Tom et Inès » : on écrit comme on parle. */
  function listeNoms(ids) {
    var n = (ids || []).map(nameOf);
    if (n.length < 2) return n.join('');
    return n.slice(0, -1).join(', ') + ' et ' + n[n.length - 1];
  }

  /* ======================================================= mode ENTRAÎNEMENT */

  function renderTraining() {
    var l = lesson();
    var sits = K.data.kind ? TRAINING.ofKind(l, K.data.kind) : (l.situations || []);

    if (K.step === 'home' || !K.data.sitId) {
      if (!sits.length) return frame(K.data.kind === 'echauffement' ? 'Échauffement' : 'Situations',
        '<p>Rien de préparé pour le moment.</p>');
      if (sits.length === 1) { K.data.sitId = sits[0].id; K.step = 'group'; }
      else {
        return frame(K.data.kind === 'echauffement' ? 'Quel échauffement ?' : 'Quelle situation ?',
          '<div class="pick-grid">' + sits.map(function (s) {
            return '<button data-act="k.go" data-s="group" data-sit="' + s.id + '">' + e(s.name) + '</button>';
          }).join('') + '</div>');
      }
    }

    var sit = TRAINING.sitById(l, K.data.sitId);
    if (!sit) { K.step = 'home'; K.data.sitId = null; return renderTraining(); }

    /* Un échauffement mené en confrontation n'a ni groupe ni palier : on va
       droit aux oppositions et à leurs scores. */
    if (TRAINING.isMatchFormat(sit)) return renderDuels(l, sit, sits.length > 1);
    /* La co-frontation a son propre parcours : on choisit son partenaire,
       on annonce le résultat, on repart en chercher un autre. */
    if (TRAINING.isCoopFormat(sit)) return renderCoop(l, sit, sits.length > 1);

    /* --- choix du groupe --- */
    if (K.step === 'group') {
      var body = '';
      if (sit.consigne) body += '<div class="notice" style="white-space:pre-wrap">' + e(sit.consigne) + '</div>';
      if (sit.image) body += '<div class="img-slot" style="margin-bottom:12px"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';
      if ((sit.groups || []).length) {
        body += '<h3>Touche ton groupe de travail</h3><div class="pick-grid">' +
          sit.groups.map(function (g) {
            var unread = g.members.filter(function (m) {
              var msg = PROGRESS.messageFor(sit, m);
              return msg && !msg.dismissed;
            }).length;
            return '<button data-act="k.pickgroup" data-g="' + g.id + '">' +
              '<span>' + e(g.label) + '<br><span class="tiny muted">' +
              e(g.members.map(nameOf).join(', ')) + '</span>' +
              (unread ? '<br><span class="badge accent">' + unread + ' message' + (unread > 1 ? 's' : '') + '</span>' : '') +
              '</span></button>';
          }).join('') + '</div>';
      }
      body += '<h3 style="margin-top:18px">Ou compose ton groupe</h3>' +
        '<div class="pick-grid">' + LESSON.presentStudents(l).map(function (s) {
          var sel = (K.data.members || []).indexOf(s.id) > -1;
          return '<button data-act="k.toggle" data-id="' + s.id + '"' + (sel ? ' class="btn-primary"' : '') + '>' + e(A.shortName(s)) + '</button>';
        }).join('') + '</div>' +
        ((K.data.members || []).length
          ? '<div class="row" style="margin-top:16px"><button class="btn-lg btn-primary" data-act="k.go" data-s="msg">Continuer avec ' +
            (K.data.members || []).length + ' élève' + ((K.data.members || []).length > 1 ? 's' : '') + '</button></div>'
          : '');
      return frame(sit.name, body, sits.length > 1 ? 'home' : null);
    }

    /* --- rappel des messages non lus --- */
    if (K.step === 'msg') {
      var pend = (K.data.members || []).map(function (sid) {
        return { sid: sid, m: PROGRESS.messageFor(sit, sid) };
      }).filter(function (x) { return x.m; });
      if (!pend.length) { K.step = 'level'; return renderTraining(); }

      /* Les élèves sont regroupés par palier d'arrivée : ceux qui vont
         travailler au même endroit lisent au même endroit. Le bloc prend la
         couleur du palier (orange → vert foncé), les prénoms passent en gros,
         et un message identique n'est écrit qu'une fois pour tout le groupe. */
      var niveaux = PROGRESS.levelsOf(sit);
      var rang = {};
      niveaux.forEach(function (lv, i) { rang[lv.id] = i; });

      var paquets = {}, ordre = [];
      pend.forEach(function (x) {
        var lid = x.m.nextLevelId || x.m.levelId || (niveaux[0] ? niveaux[0].id : 'x');
        if (!paquets[lid]) { paquets[lid] = []; ordre.push(lid); }
        paquets[lid].push(x);
      });
      ordre.sort(function (a, b) {
        return (rang[a] == null ? 99 : rang[a]) - (rang[b] == null ? 99 : rang[b]);
      });

      var b = '<p class="muted">Voici ce qui vous avait été dit au passage précédent. ' +
        'Retrouve ton prénom, relis, puis recommence.</p>';

      ordre.forEach(function (lid) {
        var groupe = paquets[lid];
        var lv = PROGRESS.levelById(sit, lid);
        var sh = PROGRESS.levelColor(sit, lid);
        var change = groupe.some(function (x) { return x.m.changed; });

        b += '<section class="lv-group lv-tint" style="' + sh.style + '">' +
          '<div class="lv-group-head">' +
          '<span class="lv-group-label">' +
          (change ? 'Vous passez au' : 'Vous restez au') + '</span>' +
          '<h2 class="lv-group-name">' + e(lv ? lv.name : 'Palier') + '</h2>' +
          (lv && lv.consigne ? '<p class="lv-group-consigne">' + e(lv.consigne) + '</p>' : '') +
          '</div>' +
          '<div class="lv-names">' + groupe.map(function (x) {
            return '<span class="lv-name-chip' + (x.m.dismissed ? '' : ' is-new') + '">' +
              e(nameOf(x.sid)) + '</span>';
          }).join('') + '</div>';

        /* un même message ne s'écrit qu'une fois */
        var vus = {}, blocs = [];
        groupe.forEach(function (x) {
          var cle = x.m.band + '|' + x.m.text + '|' + (x.m.image || '');
          if (!vus[cle]) { vus[cle] = { m: x.m, qui: [] }; blocs.push(vus[cle]); }
          vus[cle].qui.push(nameOf(x.sid));
        });

        blocs.forEach(function (bl) {
          var info = PROGRESS.BANDS[bl.m.band];
          b += '<div class="lv-msg band-' + bl.m.band + '">' +
            '<div class="row tight" style="margin-bottom:6px">' +
            UI.badge(info.icon + ' ' + info.label, info.cls) +
            (blocs.length > 1
              ? '<span class="small"><b>' + e(bl.qui.join(', ')) + '</b></span>'
              : '') +
            '</div>' +
            '<p style="margin:0;white-space:pre-wrap">' + e(bl.m.text) + '</p>' +
            (bl.m.image ? '<div class="img-slot"><img src="' + bl.m.image + '" alt="Illustration de la consigne"></div>' : '') +
            '</div>';
        });

        b += '</section>';
      });

      b += '<div class="row" style="margin-top:16px"><button class="btn-lg btn-primary" data-act="k.readmsg">J\'ai lu, je continue</button></div>';
      return frame('Retour de la dernière tentative', b, 'group');
    }

    /* --- choix du palier --- */
    if (K.step === 'level') {
      var levels = PROGRESS.levelsOf(sit);
      if (!levels.length) { K.step = 'score'; return renderTraining(); }
      var reco = PROGRESS.recommendedLevelForGroup(sit, K.data.members || []);
      var b2 = '<p class="muted">Choisis le palier auquel tu vas travailler. Le palier conseillé est mis en avant, mais tu restes libre.</p>' +
        '<div class="pick-grid">' + levels.map(function (lv, li) {
          var isReco = lv.id === reco;
          var sh = PROGRESS.levelShade(li, levels.length);
          return '<button data-act="k.picklevel" data-l="' + lv.id + '" class="k-level lv-tint' +
            (isReco ? ' is-reco' : '') + '" style="' + sh.style + ';min-height:88px">' +
            '<span><b>' + e(lv.name) + '</b>' + (isReco ? '<br><span class="tiny">conseillé</span>' : '') +
            (lv.consigne ? '<br><span class="tiny">' + e(lv.consigne) + '</span>' : '') + '</span></button>';
        }).join('') + '</div>';
      return frame('Quel palier ?', b2, 'group');
    }

    /* --- saisie du score --- */
    if (K.step === 'score') {
      var lv2 = PROGRESS.levelById(sit, K.data.levelId);
      var b3 = '<p class="muted">' + e((K.data.members || []).map(nameOf).join(', ')) + '</p>' +
        (lv2 ? '<div class="notice lv-tint lv-notice" style="' + PROGRESS.levelColor(sit, lv2.id).style + '">' +
          '<b>' + e(lv2.name) + '</b>' + (lv2.consigne ? ' — ' + e(lv2.consigne) : '') + '</div>' : '') +
        '<h3>Ton score (' + e(sit.unit) + ')</h3>' +
        '<div class="big-num">' +
        '<button data-act="k.step" data-d="-1">−</button>' +
        '<input type="number" id="kscore" inputmode="numeric" value="' + (K.data.score == null ? '' : K.data.score) + '">' +
        '<button data-act="k.step" data-d="1">+</button>' +
        '</div>' +
        '<div class="row" style="margin-top:18px"><button class="btn-lg btn-primary" data-act="k.save">Valider mon score</button></div>';
      return frame(sit.name, b3, 'level');
    }

    /* --- retour automatique --- */
    if (K.step === 'feedback') {
      var ev = K.data.ev;
      var info2 = ev.bandInfo;
      var b4 = '<div class="feedback band-' + ev.band + '">' +
        '<div class="row" style="margin-bottom:8px">' + UI.badge(info2.icon + ' ' + info2.label, info2.cls) +
        '<span class="muted">' + e((K.data.members || []).map(nameOf).join(', ')) + ' · score ' + e(K.data.score) + '</span></div>' +
        '<p style="margin:0;white-space:pre-wrap;font-size:1.15rem"><b>' + e(ev.text) + '</b></p>' +
        (ev.image ? '<div class="img-slot"><img src="' + ev.image + '" alt="Illustration de la consigne"></div>' : '') +
        '</div>';
      b4 += nextLevelBlock(ev, sit);
      b4 += '<div class="row" style="margin-top:20px">' +
        '<button class="btn-lg btn-primary" data-act="k.again">Nouvelle tentative</button>' +
        '<button class="btn-lg" data-act="k.go" data-s="group">Passer la tablette</button></div>' +
        '<p class="small muted" style="margin-top:12px">Ce message reste enregistré : il te sera réaffiché au prochain passage si tu le fermes.</p>';
      return frame('Ton retour', b4);
    }

    K.step = 'group';
    return renderTraining();
  }

  /* ------------------------------------- échauffement en confrontation
     Deux équipes, deux scores, de gros boutons : l'écran tient dans une main
     et se remplit sans lecture. Le vainqueur s'affiche tout seul. */
  function renderDuels(l, sit, plusieurs) {
    var duels = TRAINING.liveDuels(l, sit);
    /* L'échauffement peut avoir ses propres équipes : on lit les noms et les
       couleurs là où elles se trouvent vraiment. */
    var nomEq = function (id) {
      var t = TRAINING.teamById(l, sit, id); return t ? t.name : '?';
    };
    var couleurEq = function (id) {
      var t = TRAINING.teamById(l, sit, id); return t ? t.color : 'var(--accent)';
    };
    if (!duels.length) {
      return frame(sit.name, '<p>Les oppositions ne sont pas encore formées. ' +
        'Ton professeur doit appuyer sur « Opposer les équipes ».</p>', plusieurs ? 'home' : null);
    }

    var b = '';
    if (sit.consigne) b += '<div class="notice" style="white-space:pre-wrap">' + e(sit.consigne) + '</div>';
    if (sit.image) b += '<div class="img-slot" style="margin-bottom:12px"><img src="' + sit.image + '" alt="Schéma de la situation"></div>';

    TRAINING.duelRounds(l, sit).forEach(function (rd) {
      b += '<h3 class="k-tour">Tour ' + rd.n +
        (rd.repos.length
          ? ' <span class="tiny muted">— au repos : ' +
            e(rd.repos.map(function (t) { return t.name; }).join(', ')) + '</span>'
          : '') + '</h3>';
      rd.items.forEach(function (x) {
        var d = x.d, di = x.i;
        var fait = d.scoreA != null && d.scoreB != null;
        var gagnant = fait && d.scoreA !== d.scoreB
          ? nomEq(d.scoreA > d.scoreB ? d.teamA : d.teamB) : null;
        b += '<div class="k-round-match">' +
          '<div class="k-round-label">' + e(nomEq(d.teamA)) + ' contre ' + e(nomEq(d.teamB)) +
          (fait ? ' — ' + e(gagnant ? gagnant + ' l\'emporte' : 'égalité') : '') + '</div>' +
          '<div class="k-match">' + ['A', 'B'].map(function (side) {
            var tid = side === 'A' ? d.teamA : d.teamB;
            var val = side === 'A' ? d.scoreA : d.scoreB;
            return '<div class="k-team" style="border-top:4px solid ' + couleurEq(tid) + '">' +
              '<div class="k-team-head"><h2>' + e(nomEq(tid)) + '</h2>' +
              '<div class="k-score">' + (val == null ? 0 : val) + '</div></div>' +
              '<div class="k-goals">' +
              '<button class="k-goal" data-act="k.duel" data-d="' + di + '" data-side="' + side + '" data-v="1">+ 1</button>' +
              (sit.bonuses || []).map(function (bo) {
                return '<button class="k-goal bonus" data-act="k.duel" data-d="' + di + '" data-side="' + side +
                  '" data-v="' + bo.points + '" title="' + e(bo.desc || bo.name) + '">★ ' + e(bo.name) +
                  '<small>+' + bo.points + ' pts</small></button>';
              }).join('') +
              '<button class="k-goal minus" data-act="k.duel" data-d="' + di + '" data-side="' + side + '" data-v="-1">−</button>' +
              '</div></div>';
          }).join('<div class="k-vs">contre</div>') + '</div></div>';
      });
    });

    if (plusieurs) {
      b += '<div class="row" style="margin-top:10px">' +
        '<button class="btn-lg" data-act="k.go" data-s="home">Autre échauffement</button></div>';
    }
    return frame(sit.name, b, plusieurs ? 'home' : null);
  }

  /* ------------------------------------------------------- co-frontation
     Trois écrans très simples, pensés pour une tablette qui circule :
     qui joue → réussi ou raté → classement, et on recommence avec quelqu'un
     d'autre. Chaque élève voit tout de suite ce qu'il a marqué et avec qui il
     a déjà coopéré. */
  function renderCoop(l, sit, plusieurs) {
    var c = TRAINING.coopConfig(sit);
    var vise = TRAINING.coopObjectifDuos(l, sit);
    var etat = TRAINING.coopEtat(l, sit);
    var classement = TRAINING.coopStanding(l, sit);
    var info = {};
    classement.forEach(function (p) { info[p.id] = p; });
    var present = LESSON.presentStudents(l);
    K.data.duo = K.data.duo || [];

    var vues = TRAINING.coopPaires(sit);
    var regle = '<div class="notice"><b>' + c.objectif + ' ' + e(sit.unit || 'réussites') +
      '</b> en ' + e(TRAINING.coopNom(c)) + ', en <b>' + c.essais + ' essai' +
      (c.essais > 1 ? 's' : '') + '</b>. ' +
      'Réussi : ' + c.ptsReussite + ' point' + (c.ptsReussite > 1 ? 's' : '') + ' chacun. ' +
      'Raté : ' + c.ptsEchec + '. Ensuite, on change de partenaire.' +
      (c.uniques ? '<br><b>Impossible de refaire un groupe déjà formé</b> : les camarades ' +
        'déjà rencontrés sont éteints.' : '') +
      (c.fin === 'classe'
        ? '<br><b>Le premier à avoir coopéré avec toute la classe arrête la situation.</b>'
        : '') +
      (sit.consigne ? '<br><span style="white-space:pre-wrap">' + e(sit.consigne) + '</span>' : '') +
      '</div>';

    var tableau = function () {
      return '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th class="num">#</th><th>Élève</th><th class="num">Points</th>' +
        '<th class="num">' + (c.fin === 'classe' ? 'Vus' : 'Coop.') + '</th>' +
        '<th class="num">Réussites</th></tr></thead><tbody>' +
        classement.map(function (p, i) {
          return '<tr' + (etat.gagnant && etat.gagnant.id === p.id ? ' class="lv-tint"' : '') + '>' +
            '<td class="num">' + (i + 1) + '</td><td>' + e(p.court) + '</td>' +
            '<td class="num"><b>' + p.pts + '</b></td>' +
            '<td class="num">' + TRAINING.coopAvance(sit, p) + (vise ? ' / ' + vise : '') + '</td>' +
            '<td class="num">' + p.reussites + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    };

    /* --- la situation est terminée : plus de saisie, le classement final --- */
    if (etat.fini) {
      var bf = '<div class="feedback band-plus"><p style="margin:0;font-size:1.2rem"><b>' +
        e(TRAINING.coopFinTexte(etat)) + '</b></p></div>' +
        '<h3>Classement final</h3>' + tableau() +
        '<p class="muted" style="margin-top:10px">Rapportez la tablette à votre professeur.</p>' +
        (plusieurs
          ? '<div class="row" style="margin-top:12px">' +
            '<button class="btn-lg" data-act="k.go" data-s="home">Autre situation</button></div>'
          : '');
      return frame(sit.name, bf, plusieurs ? 'home' : null);
    }

    /* --- le classement, consultable à tout moment --- */
    if (K.step === 'coopstand') {
      var b0 = tableau() +
        '<div class="row" style="margin-top:14px">' +
        '<button class="btn-lg btn-primary" data-act="k.go" data-s="group">Retour</button></div>';
      return frame('Classement — ' + sit.name, b0, 'group');
    }

    /* --- résultat de la manche --- */
    if (K.step === 'coopres' && K.data.duo.length === c.taille) {
      var noms = listeNoms(K.data.duo);
      var b1 = regle +
        '<h3>' + e(noms) + '</h3>' +
        '<p class="muted">Avez-vous atteint les ' + c.objectif + ' ' + e(sit.unit || 'réussites') + ' ?</p>' +
        '<div class="coop-choix">' +
        '<button class="btn-lg coop-oui" data-act="k.coopres" data-v="1">Objectif atteint' +
        '<small>+ ' + c.ptsReussite + ' point' + (c.ptsReussite > 1 ? 's' : '') + ' chacun</small></button>' +
        '<button class="btn-lg coop-non" data-act="k.coopres" data-v="0">Pas cette fois' +
        '<small>+ ' + c.ptsEchec + ' point' + (c.ptsEchec > 1 ? 's' : '') + ' chacun</small></button>' +
        '</div>' +
        '<div class="row" style="margin-top:16px">' +
        '<button class="btn-lg" data-act="k.go" data-s="group">Changer de ' +
        e(TRAINING.coopNom(c)) + '</button></div>';
      return frame(sit.name, b1, 'group');
    }

    /* --- écran d'accueil : on choisit les deux élèves --- */
    var b = regle;
    if (K.data.coopMsg) {
      b += '<div class="feedback band-' + (K.data.coopMsg.reussi ? 'plus' : 'reco') + '">' +
        '<p style="margin:0;font-size:1.15rem"><b>' + e(K.data.coopMsg.texte) + '</b></p></div>';
    }

    if (etat.gagnant) {
      b += '<div class="notice ok"><b>' + e(etat.gagnant.court) +
        ' a coopéré avec toute la classe.</b> La situation continue : terminez votre tour.</div>';
    }

    b += '<h3>Qui joue ?</h3>' +
      '<p class="muted">Touchez vos ' + c.taille + ' prénoms. Le chiffre indique les points déjà ' +
      'marqués' + (vise ? ' et les coopérations réalisées' : '') + '.</p>' +
      '<div class="pick-grid">' + present.map(function (s2) {
        var p = info[s2.id] || { pts: 0, duos: 0, nbPartenaires: 0, partenaires: {} };
        var av = TRAINING.coopAvance(sit, p);
        var pris = K.data.duo.indexOf(s2.id) > -1;
        var avec = K.data.duo.filter(function (x) { return x !== s2.id; });
        var deja = avec.filter(function (x) { return !!p.partenaires[x]; }).length > 0;
        var fini = vise && av >= vise;
        /* contrainte « jamais deux fois ensemble » : le bouton s'éteint dès
           qu'un des élèves déjà choisis a travaillé avec celui-ci */
        var interdit = c.uniques && !pris && deja;
        if (c.uniques && !pris && !K.data.duo.length) {
          /* plus personne de disponible : inutile de le proposer */
          interdit = present.length > 1 && present.every(function (o) {
            return o.id === s2.id || vues[[s2.id, o.id].sort().join('|')];
          });
        }
        return '<button data-act="k.coopduo" data-id="' + s2.id + '" class="coop-eleve' +
          (pris ? ' is-on' : '') + (fini ? ' is-done' : '') + (interdit ? ' is-off' : '') + '"' +
          (interdit ? ' disabled' : '') + '>' +
          '<span><b>' + e(A.shortName(s2)) + '</b>' +
          '<br><span class="tiny">' + p.pts + ' pt' + (p.pts > 1 ? 's' : '') +
          (vise ? ' · ' + av + '/' + vise : ' · ' + p.duos + ' coop.') + '</span>' +
          (deja ? '<br><span class="tiny">déjà ensemble</span>' : '') +
          '</span></button>';
      }).join('') + '</div>';

    if (K.data.duo.length === c.taille) {
      b += '<div class="row" style="margin-top:16px">' +
        '<button class="btn-lg btn-primary" data-act="k.go" data-s="coopres">' +
        'C\'est parti : ' + e(listeNoms(K.data.duo)) + '</button>' +
        '<button class="btn-lg" data-act="k.coopduo" data-id="">Effacer</button></div>';
    } else if (K.data.duo.length) {
      b += '<div class="row" style="margin-top:16px">' +
        '<span class="badge">' + K.data.duo.length + ' / ' + c.taille + ' choisis</span>' +
        '<button class="btn-lg" data-act="k.coopduo" data-id="">Effacer</button></div>';
    }
    b += '<div class="row" style="margin-top:12px">' +
      '<button class="btn-lg" data-act="k.go" data-s="coopstand">Voir le classement</button>' +
      (plusieurs ? '<button class="btn-lg" data-act="k.go" data-s="home">Autre situation</button>' : '') +
      '</div>';

    return frame(sit.name, b, plusieurs ? 'home' : null);
  }

  /* ==================================================== mode RENCONTRES CA4

     La tablette circule entre les terrains. Un élève se désigne, voit ce qui
     le concerne — sa poule, sa ligue, ou les adversaires qu'il a le droit de
     défier — et saisit le score de sa rencontre. Rien d'autre n'est visible :
     ni les notes, ni les réglages. */

  function renderArena() {
    var l = lesson(), c = cls();
    var ar = ARENA.arenaOf(l);
    var present = LESSON.presentStudents(l);
    var f = ARENA.format();
    var nomDe = function (sid) { var s2 = A.studentById(c.id, sid); return s2 ? A.shortName(s2) : '?'; };

    /* --- qui es-tu ? --- */
    if (K.step === 'home' || !K.data.sid) {
      var titre = ar.mode === 'defis' ? 'Défis' : (ar.mode === 'ligues' ? 'Ligues' : 'Poules');
      if (!present.length) return frame(titre, '<p>Personne n\'est présent.</p>');
      var b0 = '<h3>Touche ton prénom</h3>' +
        '<div class="pick-grid">' + present.map(function (s2) {
          var g = ARENA.groupOf(l, s2.id);
          var rang = ar.mode === 'defis' ? ARENA.rangDe(l, s2.id) : null;
          var reste = ar.matches.filter(function (m) {
            return (m.a === s2.id || m.b === s2.id) && m.scoreA == null;
          }).length;
          return '<button data-act="k.awho" data-id="' + s2.id + '">' +
            '<span><b>' + e(A.shortName(s2)) + '</b><br><span class="tiny">' +
            (rang ? 'rang ' + rang : (g ? e(g.name) : 'sans groupe')) +
            (reste ? ' · ' + reste + ' à jouer'
              : (g && ar.mode !== 'defis' ? ' · a fini' : '')) +
            '</span></span></button>';
        }).join('') + '</div>';
      return frame(titre, b0);
    }

    var sid = K.data.sid;

    /* --- saisie du score --- */
    if (K.step === 'ascore' && K.data.matchId) {
      var m2 = ar.matches.filter(function (x) { return x.id === K.data.matchId; })[0];
      if (!m2) { K.step = 'me'; return renderArena(); }
      var moiA = m2.a === sid;
      var advId = moiA ? m2.b : m2.a;
      var bonus = ARENA.bonusDe(l);
      var releves = ARENA.champsActifs(l).filter(function (f) { return !(+f.points > 0); });
      K.data.rel = K.data.rel || {};
      /* Les deux fiches sont bâties par la même fonction, mais cela ne suffit
         pas : il faut aussi que le navigateur leur donne la même largeur et
         que les libellés de compteurs tiennent sans se chevaucher, même quand
         l'un s'écrit sur deux lignes et l'autre sur une. D'où une grille à
         deux colonnes égales pour les fiches, et une grille de vignettes pour
         les compteurs — mêmes gabarits sur l'ordinateur et sur la tablette. */
      var col = function (label, cle, val, sidCol) {
        return '<div class="k-team k-duel-team"><h2 class="k-duel-nom">' + e(label) + '</h2>' +
          '<div class="k-score">' + val + '</div>' +
          '<div class="k-duel-pts">' +
          '<button class="btn-lg" data-act="k.apt" data-c="' + cle + '" data-v="-1">−</button>' +
          '<button class="btn-lg btn-primary" data-act="k.apt" data-c="' + cle + '" data-v="1">+ 1</button>' +
          '</div>' +
          (bonus.length
            ? '<div class="k-duel-bonus">' +
              bonus.map(function (b) {
                return '<button class="k-goal bonus" data-act="k.abonus" data-c="' + cle + '" data-b="' + b.id + '">★ ' +
                  e(b.name) + ' <small>+' + b.points + '</small></button>';
              }).join('') + '</div>'
            : '') +
          (releves.length
            ? '<div class="k-counters">' + releves.map(function (f) {
              var n = ((K.data.rel[sidCol] || {})[f.id]) || 0;
              return '<div class="k-counter">' +
                '<span class="k-counter-label">' + e(f.label) + '</span>' +
                '<div class="k-counter-ctrl">' +
                '<button class="btn-sm" data-act="k.arel" data-s="' + sidCol + '" data-f="' + f.id + '" data-v="-1">−</button>' +
                '<b>' + n + '</b>' +
                '<button class="btn-sm" data-act="k.arel" data-s="' + sidCol + '" data-f="' + f.id + '" data-v="1">+</button>' +
                '</div></div>';
            }).join('') + '</div>'
            : '') +
          '</div>';
      };
      /* Qui a arbitré ? En CA4, tenir le rôle fait partie de ce qu'on évalue :
         autant que ce soit déclaré par ceux qui l'ont vu. */
      var g3 = ARENA.groupOf(l, sid);
      /* Sur une rencontre qui croise les poules — ou un défi —, l'arbitre peut
         venir de n'importe où : on propose donc toute la classe. */
      var arbitrables = ((m2.inter || m2.defi || !g3)
        ? LESSON.presentStudents(l).map(function (x) { return x.id; })
        : g3.members).filter(function (x) { return x !== m2.a && x !== m2.b; });
      K.data.arb = K.data.arb || [];
      var blocArb = '<h3 style="margin-top:18px">Qui a arbitré ?</h3>' +
        '<div class="pick-grid">' +
        '<button data-act="k.aarb" data-id="" class="coop-eleve' +
        (K.data.arb.length ? '' : ' is-on') + '"><span><b>Pas d\'arbitre</b></span></button>' +
        arbitrables.map(function (x) {
          var on = K.data.arb.indexOf(x) > -1;
          return '<button data-act="k.aarb" data-id="' + x + '" class="coop-eleve' + (on ? ' is-on' : '') + '">' +
            '<span><b>' + e(nomDe(x)) + '</b></span></button>';
        }).join('') + '</div>';

      var b1 = '<p class="muted">Rencontre en ' + f.points + ' points' +
        (f.ecart > 1 ? ', avec ' + f.ecart + ' d\'écart' : '') + '. Comptez vos points, puis validez.</p>' +
        '<div class="k-duel">' +
        col(nomDe(sid), 'moi', moiA ? (+K.data.sa || 0) : (+K.data.sb || 0), sid) +
        col(nomDe(advId), 'adv', moiA ? (+K.data.sb || 0) : (+K.data.sa || 0), advId) +
        '</div>' +
        blocArb +
        '<div class="row" style="margin-top:18px">' +
        '<button class="btn-lg btn-primary" data-act="k.asave">Valider le score</button>' +
        '<button class="btn-lg" data-act="k.go" data-s="me">Annuler</button></div>';
      return frame(nomDe(sid) + ' contre ' + nomDe(advId), b1, 'me');
    }

    /* --- l'écran de l'élève --- */
    var mes = ar.matches.filter(function (m) { return m.a === sid || m.b === sid; });
    var b = '';
    if (K.data.aMsg) {
      b += '<div class="feedback band-plus"><p style="margin:0;font-size:1.15rem"><b>' +
        e(K.data.aMsg) + '</b></p></div>';
    }

    if (ar.mode === 'defis') {
      var rg = ARENA.regles(l);
      var possibles = ARENA.adversairesPossibles(l, sid);
      var faits = ARENA.defisDe(l, sid).length;
      var quota = rg.maxDefis > 0 && faits >= rg.maxDefis;
      if (rg.consequence === 'points') {
        var moi = ARENA.classementDefis(l).filter(function (p) { return p.id === sid; })[0];
        b += '<div class="feedback band-plus"><p style="margin:0;font-size:1.15rem"><b>' +
          (moi ? moi.pts : 0) + ' point' + ((moi ? moi.pts : 0) > 1 ? 's' : '') + '</b> — ' +
          'battre plus fort que toi en rapporte davantage.</p></div>';
      }
      b += '<div class="notice"><b>Rang ' + ARENA.rangDe(l, sid) + '</b> · ' + faits + ' défi' +
        (faits > 1 ? 's' : '') + (rg.maxDefis > 0 ? ' sur ' + rg.maxDefis : '') + ' · ' +
        (rg.cible === 'mieux' ? 'tu peux défier plus fort que toi'
          : (rg.cible === 'proche' ? 'tu peux défier un adversaire de niveau proche' : 'tu peux défier qui tu veux')) +
        (rg.cible === 'libre' ? '' : ', jusqu\'à ' + rg.ecartMax + ' rang' + (rg.ecartMax > 1 ? 's' : '') + ' d\'écart') +
        '.</div>';
      var enCours = mes.filter(function (m) { return m.scoreA == null; });
      if (enCours.length) {
        b += '<h3>Ton défi en cours</h3><div class="pick-grid">' + enCours.map(function (m) {
          var adv = m.a === sid ? m.b : m.a;
          return '<button data-act="k.amatch" data-id="' + m.id + '"><span><b>contre ' +
            e(nomDe(adv)) + '</b><br><span class="tiny">saisir le score</span></span></button>';
        }).join('') + '</div>';
      }
      b += '<h3>Qui veux-tu défier ?</h3>';
      if (quota) {
        b += '<p class="muted">Tu as joué tous tes défis. Va arbitrer une rencontre, ou passe la tablette.</p>';
      } else if (!possibles.length) {
        b += '<p class="muted">Personne à défier pour l\'instant : tous ceux que tu peux affronter ' +
          'ont déjà joué contre toi. Passe la tablette et reviens plus tard.</p>';
      } else {
        b += '<div class="pick-grid">' + possibles.map(function (o) {
          return '<button data-act="k.adefi" data-id="' + o + '"><span><b>' + e(nomDe(o)) +
            '</b><br><span class="tiny">rang ' + ARENA.rangDe(l, o) + '</span></span></button>';
        }).join('') + '</div>';
      }
    } else {
      var g2 = ARENA.groupOf(l, sid);
      b += '<div class="notice"><b>' + (g2 ? e(g2.name) : 'Sans groupe') + '</b>' +
        (g2 ? ' · tu rencontres ' + (ar.mode === 'ligues' ? 'les élèves de ta ligue' : 'tout le monde dans ta poule') : '') +
        '</div>';
      var aJouer = mes.filter(function (m) { return m.scoreA == null; });
      var joues = mes.filter(function (m) { return m.scoreA != null; });
      b += '<h3>Tes rencontres</h3>';
      if (!mes.length) b += '<p class="muted">Aucune rencontre prévue pour toi.</p>';
      if (aJouer.length) {
        b += '<div class="pick-grid">' + aJouer.map(function (m) {
          var adv = m.a === sid ? m.b : m.a;
          return '<button data-act="k.amatch" data-id="' + m.id + '"><span><b>contre ' + e(nomDe(adv)) +
            '</b><br><span class="tiny">' + (m.tour ? 'tour ' + m.tour : 'à jouer') +
            (m.terrain ? ' · terrain ' + m.terrain : '') + '</span></span></button>';
        }).join('') + '</div>';
      }
      if (joues.length) {
        b += '<h4>Déjà joué</h4><div class="table-wrap"><table class="compact"><tbody>' +
          joues.map(function (m) {
            var adv = m.a === sid ? m.b : m.a;
            var mien = m.a === sid ? m.scoreA : m.scoreB;
            var sien = m.a === sid ? m.scoreB : m.scoreA;
            return '<tr><td>contre ' + e(nomDe(adv)) + '</td><td class="num"><b>' + mien + ' – ' + sien +
              '</b></td><td>' + (+mien > +sien ? UI.badge('gagné', 'ok') : UI.badge('perdu')) +
              ' <button class="btn-sm" data-act="k.amatch" data-id="' + m.id + '">corriger</button></td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      /* Fini avant les autres ? Plutôt que d'attendre au bord du terrain, on
         propose de continuer contre quelqu'un qui a fini aussi. C'est la
         tablette qui cherche, l'élève qui choisit. */
      if (!aJouer.length && g2) {
        var ech2 = ARENA.enchainConfig(l);
        var libres2 = ARENA.partenairesLibres(l, sid);
        var supp = ARENA.supplementsDe(l, sid);
        b += '<h3 style="margin-top:18px">Tu as fini tes rencontres</h3>';
        if (!ech2.actif) {
          b += '<p class="muted">Bravo. Va arbitrer une rencontre, ou passe la tablette : ' +
            'ton professeur dira quand on repart.</p>';
        } else if (ech2.max > 0 && supp >= ech2.max) {
          b += '<p class="muted">Tu as joué tes ' + ech2.max + ' rencontres supplémentaires. ' +
            'Va arbitrer, ou passe la tablette.</p>';
        } else if (!libres2.length) {
          b += '<p class="muted">Personne d\'autre n\'a encore fini. Passe la tablette et ' +
            'reviens dans deux minutes : dès qu\'un camarade a terminé, tu pourras le défier.</p>';
        } else {
          b += '<p class="muted">Tu peux continuer contre un camarade qui a fini lui aussi. ' +
            'Touche son prénom, jouez, puis revenez saisir le score.</p>' +
            '<div class="pick-grid">' + libres2.slice(0, 8).map(function (p) {
              return '<button data-act="k.aench" data-id="' + p.id + '">' +
                '<span><b>' + e(nomDe(p.id)) + '</b><br><span class="tiny">' +
                (p.autrePoule ? e(p.poule) : 'ta poule') +
                (p.place ? ' · ' + p.place + (p.place === 1 ? 'er' : 'e') : '') +
                (p.deja ? ' · déjà joué' : '') +
                '</span></span></button>';
            }).join('') + '</div>';
        }
      }

      if (g2) {
        var cl2 = ARENA.classement(l, g2.id);
        b += '<h4>Classement de ' + e(g2.name) + '</h4><div class="table-wrap"><table class="compact">' +
          '<thead><tr><th class="num">#</th><th>Élève</th><th class="num">J</th><th class="num">V</th>' +
          '<th class="num">Points</th></tr></thead><tbody>' +
          cl2.map(function (p, i) {
            return '<tr' + (p.id === sid ? ' class="lv-tint"' : '') + '><td class="num">' + (i + 1) + '</td>' +
              '<td>' + e(p.court) + '</td><td class="num">' + p.joues + '</td>' +
              '<td class="num">' + p.v + '</td><td class="num"><b>' + p.pts + '</b></td></tr>';
          }).join('') + '</tbody></table></div>';
      }
    }

    b += '<div class="row" style="margin-top:16px">' +
      '<button class="btn-lg btn-primary" data-act="k.go" data-s="home">Passer la tablette</button></div>';
    return frame(nomDe(sid), b, 'home');
  }

  /* ======================================================= mode STATS MATCH */

  function teamNameOf(l, id) {
    for (var i = 0; i < (l.teams || []).length; i++) if (l.teams[i].id === id) return l.teams[i].name;
    return '?';
  }
  function teamColorOf(l, id) {
    for (var i = 0; i < (l.teams || []).length; i++) if (l.teams[i].id === id) return l.teams[i].color;
    return 'var(--accent)';
  }

  function renderMatch() {
    var l = lesson();

    if (K.step === 'stats') return renderTeamStats();
    if (K.step === 'round') return renderRound();

    if (K.step === 'home' || K.data.mi == null) {
      if (!l.matches.length) return frame('Matchs', '<p>Aucun match préparé.</p>');
      var rs = LESSON.rounds(l);
      var b0 = '';
      rs.forEach(function (rd) {
        b0 += '<h3>Tour ' + rd.n +
          (rd.items.length > 1
            ? ' <button class="btn-round" data-act="k.pickround" data-r="' + rd.n + '">' +
              'Relever les ' + rd.items.length + ' matchs ensemble</button>'
            : '') + '</h3>' +
          (rd.observers.length
            ? '<p class="small muted">Observent : ' + e(rd.observers.map(function (t) { return t.name; }).join(', ')) + '</p>'
            : '') +
          '<div class="pick-grid">' + rd.items.map(function (x) {
            return '<button data-act="k.pickmatch" data-i="' + x.i + '" style="min-height:78px">' +
              e(teamNameOf(l, x.m.teamA)) + '<br>contre<br>' + e(teamNameOf(l, x.m.teamB)) +
              (x.m.scoreA != null ? '<br><span class="badge">' + x.m.scoreA + ' – ' + x.m.scoreB + '</span>' : '') +
              '</button>';
          }).join('') + '</div>';
      });
      b0 += '<div class="row" style="margin-top:16px">' +
        '<button class="btn-lg" data-act="k.go" data-s="stats">Voir les statistiques</button></div>';
      return frame('Quel match ?', b0);
    }

    var b = '<div class="k-match">' + matchColumn(l, K.data.mi, 'A') +
      '<div class="k-vs">contre</div>' + matchColumn(l, K.data.mi, 'B') + '</div>' +
      statLegend(l) +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn-lg" data-act="k.go" data-s="home">Autre match</button>' +
      '<button class="btn-lg" data-act="k.go" data-s="stats">Statistiques</button></div>';

    var m2 = l.matches[K.data.mi];
    return frame(teamNameOf(l, m2.teamA) + ' — ' + teamNameOf(l, m2.teamB), b, 'home');
  }

  /* Un seul écran : les deux équipes côte à côte, score en haut de chaque
     colonne, compteurs dessous. Un relevé qui vaut des points (les buts)
     met le score à jour en même temps que le comptage.
     `mi` voyage dans chaque bouton : le même rendu sert pour un match seul
     et pour les deux matchs d'un tour affichés l'un sous l'autre. */
  function matchColumn(l, mi, side) {
    var m = l.matches[mi];
    var cfg = LESSON.matchConfig(l);
    var fields = LESSON.activeFields(l);
    m.stats = m.stats || {};

    var tid = side === 'A' ? m.teamA : m.teamB;
    var val = side === 'A' ? m.scoreA : m.scoreB;
    var rows = m.granularity === 'player'
      ? RATINGS.teamMembers(l, tid).map(function (sid) { return { id: sid, label: nameOf(sid) }; })
      : [{ id: tid, label: '' }];

    var s2 = '<div class="k-team" style="border-top:4px solid ' + teamColorOf(l, tid) + '">' +
      '<div class="k-team-head"><h2>' + e(teamNameOf(l, tid)) + '</h2>' +
      '<div class="k-score">' + (val == null ? 0 : val) + '</div></div>' +
      '<div class="k-goals">' +
      '<button class="k-goal" data-act="k.score" data-mi="' + mi + '" data-side="' + side + '" data-v="' + cfg.goalValue + '">' +
      '+ But<small>' + cfg.goalValue + ' pt' + (cfg.goalValue > 1 ? 's' : '') + '</small></button>' +
      (cfg.bonuses || []).map(function (bo) {
        return '<button class="k-goal bonus" data-act="k.score" data-mi="' + mi + '" data-side="' + side + '" data-v="' + bo.points +
          '" title="' + e(bo.desc || bo.name) + '">★ ' + e(bo.name) + '<small>+' + bo.points + ' pts</small></button>';
      }).join('') +
      '<button class="k-goal minus" data-act="k.score" data-mi="' + mi + '" data-side="' + side + '" data-v="-' + cfg.goalValue + '">−</button>' +
      '</div>';

    rows.forEach(function (row) {
      var cur = m.stats[row.id] || {};
      if (row.label) s2 += '<div class="k-player">' + e(row.label) + '</div>';
      s2 += '<div class="k-stats">';
      fields.forEach(function (f) {
        s2 += '<div class="k-stat' + (+f.points > 0 ? ' scores' : '') + '">' +
          '<span title="' + e(f.label) + (+f.points > 0 ? ' — ajoute ' + f.points + ' au score' : '') + '">' + e(f.short) + '</span>' +
          '<button data-act="k.stat" data-mi="' + mi + '" data-sid="' + e(row.id) + '" data-f="' + f.id + '" data-side="' + side + '" data-d="-1">−</button>' +
          '<b>' + (cur[f.id] || 0) + '</b>' +
          '<button data-act="k.stat" data-mi="' + mi + '" data-sid="' + e(row.id) + '" data-f="' + f.id + '" data-side="' + side + '" data-d="1">+</button>' +
          '</div>';
      });
      s2 += '</div>';
    });
    return s2 + '</div>';
  }

  function statLegend(l) {
    var fields = LESSON.activeFields(l);
    return '<div class="k-legend">' +
      fields.map(function (f) {
        return '<span><b>' + e(f.short) + '</b> ' + e(f.label) +
          (+f.points > 0 ? ' — <i>ajoute ' + f.points + ' au score</i>' : '') + '</span>';
      }).join('') +
      (fields.some(function (f) { return f.id === 'intercept'; })
        ? '<span><i>Une interception compte déjà comme passe ratée pour l\'autre équipe : ne la compte pas deux fois.</i></span>' : '') +
      '</div>';
  }

  /* ------------------------------------- les deux matchs d'un tour à la fois
     Les deux équipes qui observent tiennent souvent une seule tablette : cet
     écran leur donne les deux rencontres du tour l'une sous l'autre, sans
     jamais revenir en arrière. Chaque bouton porte son propre numéro de match,
     donc rien ne se mélange entre les deux. */
  function renderRound() {
    var l = lesson();
    var rd = LESSON.rounds(l).filter(function (r) { return r.n === K.data.round; })[0];
    if (!rd) { K.step = 'home'; return renderMatch(); }

    var b = '';
    rd.items.forEach(function (x, k) {
      b += '<div class="k-round-match">' +
        '<div class="k-round-label">Terrain ' + (k + 1) + '</div>' +
        '<div class="k-match">' + matchColumn(l, x.i, 'A') +
        '<div class="k-vs">contre</div>' + matchColumn(l, x.i, 'B') + '</div></div>';
    });
    b += statLegend(l) +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn-lg" data-act="k.go" data-s="home">Autre tour</button>' +
      '<button class="btn-lg" data-act="k.go" data-s="stats">Statistiques</button></div>';

    return frame('Tour ' + rd.n + ' — les ' + rd.items.length + ' matchs', b, 'home');
  }

  /* ------------------------------------------- statistiques pour les élèves */

  function teamTotals(l) {
    var fields = LESSON.activeFields(l);
    var out = {};
    (l.teams || []).forEach(function (t) {
      out[t.id] = { id: t.id, name: t.name, color: t.color, j: 0, v: 0, n: 0, d: 0, pp: 0, pc: 0, f: {} };
      fields.forEach(function (f) { out[t.id].f[f.id] = 0; });
      out[t.id].passKoTotal = 0;
    });
    (l.matches || []).forEach(function (m) {
      [m.teamA, m.teamB].forEach(function (tid) {
        var T = out[tid]; if (!T) return;
        var eff = RATINGS.effectiveTeamStats(m, tid);
        if (eff) {
          fields.forEach(function (f) { T.f[f.id] += +((m.stats || {})[tid] || {})[f.id] || 0; });
          T.passKoTotal += eff.passKo;
        }
        if (m.scoreA == null || m.scoreB == null) return;
        var own = tid === m.teamA ? +m.scoreA : +m.scoreB;
        var opp = tid === m.teamA ? +m.scoreB : +m.scoreA;
        T.j++; T.pp += own; T.pc += opp;
        if (own > opp) T.v++; else if (own < opp) T.d++; else T.n++;
      });
    });
    Object.keys(out).forEach(function (k) {
      var T = out[k];
      T.pts = T.v * 3 + T.n * 2 + T.d;
      var tent = T.f.passOk + T.passKoTotal;
      T.acc = tent ? T.f.passOk / tent : null;
    });
    return out;
  }

  function renderTeamStats() {
    var l = lesson();
    var fields = LESSON.activeFields(l);
    var tot = teamTotals(l);
    var list = A.sortBy(Object.keys(tot).map(function (k) { return tot[k]; }),
      function (t) { return t.pts + (t.pp - t.pc) / 1000; }, true);
    var mine = K.data.myTeam;

    var b = '<div class="row tight" style="margin-bottom:12px">' +
      '<span class="small muted nowrap">Mon équipe :</span>' +
      (l.teams || []).map(function (t) {
        return '<button class="btn-sm' + (mine === t.id ? ' btn-primary' : '') + '" data-act="k.myteam" data-t="' + t.id + '">' +
          e(t.name) + '</button>';
      }).join('') + '</div>';

    if (mine && tot[mine]) {
      var T = tot[mine];
      b += '<div class="card" style="border-top:4px solid ' + T.color + '"><h2 style="margin-top:0">' + e(T.name) + '</h2>' +
        '<div class="grid cols-4">' +
        '<div class="stat"><b>' + T.pts + '</b><span>points au classement</span></div>' +
        '<div class="stat"><b>' + T.v + 'V ' + T.n + 'N ' + T.d + 'D</b><span>' + T.j + ' match(s)</span></div>' +
        '<div class="stat"><b>' + (T.pp - T.pc > 0 ? '+' : '') + (T.pp - T.pc) + '</b><span>différence de points</span></div>' +
        '<div class="stat"><b>' + (T.acc == null ? '–' : Math.round(T.acc * 100) + ' %') + '</b><span>passes réussies</span></div>' +
        '</div><div class="grid cols-4" style="margin-top:10px">' +
        fields.map(function (f) {
          return '<div class="stat"><b>' + T.f[f.id] + '</b><span>' + e(f.label) + '</span></div>';
        }).join('') + '</div></div>';
    }

    /* comparaison entre équipes */
    b += '<div class="card"><h3>Comparaison des équipes</h3><div class="table-wrap"><table class="compact"><thead><tr>' +
      '<th>Équipe</th><th class="num">Pts</th><th class="num">J</th><th class="num">Pour</th><th class="num">Contre</th>' +
      fields.map(function (f) { return '<th class="num" title="' + e(f.label) + '">' + e(f.short) + '</th>'; }).join('') +
      '<th class="num">% passes</th></tr></thead><tbody>';
    list.forEach(function (T) {
      b += '<tr' + (mine === T.id ? ' style="background:var(--accent-soft)"' : '') + '>' +
        '<td><b style="color:' + T.color + '">' + e(T.name) + '</b></td>' +
        '<td class="num"><b>' + T.pts + '</b></td><td class="num">' + T.j + '</td>' +
        '<td class="num">' + T.pp + '</td><td class="num">' + T.pc + '</td>' +
        fields.map(function (f) { return '<td class="num">' + T.f[f.id] + '</td>'; }).join('') +
        '<td class="num">' + (T.acc == null ? '–' : Math.round(T.acc * 100) + ' %') + '</td></tr>';
    });
    b += '</tbody></table></div></div>';

    /* détail des matchs */
    b += '<div class="card"><h3>Détail des matchs</h3>';
    LESSON.rounds(l).forEach(function (rd) {
      b += '<h4>Tour ' + rd.n + (rd.observers.length
        ? ' · observent : ' + e(rd.observers.map(function (t) { return t.name; }).join(', ')) : '') + '</h4>';
      rd.items.forEach(function (x) {
        var m = x.m;
        var sa = RATINGS.effectiveTeamStats(m, m.teamA), sb = RATINGS.effectiveTeamStats(m, m.teamB);
        var joue = !mine || m.teamA === mine || m.teamB === mine;
        b += '<div class="match-line' + (joue ? '' : ' faded') + '">' +
          '<span class="mt" style="color:' + teamColorOf(l, m.teamA) + '">' + e(teamNameOf(l, m.teamA)) + '</span>' +
          '<b class="ms">' + (m.scoreA == null ? '–' : m.scoreA) + ' – ' + (m.scoreB == null ? '–' : m.scoreB) + '</b>' +
          '<span class="mt" style="color:' + teamColorOf(l, m.teamB) + '">' + e(teamNameOf(l, m.teamB)) + '</span>' +
          (sa && sb
            ? '<span class="md small muted">' +
              fields.map(function (f) {
                return e(f.short) + ' ' + (((m.stats || {})[m.teamA] || {})[f.id] || 0) + '/' +
                  (((m.stats || {})[m.teamB] || {})[f.id] || 0);
              }).join(' · ') + '</span>'
            : '<span class="md small muted">relevés non saisis</span>') +
          '</div>';
      });
    });
    b += '</div>';

    b += '<div class="row" style="margin-top:10px"><button class="btn-lg" data-act="k.go" data-s="home">Retour aux matchs</button></div>';
    return frame('Statistiques', b, 'home');
  }

  /* ==================================================== mode AUTO-ÉVALUATION */

  function renderSelf() {
    var l = lesson(), st = A.get();
    var grid = st.grids[l.evaluation && l.evaluation.gridId];
    var crits = A.criteria();
    l.evaluation.self = l.evaluation.self || {};

    if (K.step === 'home' || !K.data.sid) {
      return frame('Qui es-tu ?',
        '<p class="muted">Touche ton nom, puis évalue-toi honnêtement. Ton enseignant verra l\'écart avec son évaluation : ' +
        'ce n\'est pas une note, c\'est un point de départ pour discuter.<br>' +
        '<span class="tiny">Quelqu\'un s\'est trompé de prénom ? Touche ce prénom, puis ' +
        '« Ce n\'est pas moi — effacer ».</span></p>' +
        '<div class="pick-grid">' + A.sortBy(LESSON.presentStudents(l), function (s) { return (s.first + s.last).toLowerCase(); })
          .map(function (s) {
            var done = l.evaluation.self[s.id] && Object.keys(l.evaluation.self[s.id]).length;
            return '<button data-act="k.pickself" data-id="' + s.id + '"' + (done ? ' class="btn-primary"' : '') + '>' +
              e(A.shortName(s)) + (done ? '<br><span class="tiny">✓ fait</span>' : '') + '</button>';
          }).join('') + '</div>');
    }

    var sid = K.data.sid;
    var mine = l.evaluation.self[sid] || {};
    var levels = grid ? grid.levels : A.DEFAULT_LEVELS;
    var b = '<p class="muted">Pour chaque compétence, choisis le niveau qui te correspond le mieux aujourd\'hui.</p>';
    crits.forEach(function (c) {
      /* Si l'enseignant a rédigé les niveaux pour l'item qui porte cette
         compétence, l'élève lit ses mots à lui plutôt que « maîtrise
         satisfaisante » : c'est là que l'auto-évaluation devient sérieuse. */
      var item = grid
        ? (grid.items.filter(function (it) { return it.critId === c.id && EVAL.aDesDesc(it); })[0] || null)
        : null;
      /* Quand les niveaux sont rédigés, ils se lisent l'un sous l'autre, sur
         toute la largeur : un texte de deux lignes dans une colonne de 150 px
         ne se lit pas, et un élève qui ne lit pas coche au hasard. Sans
         précisions, les quatre libellés tiennent côte à côte comme avant. */
      b += '<div class="card"><h3>' + e(c.name) + '</h3>' +
        (c.desc ? '<p class="small muted">' + e(c.desc) + '</p>' : '') +
        '<div class="pick-grid' + (item ? ' k-niveaux' : '') + '">' + levels.map(function (lv, i) {
          return '<button data-act="k.self" data-c="' + c.id + '" data-v="' + i + '"' +
            (mine[c.id] === i ? ' class="btn-primary"' : '') + '>' +
            (item ? '<span class="k-niv">' + e(lv.label) + '</span>' : e(lv.label)) +
            (item ? '<span class="k-desc">' + e(EVAL.descOf(grid, item, i)) + '</span>' : '') +
            '</button>';
        }).join('') + '</div></div>';
    });

    if (grid) {
      var sn = EVAL.selfNoteOf(grid, mine);
      var filled = crits.filter(function (c) { return mine[c.id] != null; }).length;
      b += '<div class="card" style="text-align:center">' +
        '<h3>Ton estimation</h3>' +
        '<div style="font-size:3rem;font-weight:700">' + (sn == null ? '–' : sn.toFixed(1)) + ' <span class="muted" style="font-size:1.2rem">/ ' + grid.scale + '</span></div>' +
        '<p class="small muted">' + filled + ' compétence' + (filled > 1 ? 's' : '') + ' sur ' + crits.length + ' renseignée' + (filled > 1 ? 's' : '') + '</p></div>';
    }

    /* progression personnelle */
    var r = RATINGS.compute(cls().id);
    var hist = r.byStudent[sid] ? r.byStudent[sid].history.map(function (x) { return x.index; }) : [];
    if (hist.filter(function (x) { return x != null; }).length > 1) {
      b += '<div class="card"><h3>Ta progression depuis le début du cycle</h3>' +
        UI.sparkline(hist, 320, 80) + '</div>';
    }

    b += '<div class="row" style="margin-top:16px">' +
      '<button class="btn-lg btn-primary" data-act="k.go" data-s="home">J\'ai terminé, je passe la tablette</button>' +
      /* Se tromper de prénom arrive dix fois par heure quand la tablette
         circule : il faut pouvoir effacer soi-même, sur-le-champ, sans aller
         chercher le professeur. */
      (Object.keys(mine).length
        ? '<button class="btn-lg" data-act="k.selfclear" data-id="' + sid + '">Ce n\'est pas moi — effacer</button>'
        : '') +
      '</div>';
    return frame(nameOf(sid), b, 'home');
  }

  /* ================================================================ actions */

  function handle(act, el) {
    var l = lesson();
    switch (act) {
      case 'k.close': close(); return true;

      /* --------------------------------------------- rencontres (CA4) */
      case 'k.awho':
        K.data.sid = el.getAttribute('data-id');
        K.data.aMsg = null;
        go('me'); return true;
      case 'k.amatch': {
        var mA = ARENA.arenaOf(l).matches.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
        if (!mA) return true;
        K.data.matchId = mA.id;
        K.data.sa = mA.scoreA == null ? 0 : +mA.scoreA;
        K.data.sb = mA.scoreB == null ? 0 : +mA.scoreB;
        K.data.rel = JSON.parse(JSON.stringify(mA.stats || {}));
        K.data.arb = (mA.arbitres || []).slice();
        K.data.aMsg = null;
        go('ascore'); return true;
      }
      case 'k.adefi': {
        var adv = el.getAttribute('data-id');
        if (!K.data.sid) return true;
        /* on revérifie la règle au moment du clic : l'échelle a pu bouger
           pendant que la tablette passait de main en main */
        if (ARENA.adversairesPossibles(l, K.data.sid).indexOf(adv) === -1) {
          K.data.aMsg = 'Ce défi n\'est plus possible : l\'échelle a bougé.';
          render(); return true;
        }
        var nouveau = null;
        A.set(function () { nouveau = ARENA.lancerDefi(l, K.data.sid, adv); });
        K.data.matchId = nouveau.id;
        K.data.sa = 0; K.data.sb = 0; K.data.rel = {}; K.data.arb = [];
        K.data.aMsg = null;
        go('ascore'); return true;
      }
      case 'k.aench': {
        var advE = el.getAttribute('data-id');
        if (!K.data.sid) return true;
        /* on revérifie au moment du clic : le camarade a pu être pris entre
           le moment où l'écran s'est affiché et celui du doigt */
        var okE = ARENA.partenairesLibres(l, K.data.sid).some(function (p) { return p.id === advE; });
        if (!okE) {
          K.data.aMsg = 'Ce camarade vient de repartir jouer. Choisis-en un autre.';
          render(); return true;
        }
        var neuf = null;
        A.set(function () { neuf = ARENA.enchainer(l, K.data.sid, advE); });
        K.data.matchId = neuf.id;
        K.data.sa = 0; K.data.sb = 0; K.data.rel = {}; K.data.arb = [];
        K.data.aMsg = null;
        go('ascore'); return true;
      }
      case 'k.apt': {
        var quel = el.getAttribute('data-c'), dv = +el.getAttribute('data-v');
        var mP = ARENA.arenaOf(l).matches.filter(function (x) { return x.id === K.data.matchId; })[0];
        if (!mP) return true;
        var moiEstA = mP.a === K.data.sid;
        var cible = (quel === 'moi') === moiEstA ? 'sa' : 'sb';
        K.data[cible] = Math.max(0, (+K.data[cible] || 0) + dv);
        render(); return true;
      }
      case 'k.abonus': {
        var mB = ARENA.arenaOf(l).matches.filter(function (x) { return x.id === K.data.matchId; })[0];
        if (!mB) return true;
        var bDef = ARENA.bonusDe(l).filter(function (x) { return x.id === el.getAttribute('data-b'); })[0];
        if (!bDef) return true;
        var estA = (el.getAttribute('data-c') === 'moi') === (mB.a === K.data.sid);
        var cle = estA ? 'sa' : 'sb';
        K.data[cle] = Math.max(0, (+K.data[cle] || 0) + (+bDef.points || 1));
        /* on garde aussi la trace de l'action elle-même : c'est un relevé */
        var sidB = estA ? mB.a : mB.b;
        K.data.rel = K.data.rel || {};
        K.data.rel[sidB] = K.data.rel[sidB] || {};
        K.data.rel[sidB][bDef.id] = (K.data.rel[sidB][bDef.id] || 0) + 1;
        render(); return true;
      }
      case 'k.arel': {
        var sidR = el.getAttribute('data-s'), fid = el.getAttribute('data-f');
        K.data.rel = K.data.rel || {};
        K.data.rel[sidR] = K.data.rel[sidR] || {};
        K.data.rel[sidR][fid] = Math.max(0, (K.data.rel[sidR][fid] || 0) + (+el.getAttribute('data-v')));
        render(); return true;
      }
      case 'k.aarb': {
        var idA = el.getAttribute('data-id');
        K.data.arb = K.data.arb || [];
        if (!idA) K.data.arb = [];
        else {
          var kA = K.data.arb.indexOf(idA);
          if (kA > -1) K.data.arb.splice(kA, 1); else K.data.arb.push(idA);
        }
        render(); return true;
      }
      case 'k.asave': {
        var res = null;
        var idM = K.data.matchId, sa = +K.data.sa || 0, sb = +K.data.sb || 0;
        var rel = K.data.rel || {};
        var arb = (K.data.arb || []).slice();
        A.set(function () {
          res = ARENA.enregistrer(l, idM, sa, sb);
          if (res && res.match) res.match.arbitres = arb;
          if (res && res.match && Object.keys(rel).length) {
            res.match.stats = res.match.stats || {};
            Object.keys(rel).forEach(function (sidX) {
              res.match.stats[sidX] = Object.assign({}, res.match.stats[sidX] || {}, rel[sidX]);
            });
          }
        });
        K.data.rel = {};
        K.data.arb = [];
        K.data.matchId = null;
        var rgS = ARENA.regles(l);
        K.data.aMsg = res && res.echelleModifiee
          ? (rgS.consequence === 'monte'
            ? 'Score enregistré — tu montes de ' + rgS.montee + ' rang' + (rgS.montee > 1 ? 's' : '') + '.'
            : 'Score enregistré — tu prends la place de ton adversaire dans l\'échelle.')
          : 'Score enregistré.';
        go('me'); return true;
      }
      case 'k.myteam': K.data.myTeam = el.getAttribute('data-t'); render(); return true;
      case 'k.go':
        var s = el.getAttribute('data-s');
        if (el.getAttribute('data-sit')) K.data.sitId = el.getAttribute('data-sit');
        go(s); return true;
      case 'k.toggle': {
        K.data.members = K.data.members || [];
        var id = el.getAttribute('data-id');
        var i = K.data.members.indexOf(id);
        if (i > -1) K.data.members.splice(i, 1); else K.data.members.push(id);
        render(); return true;
      }
      case 'k.pickgroup': {
        var sit = TRAINING.sitById(l, K.data.sitId);
        var g = (sit.groups || []).filter(function (x) { return x.id === el.getAttribute('data-g'); })[0];
        K.data.members = g ? g.members.slice() : [];
        go('msg'); return true;
      }
      case 'k.readmsg': {
        var sit2 = TRAINING.sitById(l, K.data.sitId);
        A.set(function () {
          (K.data.members || []).forEach(function (sid) { PROGRESS.dismissMessage(sit2, sid, true); });
        });
        go('level'); return true;
      }
      case 'k.picklevel': K.data.levelId = el.getAttribute('data-l'); K.data.score = null; go('score'); return true;
      case 'k.step': {
        var inp = document.getElementById('kscore');
        var v = (+inp.value || 0) + (+el.getAttribute('data-d'));
